<path d="M117,149 L124,148 L122,160 L117,170 Z" fill="#44301E" opacity=".35"/>
<g fill="none" stroke="#E0BC86" stroke-linecap="round" stroke-linejoin="round" opacity=".55" stroke-width=".9"><path d="M58,104 L82,110"/><path d="M62,132 L74,136 L86,128"/><path d="M86,128 L100,134"/></g>
<!-- overall bottom darkening -->
<path d="M14,74 C14,84 18,90 24,96 L30,104 L28,110 L38,116 L44,126 L52,130 L56,142 L66,146 L70,156 L80,159 L86,168 L95,170 L100,176 L106,169 L115,165 L120,156 L130,151 L135,140 L145,135 L150,124 L160,118 L166,107 L175,100 L181,91 C185,85 186,80 186,74 Z" fill="url(#_UNDERSIDE-uShade)"/>
<!-- strata and cracks -->
<g fill="none" stroke="#3C2A1A" stroke-linecap="round" stroke-linejoin="round">
<path d="M32,108 C50,113 66,112 84,118 S118,116 136,114 S160,110 170,104" stroke-width="1.2" opacity=".45"/>
<path d="M46,126 C60,130 74,128 88,134 S114,132 128,130 S142,128 150,124" stroke-width="1.1" opacity=".42"/>
<path d="M62,142 C74,146 86,144 96,150 S116,146 128,146" stroke-width="1" opacity=".4"/>
<path d="M78,156 C88,160 98,158 112,160" stroke-width=".9" opacity=".38"/>
<path d="M58,104 L62,116 L58,120" stroke-width="1" opacity=".5"/>
<path d="M86,128 L88,140 L84,146" stroke-width="1" opacity=".45"/>
<path d="M100,134 L102,146 L99,152 L101,162" stroke-width="1" opacity=".5"/>
<path d="M132,128 L128,138 L131,146" stroke-width="1" opacity=".45"/>
<path d="M118,108 L114,118" stroke-width=".9" opacity=".4"/>
</g>
<!-- rim highlights on lit edges -->
<path d="M24,96 L30,104 L28,110 L38,116 L44,126" fill="none" stroke="#E0BC86" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" opacity=".7"/>
<path d="M56,142 L66,146 L70,156" fill="none" stroke="#E0BC86" stroke-width=".9" stroke-linecap="round" opacity=".5"/>
