<path d="M124,130 C120,133 120,136 118,138" stroke-width=".8"/>
<path d="M160,98 C163,106 160,112 163,120" stroke-width="1.3"/>
<path d="M104,106 C104,112 102,116 104,120" stroke-width="1"/>
</g>
<!-- moss cushions and drips along the lip -->
<g fill="url(#_UNDERSIDE-uMoss)">
