<svg xmlns="http://www.w3.org/2000/svg" width="400" height="360" viewBox="0 0 200 180">
<!--
SHARED FLOATING-ISLAND UNDERSIDE (reference; this file is rendered with the Earth tint).
Reuse the <defs> gradients and the <g id="*-under"> group EXACTLY (same geometry) in every island file,
renaming the id prefix "_UNDERSIDE-" to the island file's base name (e.g. "island_dun01-"), and
substituting the tint tokens below. Every colour in the defs and in the group is one of these tokens;
in this file they appear as the Earth hex values (all unique), so swap each Earth hex for the same token
of your element (simple find/replace of the 11 hex codes).

Canvas: viewBox 0 0 200 180, width 400 height 360, transparent.
Draw order: <defs> ... </defs>, then this under group, then the island TOP:
  the top must start with a ground cap that covers the underside's top edge:
  ground cap ellipse = cx 100, cy 74, rx 86, ry 22 (y 52..96, x 14..186). The soil lip below the
  cap (y 74..108) and everything under it belong to the underside. Top props may hang over the lip
  (grass tufts, icicles, water spill) but keep the rock body visible.

Tint tokens per element (lit, mid, dark, deep = rock facets light->shadow; line = strata/cracks;
lipT/lipB = soil lip top/bottom; moss/mossHi = moss drips; root = dangling roots; glow = drop glow):
  Wood  lit=#B3BE93 mid=#7D8B66 dark=#4B5844 deep=#2D3729 line=#2A3326 lipT=#6A5A3A lipB=#463A26 moss=#6F9B4C mossHi=#A2C86E root=#4E3B26 glow=#E4F6D2
  Fire  lit=#E0A47C mid=#AE5E3E dark=#743528 deep=#44201A line=#3C1C16 lipT=#7A3E28 lipB=#4E2618 moss=#C88A4C mossHi=#F0B868 root=#4A2818 glow=#FFE0C0
  Water lit=#C2D0DC mid=#8398AC dark=#506378 deep=#2E3A4C line=#2A3444 lipT=#5E5A52 lipB=#3C3A36 moss=#6EA49A mossHi=#A0D2C6 root=#3E3630 glow=#DCEEFF
  Metal lit=#D4D8E0 mid=#979DAB dark=#5C6272 deep=#353947 line=#2F323E lipT=#6A6054 lipB=#443E38 moss=#8EA088 mossHi=#BCCAB0 root=#463A30 glow=#EEF1F8
  Earth lit=#E0BC86 mid=#AD8050 dark=#72502F deep=#44301E line=#3C2A1A lipT=#7A5634 lipB=#4E3620 moss=#8E9C52 mossHi=#BAC66E root=#4C3420 glow=#FFF0D2

Token template of the defs (substitute {token}):
<radialGradient id="_UNDERSIDE-uGlow" cx="100" cy="128" r="96" gradientUnits="userSpaceOnUse" gradientTransform="translate(100 128) scale(1 .5) translate(-100 -128)"><stop offset="0" stop-color="{glow}" stop-opacity=".85"/><stop offset=".5" stop-color="{glow}" stop-opacity=".35"/><stop offset="1" stop-color="{glow}" stop-opacity="0"/></radialGradient>
<linearGradient id="_UNDERSIDE-uBody" x1="14" y1="80" x2="186" y2="140" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="{lit}"/><stop offset=".38" stop-color="{mid}"/><stop offset=".72" stop-color="{dark}"/><stop offset="1" stop-color="{deep}"/></linearGradient>
<linearGradient id="_UNDERSIDE-uShade" x1="0" y1="92" x2="0" y2="176" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="{deep}" stop-opacity=".05"/><stop offset=".25" stop-color="{deep}" stop-opacity="0"/><stop offset="1" stop-color="{deep}" stop-opacity=".6"/></linearGradient>
<linearGradient id="_UNDERSIDE-uFacet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="{lit}"/><stop offset="1" stop-color="{mid}"/></linearGradient>
<linearGradient id="_UNDERSIDE-uLip" x1="0" y1="80" x2="0" y2="104" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="{lipT}"/><stop offset="1" stop-color="{lipB}"/></linearGradient>
<linearGradient id="_UNDERSIDE-uMoss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="{mossHi}"/><stop offset="1" stop-color="{moss}"/></linearGradient>
-->
<defs>
<radialGradient id="_UNDERSIDE-uGlow" cx="100" cy="128" r="96" gradientUnits="userSpaceOnUse" gradientTransform="translate(100 128) scale(1 .5) translate(-100 -128)"><stop offset="0" stop-color="#FFF0D2" stop-opacity=".85"/><stop offset=".5" stop-color="#FFF0D2" stop-opacity=".35"/><stop offset="1" stop-color="#FFF0D2" stop-opacity="0"/></radialGradient>
<linearGradient id="_UNDERSIDE-uBody" x1="14" y1="80" x2="186" y2="140" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#E0BC86"/><stop offset=".38" stop-color="#AD8050"/><stop offset=".72" stop-color="#72502F"/><stop offset="1" stop-color="#44301E"/></linearGradient>
<linearGradient id="_UNDERSIDE-uShade" x1="0" y1="92" x2="0" y2="176" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#44301E" stop-opacity=".05"/><stop offset=".25" stop-color="#44301E" stop-opacity="0"/><stop offset="1" stop-color="#44301E" stop-opacity=".6"/></linearGradient>
<linearGradient id="_UNDERSIDE-uFacet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E0BC86"/><stop offset="1" stop-color="#AD8050"/></linearGradient>
<linearGradient id="_UNDERSIDE-uLip" x1="0" y1="80" x2="0" y2="104" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#7A5634"/><stop offset="1" stop-color="#4E3620"/></linearGradient>
<linearGradient id="_UNDERSIDE-uMoss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BAC66E"/><stop offset="1" stop-color="#8E9C52"/></linearGradient>
</defs>
<g id="_UNDERSIDE-under">
<ellipse cx="100" cy="128" rx="100" ry="52" fill="url(#_UNDERSIDE-uGlow)"/>
