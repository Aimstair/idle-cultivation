<!-- pebbles in the lip -->
<g fill="#AD8050" opacity=".9"><ellipse cx="44" cy="101" rx="3" ry="1.9"/><ellipse cx="88" cy="105" rx="2.4" ry="1.6"/><ellipse cx="136" cy="104" rx="3.2" ry="1.9"/><ellipse cx="166" cy="96" rx="2.2" ry="1.5"/><ellipse cx="112" cy="106" rx="1.6" ry="1.1"/></g>
<!-- dangling roots -->
<g fill="none" stroke="#4C3420" stroke-linecap="round" stroke-linejoin="round">
