<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="herb_soul_lotus-petal" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".5" stop-color="#F0E6FF"/>
      <stop offset="1" stop-color="#B898F0"/>
    </linearGradient>
    <linearGradient id="herb_soul_lotus-petalB" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#E4D4FF"/>
      <stop offset=".5" stop-color="#B898F0"/>
      <stop offset="1" stop-color="#5A3AB0"/>
    </linearGradient>
    <linearGradient id="herb_soul_lotus-pad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9A6AE8"/>
      <stop offset="1" stop-color="#2A1460"/>
    </linearGradient>
    <radialGradient id="herb_soul_lotus-core" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".6" stop-color="#EAD8FF"/>
      <stop offset="1" stop-color="#9A6AE8"/>
    </radialGradient>
    <radialGradient id="herb_soul_lotus-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#D8C4FF" stop-opacity=".65"/>
      <stop offset="1" stop-color="#B898F0" stop-opacity="0"/>
    </radialGradient>
    <!-- rounded petal, base at origin -->
    <path id="herb_soul_lotus-p" d="M0 0C-6 -4 -8.5 -14 -5 -22C-3 -25.5 3 -25.5 5 -22C8.5 -14 6 -4 0 0Z"/>
  </defs>

  <ellipse cx="32" cy="56.5" rx="16" ry="2.4" fill="#2A1008" opacity=".3"/>
  <circle cx="32" cy="30" r="25" fill="url(#herb_soul_lotus-glow)"/>

  <!-- soul wisps -->
  <g fill="none" stroke-linecap="round">
    <path d="M14 36C11 32 14 28 11 23C9 20 11 16 14 14M50 34C53 30 50 26 53 21C55 18 53 15 50 12M32 14C30 12 30 9.5 32 7" stroke="#B898F0" stroke-width="3.4" opacity=".45"/>
    <path d="M14 36C11 32 14 28 11 23C9 20 11 16 14 14M50 34C53 30 50 26 53 21C55 18 53 15 50 12M32 14C30 12 30 9.5 32 7" stroke="#FFFFFF" stroke-width="1.3" opacity=".9"/>
  </g>

  <!-- pad -->
  <path d="M14 50C20 43 44 43 50 50C44 56 20 56 14 50Z" fill="url(#herb_soul_lotus-pad)" stroke="#2A1008" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M18 49.5C24 46.5 32 46 40 47" fill="none" stroke="#EAD8FF" stroke-width="1" stroke-linecap="round" opacity=".7"/>

  <!-- back petals -->
  <g fill="url(#herb_soul_lotus-petalB)" stroke="#2A1008" stroke-width="2" stroke-linejoin="round">
    <use href="#herb_soul_lotus-p" transform="translate(32 46) rotate(-80) scale(.78)"/>
    <use href="#herb_soul_lotus-p" transform="translate(32 46) rotate(80) scale(.78)"/>
    <use href="#herb_soul_lotus-p" transform="translate(32 46) rotate(-42) scale(.95)"/>
    <use href="#herb_soul_lotus-p" transform="translate(32 46) rotate(42) scale(.95)"/>
    <use href="#herb_soul_lotus-p" transform="translate(32 46) scale(1.05)"/>
  </g>
  <!-- front petals -->
  <g fill="url(#herb_soul_lotus-petal)" stroke="#2A1008" stroke-width="2" stroke-linejoin="round">
    <use href="#herb_soul_lotus-p" transform="translate(32 49) rotate(-38) scale(.62)"/>
    <use href="#herb_soul_lotus-p" transform="translate(32 49) rotate(38) scale(.62)"/>
    <use href="#herb_soul_lotus-p" transform="translate(32 49) scale(.66)"/>
  </g>
  <path d="M29.5 44C28 39 28.5 34.5 30.5 30.5" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>

  <!-- glowing core -->
  <ellipse cx="32" cy="46" rx="6" ry="3.4" fill="url(#herb_soul_lotus-core)" stroke="#2A1008" stroke-width="1.6"/>
  <g fill="#9A6AE8">
    <circle cx="29.5" cy="45.5" r=".9"/>
    <circle cx="32.5" cy="44.8" r=".9"/>
    <circle cx="35" cy="46" r=".9"/>
  </g>
  <!-- ghost motes -->
  <g fill="#FFFFFF" opacity=".9">
    <circle cx="20" cy="22" r="1.2"/>
    <circle cx="45" cy="19" r="1"/>
  </g>
</svg>
