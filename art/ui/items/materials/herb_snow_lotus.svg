<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="herb_snow_lotus-petal" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#F0F8FF"/>
      <stop offset="1" stop-color="#8FDCFF"/>
    </linearGradient>
    <linearGradient id="herb_snow_lotus-petalB" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#DCEEFF"/>
      <stop offset=".5" stop-color="#B8E4FF"/>
      <stop offset="1" stop-color="#4A9AE0"/>
    </linearGradient>
    <linearGradient id="herb_snow_lotus-pad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B8E4FF"/>
      <stop offset="1" stop-color="#1A2A6E"/>
    </linearGradient>
    <radialGradient id="herb_snow_lotus-core" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".6" stop-color="#C8F0FF"/>
      <stop offset="1" stop-color="#6FBCF2"/>
    </radialGradient>
    <radialGradient id="herb_snow_lotus-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#B8E4FF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#B8E4FF" stop-opacity="0"/>
    </radialGradient>
    <!-- rounded petal, base at origin -->
    <path id="herb_snow_lotus-p" d="M0 0C-6 -4 -8.5 -14 -5 -22C-3 -25.5 3 -25.5 5 -22C8.5 -14 6 -4 0 0Z"/>
    <path id="herb_snow_lotus-star" d="M0 -4.5L1.1 -1.1L4.5 0L1.1 1.1L0 4.5L-1.1 1.1L-4.5 0L-1.1 -1.1Z"/>
  </defs>

  <ellipse cx="32" cy="56.5" rx="16" ry="2.4" fill="#2A1008" opacity=".3"/>
  <circle cx="32" cy="30" r="24" fill="url(#herb_snow_lotus-glow)"/>

  <!-- pad -->
  <path d="M14 50C20 43 44 43 50 50C44 56 20 56 14 50Z" fill="url(#herb_snow_lotus-pad)" stroke="#2A1008" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M18 49.5C24 46.5 32 46 40 47" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".7"/>

  <!-- back petals -->
  <g fill="url(#herb_snow_lotus-petalB)" stroke="#2A1008" stroke-width="2" stroke-linejoin="round">
    <use href="#herb_snow_lotus-p" transform="translate(32 46) rotate(-80) scale(.78)"/>
    <use href="#herb_snow_lotus-p" transform="translate(32 46) rotate(80) scale(.78)"/>
    <use href="#herb_snow_lotus-p" transform="translate(32 46) rotate(-42) scale(.95)"/>
    <use href="#herb_snow_lotus-p" transform="translate(32 46) rotate(42) scale(.95)"/>
    <use href="#herb_snow_lotus-p" transform="translate(32 46) scale(1.05)"/>
  </g>
  <!-- front petals -->
  <g fill="url(#herb_snow_lotus-petal)" stroke="#2A1008" stroke-width="2" stroke-linejoin="round">
    <use href="#herb_snow_lotus-p" transform="translate(32 49) rotate(-38) scale(.62)"/>
    <use href="#herb_snow_lotus-p" transform="translate(32 49) rotate(38) scale(.62)"/>
    <use href="#herb_snow_lotus-p" transform="translate(32 49) scale(.66)"/>
  </g>
  <path d="M29.5 44C28 39 28.5 34.5 30.5 30.5" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>

  <!-- core -->
  <ellipse cx="32" cy="46" rx="6" ry="3.4" fill="url(#herb_snow_lotus-core)" stroke="#2A1008" stroke-width="1.6"/>

  <!-- frost sparkles -->
  <g fill="#FFFFFF" stroke="#2E7FD0" stroke-width=".9" stroke-linejoin="round">
    <use href="#herb_snow_lotus-star" transform="translate(11 20)"/>
    <use href="#herb_snow_lotus-star" transform="translate(52 15) scale(.9)"/>
    <use href="#herb_snow_lotus-star" transform="translate(47 40) scale(.75)"/>
  </g>
</svg>
