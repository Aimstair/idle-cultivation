    <path d="M17 29L24 24.5" stroke-width="1.2" opacity=".55"/>
    <path d="M38 24L43 25" stroke-width="1" opacity=".45"/>
  </g>

  <!-- silhouette outline -->
  <path d="M9 40L15 27L28 19L45 22L55 33L52 47L35 56L17 53Z" fill="none" stroke="#2A1008" stroke-width="2.4" stroke-linejoin="round"/>
