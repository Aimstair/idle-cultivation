<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="herb_star_orchid-petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A2A6E"/>
      <stop offset=".45" stop-color="#3B7FE0"/>
      <stop offset="1" stop-color="#B8E4FF"/>
    </linearGradient>
    <radialGradient id="herb_star_orchid-lip" cx=".5" cy=".3" r=".8">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".5" stop-color="#B8E4FF"/>
      <stop offset="1" stop-color="#3B7FE0"/>
    </radialGradient>
    <linearGradient id="herb_star_orchid-leaf" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0E4A50"/>
      <stop offset="1" stop-color="#3FA79A"/>
    </linearGradient>
    <radialGradient id="herb_star_orchid-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#B8E4FF" stop-opacity=".6"/>
      <stop offset="1" stop-color="#B8E4FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="herb_star_orchid-string" cx=".4" cy=".3" r=".8">
      <stop offset="0" stop-color="#FF6A44"/>
      <stop offset=".55" stop-color="#C21E10"/>
      <stop offset="1" stop-color="#5A0A04"/>
    </radialGradient>
    <!-- orchid petal: base at origin, tip up -->
    <path id="herb_star_orchid-p" d="M0 0C-3.4 -3 -4 -9 0 -12.5C4 -9 3.4 -3 0 0Z"/>
    <path id="herb_star_orchid-star" d="M0 -2.6L.7 -.7L2.6 0L.7 .7L0 2.6L-.7 .7L-2.6 0L-.7 -.7Z"/>
  </defs>

  <ellipse cx="32" cy="57" rx="14" ry="2.2" fill="#2A1008" opacity=".3"/>
  <circle cx="28" cy="22" r="20" fill="url(#herb_star_orchid-glow)"/>

  <!-- stems below the tie -->
  <path d="M27 48L25.5 56M30.5 48L30 57M34 48L35 57M37 48L39 56" fill="none" stroke="#2A1008" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M27 48L25.5 56M30.5 48L30 57M34 48L35 57M37 48L39 56" fill="none" stroke="#2E7A74" stroke-width="1.6" stroke-linecap="round"/>

  <!-- leaves -->
  <g fill="url(#herb_star_orchid-leaf)" stroke="#2A1008" stroke-width="2.2" stroke-linejoin="round">
    <path d="M29 46C24 40 17 36.5 10 37C16 32.5 25 36 32 45Z"/>
    <path d="M35 46C40 40 47 38 54 40.5C47 35.5 39 38 33 45Z"/>
    <path d="M33 45C34 36 36 29 41 22C39 30 37 38 35 46Z"/>
  </g>
  <!-- flower stems -->
  <g fill="none" stroke-linecap="round">
    <path d="M30 46C29 37 27.5 29 27 22M34 45C37 38 41 32 45 27" stroke="#2A1008" stroke-width="3.4"/>
    <path d="M30 46C29 37 27.5 29 27 22M34 45C37 38 41 32 45 27" stroke="#2E7A74" stroke-width="1.6"/>
  </g>
  <path d="M28 40C27.5 35 27 30 27.5 26" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".7"/>

  <!-- bud -->
  <ellipse cx="46.5" cy="24" rx="2.6" ry="4.2" fill="url(#herb_star_orchid-petal)" stroke="#2A1008" stroke-width="1.8" transform="rotate(35 46.5 24)"/>

  <!-- main orchid flower -->
  <g transform="translate(27 20)" fill="url(#herb_star_orchid-petal)" stroke="#2A1008" stroke-width="2" stroke-linejoin="round">
    <use href="#herb_star_orchid-p" transform="rotate(-135)"/>
    <use href="#herb_star_orchid-p" transform="rotate(135)"/>
    <use href="#herb_star_orchid-p" transform="rotate(-62) scale(1.05)"/>
    <use href="#herb_star_orchid-p" transform="rotate(62) scale(1.05)"/>
    <use href="#herb_star_orchid-p" transform="scale(1.1)"/>
  </g>
  <!-- lip -->
  <path d="M27 20C22.5 21.5 22 27 27 28.5C32 27 31.5 21.5 27 20Z" fill="url(#herb_star_orchid-lip)" stroke="#2A1008" stroke-width="1.8" stroke-linejoin="round"/>
  <circle cx="27" cy="20.5" r="1.6" fill="#FFD45A" stroke="#2A1008" stroke-width="1.1"/>
  <!-- petal highlight -->
  <path d="M25 13C25 11 25.5 9.5 26.5 8" fill="none" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" opacity=".85"/>

  <!-- tiny stars in the petals -->
  <g fill="#FFFFFF" stroke="#8FDCFF" stroke-width=".6" stroke-linejoin="round">
    <use href="#herb_star_orchid-star" transform="translate(27 12)"/>
    <use href="#herb_star_orchid-star" transform="translate(18 16) scale(.9)"/>
    <use href="#herb_star_orchid-star" transform="translate(36 16) scale(.9)"/>
    <use href="#herb_star_orchid-star" transform="translate(21 25.5) scale(.8)"/>
    <use href="#herb_star_orchid-star" transform="translate(33 25.5) scale(.8)"/>
  </g>

  <!-- red string tie -->
  <path d="M24.5 43.5C29 45.5 35 45.5 39.5 43.5L40.5 49.5C35 51.5 29 51.5 23.5 49.5Z" fill="url(#herb_star_orchid-string)" stroke="#2A1008" stroke-width="2" stroke-linejoin="round"/>
  <path d="M25.5 45.3C29.5 47 34.5 47 38.5 45.3" fill="none" stroke="#FFB0A0" stroke-width="1" stroke-linecap="round" opacity=".8"/>
  <path d="M26 49.5L23 55M28 49.5L27.5 55.5" fill="none" stroke="#2A1008" stroke-width="3" stroke-linecap="round"/>
  <path d="M26 49.5L23 55M28 49.5L27.5 55.5" fill="none" stroke="#E0401E" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="27" cy="47.5" r="2.2" fill="#FF6A44" stroke="#2A1008" stroke-width="1.6"/>
</svg>
