<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="thunder_essence-glass" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#B8E4FF" stop-opacity=".25"/>
      <stop offset="1" stop-color="#3B7FE0" stop-opacity=".35"/>
    </radialGradient>
    <radialGradient id="thunder_essence-ball" cx=".5" cy=".5" r=".5">
