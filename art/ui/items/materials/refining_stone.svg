<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="refining_stone-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E4DEEC"/>
      <stop offset="1" stop-color="#B4ACC4"/>
    </linearGradient>
    <linearGradient id="refining_stone-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A69EB8"/>
      <stop offset="1" stop-color="#6E6684"/>
    </linearGradient>
    <linearGradient id="refining_stone-side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8A8299"/>
      <stop offset="1" stop-color="#524A64"/>
    </linearGradient>
    <radialGradient id="refining_stone-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#8FDCFF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8FDCFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="32" cy="55.5" rx="22" ry="2.6" fill="#2A1008" opacity=".3"/>

  <!-- block: top / front / right faces, rounded corners -->
  <path d="M12 32Q12 30 14 28.5L22 22Q23.5 21 26 21H52Q55 21 53.5 23.5L46 31.5Q44.5 33 42 33H14Q12 33 12 32Z" fill="url(#refining_stone-top)"/>
