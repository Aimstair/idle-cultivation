<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="wood_moon_cassia-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".5" stop-color="#CFD6E4"/>
      <stop offset="1" stop-color="#7E8698"/>
    </linearGradient>
    <linearGradient id="wood_moon_cassia-end" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8E4"/>
      <stop offset="1" stop-color="#C8BCA0"/>
    </linearGradient>
    <radialGradient id="wood_moon_cassia-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#E4EEFF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#E4EEFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wood_moon_cassia-fl" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#FFF6C8"/>
      <stop offset=".6" stop-color="#FFD45A"/>
      <stop offset="1" stop-color="#D69A2A"/>
    </radialGradient>
    <!-- four-petal osmanthus blossom, centred at origin -->
    <g id="wood_moon_cassia-f">
      <g fill="url(#wood_moon_cassia-fl)" stroke="#2A1008" stroke-width="1.1">
        <circle cx="0" cy="-1.7" r="1.5"/>
        <circle cx="1.7" cy="0" r="1.5"/>
        <circle cx="0" cy="1.7" r="1.5"/>
        <circle cx="-1.7" cy="0" r="1.5"/>
      </g>
      <circle r=".9" fill="#9A5E14"/>
    </g>
  </defs>

  <ellipse cx="31" cy="55.5" rx="22" ry="2.6" fill="#2A1008" opacity=".3"/>
  <ellipse cx="31" cy="32" rx="26" ry="20" fill="url(#wood_moon_cassia-glow)"/>

  <g transform="rotate(-18 32 36)">
    <!-- log body -->
    <path d="M50 25H15A5.5 9 0 0 0 15 43H50Z" fill="url(#wood_moon_cassia-body)"/>
    <!-- fine silver bark grain -->
    <g fill="none" stroke="#8E98AC" stroke-width="1" stroke-linecap="round" opacity=".6">
      <path d="M17 31C24 30 32 32 41 31M16 37.5C23 36.5 31 38.5 42 37.5M20 34.5H28M34 40.5H46"/>
    </g>
    <!-- end face with rings -->
    <ellipse cx="50" cy="34" rx="5.5" ry="9" fill="url(#wood_moon_cassia-end)" stroke="#2A1008" stroke-width="1.4"/>
    <ellipse cx="50" cy="34" rx="3.3" ry="5.6" fill="none" stroke="#A89A7A" stroke-width="1.1" opacity=".9"/>
    <ellipse cx="50" cy="34" rx="1.2" ry="2.2" fill="#A89A7A"/>
    <!-- highlight -->
    <path d="M18 27.5H44" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" opacity=".9"/>
    <!-- outline -->
    <path d="M50 25H15A5.5 9 0 0 0 15 43H50" fill="none" stroke="#2A1008" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- blossom twig -->
    <path d="M28 25.5C28.5 21 30 17 32 13.5" fill="none" stroke="#2A1008" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M28 25.5C28.5 21 30 17 32 13.5" fill="none" stroke="#9AA4B8" stroke-width="1.6" stroke-linecap="round"/>
    <!-- small silver-green leaf -->
    <path d="M29.5 19.5C25 19 22.5 16.5 22 12.5C26.5 12.5 29.5 15.5 29.5 19.5Z" fill="#9FC8B0" stroke="#2A1008" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M24 14C26 15 27.5 16.5 28.5 18" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".8"/>
    <!-- osmanthus cluster -->
    <use href="#wood_moon_cassia-f" transform="translate(32.5 10)"/>
    <use href="#wood_moon_cassia-f" transform="translate(37 13.5) scale(.9)"/>
    <use href="#wood_moon_cassia-f" transform="translate(28.5 14.5) scale(.85)"/>
    <use href="#wood_moon_cassia-f" transform="translate(34.5 17.5) scale(.8)"/>
    <!-- a fallen blossom on the bark -->
    <use href="#wood_moon_cassia-f" transform="translate(42 33.5) scale(.8)"/>
  </g>
</svg>
