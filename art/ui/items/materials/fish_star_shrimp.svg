    <path d="M30 17.5V25.5M40 19L36.5 26M47 24.5L41.5 30M43 36H51M42.5 39.5L48.5 42.5" stroke="#2E6AC8" stroke-width="1.1" opacity=".75"/>
    <path d="M22 21C28 18.5 36 18 42 23" stroke="#FFFFFF" stroke-width="1.6" opacity=".9"/>
  </g>
  <!-- head carapace -->
  <path d="M22 23C26 27 24 33 18 33C13 33 10 29 12 25C13.5 22 18.5 21 22 23Z" fill="url(#fish_star_shrimp-head)" stroke="#2A1008" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M13 24L8 18" fill="none" stroke="#2A1008" stroke-width="3" stroke-linecap="round"/>
  <path d="M13 24L8 18" fill="none" stroke="#B8E4FF" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="15.5" cy="27" r="1.6" fill="#2A1008"/>
  <circle cx="15" cy="26.5" r=".6" fill="#FFFFFF"/>
  <!-- star specks -->
  <g fill="#FFFFFF" stroke="#3B7FE0" stroke-width=".7" stroke-linejoin="round">
    <use href="#fish_star_shrimp-star" transform="translate(33 22)"/>
    <use href="#fish_star_shrimp-star" transform="translate(44.5 29) scale(.9)"/>
    <use href="#fish_star_shrimp-star" transform="translate(46 38) scale(.8)"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="26" cy="22" r=".9"/>
    <circle cx="39" cy="22.5" r=".8"/>
    <circle cx="19" cy="29.5" r=".8"/>
  </g>
