<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="fish_star_shrimp-tray" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF0C8"/>
      <stop offset=".6" stop-color="#E2C084"/>
      <stop offset="1" stop-color="#B88E4C"/>
    </linearGradient>
    <linearGradient id="fish_star_shrimp-trayside" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A87C3C"/>
      <stop offset="1" stop-color="#6A4A1E"/>
    </linearGradient>
    <clipPath id="fish_star_shrimp-tc"><ellipse cx="32" cy="45" rx="25" ry="9"/></clipPath>
    <linearGradient id="fish_star_shrimp-body" gradientUnits="userSpaceOnUse" x1="14" y1="18" x2="48" y2="44">
      <stop offset="0" stop-color="#D8F0FF"/>
      <stop offset=".5" stop-color="#6FB4F2"/>
      <stop offset="1" stop-color="#2E6AC8"/>
    </linearGradient>
    <radialGradient id="fish_star_shrimp-head" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".5" stop-color="#8FD0FF"/>
      <stop offset="1" stop-color="#2E6AC8"/>
    </radialGradient>
    <radialGradient id="fish_star_shrimp-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#B8E4FF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#B8E4FF" stop-opacity="0"/>
    </radialGradient>
    <path id="fish_star_shrimp-star" d="M0 -3L.8 -.8L3 0L.8 .8L0 3L-.8 .8L-3 0L-.8 -.8Z"/>
  </defs>

  <!-- woven bamboo tray -->
