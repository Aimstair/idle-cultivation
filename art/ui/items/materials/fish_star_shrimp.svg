  <ellipse cx="32" cy="45" rx="25" ry="9" fill="url(#fish_star_shrimp-tray)"/>
  <g clip-path="url(#fish_star_shrimp-tc)" fill="none" stroke="#8A6630" stroke-width="1" opacity=".45">
    <path d="M8 40L24 56M14 38L32 56M20 36.5L40 56M26 36L48 55M32 36L54 52M38 36.5L58 50M44 37L60 46"/>
    <path d="M56 40L40 56M50 38L32 56M44 36.5L24 56M38 36L16 55M32 36L10 52M26 36.5L6 50M20 37L4 46"/>
  </g>
  <ellipse cx="32" cy="45" rx="22" ry="6.8" fill="none" stroke="#8A6630" stroke-width="1.2" opacity=".7"/>
  <ellipse cx="32" cy="45" rx="25" ry="9" fill="none" stroke="#2A1008" stroke-width="2.4"/>
  <path d="M11 42C15 39 20 37.5 25 37" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity=".7"/>
  <ellipse cx="32" cy="31" rx="26" ry="17" fill="url(#fish_star_shrimp-glow)"/>
  <ellipse cx="33" cy="43.5" rx="17" ry="3.6" fill="#2A1008" opacity=".22"/>

  <!-- antennae & legs -->
  <g fill="none" stroke-linecap="round">
    <path d="M14 24C9 20 10 13 16 11M13 25C7 24 6 30 9 34" stroke="#2A1008" stroke-width="2.8"/>
    <path d="M14 24C9 20 10 13 16 11M13 25C7 24 6 30 9 34" stroke="#6FB4F2" stroke-width="1.2"/>
    <path d="M20 33L18.5 37.5M24 32L24 37M28 31L29 36" stroke="#2A1008" stroke-width="2.8"/>
    <path d="M20 33L18.5 37.5M24 32L24 37M28 31L29 36" stroke="#6FB4F2" stroke-width="1.2"/>
  </g>
  <!-- tail fan -->
  <path d="M42 43.5C38 42 34 44.5 32.5 48.5C36.5 48.5 40.5 47.5 44 45.5L46 42Z" fill="#8FD0FF" stroke="#2A1008" stroke-width="2" stroke-linejoin="round" opacity=".95"/>
  <path d="M37 46L35 47.5" fill="none" stroke="#2E6AC8" stroke-width="1" stroke-linecap="round"/>

  <!-- curled body (translucent) -->
  <g opacity=".92" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 27C22 20 36 18 44 26C50 32 48 40 42 43" stroke="#2A1008" stroke-width="10.6"/>
    <path d="M18 27C22 20 36 18 44 26C50 32 48 40 42 43" stroke="url(#fish_star_shrimp-body)" stroke-width="8"/>
