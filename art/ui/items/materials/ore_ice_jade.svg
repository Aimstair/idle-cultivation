<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="ore_ice_jade-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C4D0DC"/>
      <stop offset="1" stop-color="#7C8CA0"/>
    </linearGradient>
    <linearGradient id="ore_ice_jade-left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7C8CA0"/>
      <stop offset="1" stop-color="#3C4858"/>
    </linearGradient>
    <linearGradient id="ore_ice_jade-front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6E8092"/>
      <stop offset="1" stop-color="#2A3442"/>
    </linearGradient>
    <radialGradient id="ore_ice_jade-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#A8FFE8" stop-opacity=".7"/>
      <stop offset=".6" stop-color="#7FE8D0" stop-opacity=".2"/>
      <stop offset="1" stop-color="#7FE8D0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ore_ice_jade-jL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C8FFF0"/>
      <stop offset="1" stop-color="#3FC7B0"/>
    </linearGradient>
    <linearGradient id="ore_ice_jade-jC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".5" stop-color="#D8FFF4"/>
      <stop offset="1" stop-color="#8FE8D8"/>
    </linearGradient>
    <linearGradient id="ore_ice_jade-jR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FD8E0"/>
      <stop offset="1" stop-color="#1E8A80"/>
    </linearGradient>
    <linearGradient id="ore_ice_jade-inset" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C8FFF0"/>
      <stop offset=".6" stop-color="#5FD8C0"/>
      <stop offset="1" stop-color="#1E8A80"/>
    </linearGradient>
    <!-- chunky translucent jade prism: base at origin, tip at -22 -->
    <g id="ore_ice_jade-xtal" opacity=".94">
      <path d="M-7 -15L-2.5 -13L-2.5 0L-7 0Z" fill="url(#ore_ice_jade-jL)"/>
      <path d="M-2.5 -13L2.5 -13L2.5 0L-2.5 0Z" fill="url(#ore_ice_jade-jC)"/>
      <path d="M2.5 -13L7 -15L7 0L2.5 0Z" fill="url(#ore_ice_jade-jR)"/>
      <path d="M0 -22L-7 -15L-2.5 -13Z" fill="#B8F8E8"/>
      <path d="M0 -22L-2.5 -13L2.5 -13Z" fill="#FFFFFF"/>
      <path d="M0 -22L2.5 -13L7 -15Z" fill="#6FD0C8"/>
      <g fill="none" stroke="#2A1008" stroke-width="1" stroke-linejoin="round" opacity=".6">
        <path d="M-7 -15L-2.5 -13L2.5 -13L7 -15"/>
        <path d="M-2.5 -13V0M2.5 -13V0"/>
      </g>
      <path d="M-5 -12V-4" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity=".85"/>
      <path d="M0 -22L7 -15L7 0L-7 0L-7 -15Z" fill="none" stroke="#2A1008" stroke-width="2.2" stroke-linejoin="round"/>
    </g>
  </defs>

  <ellipse cx="32" cy="56.5" rx="20" ry="2.6" fill="#2A1008" opacity=".3"/>
  <circle cx="33" cy="27" r="23" fill="url(#ore_ice_jade-glow)"/>

  <!-- rock chunk: top / left / front faces -->
  <path d="M15 27L28 19L45 22L55 33L40 38L21 40Z" fill="url(#ore_ice_jade-top)"/>
  <path d="M9 40L15 27L21 40L17 53Z" fill="url(#ore_ice_jade-left)"/>
  <path d="M21 40L40 38L55 33L52 47L35 56L17 53Z" fill="url(#ore_ice_jade-front)"/>
  <g fill="none" stroke="#2A1008" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round">
    <path d="M15 27L21 40L17 53"/>
    <path d="M21 40L40 38L55 33"/>
    <path d="M40 38L35 56"/>
  </g>

  <!-- jade inset on the front face -->
  <path d="M26 44.5L33 41.5L39.5 44.5L37.5 50.5L29 51Z" fill="url(#ore_ice_jade-inset)" stroke="#2A1008" stroke-width="1.3" stroke-linejoin="round" opacity=".95"/>
  <path d="M28.5 45.5L32.5 43.5" fill="none" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" opacity=".85"/>

  <!-- glints on the rock -->
  <path d="M17 29L24 24.5" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity=".5"/>

  <!-- silhouette outline -->
  <path d="M9 40L15 27L28 19L45 22L55 33L52 47L35 56L17 53Z" fill="none" stroke="#2A1008" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- jade crystals growing out of the top face -->
  <use href="#ore_ice_jade-xtal" transform="translate(25 34) rotate(-26) scale(.76)"/>
  <use href="#ore_ice_jade-xtal" transform="translate(42.5 34) rotate(24) scale(.68)"/>
  <use href="#ore_ice_jade-xtal" transform="translate(33.5 35) scale(1.05)"/>
</svg>
