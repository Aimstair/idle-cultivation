<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="fish_void_angler-tray" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF0C8"/>
      <stop offset=".6" stop-color="#E2C084"/>
      <stop offset="1" stop-color="#B88E4C"/>
    </linearGradient>
    <linearGradient id="fish_void_angler-trayside" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A87C3C"/>
      <stop offset="1" stop-color="#6A4A1E"/>
    </linearGradient>
    <clipPath id="fish_void_angler-tc"><ellipse cx="32" cy="45" rx="25" ry="9"/></clipPath>
    <linearGradient id="fish_void_angler-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A4A74"/>
      <stop offset=".5" stop-color="#2A1C40"/>
      <stop offset="1" stop-color="#0E0818"/>
    </linearGradient>
    <linearGradient id="fish_void_angler-fin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A3A66"/>
      <stop offset="1" stop-color="#160C24"/>
    </linearGradient>
    <radialGradient id="fish_void_angler-lure" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".3" stop-color="#EAD8FF"/>
      <stop offset=".55" stop-color="#9A6AE8" stop-opacity=".8"/>
      <stop offset="1" stop-color="#9A6AE8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fish_void_angler-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#B898F0" stop-opacity=".35"/>
      <stop offset="1" stop-color="#9A6AE8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- woven bamboo tray -->
  <ellipse cx="32" cy="57" rx="24" ry="2.4" fill="#2A1008" opacity=".3"/>
  <path d="M7 45A25 9 0 0 0 57 45V48.5A25 9 0 0 1 7 48.5Z" fill="url(#fish_void_angler-trayside)" stroke="#2A1008" stroke-width="2.4" stroke-linejoin="round"/>
  <ellipse cx="32" cy="45" rx="25" ry="9" fill="url(#fish_void_angler-tray)"/>
  <g clip-path="url(#fish_void_angler-tc)" fill="none" stroke="#8A6630" stroke-width="1" opacity=".45">
    <path d="M8 40L24 56M14 38L32 56M20 36.5L40 56M26 36L48 55M32 36L54 52M38 36.5L58 50M44 37L60 46"/>
    <path d="M56 40L40 56M50 38L32 56M44 36.5L24 56M38 36L16 55M32 36L10 52M26 36.5L6 50M20 37L4 46"/>
  </g>
  <ellipse cx="32" cy="45" rx="22" ry="6.8" fill="none" stroke="#8A6630" stroke-width="1.2" opacity=".7"/>
  <ellipse cx="32" cy="45" rx="25" ry="9" fill="none" stroke="#2A1008" stroke-width="2.4"/>
  <path d="M11 42C15 39 20 37.5 25 37" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity=".7"/>
  <ellipse cx="32" cy="32" rx="26" ry="17" fill="url(#fish_void_angler-glow)"/>
  <ellipse cx="33" cy="44" rx="19" ry="4" fill="#2A1008" opacity=".22"/>

  <!-- tail & dorsal fin -->
  <path d="M47 33L56.5 26.5C54.5 31 54.5 37 56.5 42L47 37Z" fill="url(#fish_void_angler-fin)" stroke="#2A1008" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M33 23L35 17L38 22.5L41 18.5L43 25Z" fill="url(#fish_void_angler-fin)" stroke="#2A1008" stroke-width="2" stroke-linejoin="round"/>
  <!-- body -->
  <path d="M13 32C15 25 22 20.5 32 20.5C42 20.5 49 27 48 35C47 41.5 39 45 30 45C21 45 13 41 13 32Z" fill="url(#fish_void_angler-body)"/>
  <!-- open mouth -->
  <path d="M12.5 31C17 29.5 22 30 25 32C24 36.5 20 40.5 14 41.5C12.5 38 12 34.5 12.5 31Z" fill="#4A0A2A" stroke="#2A1008" stroke-width="1.6" stroke-linejoin="round"/>
  <g fill="#FFFFFF" stroke="#2A1008" stroke-width=".9" stroke-linejoin="round">
    <path d="M14.5 30.8L15.5 34.5L17 31ZM18.5 30.8L19.5 34.5L21 31.2ZM22 31.4L23 35L24.5 32.5Z"/>
    <path d="M15 40.5L16 37L17.5 40ZM19.5 39.5L20.5 36L22 38.5Z"/>
  </g>
  <!-- pectoral fin -->
  <path d="M27 40C30 42 33 45 31 48C27.5 46.5 25 43.5 27 40Z" fill="url(#fish_void_angler-fin)" stroke="#2A1008" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- eye -->
  <circle cx="27.5" cy="27.5" r="2.6" fill="#EAD8FF" stroke="#2A1008" stroke-width="1.2"/>
  <circle cx="28" cy="27.8" r="1.3" fill="#2A1008"/>
  <!-- void speckles -->
  <g fill="#9A6AE8" opacity=".8">
    <circle cx="36" cy="30" r="1"/>
    <circle cx="41" cy="35" r=".9"/>
    <circle cx="34" cy="38" r=".8"/>
  </g>
  <!-- highlight -->
  <path d="M23 24.5C27 22.5 31 22 35 22.5" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" opacity=".6"/>
  <!-- outline -->
  <path d="M13 32C15 25 22 20.5 32 20.5C42 20.5 49 27 48 35C47 41.5 39 45 30 45C21 45 13 41 13 32Z" fill="none" stroke="#2A1008" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- lure stalk & light -->
  <path d="M29 21C27 17 23 14 18 14.5" fill="none" stroke="#2A1008" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M29 21C27 17 23 14 18 14.5" fill="none" stroke="#5A4A74" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="16.5" cy="14.5" r="7.5" fill="url(#fish_void_angler-lure)"/>
  <circle cx="16.5" cy="14.5" r="2.8" fill="#EAD8FF" stroke="#2A1008" stroke-width="1.4"/>
  <circle cx="15.7" cy="13.7" r="1" fill="#FFFFFF"/>
</svg>
