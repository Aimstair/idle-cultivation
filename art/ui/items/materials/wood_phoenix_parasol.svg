<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="wood_phoenix_parasol-branch" gradientUnits="userSpaceOnUse" x1="12" y1="54" x2="48" y2="14">
      <stop offset="0" stop-color="#7A2A10"/>
      <stop offset=".5" stop-color="#C04A20"/>
      <stop offset="1" stop-color="#E8A040"/>
    </linearGradient>
    <linearGradient id="wood_phoenix_parasol-leaf" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#C21E10"/>
      <stop offset=".45" stop-color="#FF6A44"/>
      <stop offset=".8" stop-color="#FFB040"/>
      <stop offset="1" stop-color="#FFF0A0"/>
    </linearGradient>
    <radialGradient id="wood_phoenix_parasol-ember" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFF2A0"/>
      <stop offset=".4" stop-color="#FFA020" stop-opacity=".9"/>
      <stop offset="1" stop-color="#FFA020" stop-opacity="0"/>
    </radialGradient>
    <!-- phoenix-tail leaf: base at origin, hooked tip at the top -->
    <g id="wood_phoenix_parasol-pl">
      <path d="M0 0C-5.5 -6 -6.5 -14 -2.5 -20C-1 -22.5 1 -24.5 4 -26.5C2.5 -22 4 -17 3 -13C3.5 -7 2 -3 0 0Z" fill="url(#wood_phoenix_parasol-leaf)" stroke="#2A1008" stroke-width="2" stroke-linejoin="round"/>
      <path d="M0 -3C-1.5 -8 -1.8 -14 -.5 -19" fill="none" stroke="#FFF0A0" stroke-width="1" stroke-linecap="round" opacity=".85"/>
    </g>
  </defs>

  <ellipse cx="30" cy="56" rx="18" ry="2.4" fill="#2A1008" opacity=".3"/>

  <!-- back leaves (lower/right side, draping) -->
  <use href="#wood_phoenix_parasol-pl" transform="translate(26 40) rotate(135) scale(.7)"/>
  <use href="#wood_phoenix_parasol-pl" transform="translate(36 28) rotate(125) scale(.8)"/>
  <use href="#wood_phoenix_parasol-pl" transform="translate(42 19) rotate(95) scale(.55)"/>

  <!-- branch -->
  <path d="M12 54C22 44 30 30 48 14" fill="none" stroke="#2A1008" stroke-width="6.6" stroke-linecap="round"/>
  <path d="M12 54C22 44 30 30 48 14" fill="none" stroke="url(#wood_phoenix_parasol-branch)" stroke-width="4"/>
  <path d="M14 51.5C21 44 27 35 36 25" fill="none" stroke="#FFD08A" stroke-width="1.1" stroke-linecap="round" opacity=".75"/>
  <circle cx="48" cy="14" r="2.2" fill="#FFD45A" stroke="#2A1008" stroke-width="1.6"/>

  <!-- front leaves (upper/left side) -->
  <use href="#wood_phoenix_parasol-pl" transform="translate(22 44) rotate(-60) scale(.65)"/>
  <use href="#wood_phoenix_parasol-pl" transform="translate(29 33) rotate(-52) scale(.95)"/>
  <use href="#wood_phoenix_parasol-pl" transform="translate(38 23) rotate(-30) scale(.7)"/>

  <!-- ember sparks -->
  <g>
    <circle cx="13" cy="33" r="3.5" fill="url(#wood_phoenix_parasol-ember)"/>
    <circle cx="13" cy="33" r="1.3" fill="#FFF6C8"/>
    <circle cx="53" cy="33" r="3" fill="url(#wood_phoenix_parasol-ember)"/>
    <circle cx="53" cy="33" r="1.1" fill="#FFF6C8"/>
    <circle cx="50" cy="48" r="3.4" fill="url(#wood_phoenix_parasol-ember)"/>
    <circle cx="50" cy="48" r="1.3" fill="#FFF6C8"/>
    <circle cx="24" cy="14" r="3" fill="url(#wood_phoenix_parasol-ember)"/>
    <circle cx="24" cy="14" r="1.1" fill="#FFF6C8"/>
  </g>
</svg>
