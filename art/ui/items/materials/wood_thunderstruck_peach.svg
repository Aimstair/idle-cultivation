<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="wood_thunderstruck_peach-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5E4C48"/>
      <stop offset=".5" stop-color="#2A1C1A"/>
      <stop offset="1" stop-color="#0E0806"/>
    </linearGradient>
    <radialGradient id="wood_thunderstruck_peach-end" cx=".4" cy=".35" r=".75">
      <stop offset="0" stop-color="#F6D4B0"/>
      <stop offset=".7" stop-color="#C07A3E"/>
      <stop offset="1" stop-color="#5A2A10"/>
    </radialGradient>
    <linearGradient id="wood_thunderstruck_peach-petal" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".5" stop-color="#FFC4D8"/>
      <stop offset="1" stop-color="#E0607E"/>
    </linearGradient>
    <radialGradient id="wood_thunderstruck_peach-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFF6C8" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#B898F0" stop-opacity=".18"/>
      <stop offset="1" stop-color="#B898F0" stop-opacity="0"/>
    </radialGradient>
    <path id="wood_thunderstruck_peach-pt" d="M0 0C-2.8 -1.6 -3 -5.4 0 -6.6C3 -5.4 2.8 -1.6 0 0Z"/>
  </defs>

  <ellipse cx="31" cy="55.5" rx="22" ry="2.6" fill="#2A1008" opacity=".3"/>
  <ellipse cx="31" cy="35" rx="24" ry="14" fill="url(#wood_thunderstruck_peach-glow)"/>

  <g transform="rotate(-18 32 36)">
    <!-- charred log body -->
    <path d="M50 25H15A5.5 9 0 0 0 15 43H50Z" fill="url(#wood_thunderstruck_peach-body)"/>
    <!-- char texture -->
    <g fill="none" stroke="#0E0806" stroke-width="1.1" stroke-linecap="round" opacity=".8">
      <path d="M18 30H24M30 29H36M41 30H47M17 40H23M28 41H35M40 40H46"/>
    </g>
    <!-- lightning scar split -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 34L24 33.5L22 36.5L31 35.5L29 38.5L39 37L37 40L48 38" stroke="#9A6AE8" stroke-width="4.6" opacity=".55"/>
      <path d="M15 34L24 33.5L22 36.5L31 35.5L29 38.5L39 37L37 40L48 38" stroke="#FFF6C8" stroke-width="2"/>
      <path d="M15 34L24 33.5L22 36.5L31 35.5L29 38.5L39 37L37 40L48 38" stroke="#FFFFFF" stroke-width=".9" opacity=".9"/>
    </g>
    <!-- end face: warm peach wood inside the char -->
    <ellipse cx="50" cy="34" rx="5.5" ry="9" fill="url(#wood_thunderstruck_peach-end)" stroke="#2A1008" stroke-width="1.4"/>
    <ellipse cx="50" cy="34" rx="3.3" ry="5.6" fill="none" stroke="#8A4A20" stroke-width="1.1" opacity=".9"/>
    <ellipse cx="50" cy="34" rx="1.2" ry="2.2" fill="#8A4A20"/>
    <!-- highlight -->
    <path d="M18 27.5H44" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" opacity=".45"/>
    <!-- outline -->
    <path d="M50 25H15A5.5 9 0 0 0 15 43H50" fill="none" stroke="#2A1008" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- surviving twig with one blossom -->
    <path d="M36 25.5C37 21 38.5 17.5 41 14" fill="none" stroke="#2A1008" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M36 25.5C37 21 38.5 17.5 41 14" fill="none" stroke="#6A3414" stroke-width="1.6" stroke-linecap="round"/>
    <g transform="translate(41.5 12.5)" fill="url(#wood_thunderstruck_peach-petal)" stroke="#2A1008" stroke-width="1.6" stroke-linejoin="round">
      <use href="#wood_thunderstruck_peach-pt" transform="rotate(0)"/>
      <use href="#wood_thunderstruck_peach-pt" transform="rotate(72)"/>
      <use href="#wood_thunderstruck_peach-pt" transform="rotate(144)"/>
      <use href="#wood_thunderstruck_peach-pt" transform="rotate(216)"/>
      <use href="#wood_thunderstruck_peach-pt" transform="rotate(288)"/>
    </g>
    <circle cx="41.5" cy="12.5" r="1.6" fill="#FFD45A" stroke="#2A1008" stroke-width="1.1"/>
    <!-- bud -->
    <ellipse cx="38" cy="19.5" rx="1.8" ry="2.4" fill="#FFC4D8" stroke="#2A1008" stroke-width="1.4" transform="rotate(-30 38 19.5)"/>
  </g>
</svg>
