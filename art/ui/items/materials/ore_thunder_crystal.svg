<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="ore_thunder_crystal-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#CFC6DC"/>
      <stop offset="1" stop-color="#8A82A0"/>
    </linearGradient>
    <linearGradient id="ore_thunder_crystal-left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8A82A0"/>
      <stop offset="1" stop-color="#524A66"/>
    </linearGradient>
    <linearGradient id="ore_thunder_crystal-front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7E7694"/>
      <stop offset="1" stop-color="#3E3650"/>
    </linearGradient>
    <radialGradient id="ore_thunder_crystal-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#C9A8FF" stop-opacity=".75"/>
      <stop offset=".6" stop-color="#9A6AE8" stop-opacity=".22"/>
      <stop offset="1" stop-color="#9A6AE8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ore_thunder_crystal-sL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAD8FF"/>
      <stop offset="1" stop-color="#9A6AE8"/>
    </linearGradient>
    <linearGradient id="ore_thunder_crystal-sR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B898F0"/>
      <stop offset="1" stop-color="#5A3AB0"/>
    </linearGradient>
    <!-- jagged shard, base centred at origin, tip at -32 -->
    <g id="ore_thunder_crystal-shard">
      <path d="M0 -32L-1 -18L-5 -16L-4 0L0 0Z" fill="url(#ore_thunder_crystal-sL)"/>
      <path d="M0 -32L0 0L4 0L5 -14L1 -18Z" fill="url(#ore_thunder_crystal-sR)"/>
      <path d="M0 -32L-1.8 -18L0 -2L1.8 -18Z" fill="#FFFFFF" opacity=".92"/>
      <path d="M-3.4 -15L-2.6 -4" fill="none" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" opacity=".8"/>
      <path d="M0 -32L-1 -18L-5 -16L-4 0L4 0L5 -14L1 -18Z" fill="none" stroke="#2A1008" stroke-width="2.2" stroke-linejoin="round"/>
    </g>
  </defs>

  <ellipse cx="32" cy="57" rx="20" ry="2.4" fill="#2A1008" opacity=".3"/>
  <circle cx="32" cy="30" r="25" fill="url(#ore_thunder_crystal-glow)"/>

  <!-- shards, splayed -->
  <use href="#ore_thunder_crystal-shard" transform="translate(17 47) rotate(-40) scale(.78)"/>
  <use href="#ore_thunder_crystal-shard" transform="translate(47 47) rotate(38) scale(.7)"/>
  <use href="#ore_thunder_crystal-shard" transform="translate(25 47) rotate(-14) scale(.9)"/>
  <use href="#ore_thunder_crystal-shard" transform="translate(40 47) rotate(16) scale(.84)"/>
  <use href="#ore_thunder_crystal-shard" transform="translate(32.5 47) scale(1.08)"/>

  <!-- lightning crackles -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M38 11L41 15L38.5 16.5L42 21" stroke="#9A6AE8" stroke-width="2.6" opacity=".7"/>
    <path d="M38 11L41 15L38.5 16.5L42 21" stroke="#FFFFFF" stroke-width="1.2"/>
    <path d="M12 22L10 26L13 27L11 31" stroke="#9A6AE8" stroke-width="2.6" opacity=".7"/>
    <path d="M12 22L10 26L13 27L11 31" stroke="#FFFFFF" stroke-width="1.2"/>
    <path d="M53 27L55 30.5L52.5 31.5L54.5 35" stroke="#9A6AE8" stroke-width="2.6" opacity=".7"/>
    <path d="M53 27L55 30.5L52.5 31.5L54.5 35" stroke="#FFFFFF" stroke-width="1.2"/>
  </g>

  <!-- rock base -->
  <path d="M16 41L32 39L48 41L54 46L50 54L32 57L14 54L10 46Z" fill="url(#ore_thunder_crystal-top)"/>
  <path d="M10 46L16 41L21 47L14 54Z" fill="url(#ore_thunder_crystal-left)"/>
  <path d="M21 47L43 48L54 46L50 54L32 57L14 54Z" fill="url(#ore_thunder_crystal-front)"/>
  <g fill="none" stroke="#2A1008" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round">
    <path d="M16 41L21 47L14 54"/>
    <path d="M21 47L43 48L54 46"/>
  </g>
  <path d="M12.5 46L16.5 42.5" fill="none" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" opacity=".5"/>
  <path d="M16 41L32 39L48 41L54 46L50 54L32 57L14 54L10 46Z" fill="none" stroke="#2A1008" stroke-width="2.4" stroke-linejoin="round"/>
</svg>
