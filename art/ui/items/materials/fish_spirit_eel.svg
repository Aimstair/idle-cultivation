<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="fish_spirit_eel-tray" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF0C8"/>
      <stop offset=".6" stop-color="#E2C084"/>
      <stop offset="1" stop-color="#B88E4C"/>
    </linearGradient>
    <linearGradient id="fish_spirit_eel-trayside" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A87C3C"/>
      <stop offset="1" stop-color="#6A4A1E"/>
    </linearGradient>
    <clipPath id="fish_spirit_eel-tc"><ellipse cx="32" cy="45" rx="25" ry="9"/></clipPath>
    <linearGradient id="fish_spirit_eel-body" gradientUnits="userSpaceOnUse" x1="10" y1="24" x2="50" y2="44">
      <stop offset="0" stop-color="#8FFFD0"/>
      <stop offset=".5" stop-color="#3FC79A"/>
      <stop offset="1" stop-color="#1A7A8A"/>
    </linearGradient>
    <radialGradient id="fish_spirit_eel-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#8FFFD0" stop-opacity=".6"/>
      <stop offset="1" stop-color="#8FFFD0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- woven bamboo tray -->
  <ellipse cx="32" cy="57" rx="24" ry="2.4" fill="#2A1008" opacity=".3"/>
  <path d="M7 45A25 9 0 0 0 57 45V48.5A25 9 0 0 1 7 48.5Z" fill="url(#fish_spirit_eel-trayside)" stroke="#2A1008" stroke-width="2.4" stroke-linejoin="round"/>
  <ellipse cx="32" cy="45" rx="25" ry="9" fill="url(#fish_spirit_eel-tray)"/>
  <g clip-path="url(#fish_spirit_eel-tc)" fill="none" stroke="#8A6630" stroke-width="1" opacity=".45">
    <path d="M8 40L24 56M14 38L32 56M20 36.5L40 56M26 36L48 55M32 36L54 52M38 36.5L58 50M44 37L60 46"/>
    <path d="M56 40L40 56M50 38L32 56M44 36.5L24 56M38 36L16 55M32 36L10 52M26 36.5L6 50M20 37L4 46"/>
  </g>
  <ellipse cx="32" cy="45" rx="22" ry="6.8" fill="none" stroke="#8A6630" stroke-width="1.2" opacity=".7"/>
  <ellipse cx="32" cy="45" rx="25" ry="9" fill="none" stroke="#2A1008" stroke-width="2.4"/>
  <path d="M11 42C15 39 20 37.5 25 37" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity=".7"/>
  <ellipse cx="32" cy="36" rx="26" ry="16" fill="url(#fish_spirit_eel-glow)"/>

  <!-- coiled eel -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- dorsal fin ribbon -->
    <path d="M27 36C27 29 32 24.5 39 24.5C44 24.5 48 27 50 31" stroke="#2A1008" stroke-width="5.2" opacity=".9"/>
    <path d="M27 36C27 29 32 24.5 39 24.5C44 24.5 48 27 50 31" stroke="#8FFFD0" stroke-width="3" opacity=".85"/>
    <!-- body -->
    <path d="M15 28C9 34 13 43 22 42C31 41 30 31 38 29C45 27 50 32 48 37C46 41 41 43 37 41" stroke="#2A1008" stroke-width="9.6"/>
    <path d="M15 28C9 34 13 43 22 42C31 41 30 31 38 29C45 27 50 32 48 37C46 41 41 43 37 41" stroke="url(#fish_spirit_eel-body)" stroke-width="7"/>
    <path d="M15 28C9 34 13 43 22 42C31 41 30 31 38 29C45 27 50 32 48 37" stroke="#FFFFFF" stroke-width="1.4" opacity=".55"/>
  </g>
  <!-- tail tip -->
  <path d="M37 41C35 43.5 32.5 45 30 44.5C32 42.5 34 40.5 36 39Z" fill="#8FFFD0" stroke="#2A1008" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- head -->
  <path d="M19 27.5C16.5 24.5 12 24.5 10 27.5C11 30.5 15.5 31.5 19 29.5Z" fill="#8FFFD0" stroke="#2A1008" stroke-width="2.2" stroke-linejoin="round"/>
  <circle cx="14" cy="27.5" r="1.9" fill="#FFFFFF" stroke="#2A1008" stroke-width="1.1"/>
  <circle cx="14.3" cy="27.7" r="1" fill="#2A1008"/>
  <!-- spirit spots -->
  <g fill="#FFFFFF">
    <circle cx="20" cy="40.5" r="1.3"/>
    <circle cx="28" cy="36" r="1.2"/>
    <circle cx="41" cy="30" r="1.3"/>
    <circle cx="47" cy="37" r="1.1"/>
  </g>
  <!-- highlight on head -->
  <path d="M12 26C14 25 16 25 18 26" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity=".9"/>
</svg>
