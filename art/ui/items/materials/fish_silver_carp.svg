<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="fish_silver_carp-tray" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF0C8"/>
      <stop offset=".6" stop-color="#E2C084"/>
      <stop offset="1" stop-color="#B88E4C"/>
    </linearGradient>
    <linearGradient id="fish_silver_carp-trayside" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A87C3C"/>
      <stop offset="1" stop-color="#6A4A1E"/>
    </linearGradient>
    <clipPath id="fish_silver_carp-tc"><ellipse cx="32" cy="45" rx="25" ry="9"/></clipPath>
    <linearGradient id="fish_silver_carp-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".5" stop-color="#CFD6E4"/>
      <stop offset="1" stop-color="#8E96A8"/>
    </linearGradient>
    <linearGradient id="fish_silver_carp-fin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C8D0E0"/>
      <stop offset="1" stop-color="#7E8698"/>
    </linearGradient>
  </defs>

  <!-- woven bamboo tray -->
  <ellipse cx="32" cy="57" rx="24" ry="2.4" fill="#2A1008" opacity=".3"/>
  <path d="M7 45A25 9 0 0 0 57 45V48.5A25 9 0 0 1 7 48.5Z" fill="url(#fish_silver_carp-trayside)" stroke="#2A1008" stroke-width="2.4" stroke-linejoin="round"/>
  <ellipse cx="32" cy="45" rx="25" ry="9" fill="url(#fish_silver_carp-tray)"/>
  <g clip-path="url(#fish_silver_carp-tc)" fill="none" stroke="#8A6630" stroke-width="1" opacity=".45">
    <path d="M8 40L24 56M14 38L32 56M20 36.5L40 56M26 36L48 55M32 36L54 52M38 36.5L58 50M44 37L60 46"/>
    <path d="M56 40L40 56M50 38L32 56M44 36.5L24 56M38 36L16 55M32 36L10 52M26 36.5L6 50M20 37L4 46"/>
  </g>
  <ellipse cx="32" cy="45" rx="22" ry="6.8" fill="none" stroke="#8A6630" stroke-width="1.2" opacity=".7"/>
  <ellipse cx="32" cy="45" rx="25" ry="9" fill="none" stroke="#2A1008" stroke-width="2.4"/>
  <path d="M11 42C15 39 20 37.5 25 37" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity=".7"/>
  <ellipse cx="33" cy="44" rx="20" ry="4" fill="#2A1008" opacity=".22"/>

  <!-- carp -->
  <path d="M46.5 34L56 25.5C54.5 30 54 33 52.5 34C54 35 54.5 38 56 42.5Z" fill="url(#fish_silver_carp-fin)" stroke="#2A1008" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M23 25.5C26 18.5 35 17.5 40.5 24Z" fill="url(#fish_silver_carp-fin)" stroke="#2A1008" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M11 34C12 27 20 23.5 30 23.5C40 23.5 46.5 28.5 47.5 34C46.5 39.5 40 44.5 30 44.5C20 44.5 12 41 11 34Z" fill="url(#fish_silver_carp-body)"/>
  <path d="M13 37C18 42 26 44 34 43.5C40 43 44 40 46.5 36C42 42 32 44 24 42.5C19 41.5 15 39.5 13 37Z" fill="#FFFFFF" opacity=".5"/>
  <!-- scales -->
  <g fill="none" stroke="#7E8698" stroke-width=".9" opacity=".6">
    <path d="M27 29A3 3 0 0 0 33 29M33 29A3 3 0 0 0 39 29M24 34A3 3 0 0 0 30 34M30 34A3 3 0 0 0 36 34M36 34A3 3 0 0 0 42 34M27 39A3 3 0 0 0 33 39M33 39A3 3 0 0 0 39 39"/>
  </g>
  <!-- gill -->
  <path d="M23 27C21 31 21 37 23 41" fill="none" stroke="#2A1008" stroke-width="1.2" stroke-linecap="round" opacity=".8"/>
  <!-- pectoral fin -->
  <path d="M24 39.5C27 41.5 30 44.5 28 47.5C24 46 22 43 24 39.5Z" fill="url(#fish_silver_carp-fin)" stroke="#2A1008" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- eye & mouth -->
  <circle cx="18.5" cy="32" r="2.4" fill="#FFFFFF" stroke="#2A1008" stroke-width="1.2"/>
  <circle cx="19" cy="32.3" r="1.2" fill="#2A1008"/>
  <path d="M11.5 36L14.5 36.5" fill="none" stroke="#2A1008" stroke-width="1.2" stroke-linecap="round"/>
  <!-- highlight -->
  <path d="M18 27C23 25 29 24.5 35 25.5" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" opacity=".95"/>
  <!-- body outline -->
  <path d="M11 34C12 27 20 23.5 30 23.5C40 23.5 46.5 28.5 47.5 34C46.5 39.5 40 44.5 30 44.5C20 44.5 12 41 11 34Z" fill="none" stroke="#2A1008" stroke-width="2.4" stroke-linejoin="round"/>
</svg>
