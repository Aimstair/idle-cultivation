<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="fish_lava_crab-tray" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF0C8"/>
      <stop offset=".6" stop-color="#E2C084"/>
      <stop offset="1" stop-color="#B88E4C"/>
    </linearGradient>
    <linearGradient id="fish_lava_crab-trayside" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A87C3C"/>
      <stop offset="1" stop-color="#6A4A1E"/>
    </linearGradient>
    <clipPath id="fish_lava_crab-tc"><ellipse cx="32" cy="45" rx="25" ry="9"/></clipPath>
    <radialGradient id="fish_lava_crab-shell" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#FF6A44"/>
      <stop offset=".5" stop-color="#C21E10"/>
      <stop offset="1" stop-color="#2A0806"/>
    </radialGradient>
    <radialGradient id="fish_lava_crab-claw" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#E84A2A"/>
      <stop offset=".6" stop-color="#8A1208"/>
      <stop offset="1" stop-color="#2A0806"/>
    </radialGradient>
    <radialGradient id="fish_lava_crab-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFA020" stop-opacity=".55"/>
      <stop offset="1" stop-color="#FFA020" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fish_lava_crab-joint" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFF2A0"/>
      <stop offset=".45" stop-color="#FFA020" stop-opacity=".9"/>
      <stop offset="1" stop-color="#FFA020" stop-opacity="0"/>
    </radialGradient>
    <!-- left pincer, mirrored for the right -->
    <path id="fish_lava_crab-pincer" d="M20 25C14 26 9 22 10 17C11 14 15 13.5 17 16L13.5 18.5L17.5 20.5C19.5 21.5 20.5 23.5 20 25Z"/>
  </defs>

  <!-- woven bamboo tray -->
  <ellipse cx="32" cy="57" rx="24" ry="2.4" fill="#2A1008" opacity=".3"/>
  <path d="M7 45A25 9 0 0 0 57 45V48.5A25 9 0 0 1 7 48.5Z" fill="url(#fish_lava_crab-trayside)" stroke="#2A1008" stroke-width="2.4" stroke-linejoin="round"/>
  <ellipse cx="32" cy="45" rx="25" ry="9" fill="url(#fish_lava_crab-tray)"/>
  <g clip-path="url(#fish_lava_crab-tc)" fill="none" stroke="#8A6630" stroke-width="1" opacity=".45">
    <path d="M8 40L24 56M14 38L32 56M20 36.5L40 56M26 36L48 55M32 36L54 52M38 36.5L58 50M44 37L60 46"/>
    <path d="M56 40L40 56M50 38L32 56M44 36.5L24 56M38 36L16 55M32 36L10 52M26 36.5L6 50M20 37L4 46"/>
  </g>
  <ellipse cx="32" cy="45" rx="22" ry="6.8" fill="none" stroke="#8A6630" stroke-width="1.2" opacity=".7"/>
  <ellipse cx="32" cy="45" rx="25" ry="9" fill="none" stroke="#2A1008" stroke-width="2.4"/>
  <path d="M11 42C15 39 20 37.5 25 37" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity=".7"/>
  <ellipse cx="32" cy="33" rx="26" ry="17" fill="url(#fish_lava_crab-glow)"/>
  <ellipse cx="32" cy="43" rx="16" ry="4" fill="#2A1008" opacity=".22"/>

  <!-- legs -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 31L14 27.5L10 31M21 35.5L12 36.5L9 40.5M22 39.5L15 44L13 48M42 31L50 27.5L54 31M43 35.5L52 36.5L55 40.5M42 39.5L49 44L51 48" stroke="#2A1008" stroke-width="4.2"/>
    <path d="M22 31L14 27.5L10 31M21 35.5L12 36.5L9 40.5M22 39.5L15 44L13 48M42 31L50 27.5L54 31M43 35.5L52 36.5L55 40.5M42 39.5L49 44L51 48" stroke="#8A1A10" stroke-width="2"/>
  </g>
  <!-- claw arms -->
  <g fill="none" stroke-linecap="round">
    <path d="M24 28L19 24M40 28L45 24" stroke="#2A1008" stroke-width="5"/>
    <path d="M24 28L19 24M40 28L45 24" stroke="#8A1A10" stroke-width="2.6"/>
  </g>
  <!-- pincers -->
  <g fill="url(#fish_lava_crab-claw)" stroke="#2A1008" stroke-width="2.2" stroke-linejoin="round">
    <use href="#fish_lava_crab-pincer"/>
    <use href="#fish_lava_crab-pincer" transform="translate(64 0) scale(-1 1)"/>
  </g>
  <!-- carapace -->
  <path d="M20 34C19 26 25 22 32 22C39 22 45 26 44 34C43 40 38 42.5 32 42.5C26 42.5 21 40 20 34Z" fill="url(#fish_lava_crab-shell)" stroke="#2A1008" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- magma seams -->
  <g fill="none" stroke-linecap="round">
    <path d="M23.5 30.5C27.5 28.5 36.5 28.5 40.5 30.5M22.5 37C27 39.5 37 39.5 41.5 37" stroke="#FFA020" stroke-width="3" opacity=".6"/>
    <path d="M23.5 30.5C27.5 28.5 36.5 28.5 40.5 30.5M22.5 37C27 39.5 37 39.5 41.5 37" stroke="#FFF2A0" stroke-width="1.3"/>
  </g>
  <!-- glowing joints -->
  <g>
    <circle cx="14" cy="27.5" r="3.2" fill="url(#fish_lava_crab-joint)"/><circle cx="14" cy="27.5" r="1.2" fill="#FFF6C8"/>
    <circle cx="12" cy="36.5" r="3.2" fill="url(#fish_lava_crab-joint)"/><circle cx="12" cy="36.5" r="1.2" fill="#FFF6C8"/>
    <circle cx="15" cy="44" r="3.2" fill="url(#fish_lava_crab-joint)"/><circle cx="15" cy="44" r="1.2" fill="#FFF6C8"/>
    <circle cx="50" cy="27.5" r="3.2" fill="url(#fish_lava_crab-joint)"/><circle cx="50" cy="27.5" r="1.2" fill="#FFF6C8"/>
    <circle cx="52" cy="36.5" r="3.2" fill="url(#fish_lava_crab-joint)"/><circle cx="52" cy="36.5" r="1.2" fill="#FFF6C8"/>
    <circle cx="49" cy="44" r="3.2" fill="url(#fish_lava_crab-joint)"/><circle cx="49" cy="44" r="1.2" fill="#FFF6C8"/>
    <circle cx="19" cy="24" r="3" fill="url(#fish_lava_crab-joint)"/><circle cx="19" cy="24" r="1.1" fill="#FFF6C8"/>
    <circle cx="45" cy="24" r="3" fill="url(#fish_lava_crab-joint)"/><circle cx="45" cy="24" r="1.1" fill="#FFF6C8"/>
  </g>
  <!-- eyes -->
  <circle cx="28.5" cy="24" r="1.9" fill="#1A0804" stroke="#2A1008" stroke-width="1"/>
  <circle cx="35.5" cy="24" r="1.9" fill="#1A0804" stroke="#2A1008" stroke-width="1"/>
  <circle cx="28" cy="23.5" r=".7" fill="#FFFFFF"/>
  <circle cx="35" cy="23.5" r=".7" fill="#FFFFFF"/>
  <!-- highlight -->
  <path d="M23 29C25 26 28 24.5 31 24.5" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" opacity=".85"/>
</svg>
