<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="pickaxe_iron-head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E4EAF4"/>
      <stop offset=".35" stop-color="#7A8294"/>
      <stop offset=".75" stop-color="#3A3F4C"/>
      <stop offset="1" stop-color="#1A1C24"/>
    </linearGradient>
    <linearGradient id="pickaxe_iron-collar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D8DEE8"/>
      <stop offset="1" stop-color="#2A2E3A"/>
    </linearGradient>
    <linearGradient id="pickaxe_iron-wood" gradientUnits="userSpaceOnUse" x1="27" y1="34" x2="32" y2="39">
      <stop offset="0" stop-color="#8A4A26"/>
      <stop offset=".5" stop-color="#5A2A14"/>
      <stop offset="1" stop-color="#2E1208"/>
    </linearGradient>
    <linearGradient id="pickaxe_iron-leather" gradientUnits="userSpaceOnUse" x1="23" y1="37" x2="29" y2="43">
      <stop offset="0" stop-color="#C8824A"/>
      <stop offset=".5" stop-color="#9A5228"/>
      <stop offset="1" stop-color="#5A2A10"/>
    </linearGradient>
  </defs>

  <!-- contact shadow -->
  <ellipse cx="31" cy="55.5" rx="18" ry="2" fill="#2A1008" opacity=".25"/>

  <!-- ironwood handle -->
  <path d="M13 53L46 20" fill="none" stroke="#2A1008" stroke-width="9.8" stroke-linecap="round"/>
  <path d="M13 53L46 20" fill="none" stroke="url(#pickaxe_iron-wood)" stroke-width="5.4" stroke-linecap="round"/>
  <path d="M12.2 50.6L36 26.8" fill="none" stroke="#D9A070" stroke-width="1.2" stroke-linecap="round" opacity=".55"/>

  <!-- leather wrap -->
  <path d="M19.5 46.5L30.5 35.5" fill="none" stroke="#2A1008" stroke-width="10.6" stroke-linecap="butt"/>
  <path d="M19.5 46.5L30.5 35.5" fill="none" stroke="url(#pickaxe_iron-leather)" stroke-width="6.6" stroke-linecap="butt"/>
  <g fill="none" stroke="#2A1008" stroke-width="1.1" stroke-linecap="round" opacity=".75">
    <path d="M19.6 42.4L23.6 46.4M22.4 39.6L26.4 43.6M25.2 36.8L29.2 40.8"/>
  </g>
  <g fill="#FFE7C0" opacity=".7">
    <circle cx="20.4" cy="43.8" r=".55"/>
    <circle cx="23.2" cy="41" r=".55"/>
    <circle cx="26" cy="38.2" r=".55"/>
  </g>
  <path d="M20.2 43.3L28.6 34.9" fill="none" stroke="#FFE7C0" stroke-width="1" stroke-linecap="round" opacity=".5"/>

  <!-- dark iron head -->
  <path d="M28 10Q56 10 56 38Q46 20 28 10Z" fill="url(#pickaxe_iron-head)" stroke="#2A1008" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M33 12.4Q50.5 13.5 53.4 29" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity=".85"/>
  <path d="M38.5 16.2Q45.5 19 48.5 26" fill="none" stroke="#0E1014" stroke-width="1.1" stroke-linecap="round" opacity=".5"/>
  <path d="M30 11.4L31.8 11.6M53.6 34.6L54.6 36.2" fill="none" stroke="#CFD6E4" stroke-width="1.2" stroke-linecap="round" opacity=".8"/>

  <!-- riveted collar -->
  <path d="M38.2 22.2L43.8 27.8" fill="none" stroke="#2A1008" stroke-width="6.4" stroke-linecap="round"/>
  <path d="M38.2 22.2L43.8 27.8" fill="none" stroke="url(#pickaxe_iron-collar)" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="41" cy="25" r="1" fill="#1A1C24"/>
  <circle cx="39.6" cy="23.4" r=".7" fill="#FFFFFF" opacity=".8"/>
</svg>
