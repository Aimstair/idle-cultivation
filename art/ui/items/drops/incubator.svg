<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="incubator-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFE7A0" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#FFC860" stop-opacity=".5"/>
      <stop offset="1" stop-color="#FFB030" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="incubator-halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFD45A" stop-opacity=".5"/>
      <stop offset="1" stop-color="#FFD45A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="incubator-straw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE9A8"/>
      <stop offset=".45" stop-color="#E0B050"/>
      <stop offset="1" stop-color="#8A5A18"/>
    </linearGradient>
    <radialGradient id="incubator-hollow" gradientUnits="userSpaceOnUse" cx="32" cy="29" r="14">
      <stop offset="0" stop-color="#FFF2C0"/>
      <stop offset=".55" stop-color="#C8903A"/>
      <stop offset="1" stop-color="#6A4010"/>
    </radialGradient>
    <linearGradient id="incubator-wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C07A3E"/>
      <stop offset=".5" stop-color="#6A3414"/>
      <stop offset="1" stop-color="#3A190C"/>
    </linearGradient>
    <linearGradient id="incubator-woodV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A86030"/>
      <stop offset="1" stop-color="#3A190C"/>
    </linearGradient>
    <linearGradient id="incubator-jade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C8FFE6"/>
      <stop offset=".5" stop-color="#3FC79A"/>
      <stop offset="1" stop-color="#0E6A50"/>
    </linearGradient>
    <clipPath id="incubator-hollowclip">
      <ellipse cx="32" cy="30" rx="13" ry="6"/>
    </clipPath>
  </defs>

  <!-- warm halo and contact shadow -->
  <circle cx="32" cy="32" r="25" fill="url(#incubator-halo)"/>
  <ellipse cx="32" cy="57.4" rx="20" ry="1.8" fill="#2A1008" opacity=".3"/>

  <!-- wooden cradle legs -->
  <g fill="none" stroke-linecap="round">
    <path d="M14 44Q9 49 11 56M50 44Q55 49 53 56" stroke="#2A1008" stroke-width="6.2"/>
    <path d="M14 44Q9 49 11 56M50 44Q55 49 53 56" stroke="url(#incubator-woodV)" stroke-width="3.6"/>
    <path d="M13 46.5Q11 49 11.6 52" stroke="#FFE7C0" stroke-width=".9" opacity=".6"/>
  </g>
  <!-- curved rocker -->
  <path d="M9 54.5Q32 61 55 54.5" fill="none" stroke="#2A1008" stroke-width="5.6" stroke-linecap="round"/>
  <path d="M9 54.5Q32 61 55 54.5" fill="none" stroke="url(#incubator-woodV)" stroke-width="3" stroke-linecap="round"/>

  <!-- wooden bowl -->
  <path d="M10 36C11 46 19 52 32 52C45 52 53 46 54 36Z" fill="url(#incubator-wood)" stroke="#2A1008" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M13.5 39C14.5 44 18 47.5 23 49.5" fill="none" stroke="#FFE7C0" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>
  <!-- jade band around the bowl -->
  <rect x="8" y="33" width="48" height="5.5" rx="2.7" fill="url(#incubator-jade)" stroke="#2A1008" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M11 34.6H24" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".8"/>
  <g fill="#FFFFFF" opacity=".85">
    <path d="M32 33.6L33.4 35.75L32 37.9L30.6 35.75Z"/>
    <path d="M42 33.6L43.4 35.75L42 37.9L40.6 35.75Z"/>
    <path d="M22 33.6L23.4 35.75L22 37.9L20.6 35.75Z"/>
  </g>

  <!-- loose straws poking out (behind the nest) -->
  <g fill="none" stroke="#2A1008" stroke-width="3.2" stroke-linecap="round">
    <path d="M13 24L8 20.5M18 20L15.5 15.5M51 24L56.5 20.5M46 20L48 15.5M30 18.5L28.5 14M38 19L41 15"/>
  </g>
  <g fill="none" stroke="#FFE9A8" stroke-width="1.4" stroke-linecap="round">
    <path d="M13 24L8 20.5M18 20L15.5 15.5M51 24L56.5 20.5M46 20L48 15.5M30 18.5L28.5 14M38 19L41 15"/>
  </g>

  <!-- straw nest -->
  <ellipse cx="32" cy="29.5" rx="21.5" ry="11.5" fill="url(#incubator-straw)" stroke="#2A1008" stroke-width="2.5"/>
  <!-- woven rings -->
  <ellipse cx="32" cy="29.5" rx="19" ry="9.6" fill="none" stroke="#8A5A18" stroke-width="2.2" stroke-dasharray="3 2.4" opacity=".55"/>
  <ellipse cx="32" cy="29.5" rx="16.4" ry="7.6" fill="none" stroke="#6A4010" stroke-width="2" stroke-dasharray="2.6 2.2" stroke-dashoffset="1.4" opacity=".55"/>
  <ellipse cx="32" cy="29.5" rx="19" ry="9.6" fill="none" stroke="#FFF4C8" stroke-width="1" stroke-dasharray="3 2.4" stroke-dashoffset="2.7" opacity=".7"/>
  <path d="M12.5 27.5C13 25.5 14.5 24 16.5 23M51.5 27.5C51 25.5 49.5 24 47.5 23" fill="none" stroke="#8A5A18" stroke-width="1.2" stroke-linecap="round" opacity=".5"/>

  <!-- hollow with warm glow, waiting for an egg -->
  <ellipse cx="32" cy="30" rx="13" ry="6" fill="url(#incubator-hollow)" stroke="#2A1008" stroke-width="1.8"/>
  <g clip-path="url(#incubator-hollowclip)">
    <ellipse cx="32" cy="30" rx="11" ry="4.8" fill="none" stroke="#6A4010" stroke-width="1.4" stroke-dasharray="2.4 2" opacity=".5"/>
    <ellipse cx="32" cy="30.5" rx="9" ry="4" fill="url(#incubator-glow)"/>
  </g>
  <ellipse cx="32" cy="30" rx="8" ry="3.4" fill="url(#incubator-glow)" opacity=".9"/>
  <path d="M15.5 26.5C18.5 23.5 24 21.5 30 21.2" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" opacity=".8"/>

  <!-- warm motes -->
  <g fill="#FFF6C8">
    <path d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z" transform="translate(30 14) scale(1.8)"/>
    <path d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z" transform="translate(39 11) scale(1.3)"/>
    <circle cx="24" cy="16.5" r=".9"/>
  </g>
</svg>
