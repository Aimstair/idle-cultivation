<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="drop_sovereign_blood-halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#B83A1A" stop-opacity=".65"/>
      <stop offset=".55" stop-color="#B83A1A" stop-opacity=".2"/>
      <stop offset="1" stop-color="#B83A1A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="drop_sovereign_blood-liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D8604A"/>
      <stop offset=".5" stop-color="#8A1018"/>
      <stop offset="1" stop-color="#30060A"/>
    </linearGradient>
    <radialGradient id="drop_sovereign_blood-core" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#E0784A" stop-opacity=".95"/>
      <stop offset=".4" stop-color="#E0784A" stop-opacity=".5"/>
      <stop offset="1" stop-color="#E0784A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="drop_sovereign_blood-glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".5"/>
      <stop offset=".3" stop-color="#FFFFFF" stop-opacity=".1"/>
      <stop offset=".8" stop-color="#FFFFFF" stop-opacity=".04"/>
      <stop offset="1" stop-color="#1A2A6E" stop-opacity=".35"/>
