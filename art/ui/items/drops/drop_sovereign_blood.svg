  <path d="M24.5 17.5H35.5" fill="none" stroke="#2A1008" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M24.5 17.5H35.5" fill="none" stroke="#8A4A26" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M35.5 17.5Q43 17 46.8 21" fill="none" stroke="#2A1008" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M35.5 17.5Q43 17 46.8 21" fill="none" stroke="#8A4A26" stroke-width="1.1" stroke-linecap="round"/>
  <rect x="42.4" y="29.2" width="10.2" height="3.2" rx="1" fill="#8A4A26" stroke="#2A1008" stroke-width="1.4"/>
  <path d="M42.6 29.4L42.2 22.2L45.6 25.6L47.5 20.6L49.4 25.6L52.8 22.2L52.4 29.4Z" fill="url(#drop_sovereign_blood-charm)" stroke="#2A1008" stroke-width="1.6" stroke-linejoin="round"/>
  <circle cx="47.5" cy="27" r="1.3" fill="#C21E10" stroke="#2A1008" stroke-width=".8"/>
  <path d="M43.4 23.6L44.6 25" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".85"/>
  <path d="M43.4 30.8H46.4" fill="none" stroke="#C8824A" stroke-width=".8" stroke-linecap="round" opacity=".7"/>

