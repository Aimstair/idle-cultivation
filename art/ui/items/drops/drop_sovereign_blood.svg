    <linearGradient id="drop_sovereign_blood-empty" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0D8D0" stop-opacity=".55"/>
      <stop offset="1" stop-color="#F0D8D0" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="drop_sovereign_blood-cork" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0D2A0"/>
      <stop offset=".5" stop-color="#C48A4E"/>
      <stop offset="1" stop-color="#7A4620"/>
    </linearGradient>
    <linearGradient id="drop_sovereign_blood-charm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6C8"/>
      <stop offset=".5" stop-color="#FFD45A"/>
      <stop offset="1" stop-color="#9A5E14"/>
