<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="drop_kraken_ink-halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#9A6AE8" stop-opacity=".6"/>
      <stop offset=".55" stop-color="#9A6AE8" stop-opacity=".2"/>
      <stop offset="1" stop-color="#9A6AE8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="drop_kraken_ink-jar" gradientUnits="userSpaceOnUse" cx="24" cy="30" r="30">
      <stop offset="0" stop-color="#8E78C8"/>
      <stop offset=".4" stop-color="#4A2E82"/>
      <stop offset=".8" stop-color="#22103E"/>
      <stop offset="1" stop-color="#0E0618"/>
    </radialGradient>
    <linearGradient id="drop_kraken_ink-ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A3A9A"/>
      <stop offset=".5" stop-color="#241046"/>
      <stop offset="1" stop-color="#08030E"/>
    </linearGradient>
    <linearGradient id="drop_kraken_ink-cork" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0D2A0"/>
      <stop offset=".5" stop-color="#C48A4E"/>
      <stop offset="1" stop-color="#7A4620"/>
    </linearGradient>
    <linearGradient id="drop_kraken_ink-tent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0A0D8"/>
      <stop offset=".5" stop-color="#B8509A"/>
      <stop offset="1" stop-color="#5E1E5A"/>
    </linearGradient>
    <clipPath id="drop_kraken_ink-clip">
      <path d="M27 12H37V19.5C44.5 21 49.5 27.5 49.5 36.5C49.5 47 42 54.5 32 54.5C22 54.5 14.5 47 14.5 36.5C14.5 27.5 19.5 21 27 19.5Z"/>
    </clipPath>
  </defs>

  <!-- halo and contact shadow -->
  <circle cx="32" cy="38" r="22" fill="url(#drop_kraken_ink-halo)"/>
  <ellipse cx="32" cy="57.4" rx="15" ry="1.7" fill="#2A1008" opacity=".3"/>

  <!-- gourd jar body -->
  <path d="M27 12H37V19.5C44.5 21 49.5 27.5 49.5 36.5C49.5 47 42 54.5 32 54.5C22 54.5 14.5 47 14.5 36.5C14.5 27.5 19.5 21 27 19.5Z" fill="url(#drop_kraken_ink-jar)"/>
  <g clip-path="url(#drop_kraken_ink-clip)">
    <!-- ink level -->
    <rect x="12" y="29" width="40" height="30" fill="url(#drop_kraken_ink-ink)"/>
    <ellipse cx="32" cy="29" rx="17" ry="2.6" fill="#7A5AC0"/>
    <ellipse cx="32" cy="29" rx="12" ry="1.4" fill="#A890E0" opacity=".7"/>
    <!-- ink swirl -->
    <path d="M20 42C26 38 30 48 38 42C41 39.6 42 36 41 33" fill="none" stroke="#6A48B0" stroke-width="1.6" stroke-linecap="round" opacity=".6"/>
    <circle cx="25" cy="48" r="1" fill="#9A6AE8" opacity=".8"/>
    <circle cx="39" cy="47.6" r=".8" fill="#9A6AE8" opacity=".7"/>
  </g>
  <!-- glass sheen and outline -->
  <path d="M27 12H37V19.5C44.5 21 49.5 27.5 49.5 36.5C49.5 47 42 54.5 32 54.5C22 54.5 14.5 47 14.5 36.5C14.5 27.5 19.5 21 27 19.5Z" fill="none" stroke="#2A1008" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M19 33C18.4 38 19.8 44 23.5 48.5" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity=".7"/>
  <path d="M29.4 14V18" fill="none" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" opacity=".6"/>

  <!-- ink drip down the lip -->
  <path d="M40 20.5C40.4 24 41.8 25.5 40.8 28.6" fill="none" stroke="#2A1008" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M40 20.5C40.4 24 41.8 25.5 40.8 28.6" fill="none" stroke="#7A5AC0" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="40.8" cy="29" r="1.6" fill="#7A5AC0" stroke="#2A1008" stroke-width="1.2"/>

  <!-- cork -->
  <rect x="25" y="6" width="14" height="8.5" rx="2.2" fill="url(#drop_kraken_ink-cork)" stroke="#2A1008" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M29 8V12.4M32.4 7.8V12.6M35.6 8.1V12.3" fill="none" stroke="#7A4620" stroke-width=".9" stroke-linecap="round" opacity=".55"/>
  <path d="M27.2 7.9H30.6" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".7"/>

  <!-- tentacle seal wrapping the neck and curling down the front -->
  <path d="M24 16.5C30 15.2 36 15.2 41 16.8C46.5 18.6 47.5 24.5 44.5 29C41.5 33.5 36 35.5 33.2 40.5C31.4 43.8 34 47.5 37.6 46C40.4 44.8 39.6 41 37 41.4" fill="none" stroke="#2A1008" stroke-width="6.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M24 16.5C30 15.2 36 15.2 41 16.8C46.5 18.6 47.5 24.5 44.5 29C41.5 33.5 36 35.5 33.2 40.5C31.4 43.8 34 47.5 37.6 46C40.4 44.8 39.6 41 37 41.4" fill="none" stroke="url(#drop_kraken_ink-tent)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- suckers -->
  <g fill="#FFD6F0" opacity=".9">
    <circle cx="44.6" cy="22.4" r=".8"/>
    <circle cx="44" cy="26.6" r=".8"/>
    <circle cx="40.6" cy="31.2" r=".8"/>
    <circle cx="36.4" cy="35.4" r=".8"/>
    <circle cx="34" cy="43.6" r=".7"/>
  </g>
  <path d="M26 15.6C30 14.8 34 14.8 38 15.4" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".75"/>

  <!-- glint -->
  <path d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z" transform="translate(21 24) scale(1.7)" fill="#FFFFFF"/>
  <path d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z" transform="translate(52 44) scale(1.3)" fill="#EAD8FF"/>
</svg>
