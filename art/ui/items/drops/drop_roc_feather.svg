<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="drop_roc_feather-halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFD45A" stop-opacity=".6"/>
      <stop offset=".55" stop-color="#FFB030" stop-opacity=".2"/>
      <stop offset="1" stop-color="#FFB030" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="drop_roc_feather-vane" gradientUnits="userSpaceOnUse" x1="22" y1="10" x2="42" y2="46">
      <stop offset="0" stop-color="#FFF6C8"/>
      <stop offset=".35" stop-color="#FFD45A"/>
      <stop offset=".75" stop-color="#D69A2A"/>
      <stop offset="1" stop-color="#9A5E14"/>
    </linearGradient>
    <linearGradient id="drop_roc_feather-tip" gradientUnits="userSpaceOnUse" x1="32" y1="4" x2="32" y2="22">
      <stop offset="0" stop-color="#FF6A44"/>
      <stop offset=".5" stop-color="#FF8A3A" stop-opacity=".6"/>
      <stop offset="1" stop-color="#FFB030" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="drop_roc_feather-quill" gradientUnits="userSpaceOnUse" x1="30" y1="0" x2="34" y2="0">
      <stop offset="0" stop-color="#FFF6C8"/>
      <stop offset=".6" stop-color="#F0D28A"/>
      <stop offset="1" stop-color="#B07A2A"/>
    </linearGradient>
  </defs>

  <!-- halo and contact shadow -->
  <circle cx="32" cy="32" r="26" fill="url(#drop_roc_feather-halo)"/>
  <ellipse cx="30" cy="57.3" rx="16" ry="1.7" fill="#2A1008" opacity=".3"/>

  <g transform="rotate(45 32 32)">
    <!-- vane -->
    <path d="M32 5C38.5 9.5 42 19 42 29C42 37.5 38 44 32 47.5C28 44.5 25 38.5 25 30C25 20 27 11 32 5Z" fill="url(#drop_roc_feather-vane)" stroke="#2A1008" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M32 5C38.5 9.5 42 19 42 29C42 37.5 38 44 32 47.5C28 44.5 25 38.5 25 30C25 20 27 11 32 5Z" fill="url(#drop_roc_feather-tip)"/>
    <!-- barb texture -->
    <g fill="none" stroke="#FFF6C8" stroke-width="1" stroke-linecap="round" opacity=".6">
      <path d="M33 16L38.5 12.5M33 23L40.5 19M33 30L40.5 27M33 37L39 35"/>
      <path d="M31 20L27.5 17.5M31 27L26.5 25M31 34L26.5 33"/>
    </g>
    <!-- barb splits -->
    <g fill="none" stroke="#2A1008" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M41.6 24.5L36 27.5L41.4 29.5"/>
      <path d="M26 24L30 26.5L25.4 29.5"/>
      <path d="M40 37.5L35 38L38.5 41.5"/>
    </g>
    <!-- shaft -->
    <path d="M32 9V58" fill="none" stroke="#2A1008" stroke-width="4" stroke-linecap="round"/>
    <path d="M32 9V58" fill="none" stroke="url(#drop_roc_feather-quill)" stroke-width="1.9" stroke-linecap="round"/>
    <path d="M31.5 12V40" fill="none" stroke="#FFFFFF" stroke-width=".8" stroke-linecap="round" opacity=".7"/>
    <!-- highlight -->
    <path d="M29 12C27.8 16 27 21 27 27" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity=".85"/>
  </g>

  <!-- sparkles -->
  <g fill="#FFFFFF">
    <path d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z" transform="translate(50 9) scale(2)"/>
    <path d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z" transform="translate(13 29) scale(1.5)"/>
    <path d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z" transform="translate(47 40) scale(1.3)"/>
  </g>
</svg>
