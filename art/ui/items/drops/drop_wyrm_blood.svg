  <rect x="23" y="6.5" width="14" height="9" rx="2.2" fill="url(#drop_wyrm_blood-cork)" stroke="#2A1008" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M27 8.6V13.4M30.5 8.4V13.6M33.8 8.7V13.3" fill="none" stroke="#7A4620" stroke-width=".9" stroke-linecap="round" opacity=".55"/>
  <path d="M25.2 8.4H28.6" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".7"/>

  <!-- neck cord and charm -->
  <path d="M24.5 17.5H35.5" fill="none" stroke="#2A1008" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M24.5 17.5H35.5" fill="none" stroke="#B8862A" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M35.5 17.5Q43 17 46.8 21" fill="none" stroke="#2A1008" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M35.5 17.5Q43 17 46.8 21" fill="none" stroke="#B8862A" stroke-width="1.1" stroke-linecap="round"/>
  <path d="M47.6 20.4L52.4 23.6L51.2 29.8L47.6 32.4L44 29.8L42.8 23.6Z" fill="url(#drop_wyrm_blood-charm)" stroke="#2A1008" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M47.6 22.6V30.2" fill="none" stroke="#6E4410" stroke-width="1" stroke-linecap="round" opacity=".7"/>
  <path d="M44.6 25.6L47.6 27.6L50.6 25.6" fill="none" stroke="#6E4410" stroke-width=".9" stroke-linecap="round" stroke-linejoin="round" opacity=".6"/>
  <path d="M44.6 24.2C45.2 23 46.2 22.2 47.2 21.8" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".85"/>

  <!-- glint -->
  <path d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z" transform="translate(38.6 26) scale(1.7)" fill="#FFFFFF"/>
