<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="drop_wyrm_blood-halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#E0B040" stop-opacity=".65"/>
      <stop offset=".55" stop-color="#E0B040" stop-opacity=".2"/>
      <stop offset="1" stop-color="#E0B040" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="drop_wyrm_blood-liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF0B8"/>
      <stop offset=".5" stop-color="#E2B44A"/>
      <stop offset="1" stop-color="#7A4E0E"/>
    </linearGradient>
    <radialGradient id="drop_wyrm_blood-core" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFF2C0" stop-opacity=".95"/>
      <stop offset=".4" stop-color="#FFF2C0" stop-opacity=".5"/>
      <stop offset="1" stop-color="#FFF2C0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="drop_wyrm_blood-glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".5"/>
      <stop offset=".3" stop-color="#FFFFFF" stop-opacity=".1"/>
      <stop offset=".8" stop-color="#FFFFFF" stop-opacity=".04"/>
      <stop offset="1" stop-color="#1A2A6E" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="drop_wyrm_blood-empty" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF2D8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#FFF2D8" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="drop_wyrm_blood-cork" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0D2A0"/>
      <stop offset=".5" stop-color="#C48A4E"/>
      <stop offset="1" stop-color="#7A4620"/>
    </linearGradient>
    <linearGradient id="drop_wyrm_blood-charm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE7A0"/>
      <stop offset=".5" stop-color="#C89030"/>
      <stop offset="1" stop-color="#6E4410"/>
    </linearGradient>
    <clipPath id="drop_wyrm_blood-clip">
      <path d="M25.5 14H34.5V22.5L41.5 29V45A11.5 11.5 0 0 1 18.5 45V29L25.5 22.5Z"/>
    </clipPath>
  </defs>

  <!-- glow halo and contact shadow -->
  <circle cx="30" cy="40" r="20" fill="url(#drop_wyrm_blood-halo)"/>
  <ellipse cx="30" cy="57.3" rx="12" ry="1.6" fill="#2A1008" opacity=".3"/>

  <!-- empty glass -->
  <path d="M25.5 14H34.5V22.5L41.5 29V45A11.5 11.5 0 0 1 18.5 45V29L25.5 22.5Z" fill="url(#drop_wyrm_blood-empty)"/>

  <!-- blood -->
  <g clip-path="url(#drop_wyrm_blood-clip)">
    <rect x="16" y="31" width="30" height="30" fill="url(#drop_wyrm_blood-liquid)"/>
    <ellipse cx="30" cy="31" rx="12" ry="2.2" fill="#FFF6D0"/>
    <circle cx="30" cy="44" r="9" fill="url(#drop_wyrm_blood-core)"/>
    <!-- swirling sand grit -->
    <path d="M20 46C25 41 30 50 36 44C39 41 40 37 38 34" fill="none" stroke="#9A6A20" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>
    <path d="M22 38C27 36 29 41 33 39" fill="none" stroke="#FFF6C8" stroke-width="1.2" stroke-linecap="round" opacity=".7"/>
    <g fill="#6E4410" opacity=".7">
      <circle cx="24.5" cy="50.5" r=".9"/>
      <circle cx="35" cy="48" r=".8"/>
      <circle cx="37.6" cy="40" r=".7"/>
      <circle cx="26" cy="34.6" r=".7"/>
    </g>
    <g fill="#FFF6C8" opacity=".9">
      <circle cx="28" cy="47" r=".8"/>
      <circle cx="33.4" cy="35.4" r=".7"/>
    </g>
  </g>

  <!-- glass overlay and outline -->
  <path d="M25.5 14H34.5V22.5L41.5 29V45A11.5 11.5 0 0 1 18.5 45V29L25.5 22.5Z" fill="url(#drop_wyrm_blood-glass)"/>
  <path d="M25.5 14H34.5V22.5L41.5 29V45A11.5 11.5 0 0 1 18.5 45V29L25.5 22.5Z" fill="none" stroke="#2A1008" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M22 31C21.2 36 21.6 42 23.8 47.5" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" opacity=".8"/>
  <path d="M27.6 16.5V21" fill="none" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" opacity=".6"/>

