<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="drop_roc_blood-halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFD45A" stop-opacity=".65"/>
      <stop offset=".55" stop-color="#FFD45A" stop-opacity=".2"/>
      <stop offset="1" stop-color="#FFD45A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="drop_roc_blood-liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF9A4A"/>
      <stop offset=".5" stop-color="#F03028"/>
      <stop offset="1" stop-color="#8A0A12"/>
    </linearGradient>
    <radialGradient id="drop_roc_blood-core" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFF2A0" stop-opacity=".95"/>
      <stop offset=".4" stop-color="#FFF2A0" stop-opacity=".5"/>
      <stop offset="1" stop-color="#FFF2A0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="drop_roc_blood-glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".5"/>
      <stop offset=".3" stop-color="#FFFFFF" stop-opacity=".1"/>
      <stop offset=".8" stop-color="#FFFFFF" stop-opacity=".04"/>
      <stop offset="1" stop-color="#1A2A6E" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="drop_roc_blood-empty" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE4D8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#FFE4D8" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="drop_roc_blood-cork" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0D2A0"/>
      <stop offset=".5" stop-color="#C48A4E"/>
      <stop offset="1" stop-color="#7A4620"/>
    </linearGradient>
    <linearGradient id="drop_roc_blood-charm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF6C8"/>
      <stop offset=".5" stop-color="#FFD45A"/>
      <stop offset="1" stop-color="#B06A14"/>
    </linearGradient>
    <clipPath id="drop_roc_blood-clip">
      <path d="M25.5 14H34.5V22.5L41.5 29V45A11.5 11.5 0 0 1 18.5 45V29L25.5 22.5Z"/>
    </clipPath>
  </defs>

  <!-- glow halo and contact shadow -->
  <circle cx="30" cy="40" r="20" fill="url(#drop_roc_blood-halo)"/>
  <ellipse cx="30" cy="57.3" rx="12" ry="1.6" fill="#2A1008" opacity=".3"/>

  <!-- empty glass -->
  <path d="M25.5 14H34.5V22.5L41.5 29V45A11.5 11.5 0 0 1 18.5 45V29L25.5 22.5Z" fill="url(#drop_roc_blood-empty)"/>

  <!-- blood -->
  <g clip-path="url(#drop_roc_blood-clip)">
    <rect x="16" y="31" width="30" height="30" fill="url(#drop_roc_blood-liquid)"/>
    <ellipse cx="30" cy="31" rx="12" ry="2.2" fill="#FFD070"/>
    <circle cx="30" cy="44" r="9" fill="url(#drop_roc_blood-core)"/>
    <!-- golden light rays -->
    <g fill="none" stroke="#FFE78A" stroke-width="1.2" stroke-linecap="round" opacity=".8">
      <path d="M30 44L24 36M30 44L37.5 37M30 44L22 46.5M30 44L38.5 48"/>
    </g>
    <circle cx="30" cy="44" r="3.4" fill="#FFF6C8"/>
    <g fill="#FFE07A" opacity=".9">
      <circle cx="24" cy="51" r="1"/>
      <circle cx="36.6" cy="52" r=".8"/>
    </g>
  </g>

  <!-- glass overlay and outline -->
  <path d="M25.5 14H34.5V22.5L41.5 29V45A11.5 11.5 0 0 1 18.5 45V29L25.5 22.5Z" fill="url(#drop_roc_blood-glass)"/>
  <path d="M25.5 14H34.5V22.5L41.5 29V45A11.5 11.5 0 0 1 18.5 45V29L25.5 22.5Z" fill="none" stroke="#2A1008" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M22 31C21.2 36 21.6 42 23.8 47.5" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" opacity=".8"/>
  <path d="M27.6 16.5V21" fill="none" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" opacity=".6"/>

  <!-- cork -->
  <rect x="23" y="6.5" width="14" height="9" rx="2.2" fill="url(#drop_roc_blood-cork)" stroke="#2A1008" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M27 8.6V13.4M30.5 8.4V13.6M33.8 8.7V13.3" fill="none" stroke="#7A4620" stroke-width=".9" stroke-linecap="round" opacity=".55"/>
  <path d="M25.2 8.4H28.6" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".7"/>

  <!-- neck cord and charm -->
  <path d="M24.5 17.5H35.5" fill="none" stroke="#2A1008" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M24.5 17.5H35.5" fill="none" stroke="#D69A2A" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M35.5 17.5Q43 17 46.8 21" fill="none" stroke="#2A1008" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M35.5 17.5Q43 17 46.8 21" fill="none" stroke="#D69A2A" stroke-width="1.1" stroke-linecap="round"/>
  <path d="M48.6 19.6C43.4 22.2 42.4 28.4 44.6 33.6C49.6 31.6 51.8 25.4 48.6 19.6Z" fill="url(#drop_roc_blood-charm)" stroke="#2A1008" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M48.2 21.6C46.8 25 45.8 29 44.8 33.2" fill="none" stroke="#9A5E14" stroke-width="1" stroke-linecap="round" opacity=".8"/>
  <path d="M47 24.8L49.6 25.8M46.2 27.8L48.6 29" fill="none" stroke="#9A5E14" stroke-width=".8" stroke-linecap="round" opacity=".55"/>
  <path d="M47.8 20.4C48.8 21.4 49.4 22.6 49.6 23.8" fill="none" stroke="#FF6A44" stroke-width="1.4" stroke-linecap="round" opacity=".8"/>
  <path d="M45.4 24.6C45.8 23.4 46.6 22.4 47.4 21.6" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".85"/>

  <!-- glint -->
  <path d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z" transform="translate(38.6 26) scale(1.7)" fill="#FFFFFF"/>
