<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="furnace_earth_fire-iron" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C7C8C"/>
      <stop offset=".3" stop-color="#3C3C48"/>
      <stop offset=".7" stop-color="#1E1E26"/>
      <stop offset="1" stop-color="#0C0C10"/>
    </linearGradient>
    <linearGradient id="furnace_earth_fire-bronze" x1="0" y1="0" x2="1" y2=".4">
      <stop offset="0" stop-color="#FFC890"/>
      <stop offset=".3" stop-color="#E07040"/>
      <stop offset=".7" stop-color="#9A3A14"/>
      <stop offset="1" stop-color="#5A1C08"/>
    </linearGradient>
    <linearGradient id="furnace_earth_fire-bronzeV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0A070"/>
      <stop offset=".4" stop-color="#C8502A"/>
      <stop offset="1" stop-color="#6A2008"/>
    </linearGradient>
    <linearGradient id="furnace_earth_fire-shade" gradientUnits="userSpaceOnUse" x1="0" y1="32" x2="0" y2="49">
      <stop offset="0" stop-color="#FF6A1A" stop-opacity="0"/>
      <stop offset="1" stop-color="#FF6A1A" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="furnace_earth_fire-shadeR" gradientUnits="userSpaceOnUse" x1="38" y1="0" x2="56" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".5"/>
    </linearGradient>
    <radialGradient id="furnace_earth_fire-sheen" gradientUnits="userSpaceOnUse" cx="19" cy="30" r="15">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".4"/>
      <stop offset=".55" stop-color="#FFFFFF" stop-opacity=".1"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="furnace_earth_fire-flameO" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FFA020"/>
      <stop offset=".55" stop-color="#F0481C"/>
      <stop offset="1" stop-color="#C8241A"/>
    </linearGradient>
    <linearGradient id="furnace_earth_fire-flameM" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FFE060"/>
      <stop offset=".6" stop-color="#FFB22E"/>
      <stop offset="1" stop-color="#FF8A1E"/>
    </linearGradient>
    <linearGradient id="furnace_earth_fire-flameC" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FFF8D0"/>
      <stop offset="1" stop-color="#FFE070"/>
    </linearGradient>
    <radialGradient id="furnace_earth_fire-fireGlow" cx=".5" cy=".6" r=".5">
      <stop offset="0" stop-color="#FFB030" stop-opacity=".75"/>
      <stop offset="1" stop-color="#FFB030" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="furnace_earth_fire-magma" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFF2A0"/>
      <stop offset=".4" stop-color="#FFA020"/>
      <stop offset="1" stop-color="#C8301A"/>
    </radialGradient>
    <linearGradient id="furnace_earth_fire-rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A3A3C"/>
      <stop offset="1" stop-color="#1A1012"/>
    </linearGradient>
    <clipPath id="furnace_earth_fire-body">
      <path d="M8.5 26C8.5 39 16 48.5 32 48.5C48 48.5 55.5 39 55.5 26Z"/>
    </clipPath>
  </defs>

  <g transform="translate(32 32) scale(.93) translate(-32 -32)">
    <!-- fire glow, cast shadow -->
    <ellipse cx="32" cy="50" rx="22" ry="11" fill="url(#furnace_earth_fire-fireGlow)"/>
    <ellipse cx="32" cy="57.2" rx="24" ry="2.6" fill="#2A1008" opacity=".3"/>

    <!-- magma vent: cracked rock with a lava pool -->
    <path d="M9 57.5C12 51.5 20 49.5 32 49.5C44 49.5 52 51.5 55 57.5Z" fill="url(#furnace_earth_fire-rock)" stroke="#2A1008" stroke-width="2.2" stroke-linejoin="round"/>
    <ellipse cx="32" cy="55.4" rx="13" ry="2.2" fill="url(#furnace_earth_fire-magma)" stroke="#2A1008" stroke-width="1.6"/>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13 56L18 53.5L22 54.5M51 56L46 53.5L42 54.5" stroke="#FF6A1A" stroke-width="2.6" opacity=".6"/>
      <path d="M13 56L18 53.5L22 54.5M51 56L46 53.5L42 54.5" stroke="#FFD040" stroke-width="1.1"/>
    </g>

    <!-- back legs -->
    <g stroke="#2A1008" stroke-width="2.4" stroke-linejoin="round" fill="url(#furnace_earth_fire-iron)">
      <path d="M13.5 42L12 52.5Q11.7 55 14.2 55H18.8Q20.8 55 20.6 53L20.5 47.5Z"/>
      <path d="M50.5 42L52 52.5Q52.3 55 49.8 55H45.2Q43.2 55 43.4 53L43.5 47.5Z"/>
    </g>
    <path d="M14.3 45.5L13.6 52" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".45"/>

    <!-- dragon-head vents (left faces left, right faces right) -->
    <g stroke="#2A1008" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
      <path d="M17 22C13 22 9 19 5.5 21.5C7.5 19 7 16 9.5 13.5C11.5 11.5 15 11 17.5 12Z" fill="url(#furnace_earth_fire-bronzeV)"/>
      <path d="M47 22C51 22 55 19 58.5 21.5C56.5 19 57 16 54.5 13.5C52.5 11.5 49 11 46.5 12Z" fill="url(#furnace_earth_fire-bronzeV)"/>
    </g>
    <!-- horns -->
    <path d="M12 12.8L10.8 8M52 12.8L53.2 8" fill="none" stroke="#2A1008" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M12 12.8L10.8 8M52 12.8L53.2 8" fill="none" stroke="#F0A070" stroke-width="1.5" stroke-linecap="round"/>
    <!-- eyes and jaw flames -->
    <circle cx="10.6" cy="16" r="1.3" fill="#FFF2A0"/>
    <circle cx="53.4" cy="16" r="1.3" fill="#FFF2A0"/>
    <path d="M6.5 21.2C5.2 22.8 5.6 24.6 7 26M57.5 21.2C58.8 22.8 58.4 24.6 57 26" fill="none" stroke="#FFA020" stroke-width="2" stroke-linecap="round" opacity=".9"/>
    <path d="M9.6 13.8C11 12.6 13 12.2 15 12.6" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".6"/>

    <!-- body -->
    <path d="M8.5 26C8.5 39 16 48.5 32 48.5C48 48.5 55.5 39 55.5 26Z" fill="url(#furnace_earth_fire-iron)"/>
    <g clip-path="url(#furnace_earth_fire-body)">
      <rect x="0" y="0" width="64" height="64" fill="url(#furnace_earth_fire-shade)"/>
      <rect x="0" y="0" width="64" height="64" fill="url(#furnace_earth_fire-shadeR)"/>
      <rect x="0" y="0" width="64" height="64" fill="url(#furnace_earth_fire-sheen)"/>
      <!-- red-bronze band with rivets -->
      <rect x="0" y="32" width="64" height="5" fill="url(#furnace_earth_fire-bronze)"/>
      <path d="M0 32H64M0 37H64" stroke="#2A1008" stroke-width="1" opacity=".85"/>
      <path d="M0 33H64" stroke="#FFD0A0" stroke-width=".6" opacity=".5"/>
      <g fill="#2A1008" opacity=".7">
        <circle cx="15" cy="34.5" r=".9"/>
        <circle cx="22" cy="34.5" r=".9"/>
        <circle cx="42" cy="34.5" r=".9"/>
        <circle cx="49" cy="34.5" r=".9"/>
      </g>
      <!-- heat cracks glowing through the iron belly -->
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M24 46L27 42L25 39M40 47L37 42L39.5 39.5" stroke="#FF6A1A" stroke-width="2.8" opacity=".55"/>
        <path d="M24 46L27 42L25 39M40 47L37 42L39.5 39.5" stroke="#FFD040" stroke-width="1.1"/>
      </g>
    </g>
    <path d="M8.5 26C8.5 39 16 48.5 32 48.5C48 48.5 55.5 39 55.5 26Z" fill="none" stroke="#2A1008" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M13 30C12.3 35 14 39.5 17.5 43" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" opacity=".55"/>

    <!-- red emblem on the belly: a flame disc -->
    <circle cx="32" cy="41.5" r="4.2" fill="url(#furnace_earth_fire-bronzeV)" stroke="#2A1008" stroke-width="1.6"/>
    <path d="M32 38.4C30.4 40.2 30.2 41.6 30.8 43.2C31.4 42.2 31.8 42 32.2 41.2C33.2 42 33.6 43 33.3 43.8C34.4 42.2 34 40 32 38.4Z" fill="#FFE070"/>
    <circle cx="30.8" cy="40" r=".6" fill="#FFFFFF" opacity=".8"/>

    <!-- rim band and mouth -->
    <rect x="5.5" y="20" width="53" height="7.5" rx="3.6" fill="url(#furnace_earth_fire-bronze)" stroke="#2A1008" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M8.6 25.5H19.5" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".55"/>
    <path d="M9 21.8H55" fill="none" stroke="#FFFFFF" stroke-width=".6" stroke-linecap="round" opacity=".4"/>
    <ellipse cx="32" cy="21.8" rx="21.5" ry="2.6" fill="#3A1608" stroke="#2A1008" stroke-width="1.5"/>

    <!-- roaring fire bursting from the mouth -->
    <path d="M13 22C14 16.5 17 14 19 8.5C21 13 24 13.5 25.5 6.5C27.5 12 30 12 32 4C34 12 36.5 12 38.5 6.5C40 13.5 43 13 45 8.5C47 14 50 16.5 51 22Z" fill="url(#furnace_earth_fire-flameO)" stroke="#2A1008" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M17 22C18 18 21 16 22.5 12C24 16 26.5 16 28 10.5C29.5 16 32.5 16 34 10C35.5 16 38 16 39.5 12C41 16 44 18 45 22Z" fill="url(#furnace_earth_fire-flameM)"/>
    <path d="M22 22C22.5 19 25 18 27 14.5C28.5 18 31.5 18 33 14.5C35 18 37.5 19 38 22Z" fill="url(#furnace_earth_fire-flameC)"/>
    <ellipse cx="32" cy="22.2" rx="19" ry="1.6" fill="#FFE070"/>
    <circle cx="24" cy="9" r=".9" fill="#FFC844"/>
    <circle cx="41" cy="7.4" r=".8" fill="#FFB030"/>

    <!-- front leg -->
    <path d="M27.9 48Q27.9 46.2 29.7 46.2H34.3Q36.1 46.2 36.1 48L36.4 53.6Q36.4 55.8 34.2 55.8H29.8Q27.6 55.8 27.6 53.6Z" fill="url(#furnace_earth_fire-iron)" stroke="#2A1008" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M29.6 48.2L29.4 53.2" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".5"/>
  </g>
</svg>
