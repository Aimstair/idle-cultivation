<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="furnace_spirit-jade" gradientUnits="userSpaceOnUse" cx="25" cy="27" r="24">
      <stop offset="0" stop-color="#D8FFEE"/>
      <stop offset=".4" stop-color="#3FC79A"/>
      <stop offset=".8" stop-color="#17805E"/>
      <stop offset="1" stop-color="#0A4A38"/>
    </radialGradient>
    <linearGradient id="furnace_spirit-lid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C8FFE6"/>
      <stop offset=".5" stop-color="#3FC79A"/>
      <stop offset="1" stop-color="#0E6A50"/>
    </linearGradient>
    <linearGradient id="furnace_spirit-silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".45" stop-color="#CFD6E4"/>
      <stop offset="1" stop-color="#6E7688"/>
    </linearGradient>
    <linearGradient id="furnace_spirit-silverD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".5" stop-color="#B8C0D0"/>
      <stop offset="1" stop-color="#5E6678"/>
    </linearGradient>
    <linearGradient id="furnace_spirit-flameO" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#8FDCFF"/>
      <stop offset=".6" stop-color="#3B7FE0"/>
      <stop offset="1" stop-color="#2448B0"/>
    </linearGradient>
    <linearGradient id="furnace_spirit-flameM" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#E8F8FF"/>
      <stop offset="1" stop-color="#8FDCFF"/>
    </linearGradient>
    <radialGradient id="furnace_spirit-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#8FDCFF" stop-opacity=".7"/>
      <stop offset="1" stop-color="#8FDCFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="furnace_spirit-emberBlue" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#3B7FE0"/>
      <stop offset="1" stop-color="#1A2A6E"/>
    </radialGradient>
    <clipPath id="furnace_spirit-bodyclip">
      <ellipse cx="32" cy="34" rx="16.5" ry="15"/>
    </clipPath>
  </defs>

  <!-- spirit glow and contact shadow -->
  <ellipse cx="32" cy="50" rx="18" ry="9" fill="url(#furnace_spirit-glow)"/>
  <ellipse cx="32" cy="57" rx="20" ry="1.8" fill="#2A1008" opacity=".3"/>

  <!-- back half of the outer rune ring -->
  <g transform="rotate(-18 32 36)">
    <path d="M9 36A23 6 0 0 1 55 36" fill="none" stroke="#8FDCFF" stroke-width="3.4" stroke-linecap="round" opacity=".3"/>
    <path d="M9 36A23 6 0 0 1 55 36" fill="none" stroke="#B8E4FF" stroke-width="1.4" stroke-linecap="round"/>
    <g fill="#E8F8FF">
      <path d="M20 31.2L21.2 32.4L20 33.6L18.8 32.4Z"/>
      <path d="M44 31.2L45.2 32.4L44 33.6L42.8 32.4Z"/>
      <path d="M31.2 29.4H32.8V30.6H31.2Z"/>
    </g>
  </g>

  <!-- silver legs (back pair) -->
  <g fill="none" stroke-linecap="round">
    <path d="M18 42Q13 47 13.5 55" stroke="#2A1008" stroke-width="6"/>
    <path d="M46 42Q51 47 50.5 55" stroke="#2A1008" stroke-width="6"/>
    <path d="M18 42Q13 47 13.5 55" stroke="url(#furnace_spirit-silver)" stroke-width="3.4"/>
    <path d="M46 42Q51 47 50.5 55" stroke="url(#furnace_spirit-silver)" stroke-width="3.4"/>
    <path d="M16.6 44.5Q14.6 48 14.6 52" stroke="#FFFFFF" stroke-width=".9" opacity=".7"/>
  </g>

  <!-- blue spirit flame beneath -->
  <ellipse cx="32" cy="56" rx="11" ry="1.8" fill="url(#furnace_spirit-emberBlue)" stroke="#2A1008" stroke-width="1.6"/>
  <path d="M22 56C21.5 52.5 23.5 50 24.5 47C26 50 28 50 29 45.5C30.5 49.5 33.5 49.5 35 45.5C36 50 38 50 39.5 47C40.5 50 42.5 52.5 42 56Z" fill="url(#furnace_spirit-flameO)" stroke="#2A1008" stroke-width="2" stroke-linejoin="round"/>
  <path d="M26 56C26 54 27.5 52.5 29 49.5C30.5 52.5 33.5 52.5 35 49.5C36.5 52.5 38 54 38 56Z" fill="url(#furnace_spirit-flameM)"/>

  <!-- jade body -->
  <ellipse cx="32" cy="34" rx="16.5" ry="15" fill="url(#furnace_spirit-jade)"/>
  <g clip-path="url(#furnace_spirit-bodyclip)">
    <path d="M18 44Q32 52 46 44" fill="none" stroke="#0A4A38" stroke-width="1.2" opacity=".4"/>
    <path d="M14 38C22 34 26 40 36 32" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" opacity=".22"/>
    <!-- silver belly band -->
    <rect x="10" y="33" width="44" height="3.6" fill="url(#furnace_spirit-silver)"/>
    <path d="M10 33H54M10 36.6H54" stroke="#2A1008" stroke-width="1" opacity=".7"/>
  </g>
  <ellipse cx="32" cy="34" rx="16.5" ry="15" fill="none" stroke="#2A1008" stroke-width="2.4"/>
  <path d="M19.5 30C19.2 34 20.2 38.5 23 42" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity=".75"/>

  <!-- silver mouth rim -->
  <rect x="16" y="18.5" width="32" height="5.5" rx="2.6" fill="url(#furnace_spirit-silver)" stroke="#2A1008" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M18.6 20H30" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".8"/>

  <!-- domed jade lid with silver knob -->
  <path d="M19.5 18.5C19.5 11.5 44.5 11.5 44.5 18.5Z" fill="url(#furnace_spirit-lid)" stroke="#2A1008" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M22.4 16.4C24 14.6 27 13.6 30 13.4" fill="none" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" opacity=".8"/>
  <circle cx="32" cy="10" r="3.2" fill="url(#furnace_spirit-silverD)" stroke="#2A1008" stroke-width="2"/>
  <circle cx="30.9" cy="8.9" r=".8" fill="#FFFFFF" opacity=".9"/>

  <!-- front leg -->
  <path d="M32 46V56" fill="none" stroke="#2A1008" stroke-width="6.4" stroke-linecap="round"/>
  <path d="M32 46V56" fill="none" stroke="url(#furnace_spirit-silverD)" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M30.8 48V53.5" fill="none" stroke="#FFFFFF" stroke-width=".9" stroke-linecap="round" opacity=".7"/>

  <!-- front half of the outer rune ring and a smaller inner ring -->
  <g transform="rotate(-18 32 36)">
    <path d="M9 36A23 6 0 0 0 55 36" fill="none" stroke="#8FDCFF" stroke-width="3.4" stroke-linecap="round" opacity=".3"/>
    <path d="M9 36A23 6 0 0 0 55 36" fill="none" stroke="#DFF4FF" stroke-width="1.5" stroke-linecap="round"/>
    <g fill="#FFFFFF" stroke="#2A1008" stroke-width=".6">
      <path d="M17 36.8L18.4 38.2L17 39.6L15.6 38.2Z"/>
      <path d="M32 40.4L33.4 41.8L32 43.2L30.6 41.8Z"/>
      <path d="M47 36.8L48.4 38.2L47 39.6L45.6 38.2Z"/>
      <path d="M24 40.4H26V41.6H24Z"/>
      <path d="M38.6 40.4H40.6V41.6H38.6Z"/>
    </g>
  </g>
  <g transform="rotate(14 32 28)">
    <path d="M14 28A18 4.2 0 0 0 50 28" fill="none" stroke="#8FDCFF" stroke-width="2.8" stroke-linecap="round" opacity=".3"/>
    <path d="M14 28A18 4.2 0 0 0 50 28" fill="none" stroke="#DFF4FF" stroke-width="1.2" stroke-linecap="round"/>
    <g fill="#FFFFFF">
      <path d="M22 30.6L23 31.6L22 32.6L21 31.6Z"/>
      <path d="M42 30.6L43 31.6L42 32.6L41 31.6Z"/>
    </g>
  </g>

  <!-- sparkles -->
  <g fill="#FFFFFF">
    <path d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z" transform="translate(10 22) scale(2)"/>
    <path d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z" transform="translate(55 16) scale(1.6)"/>
    <path d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z" transform="translate(52 48) scale(1.3)"/>
  </g>
</svg>
