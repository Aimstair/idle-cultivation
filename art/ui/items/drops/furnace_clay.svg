<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="furnace_clay-clay" gradientUnits="userSpaceOnUse" cx="22" cy="28" r="34">
      <stop offset="0" stop-color="#F2B486"/>
      <stop offset=".45" stop-color="#C0683C"/>
      <stop offset="1" stop-color="#5A2612"/>
    </radialGradient>
    <linearGradient id="furnace_clay-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6C8A0"/>
      <stop offset="1" stop-color="#A0522A"/>
    </linearGradient>
    <linearGradient id="furnace_clay-stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C4BCD4"/>
      <stop offset="1" stop-color="#6E6684"/>
