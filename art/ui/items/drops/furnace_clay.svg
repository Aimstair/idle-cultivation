  <!-- smoke -->
  <g fill="url(#furnace_clay-smoke)" stroke="#2A1008" stroke-width="1.6">
    <circle cx="29" cy="14.5" r="3.6"/>
    <circle cx="34.5" cy="10.5" r="3.2"/>
    <circle cx="25.5" cy="10" r="2.4"/>
    <circle cx="39" cy="14" r="2.4"/>
    <circle cx="31" cy="7.4" r="1.6"/>
  </g>
