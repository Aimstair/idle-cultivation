  <path d="M26.6 50.5C26.6 47.5 27.6 46 28.6 43.5C29.8 46.2 31 46 32 42.5C33 46 34.2 46.2 35.4 43.5C36.4 46 37.4 47.5 37.4 50.5Z" fill="url(#furnace_clay-flameO)"/>
  <path d="M28.8 50.5C28.8 48.5 30 47.8 32 45.5C34 47.8 35.2 48.5 35.2 50.5Z" fill="url(#furnace_clay-flameC)"/>
