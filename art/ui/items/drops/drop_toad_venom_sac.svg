      <circle cx="22" cy="30" r="2.9"/>
      <circle cx="40.5" cy="25.5" r="2.4"/>
      <circle cx="27.5" cy="44" r="2.5"/>
      <circle cx="44" cy="42" r="2.1"/>
      <circle cx="35" cy="35.5" r="1.9"/>
      <circle cx="17" cy="40.5" r="1.7"/>
    </g>
    <g fill="#FFFFFF" opacity=".85">
      <circle cx="21" cy="29" r=".9"/>
      <circle cx="39.7" cy="24.7" r=".8"/>
      <circle cx="26.7" cy="43.1" r=".8"/>
      <circle cx="43.3" cy="41.3" r=".7"/>
      <circle cx="34.4" cy="34.9" r=".6"/>
