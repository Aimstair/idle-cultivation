  <path d="M32 14C20 14 11.5 24 12 36.5C12.5 47 21 52.5 32 52.5C43 52.5 51.5 47 52 36.5C52.5 24 44 14 32 14Z" fill="none" stroke="#2A1008" stroke-width="2.4" stroke-linejoin="round"/>

