  <path d="M27.8 12.4H36.2" fill="none" stroke="#2A1008" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M27.8 12.4H36.2" fill="none" stroke="#8A5A2E" stroke-width="1.2" stroke-linecap="round"/>

