  <path d="M46 30.2C46.4 26.8 47.6 24.4 49.4 22.4M48.8 30.4C49 27.6 49.6 25.4 50.6 23.4" fill="none" stroke="#1A2A6E" stroke-width=".9" stroke-linecap="round" opacity=".6"/>
