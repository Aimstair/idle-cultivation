<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="drop_serpent_scale-base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B8E4FF"/>
      <stop offset=".45" stop-color="#2FA8B8"/>
      <stop offset="1" stop-color="#1A2A6E"/>
    </linearGradient>
    <linearGradient id="drop_serpent_scale-rainbow" gradientUnits="userSpaceOnUse" x1="14" y1="40" x2="48" y2="16">
      <stop offset="0" stop-color="#FF9AD0" stop-opacity="0"/>
      <stop offset=".22" stop-color="#FF9AD0" stop-opacity=".55"/>
      <stop offset=".38" stop-color="#FFE680" stop-opacity=".6"/>
      <stop offset=".54" stop-color="#9AFFB0" stop-opacity=".6"/>
      <stop offset=".7" stop-color="#8FDCFF" stop-opacity=".55"/>
      <stop offset=".85" stop-color="#C9A0FF" stop-opacity=".45"/>
      <stop offset="1" stop-color="#C9A0FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="drop_serpent_scale-shade" gradientUnits="userSpaceOnUse" x1="0" y1="20" x2="0" y2="58">
      <stop offset="0" stop-color="#0E1A50" stop-opacity="0"/>
      <stop offset="1" stop-color="#0E1A50" stop-opacity=".5"/>
    </linearGradient>
    <radialGradient id="drop_serpent_scale-gloss" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="drop_serpent_scale-clip">
      <path d="M32 7C19 7 11 17 11 30C11 44 22 54 32 57.5C42 54 53 44 53 30C53 17 45 7 32 7Z"/>
    </clipPath>
  </defs>

  <!-- contact shadow -->
  <ellipse cx="32" cy="57.4" rx="11" ry="1.8" fill="#2A1008" opacity=".3"/>

  <!-- scale -->
  <path d="M32 7C19 7 11 17 11 30C11 44 22 54 32 57.5C42 54 53 44 53 30C53 17 45 7 32 7Z" fill="url(#drop_serpent_scale-base)"/>
  <g clip-path="url(#drop_serpent_scale-clip)">
    <rect x="0" y="0" width="64" height="64" fill="url(#drop_serpent_scale-shade)"/>
    <!-- rainbow sheen band -->
    <path d="M6 44L52 6L64 18L18 56Z" fill="url(#drop_serpent_scale-rainbow)"/>
    <!-- growth arcs following the free edge -->
    <g fill="none" stroke="#0E1A50" stroke-width="1.2" stroke-linecap="round" opacity=".38">
      <path d="M16 36Q32 48 48 36"/>
      <path d="M20 43Q32 52.5 44 43"/>
    </g>
    <g fill="none" stroke="#B8E4FF" stroke-width=".8" stroke-linecap="round" opacity=".45">
      <path d="M16.6 34.8Q32 46.6 47.4 34.8"/>
      <path d="M20.6 41.8Q32 51.2 43.4 41.8"/>
    </g>
    <!-- keel -->
    <path d="M33.2 10V54" fill="none" stroke="#0E1A50" stroke-width="1.4" stroke-linecap="round" opacity=".35"/>
    <path d="M31.8 10V53" fill="none" stroke="#DFF4FF" stroke-width="1.3" stroke-linecap="round" opacity=".6"/>
    <!-- outer bevel -->
    <path d="M32 7C19 7 11 17 11 30C11 44 22 54 32 57.5C42 54 53 44 53 30C53 17 45 7 32 7Z" fill="none" stroke="#FFFFFF" stroke-width="2.4" opacity=".28"/>
  </g>
  <path d="M32 7C19 7 11 17 11 30C11 44 22 54 32 57.5C42 54 53 44 53 30C53 17 45 7 32 7Z" fill="none" stroke="#2A1008" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- highlight -->
  <ellipse cx="22.5" cy="19.5" rx="6.5" ry="3.6" fill="url(#drop_serpent_scale-gloss)" transform="rotate(-48 22.5 19.5)"/>
  <path d="M17.5 24C18.6 18.6 21.6 14.4 26 11.8" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" opacity=".85"/>
  <path d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z" transform="translate(44 38) scale(1.9)" fill="#FFFFFF"/>
  <path d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z" transform="translate(39.5 15.5) scale(1.3)" fill="#FFFFFF" opacity=".85"/>
</svg>
