  <path d="M38.2 22.2L43.8 27.8" fill="none" stroke="url(#pickaxe_copper-collar)" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="40.2" cy="24.2" r=".7" fill="#FFFFFF" opacity=".8"/>
