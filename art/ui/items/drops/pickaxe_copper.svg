<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="pickaxe_copper-head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE2C0"/>
      <stop offset=".35" stop-color="#E08A48"/>
      <stop offset=".75" stop-color="#9A4A1C"/>
      <stop offset="1" stop-color="#4E2008"/>
    </linearGradient>
    <linearGradient id="pickaxe_copper-collar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD9B0"/>
      <stop offset="1" stop-color="#8A4218"/>
    </linearGradient>
    <linearGradient id="pickaxe_copper-wood" gradientUnits="userSpaceOnUse" x1="27" y1="34" x2="32" y2="39">
      <stop offset="0" stop-color="#D89258"/>
      <stop offset=".5" stop-color="#B06A30"/>
      <stop offset="1" stop-color="#6A3414"/>
