  <path d="M14.6 49.6L39.5 24.7" fill="none" stroke="#6A3414" stroke-width=".9" stroke-linecap="round" opacity=".55"/>
  <path d="M12.2 50.6L36 26.8" fill="none" stroke="#FFE7C0" stroke-width="1.2" stroke-linecap="round" opacity=".6"/>

