  <path d="M33 12.4Q50.5 13.5 53.4 29" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity=".8"/>
  <path d="M38.5 16.2Q45.5 19 48.5 26" fill="none" stroke="#5A2608" stroke-width="1.1" stroke-linecap="round" opacity=".4"/>

  <!-- collar -->
