    <path d="M46 12.8V19.5" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".45"/>

    <!-- body -->
    <path d="M8.5 26C8.5 39 16 48.5 32 48.5C48 48.5 55.5 39 55.5 26Z" fill="url(#furnace_bronze-bronze)"/>
