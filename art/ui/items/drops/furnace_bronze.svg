      <g fill="#FFE7A0" opacity=".6">
        <circle cx="17" cy="34.4" r=".6"/>
        <circle cx="23" cy="34.4" r=".6"/>
        <circle cx="41" cy="34.4" r=".6"/>
        <circle cx="47" cy="34.4" r=".6"/>
      </g>
      <path d="M12 43.5Q32 50 52 43.5" fill="none" stroke="#2A1008" stroke-width="1" opacity=".45"/>
      <path d="M13 42.6Q32 49 51 42.6" fill="none" stroke="#FFE7A0" stroke-width=".7" opacity=".4"/>
    </g>
    <path d="M8.5 26C8.5 39 16 48.5 32 48.5C48 48.5 55.5 39 55.5 26Z" fill="none" stroke="#2A1008" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M13 30C12.3 35 14 39.5 17.5 43" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" opacity=".72"/>

    <!-- red emblem -->
    <circle cx="32" cy="38.2" r="4" fill="url(#furnace_bronze-emblem)" stroke="#2A1008" stroke-width="1.6"/>
    <circle cx="32" cy="38.2" r="2.6" fill="none" stroke="#FFE08A" stroke-width=".8"/>
    <circle cx="32" cy="38.2" r="1.15" fill="#FFE08A"/>
    <circle cx="30.8" cy="36.9" r=".6" fill="#FFFFFF" opacity=".8"/>

