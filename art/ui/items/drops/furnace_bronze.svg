    <path d="M19 56.5C18 53 20 50 21.5 46C23 50 25.5 50.5 26.5 44.5C28 49 30.5 49 32 42C33.5 48.5 36 49 37.5 44C38.5 50 41 50 42.5 46C44 50 46 53 45 56.5Z" fill="url(#furnace_bronze-flameO)" stroke="#2A1008" stroke-width="2.1" stroke-linejoin="round"/>
    <path d="M22 56.5C21.5 54 23.5 52 24.5 48.5C26 52 28 52 29.5 47C31 52 33 51.5 34 46C35.5 51.5 37.5 52 39.5 48.5C40.5 52 42.5 54 42 56.5Z" fill="url(#furnace_bronze-flameM)"/>
    <path d="M26 56.5C26 54.5 28 53.5 29.5 50.5C31 54 33 54 34.5 50.5C36 53.5 38 54.5 38 56.5Z" fill="url(#furnace_bronze-flameC)"/>
    <circle cx="23.2" cy="41.6" r=".8" fill="#FFC844"/>
    <circle cx="41.4" cy="40.4" r=".7" fill="#FFB030"/>

