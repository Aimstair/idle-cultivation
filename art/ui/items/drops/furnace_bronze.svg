      <rect x="0" y="0" width="64" height="64" fill="url(#furnace_bronze-shadeR)"/>
      <rect x="0" y="0" width="64" height="64" fill="url(#furnace_bronze-sheen)"/>
      <!-- decorative band with key-fret diamonds -->
      <rect x="0" y="32" width="64" height="4.8" fill="url(#furnace_bronze-band)"/>
      <path d="M0 32H64M0 36.8H64" stroke="#2A1008" stroke-width="1" opacity=".8"/>
      <path d="M0 33H64" stroke="#FFF2B0" stroke-width=".6" opacity=".5"/>
      <g fill="#2A1008" opacity=".55">
        <path d="M14 33.1L15.4 34.4L14 35.7L12.6 34.4Z"/>
        <path d="M20 33.1L21.4 34.4L20 35.7L18.6 34.4Z"/>
        <path d="M26 33.1L27.4 34.4L26 35.7L24.6 34.4Z"/>
        <path d="M38 33.1L39.4 34.4L38 35.7L36.6 34.4Z"/>
        <path d="M44 33.1L45.4 34.4L44 35.7L42.6 34.4Z"/>
        <path d="M50 33.1L51.4 34.4L50 35.7L48.6 34.4Z"/>
