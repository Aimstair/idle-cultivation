    <g fill="url(#furnace_bronze-smoke)" stroke="#2A1008" stroke-width="1.6">
      <circle cx="27" cy="15" r="3.4"/>
      <circle cx="32.5" cy="11.2" r="3"/>
      <circle cx="37.5" cy="14.6" r="2.6"/>
      <circle cx="23" cy="12.4" r="2"/>
    </g>
    <g fill="url(#furnace_bronze-smoke)">
      <circle cx="27" cy="15" r="3.4"/>
      <circle cx="32.5" cy="11.2" r="3"/>
      <circle cx="37.5" cy="14.6" r="2.6"/>
      <circle cx="23" cy="12.4" r="2"/>
    </g>
    <ellipse cx="25.8" cy="13.8" rx="1.1" ry=".7" fill="#FFFFFF" opacity=".85"/>
    <ellipse cx="31.4" cy="10.2" rx=".9" ry=".6" fill="#FFFFFF" opacity=".85"/>

