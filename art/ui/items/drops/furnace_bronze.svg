      <path d="M8.5 21.5V11.5Q8.5 9.5 10.5 9.5H17.5Q19.5 9.5 19.5 11.5V21.5ZM11.5 12.3H16.5V20H11.5Z"/>
      <path d="M44.5 21.5V11.5Q44.5 9.5 46.5 9.5H53.5Q55.5 9.5 55.5 11.5V21.5ZM47.5 12.3H52.5V20H47.5Z"/>
