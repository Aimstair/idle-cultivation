<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="furnace_bronze-bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6E2A8"/>
      <stop offset=".3" stop-color="#D8A850"/>
      <stop offset=".65" stop-color="#A86E22"/>
      <stop offset="1" stop-color="#5E3A10"/>
    </linearGradient>
    <linearGradient id="furnace_bronze-rim" x1="0" y1="0" x2="1" y2=".4">
      <stop offset="0" stop-color="#FFF0C0"/>
      <stop offset=".3" stop-color="#E8BE58"/>
      <stop offset=".7" stop-color="#B8802A"/>
      <stop offset="1" stop-color="#7A4E12"/>
    </linearGradient>
    <linearGradient id="furnace_bronze-legV" x1="0" y1="0" x2="0" y2="1">
