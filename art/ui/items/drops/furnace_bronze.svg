    <path d="M27.9 48Q27.9 46.2 29.7 46.2H34.3Q36.1 46.2 36.1 48L36.4 53.6Q36.4 55.8 34.2 55.8H29.8Q27.6 55.8 27.6 53.6Z" fill="url(#furnace_bronze-legV)" stroke="#2A1008" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M29.6 48.2L29.4 53.2" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".6"/>
