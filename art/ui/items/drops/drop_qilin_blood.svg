<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="drop_qilin_blood-halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#8FDCFF" stop-opacity=".7"/>
      <stop offset=".55" stop-color="#8FDCFF" stop-opacity=".22"/>
      <stop offset="1" stop-color="#8FDCFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="drop_qilin_blood-liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8F8FF"/>
      <stop offset=".45" stop-color="#6CC8FF"/>
      <stop offset="1" stop-color="#1E60B8"/>
    </linearGradient>
    <radialGradient id="drop_qilin_blood-core" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset=".4" stop-color="#FFFFFF" stop-opacity=".5"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="drop_qilin_blood-glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".5"/>
      <stop offset=".3" stop-color="#FFFFFF" stop-opacity=".1"/>
      <stop offset=".8" stop-color="#FFFFFF" stop-opacity=".04"/>
      <stop offset="1" stop-color="#1A2A6E" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="drop_qilin_blood-empty" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4F4FF" stop-opacity=".7"/>
      <stop offset="1" stop-color="#E4F4FF" stop-opacity=".3"/>
    </linearGradient>
    <linearGradient id="drop_qilin_blood-frost" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".75"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="drop_qilin_blood-cork" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0D2A0"/>
      <stop offset=".5" stop-color="#C48A4E"/>
      <stop offset="1" stop-color="#7A4620"/>
    </linearGradient>
    <linearGradient id="drop_qilin_blood-charm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".6" stop-color="#D8ECFF"/>
      <stop offset="1" stop-color="#8FB8E0"/>
    </linearGradient>
    <clipPath id="drop_qilin_blood-clip">
      <path d="M25.5 14H34.5V22.5L41.5 29V45A11.5 11.5 0 0 1 18.5 45V29L25.5 22.5Z"/>
    </clipPath>
  </defs>

  <!-- glow halo and contact shadow -->
  <circle cx="30" cy="40" r="20" fill="url(#drop_qilin_blood-halo)"/>
  <ellipse cx="30" cy="57.3" rx="12" ry="1.6" fill="#2A1008" opacity=".3"/>

  <!-- empty glass -->
  <path d="M25.5 14H34.5V22.5L41.5 29V45A11.5 11.5 0 0 1 18.5 45V29L25.5 22.5Z" fill="url(#drop_qilin_blood-empty)"/>

  <!-- icy luminous blood -->
  <g clip-path="url(#drop_qilin_blood-clip)">
    <rect x="16" y="31" width="30" height="30" fill="url(#drop_qilin_blood-liquid)"/>
    <ellipse cx="30" cy="31" rx="12" ry="2.2" fill="#FFFFFF"/>
    <circle cx="30" cy="43" r="8.5" fill="url(#drop_qilin_blood-core)"/>
    <g fill="#FFFFFF" opacity=".9">
      <circle cx="24.6" cy="47" r="1"/>
      <circle cx="36.4" cy="40.4" r=".8"/>
    </g>
    <!-- frost creeping up the glass from the bottom -->
    <rect x="16" y="40" width="30" height="20" fill="url(#drop_qilin_blood-frost)"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19.5 48L23.5 44.5M21 46.8L21.4 44.4M22.4 45.6L24.4 46"/>
      <path d="M41 46.5L37.5 43.5M39.6 45.3L39.4 43M38.4 44.3L36.6 44.8"/>
    </g>
  </g>

  <!-- glass overlay and outline -->
  <path d="M25.5 14H34.5V22.5L41.5 29V45A11.5 11.5 0 0 1 18.5 45V29L25.5 22.5Z" fill="url(#drop_qilin_blood-glass)"/>
  <path d="M25.5 14H34.5V22.5L41.5 29V45A11.5 11.5 0 0 1 18.5 45V29L25.5 22.5Z" fill="none" stroke="#2A1008" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M22 31C21.2 36 21.6 42 23.8 47.5" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" opacity=".8"/>
  <path d="M27.6 16.5V21" fill="none" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" opacity=".6"/>
  <!-- rime on the outside of the glass -->
  <g fill="#FFFFFF" stroke="#2A1008" stroke-width="1" stroke-linejoin="round">
    <path d="M17 36.6L19.6 35.2L20.2 38.2L18.4 39.4Z"/>
    <path d="M42.8 38.6L44.6 36.4L45.6 39.6L43.6 41.2Z"/>
  </g>

  <!-- cork -->
  <rect x="23" y="6.5" width="14" height="9" rx="2.2" fill="url(#drop_qilin_blood-cork)" stroke="#2A1008" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M27 8.6V13.4M30.5 8.4V13.6M33.8 8.7V13.3" fill="none" stroke="#7A4620" stroke-width=".9" stroke-linecap="round" opacity=".55"/>
  <path d="M25.2 8.4H28.6" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".7"/>

  <!-- neck cord and charm (small cloud) -->
  <path d="M24.5 17.5H35.5" fill="none" stroke="#2A1008" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M24.5 17.5H35.5" fill="none" stroke="#7FA8D8" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M35.5 17.5Q43 17 46.8 21" fill="none" stroke="#2A1008" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M35.5 17.5Q43 17 46.8 21" fill="none" stroke="#7FA8D8" stroke-width="1.1" stroke-linecap="round"/>
  <path d="M43.2 30H52.4A2.6 2.6 0 0 0 52 24.8A3.4 3.4 0 0 0 46 23.2A3 3 0 0 0 43.2 30Z" fill="url(#drop_qilin_blood-charm)" stroke="#2A1008" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M45 27.8C45 26.4 46 25.4 47.2 25.2" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round"/>
  <path d="M46.4 29.2H50.6" fill="none" stroke="#8FB8E0" stroke-width=".8" stroke-linecap="round" opacity=".8"/>

  <!-- snow sparkles -->
  <g fill="#FFFFFF">
    <path d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z" transform="translate(38.6 26) scale(1.7)"/>
    <path d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z" transform="translate(13.5 30) scale(1.6)"/>
    <path d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z" transform="translate(50 42) scale(1.3)"/>
  </g>
</svg>
