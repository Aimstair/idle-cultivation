<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="pickaxe_spirit_crystal-head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".35" stop-color="#8FDCFF"/>
      <stop offset=".75" stop-color="#3E8FD8"/>
      <stop offset="1" stop-color="#1E4E9A"/>
    </linearGradient>
    <radialGradient id="pickaxe_spirit_crystal-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#8FDCFF" stop-opacity=".7"/>
      <stop offset=".5" stop-color="#8FDCFF" stop-opacity=".25"/>
      <stop offset="1" stop-color="#8FDCFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pickaxe_spirit_crystal-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF6C8"/>
      <stop offset=".45" stop-color="#FFD45A"/>
      <stop offset="1" stop-color="#9A5E14"/>
    </linearGradient>
    <linearGradient id="pickaxe_spirit_crystal-wood" gradientUnits="userSpaceOnUse" x1="27" y1="34" x2="32" y2="39">
      <stop offset="0" stop-color="#FF8A5A"/>
      <stop offset=".5" stop-color="#C8301C"/>
      <stop offset="1" stop-color="#6A0E08"/>
    </linearGradient>
  </defs>

  <!-- contact shadow and spirit glow -->
  <ellipse cx="31" cy="55.5" rx="18" ry="2" fill="#2A1008" opacity=".25"/>
  <circle cx="45" cy="21" r="17" fill="url(#pickaxe_spirit_crystal-glow)"/>

  <!-- phoenix-wood handle -->
  <path d="M13 53L46 20" fill="none" stroke="#2A1008" stroke-width="9.8" stroke-linecap="round"/>
  <path d="M13 53L46 20" fill="none" stroke="url(#pickaxe_spirit_crystal-wood)" stroke-width="5.4" stroke-linecap="round"/>
  <path d="M12.2 50.6L36 26.8" fill="none" stroke="#FFD2B0" stroke-width="1.2" stroke-linecap="round" opacity=".6"/>
  <path d="M15.4 49.2L38 26.6" fill="none" stroke="#FFD45A" stroke-width=".9" stroke-linecap="round" opacity=".5"/>
  <!-- gold rings and pommel cap -->
  <g stroke="#2A1008" stroke-width="5" stroke-linecap="butt" fill="none">
    <path d="M19.6 46.6L24.6 41.6"/>
    <path d="M29.6 36.6L32.6 33.6"/>
    <path d="M11.2 52.2L14.2 49.2"/>
  </g>
  <g stroke="url(#pickaxe_spirit_crystal-gold)" stroke-width="6.8" stroke-linecap="butt" fill="none">
    <path d="M20.2 46L24 42.2"/>
    <path d="M30.2 36L32 34.2"/>
  </g>
  <path d="M13 53L15.2 50.8" fill="none" stroke="#2A1008" stroke-width="9.8" stroke-linecap="round"/>
  <path d="M13 53L15.2 50.8" fill="none" stroke="url(#pickaxe_spirit_crystal-gold)" stroke-width="5.4" stroke-linecap="round"/>
  <path d="M20.2 43.4L22.2 41.4M30 35.6L31 34.6" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".8"/>

  <!-- spirit crystal head -->
  <path d="M28 10Q56 10 56 38Q46 20 28 10Z" fill="url(#pickaxe_spirit_crystal-head)" stroke="#2A1008" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- facets -->
  <g fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".75">
    <path d="M36 12.2L40.4 18.6L47.2 22.4M47.2 22.4L53.6 29.6M47.2 22.4L51.6 14.2"/>
  </g>
  <path d="M40.4 18.6L45.5 13.2" fill="none" stroke="#1E4E9A" stroke-width=".9" stroke-linecap="round" opacity=".45"/>
  <path d="M33 12.4Q50.5 13.5 53.4 29" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" opacity=".9"/>

  <!-- gold collar -->
  <path d="M38.2 22.2L43.8 27.8" fill="none" stroke="#2A1008" stroke-width="6.4" stroke-linecap="round"/>
  <path d="M38.2 22.2L43.8 27.8" fill="none" stroke="url(#pickaxe_spirit_crystal-gold)" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="39.8" cy="23.8" r=".7" fill="#FFFFFF" opacity=".85"/>

  <!-- sparkles -->
  <g fill="#FFFFFF">
    <path d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z" transform="translate(27 17.5) scale(2.2)"/>
    <path d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z" transform="translate(57 31) scale(1.5)"/>
    <path d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z" transform="translate(49 42) scale(1.3)"/>
  </g>
</svg>
