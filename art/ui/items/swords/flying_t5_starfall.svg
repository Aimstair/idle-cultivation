<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="flying_t5_starfall-blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".45" stop-color="#D6EAFF"/>
      <stop offset=".55" stop-color="#8FC4F8"/>
      <stop offset="1" stop-color="#2E5FB0"/>
    </linearGradient>
    <linearGradient id="flying_t5_starfall-fit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".5" stop-color="#C4D0E0"/>
      <stop offset="1" stop-color="#5E6C86"/>
    </linearGradient>
    <linearGradient id="flying_t5_starfall-ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0F8FF"/>
      <stop offset=".55" stop-color="#9CC8FF"/>
      <stop offset="1" stop-color="#3B7FE0"/>
    </linearGradient>
    <linearGradient id="flying_t5_starfall-trail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B8E4FF" stop-opacity=".7"/>
      <stop offset="1" stop-color="#B8E4FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="flying_t5_starfall-under" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#B8E4FF" stop-opacity=".6"/>
      <stop offset="1" stop-color="#B8E4FF" stop-opacity="0"/>
    </radialGradient>
    <path id="flying_t5_starfall-star" d="M0 -2.2C.3 -.6 .6 -.3 2.2 0C.6 .3 .3 .6 0 2.2C-.3 .6 -.6 .3 -2.2 0C-.6 -.3 -.3 -.6 0 -2.2Z" fill="#FFFFFF"/>
  </defs>

  <!-- flying sword: point-up, rotated onto the grip-bottom-left / tip-top-right diagonal; it floats (no contact shadow) -->
  <g transform="translate(36 27) rotate(45)">
    <!-- faint glow beneath the blade -->
    <ellipse cx="3.6" cy="-8" rx="4.5" ry="21" fill="url(#flying_t5_starfall-under)"/>
    <!-- spirit trail streaming behind the hilt -->
    <path d="M-3 6C-3 18 -1.6 28 0 34C1.6 28 3 18 3 6Z" fill="url(#flying_t5_starfall-trail)"/>
    <path d="M0 -28L1.9 -22L1.7 9H-1.7L-1.9 -22Z" fill="none" stroke="#B8E4FF" stroke-width="5" opacity=".38"/>
    <g stroke="#2A1008" stroke-linejoin="round" stroke-linecap="round">
      <!-- flowing silk ribbon -->
      <path d="M.6 20.2C-2.6 23.4 2.8 25.6 1.4 29.4C0 33 4.2 34.2 3.4 37.6" fill="none" stroke-width="4"/>
      <path d="M.6 20.2C-2.6 23.4 2.8 25.6 1.4 29.4C0 33 4.2 34.2 3.4 37.6" fill="none" stroke="url(#flying_t5_starfall-ribbon)" stroke-width="2"/>
      <path d="M.2 21C-1 22.4 -1 23.4 -.2 24.2" fill="none" stroke="#FFFFFF" stroke-width=".9" opacity=".8"/>
      <path d="M.2 20.4C-1 24 -3.6 27 -4.4 31.5" fill="none" stroke-width="3.2"/>
      <path d="M.2 20.4C-1 24 -3.6 27 -4.4 31.5" fill="none" stroke="url(#flying_t5_starfall-ribbon)" stroke-width="1.3"/>
      <!-- slim blade -->
      <path d="M0 -28L1.9 -22L1.7 9H-1.7L-1.9 -22Z" fill="url(#flying_t5_starfall-blade)" stroke-width="2.4"/>
      <path d="M0 -22V8" fill="none" stroke="#3B7FE0" stroke-width="1" opacity=".8"/>
      <path d="M-1 -20V7" fill="none" stroke="#FFFFFF" stroke-width=".9" opacity=".85"/>
      <path d="M.2 -17L1.4 -13.6M.4 -5L1.5 -1.6" fill="none" stroke="#FFFFFF" stroke-width=".9" opacity=".9"/>
      <!-- small ornamental hilt: petal guard, bare tang, bead -->
      <path d="M-4.6 9.2Q0 11.4 4.6 9.2L3.4 12.4Q0 13.4 -3.4 12.4Z" fill="url(#flying_t5_starfall-fit)" stroke-width="2"/>
      <path d="M-3 10.6L-1.2 10.2" fill="none" stroke="#FFFFFF" stroke-width=".9" opacity=".85"/>
      <rect x="-1.2" y="13" width="2.4" height="4.2" rx=".6" fill="url(#flying_t5_starfall-fit)" stroke-width="2"/>
      <circle cx="0" cy="18.8" r="1.9" fill="url(#flying_t5_starfall-fit)" stroke-width="2"/>
      <circle cx="-.6" cy="18.2" r=".6" fill="#FFF6C8" stroke="none"/>
    </g>
  </g>
  <!-- comet trail of stars (canvas space, along the trail) -->
  <g>
    <use href="#flying_t5_starfall-star" xlink:href="#flying_t5_starfall-star" transform="translate(17.6 46.4) scale(1.15)" stroke="#2E7FD0" stroke-width=".6" opacity=".95"/>
    <use href="#flying_t5_starfall-star" xlink:href="#flying_t5_starfall-star" transform="translate(12 52.6) scale(.9)" stroke="#2E7FD0" stroke-width=".6" opacity=".9"/>
    <use href="#flying_t5_starfall-star" xlink:href="#flying_t5_starfall-star" transform="translate(23.4 52.2) scale(.7)" opacity=".85"/>
    <use href="#flying_t5_starfall-star" xlink:href="#flying_t5_starfall-star" transform="translate(55.6 11.4) scale(.95)" opacity=".95"/>
    <circle cx="20.6" cy="41.2" r=".8" fill="#FFFFFF" opacity=".9"/>
    <circle cx="9.2" cy="47.8" r=".7" fill="#FFFFFF" opacity=".8"/>
  </g>
</svg>
