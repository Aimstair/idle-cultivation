<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="jian_t4_ice_jade-blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4FFFB"/>
      <stop offset=".42" stop-color="#C4F4E6"/>
      <stop offset=".58" stop-color="#7ADCC8"/>
      <stop offset="1" stop-color="#2C9C8A"/>
    </linearGradient>
    <linearGradient id="jian_t4_ice_jade-silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".5" stop-color="#C4D0E0"/>
      <stop offset="1" stop-color="#5E6C86"/>
    </linearGradient>
    <linearGradient id="jian_t4_ice_jade-grip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".5" stop-color="#D4E8E6"/>
      <stop offset="1" stop-color="#7E9E9C"/>
    </linearGradient>
    <linearGradient id="jian_t4_ice_jade-tassel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C8FFE6"/>
      <stop offset=".55" stop-color="#3FC79A"/>
      <stop offset="1" stop-color="#0E6A50"/>
    </linearGradient>
    <radialGradient id="jian_t4_ice_jade-shadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2A1008" stop-opacity=".3"/>
      <stop offset="1" stop-color="#2A1008" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="0" cy="0" rx="26" ry="4.6" fill="url(#jian_t4_ice_jade-shadow)" transform="translate(36 34) rotate(-45)"/>

  <!-- jian: point-up, rotated onto the grip-bottom-left / tip-top-right diagonal -->
  <g transform="translate(34.5 28.5) rotate(45)" stroke="#2A1008" stroke-linejoin="round" stroke-linecap="round">
    <path d="M0 -29L2.8 -22.5L2.5 13H-2.5L-2.8 -22.5Z" fill="none" stroke="#C8FFE6" stroke-width="5.2" opacity=".42"/>
    <path d="M0 -29L2.8 -22.5L2.5 13H-2.5L-2.8 -22.5Z" fill="url(#jian_t4_ice_jade-blade)" stroke-width="2.4"/>
    <path d="M0 -23V12" fill="none" stroke="#1E7A6A" stroke-width="1.1" opacity=".8"/>
    <path d="M-1.5 -21V11" fill="none" stroke="#FFFFFF" stroke-width="1" opacity=".95"/>
    <!-- frost veins inside the translucent jade -->
    <path d="M.6 -17L1.7 -13.2M.4 -8L1.6 -4.2M.3 1L1.5 4.8" fill="none" stroke="#FFFFFF" stroke-width="1" opacity=".9"/>
    <path d="M1.6 -20V10" fill="none" stroke="#C8FFE6" stroke-width=".8" opacity=".7"/>
    <!-- guard -->
    <path d="M-6.8 12.4Q-3.4 14.6 0 14.2Q3.4 14.6 6.8 12.4L6.8 16.8Q0 18.8 -6.8 16.8Z" fill="url(#jian_t4_ice_jade-silver)" stroke-width="2.1"/>
    <path d="M-4.8 14.6L-2 14.1" fill="none" stroke="#FFF6C8" stroke-width="1" opacity=".9"/>
    <!-- grip -->
    <rect x="-2.1" y="17.3" width="4.2" height="7.6" rx="1" fill="url(#jian_t4_ice_jade-grip)" stroke-width="2.1"/>
    <path d="M-2.1 19.6H2.1M-2.1 22.4H2.1" fill="none" stroke="#3FC79A" stroke-width="1"/>
    <!-- pommel -->
    <circle cx="0" cy="27" r="2.7" fill="url(#jian_t4_ice_jade-silver)" stroke-width="2.1"/>
    <circle cx="-.9" cy="26.1" r=".7" fill="#FFFFFF" stroke="none"/>
  </g>

  <!-- tassel -->
  <g transform="translate(15.4 47.6) rotate(-35)" stroke="#2A1008" stroke-linejoin="round" stroke-linecap="round">
    <path d="M0 2.6V5.2" fill="none" stroke-width="2.2"/>
    <path d="M0 2.6V5.2" fill="none" stroke="#C4D0E0" stroke-width=".9"/>
    <path d="M0 5.2C-2.3 6.8 -3.1 9 -2.2 10.4C-1.1 11.1 1.1 11.1 2.2 10.4C3.1 9 2.3 6.8 0 5.2Z" fill="url(#jian_t4_ice_jade-tassel)" stroke-width="1.8"/>
    <path d="M-.8 7L-1.2 9.6M.8 7L1.2 9.6" fill="none" stroke="#0E6A50" stroke-width=".9" stroke-opacity=".8"/>
  </g>
</svg>
