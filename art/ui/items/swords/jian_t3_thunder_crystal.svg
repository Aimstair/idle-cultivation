<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="jian_t3_thunder_crystal-blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".4" stop-color="#DCF4FF"/>
      <stop offset=".6" stop-color="#8FDCFF"/>
      <stop offset="1" stop-color="#2E7FD0"/>
    </linearGradient>
    <linearGradient id="jian_t3_thunder_crystal-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF6C8"/>
      <stop offset=".35" stop-color="#FFD45A"/>
      <stop offset=".72" stop-color="#D69A2A"/>
      <stop offset="1" stop-color="#9A5E14"/>
    </linearGradient>
    <linearGradient id="jian_t3_thunder_crystal-grip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9A6AE8"/>
      <stop offset=".5" stop-color="#5A3AA8"/>
      <stop offset="1" stop-color="#2A1460"/>
    </linearGradient>
    <linearGradient id="jian_t3_thunder_crystal-tassel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAD8FF"/>
      <stop offset=".55" stop-color="#9A6AE8"/>
      <stop offset="1" stop-color="#3A1E7A"/>
    </linearGradient>
    <radialGradient id="jian_t3_thunder_crystal-shadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2A1008" stop-opacity=".3"/>
      <stop offset="1" stop-color="#2A1008" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="0" cy="0" rx="26" ry="4.6" fill="url(#jian_t3_thunder_crystal-shadow)" transform="translate(36 34) rotate(-45)"/>

  <g transform="translate(34.5 28.5) rotate(45)" stroke="#2A1008" stroke-linejoin="round" stroke-linecap="round">
    <!-- soft crystal glow -->
    <path d="M0 -29L2.8 -22.5L2.5 13H-2.5L-2.8 -22.5Z" fill="none" stroke="#B8E8FF" stroke-width="5.2" opacity=".4"/>
    <!-- pale crystal blade -->
    <path d="M0 -29L2.8 -22.5L2.5 13H-2.5L-2.8 -22.5Z" fill="url(#jian_t3_thunder_crystal-blade)" stroke-width="2.4"/>
    <path d="M0 -23V12" fill="none" stroke="#2E7FD0" stroke-width="1.1" opacity=".8"/>
    <path d="M-1.5 -21V11" fill="none" stroke="#FFFFFF" stroke-width="1" opacity=".9"/>
    <!-- silver lightning crackles -->
    <path d="M.2 -18L1.8 -14.2L.2 -11L1.8 -7.4M.6 -3L1.8 .4L.4 3.6" fill="none" stroke="#8FDCFF" stroke-width="2.4" opacity=".55"/>
    <path d="M.2 -18L1.8 -14.2L.2 -11L1.8 -7.4M.6 -3L1.8 .4L.4 3.6" fill="none" stroke="#FFFFFF" stroke-width="1"/>
    <!-- gold guard -->
    <path d="M-6.8 12.4Q-3.4 14.6 0 14.2Q3.4 14.6 6.8 12.4L6.8 16.8Q0 18.8 -6.8 16.8Z" fill="url(#jian_t3_thunder_crystal-gold)" stroke-width="2.1"/>
    <path d="M-4.8 14.6L-2 14.1" fill="none" stroke="#FFF6C8" stroke-width="1" opacity=".9"/>
    <!-- violet silk grip with gold bands -->
    <rect x="-2.1" y="17.3" width="4.2" height="7.6" rx="1" fill="url(#jian_t3_thunder_crystal-grip)" stroke-width="2.1"/>
    <path d="M-2.1 19.6H2.1M-2.1 22.4H2.1" fill="none" stroke="#FFD45A" stroke-width="1"/>
    <!-- gold pommel -->
    <circle cx="0" cy="27" r="2.7" fill="url(#jian_t3_thunder_crystal-gold)" stroke-width="2.1"/>
    <circle cx="-.9" cy="26.1" r=".7" fill="#FFF6C8" stroke="none"/>
  </g>

  <!-- violet tassel -->
  <g transform="translate(15.4 47.6) rotate(-35)" stroke="#2A1008" stroke-linejoin="round" stroke-linecap="round">
    <path d="M0 2.6V5.2" fill="none" stroke-width="2.2"/>
    <path d="M0 2.6V5.2" fill="none" stroke="#FFD45A" stroke-width=".9"/>
    <path d="M0 5.2C-2.3 6.8 -3.1 9 -2.2 10.4C-1.1 11.1 1.1 11.1 2.2 10.4C3.1 9 2.3 6.8 0 5.2Z" fill="url(#jian_t3_thunder_crystal-tassel)" stroke-width="1.8"/>
    <path d="M-.8 7L-1.2 9.6M.8 7L1.2 9.6" fill="none" stroke="#3A1E7A" stroke-width=".9" stroke-opacity=".8"/>
  </g>
</svg>
