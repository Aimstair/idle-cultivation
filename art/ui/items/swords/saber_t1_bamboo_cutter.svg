<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="saber_t1_bamboo_cutter-blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".45" stop-color="#CFD6E4"/>
      <stop offset=".55" stop-color="#AEB6C8"/>
      <stop offset="1" stop-color="#7E8698"/>
    </linearGradient>
    <linearGradient id="saber_t1_bamboo_cutter-iron" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C8CCD4"/>
      <stop offset=".5" stop-color="#7E8490"/>
      <stop offset="1" stop-color="#40444F"/>
    </linearGradient>
    <linearGradient id="saber_t1_bamboo_cutter-bamboo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EBE2A4"/>
      <stop offset=".5" stop-color="#B4B060"/>
      <stop offset="1" stop-color="#6E682A"/>
    </linearGradient>
    <radialGradient id="saber_t1_bamboo_cutter-shadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2A1008" stop-opacity=".3"/>
      <stop offset="1" stop-color="#2A1008" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="0" cy="0" rx="26" ry="4.6" fill="url(#saber_t1_bamboo_cutter-shadow)" transform="translate(35.5 34.5) rotate(-45)"/>

  <g transform="translate(34.5 31.5) rotate(45)" stroke="#2A1008" stroke-linejoin="round" stroke-linecap="round">
    <!-- curved single-edged blade, wider toward the tip -->
    <path d="M-4.8 -29C-3.2 -23 -2 -4 -2.4 13L2.6 13C3.4 -4 5.6 -13 5.6 -19C5.6 -24 1.8 -28 -4.8 -29Z" fill="url(#saber_t1_bamboo_cutter-blade)" stroke-width="2.4"/>
    <!-- edge bevel -->
    <path d="M1.2 11.5C2 -4 3.9 -12 3.9 -18.5C3.9 -22 2.2 -25.2 -1.6 -27" fill="none" stroke="#7E8698" stroke-width="1.1"/>
    <!-- spine highlight -->
    <path d="M-3.4 -23.5C-2.4 -16 -1.5 -4 -1.4 11" fill="none" stroke="#FFFFFF" stroke-width="1" opacity=".8"/>
    <!-- iron disc guard -->
    <ellipse cx="0" cy="14.4" rx="6" ry="2.1" fill="url(#saber_t1_bamboo_cutter-iron)" stroke-width="2"/>
    <!-- bamboo-segment handle -->
    <rect x="-2.3" y="16.4" width="4.6" height="10.2" rx="1" fill="url(#saber_t1_bamboo_cutter-bamboo)" stroke-width="2.1"/>
    <path d="M-2.3 19.8H2.3M-2.3 23.2H2.3" fill="none" stroke="#6E682A" stroke-width="1.1"/>
    <path d="M-1.4 17.6V19M-1.4 20.8V22.4" fill="none" stroke="#FFF8D0" stroke-width=".9" opacity=".8"/>
    <!-- iron ring pommel -->
    <circle cx="0" cy="29.8" r="3" fill="none" stroke-width="3.8"/>
    <circle cx="0" cy="29.8" r="3" fill="none" stroke="url(#saber_t1_bamboo_cutter-iron)" stroke-width="1.7"/>
    <path d="M-2.4 28.2A3 3 0 0 1 -.6 27" fill="none" stroke="#FFFFFF" stroke-width=".9" opacity=".8"/>
  </g>
</svg>
