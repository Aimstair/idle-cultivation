<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="flying_t6_void_weaver-blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8F2FF"/>
      <stop offset=".45" stop-color="#D8C2FF"/>
      <stop offset=".55" stop-color="#A478F0"/>
      <stop offset="1" stop-color="#4A2A90"/>
    </linearGradient>
    <linearGradient id="flying_t6_void_weaver-fit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF6C8"/>
      <stop offset=".35" stop-color="#FFD45A"/>
      <stop offset=".72" stop-color="#D69A2A"/>
      <stop offset="1" stop-color="#9A5E14"/>
    </linearGradient>
    <linearGradient id="flying_t6_void_weaver-ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAD8FF"/>
      <stop offset=".55" stop-color="#9A6AE8"/>
      <stop offset="1" stop-color="#3A1E7A"/>
    </linearGradient>
    <linearGradient id="flying_t6_void_weaver-trail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C8A4FF" stop-opacity=".75"/>
      <stop offset="1" stop-color="#C8A4FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="flying_t6_void_weaver-under" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#9A6AE8" stop-opacity=".6"/>
      <stop offset="1" stop-color="#9A6AE8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flying_t6_void_weaver-aura" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#C8A4FF" stop-opacity=".5"/>
      <stop offset=".55" stop-color="#9A6AE8" stop-opacity=".22"/>
      <stop offset="1" stop-color="#9A6AE8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- void aura -->
  <ellipse cx="0" cy="0" rx="27" ry="10" fill="url(#flying_t6_void_weaver-aura)" transform="translate(35 29) rotate(-45)"/>

  <!-- flying sword: point-up, rotated onto the grip-bottom-left / tip-top-right diagonal; it floats (no contact shadow) -->
  <g transform="translate(36 27) rotate(45)">
    <ellipse cx="3.2" cy="-9" rx="4" ry="21" fill="url(#flying_t6_void_weaver-under)"/>
    <path d="M-2.2 3C-2.2 16 -1.2 26 0 32C1.2 26 2.2 16 2.2 3Z" fill="url(#flying_t6_void_weaver-trail)"/>
    <path d="M0 -29L1.1 -24L1 10H-1L-1.1 -24Z" fill="none" stroke="#C8A4FF" stroke-width="4.6" opacity=".42"/>
    <g stroke="#2A1008" stroke-linejoin="round" stroke-linecap="round">
      <!-- long thread-like ribbon running through the needle's eye -->
      <path d="M-1.4 15.5C-5.4 18.2 -4.6 23 -1.2 25.4C2.4 28 3 31 1 33.6C-.2 35.2 -1.4 36 -2.6 36.6" fill="none" stroke-width="3"/>
      <path d="M-1.4 15.5C-5.4 18.2 -4.6 23 -1.2 25.4C2.4 28 3 31 1 33.6C-.2 35.2 -1.4 36 -2.6 36.6" fill="none" stroke="url(#flying_t6_void_weaver-ribbon)" stroke-width="1.3"/>
      <path d="M-2.6 16.6C-4 18 -4.2 19.4 -3.8 20.6" fill="none" stroke="#FFFFFF" stroke-width=".7" opacity=".85"/>
      <!-- extremely thin needle blade -->
      <path d="M0 -29L1.1 -24L1 10H-1L-1.1 -24Z" fill="url(#flying_t6_void_weaver-blade)" stroke-width="2"/>
      <path d="M-.3 -22V8" fill="none" stroke="#FFFFFF" stroke-width=".7" opacity=".9"/>
      <!-- tiny petal guard and the needle's eye as pommel -->
      <path d="M-3.4 9.8Q0 11.6 3.4 9.8L2.4 12.6Q0 13.4 -2.4 12.6Z" fill="url(#flying_t6_void_weaver-fit)" stroke-width="1.9"/>
      <circle cx="0" cy="15.6" r="2.3" fill="none" stroke-width="3.6"/>
      <circle cx="0" cy="15.6" r="2.3" fill="none" stroke="url(#flying_t6_void_weaver-fit)" stroke-width="1.5"/>
      <path d="M-1.8 14.4A2.3 2.3 0 0 1 -.4 13.4" fill="none" stroke="#FFF6C8" stroke-width=".8" opacity=".9"/>
    </g>
  </g>
  <!-- void motes -->
  <circle cx="24.4" cy="17.6" r="1.2" fill="#E0CCFF" opacity=".9"/>
  <circle cx="51" cy="28.6" r="1" fill="#E0CCFF" opacity=".85"/>
  <circle cx="18.2" cy="28.4" r=".8" fill="#FFFFFF" opacity=".8"/>
</svg>
