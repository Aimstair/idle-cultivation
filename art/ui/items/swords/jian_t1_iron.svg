<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="jian_t1_iron-blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8EAEE"/>
      <stop offset=".45" stop-color="#B0B6C2"/>
      <stop offset=".55" stop-color="#8C93A2"/>
      <stop offset="1" stop-color="#565C6A"/>
    </linearGradient>
    <linearGradient id="jian_t1_iron-brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8E6A8"/>
      <stop offset=".45" stop-color="#C9A24A"/>
      <stop offset="1" stop-color="#6E4C16"/>
    </linearGradient>
    <linearGradient id="jian_t1_iron-grip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B07640"/>
      <stop offset=".5" stop-color="#7A4A22"/>
      <stop offset="1" stop-color="#46280E"/>
    </linearGradient>
    <linearGradient id="jian_t1_iron-tassel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF6A44"/>
      <stop offset=".6" stop-color="#C21E10"/>
      <stop offset="1" stop-color="#7A1008"/>
    </linearGradient>
    <radialGradient id="jian_t1_iron-shadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2A1008" stop-opacity=".3"/>
      <stop offset="1" stop-color="#2A1008" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- soft contact shadow -->
  <ellipse cx="0" cy="0" rx="26" ry="4.6" fill="url(#jian_t1_iron-shadow)" transform="translate(36 34) rotate(-45)"/>

  <!-- sword: drawn point-up, rotated onto the grip-bottom-left / tip-top-right diagonal -->
  <g transform="translate(34.5 28.5) rotate(45)" stroke="#2A1008" stroke-linejoin="round" stroke-linecap="round">
    <!-- blade -->
    <path d="M0 -29L2.8 -22.5L2.5 13H-2.5L-2.8 -22.5Z" fill="url(#jian_t1_iron-blade)" stroke-width="2.4"/>
    <path d="M0 -23V12" fill="none" stroke="#6A7080" stroke-width="1.1"/>
    <path d="M-1.4 -21V11" fill="none" stroke="#FFFFFF" stroke-width="1" opacity=".7"/>
    <!-- brass guard -->
    <path d="M-6.4 12.6Q-3.2 14.6 0 14.2Q3.2 14.6 6.4 12.6L6.4 16.8Q0 18.8 -6.4 16.8Z" fill="url(#jian_t1_iron-brass)" stroke-width="2.1"/>
    <path d="M-4.6 14.6L-2 14.2" fill="none" stroke="#FFF6C8" stroke-width="1" opacity=".8"/>
    <!-- leather grip -->
    <rect x="-2.1" y="17.3" width="4.2" height="7.6" rx="1" fill="url(#jian_t1_iron-grip)" stroke-width="2.1"/>
    <path d="M-1.6 19.2L1.6 20.4M-1.6 21.4L1.6 22.6" fill="none" stroke="#46280E" stroke-width="1"/>
    <!-- pommel -->
    <circle cx="0" cy="27" r="2.7" fill="url(#jian_t1_iron-brass)" stroke-width="2.1"/>
    <circle cx="-.9" cy="26.1" r=".7" fill="#FFF6C8" stroke="none"/>
  </g>

  <!-- short red tassel hanging from the pommel -->
  <g transform="translate(15.4 47.6) rotate(-35)" stroke="#2A1008" stroke-linejoin="round" stroke-linecap="round">
    <path d="M0 2.6V5.2" fill="none" stroke-width="2.2"/>
    <path d="M0 2.6V5.2" fill="none" stroke="#C9A24A" stroke-width=".9"/>
    <path d="M0 5.2C-2.3 6.8 -3.1 9 -2.2 10.4C-1.1 11.1 1.1 11.1 2.2 10.4C3.1 9 2.3 6.8 0 5.2Z" fill="url(#jian_t1_iron-tassel)" stroke-width="1.8"/>
    <path d="M-.8 7L-1.2 9.6M.8 7L1.2 9.6" fill="none" stroke="#5A0A04" stroke-width=".9" stroke-opacity=".8"/>
  </g>
</svg>
