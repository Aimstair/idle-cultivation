<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="saber_t4_desert_wind-blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFF8DC"/>
      <stop offset=".42" stop-color="#F2D688"/>
      <stop offset=".58" stop-color="#D8AC52"/>
      <stop offset="1" stop-color="#8C6622"/>
    </linearGradient>
    <linearGradient id="saber_t4_desert_wind-bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E0A870"/>
      <stop offset=".5" stop-color="#9A6034"/>
      <stop offset="1" stop-color="#4A2810"/>
    </linearGradient>
    <linearGradient id="saber_t4_desert_wind-grip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D8A050"/>
      <stop offset=".5" stop-color="#A86A22"/>
      <stop offset="1" stop-color="#5A3410"/>
    </linearGradient>
    <radialGradient id="saber_t4_desert_wind-shadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2A1008" stop-opacity=".3"/>
      <stop offset="1" stop-color="#2A1008" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="0" cy="0" rx="26" ry="4.6" fill="url(#saber_t4_desert_wind-shadow)" transform="translate(35.5 34.5) rotate(-45)"/>

  <!-- saber: point-up, rotated onto the grip-bottom-left / tip-top-right diagonal -->
  <g transform="translate(34.5 31.5) rotate(45)" stroke="#2A1008" stroke-linejoin="round" stroke-linecap="round">
    <path d="M-4.8 -29C-3.2 -23 -2 -4 -2.4 13L2.6 13C3.4 -4 5.6 -13 5.6 -19C5.6 -24 1.8 -28 -4.8 -29Z" fill="none" stroke="#FFE7A0" stroke-width="4.6" opacity=".28"/>
    <!-- curved single-edged blade -->
    <path d="M-4.8 -29C-3.2 -23 -2 -4 -2.4 13L2.6 13C3.4 -4 5.6 -13 5.6 -19C5.6 -24 1.8 -28 -4.8 -29Z" fill="url(#saber_t4_desert_wind-blade)" stroke-width="2.4"/>
    <path d="M1.2 11.5C2 -4 3.9 -12 3.9 -18.5C3.9 -22 2.2 -25.2 -1.6 -27" fill="none" stroke="#9A6E22" stroke-width="1.1" opacity=".85"/>
    <path d="M-3.4 -23.5C-2.4 -16 -1.5 -4 -1.4 11" fill="none" stroke="#FFFFFF" stroke-width="1" opacity=".85"/>
    <!-- wind-swirl etching -->
    <path d="M-.4 -17C2.4 -19.6 5.2 -16 2.8 -14C1.2 -12.8 -.6 -14.4 .8 -15.6" fill="none" stroke="#A87C2E" stroke-width="1" opacity=".9"/>
    <path d="M-1 -4C1.6 -6.6 4.4 -3.2 2 -1.2C.4 .2 -1.2 -1.4 .2 -2.6" fill="none" stroke="#A87C2E" stroke-width="1" opacity=".9"/>
    <path d="M-1.6 7C-.2 4.6 1.4 4.6 2.4 7.4" fill="none" stroke="#A87C2E" stroke-width="1" opacity=".9"/>
    <!-- disc guard -->
    <ellipse cx="0" cy="14.4" rx="6" ry="2.1" fill="url(#saber_t4_desert_wind-bronze)" stroke-width="2"/>
    <!-- wrapped handle -->
    <rect x="-2.3" y="16.4" width="4.6" height="10.2" rx="1" fill="url(#saber_t4_desert_wind-grip)" stroke-width="2.1"/>
    <path d="M-1.8 18.6L1.8 19.8M-1.8 21.2L1.8 22.4M-1.8 23.8L1.8 25" fill="none" stroke="#5A3410" stroke-width="1"/>
    <path d="M-1.4 17.4V18.4" fill="none" stroke="#FFF2CC" stroke-width=".9" opacity=".8"/>
    <!-- ring pommel -->
    <circle cx="0" cy="29.8" r="3" fill="none" stroke-width="3.8"/>
    <circle cx="0" cy="29.8" r="3" fill="none" stroke="url(#saber_t4_desert_wind-bronze)" stroke-width="1.7"/>
    <path d="M-2.4 28.2A3 3 0 0 1 -.6 27" fill="none" stroke="#FFFFFF" stroke-width=".9" opacity=".9"/>
  </g>
