<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="saber_t2_moonlit-blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".45" stop-color="#EEF2FA"/>
      <stop offset=".55" stop-color="#CCD5E8"/>
      <stop offset="1" stop-color="#8492B4"/>
    </linearGradient>
    <linearGradient id="saber_t2_moonlit-silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".5" stop-color="#CFD6E4"/>
      <stop offset="1" stop-color="#6E7688"/>
    </linearGradient>
    <linearGradient id="saber_t2_moonlit-grip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4668B8"/>
      <stop offset=".5" stop-color="#22336E"/>
      <stop offset="1" stop-color="#141E4A"/>
    </linearGradient>
    <radialGradient id="saber_t2_moonlit-shadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2A1008" stop-opacity=".3"/>
      <stop offset="1" stop-color="#2A1008" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="0" cy="0" rx="26" ry="4.6" fill="url(#saber_t2_moonlit-shadow)" transform="translate(35.5 34.5) rotate(-45)"/>

  <g transform="translate(34.5 31.5) rotate(45)" stroke="#2A1008" stroke-linejoin="round" stroke-linecap="round">
    <!-- moonlight sheen -->
    <path d="M-4.8 -29C-3.2 -23 -2 -4 -2.4 13L2.6 13C3.4 -4 5.6 -13 5.6 -19C5.6 -24 1.8 -28 -4.8 -29Z" fill="none" stroke="#DCE8FF" stroke-width="5" opacity=".4"/>
    <!-- pale silver blade with a crescent-moon cut-out near the spine -->
    <path fill-rule="evenodd" d="M-4.8 -29C-3.2 -23 -2 -4 -2.4 13L2.6 13C3.4 -4 5.6 -13 5.6 -19C5.6 -24 1.8 -28 -4.8 -29Z M1.2 -12.6A2.6 2.6 0 1 0 1.2 -7.4A3.88 3.88 0 0 1 1.2 -12.6Z" fill="url(#saber_t2_moonlit-blade)" stroke-width="2.4"/>
    <path d="M1.2 -12.6A2.6 2.6 0 1 0 1.2 -7.4A3.88 3.88 0 0 1 1.2 -12.6Z" fill="none" stroke-width="1.5"/>
    <!-- edge bevel -->
    <path d="M1.2 11.5C2 -4 3.9 -12 3.9 -18.5C3.9 -22 2.2 -25.2 -1.6 -27" fill="none" stroke="#8492B4" stroke-width="1.1"/>
    <!-- spine highlight -->
    <path d="M-3.4 -23.5C-2.6 -18 -2 -10 -1.8 -3" fill="none" stroke="#FFFFFF" stroke-width="1.1" opacity=".95"/>
    <!-- silver disc guard -->
    <ellipse cx="0" cy="14.4" rx="6" ry="2.1" fill="url(#saber_t2_moonlit-silver)" stroke-width="2"/>
    <!-- blue cord grip -->
    <rect x="-2.3" y="16.4" width="4.6" height="10.2" rx="1" fill="url(#saber_t2_moonlit-grip)" stroke-width="2.1"/>
    <path d="M-1.8 18.6L1.8 19.8M-1.8 21.2L1.8 22.4M-1.8 23.8L1.8 25" fill="none" stroke="#7A98E6" stroke-width="1" opacity=".8"/>
    <!-- silver ring pommel -->
    <circle cx="0" cy="29.8" r="3" fill="none" stroke-width="3.8"/>
    <circle cx="0" cy="29.8" r="3" fill="none" stroke="url(#saber_t2_moonlit-silver)" stroke-width="1.7"/>
    <path d="M-2.4 28.2A3 3 0 0 1 -.6 27" fill="none" stroke="#FFFFFF" stroke-width=".9" opacity=".9"/>
  </g>
</svg>
