<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="leg_sword_saints_last_intent-blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".42" stop-color="#FFF8DC"/>
      <stop offset=".58" stop-color="#FFE08A"/>
      <stop offset="1" stop-color="#B8842A"/>
    </linearGradient>
    <linearGradient id="leg_sword_saints_last_intent-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF6C8"/>
      <stop offset=".35" stop-color="#FFD45A"/>
      <stop offset=".72" stop-color="#D69A2A"/>
      <stop offset="1" stop-color="#9A5E14"/>
    </linearGradient>
    <linearGradient id="leg_sword_saints_last_intent-grip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".5" stop-color="#ECE6D8"/>
      <stop offset="1" stop-color="#A09886"/>
    </linearGradient>
    <linearGradient id="leg_sword_saints_last_intent-tassel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#FFE7A0"/>
      <stop offset="1" stop-color="#D69A2A"/>
    </linearGradient>
    <radialGradient id="leg_sword_saints_last_intent-aura" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".7"/>
      <stop offset=".55" stop-color="#FFE7A0" stop-opacity=".32"/>
      <stop offset="1" stop-color="#FFE7A0" stop-opacity="0"/>
    </radialGradient>
    <path id="leg_sword_saints_last_intent-star" d="M0 -2.2C.3 -.6 .6 -.3 2.2 0C.6 .3 .3 .6 0 2.2C-.3 .6 -.6 .3 -2.2 0C-.6 -.3 -.3 -.6 0 -2.2Z" fill="#FFFFFF"/>
    <radialGradient id="leg_sword_saints_last_intent-shadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2A1008" stop-opacity=".3"/>
      <stop offset="1" stop-color="#2A1008" stop-opacity="0"/>
    </radialGradient>
    <!-- ghost sword silhouette (sword intent) -->
    <path id="leg_sword_saints_last_intent-ghost" d="M0 -22L2 -17L1.8 8.4H-1.8L-2 -17ZM-4.8 8.4Q0 10.6 4.8 8.4V11Q0 12.6 -4.8 11ZM-1.4 11.4H1.4V16.6H-1.4ZM0 19.6a1.9 1.9 0 1 0 .01 0" fill="#FFFFFF" fill-opacity=".38" stroke="#FFF6C8" stroke-opacity=".75" stroke-width=".9" stroke-linejoin="round"/>
  </defs>

  <!-- radiant aura + ghostly sword intent around the blade -->
  <ellipse cx="0" cy="0" rx="30" ry="15" fill="url(#leg_sword_saints_last_intent-aura)" transform="translate(33 30) rotate(-45)"/>
  <use href="#leg_sword_saints_last_intent-ghost" xlink:href="#leg_sword_saints_last_intent-ghost" transform="translate(26 20.5) rotate(45) scale(.78)"/>
  <use href="#leg_sword_saints_last_intent-ghost" xlink:href="#leg_sword_saints_last_intent-ghost" transform="translate(42.5 37) rotate(45) scale(.78)"/>
  <use href="#leg_sword_saints_last_intent-ghost" xlink:href="#leg_sword_saints_last_intent-ghost" transform="translate(21.5 15.5) rotate(45) scale(.55)"/>
  <use href="#leg_sword_saints_last_intent-ghost" xlink:href="#leg_sword_saints_last_intent-ghost" transform="translate(48 45) rotate(45) scale(.55)"/>
  <ellipse cx="0" cy="0" rx="26" ry="4.6" fill="url(#leg_sword_saints_last_intent-shadow)" transform="translate(36 34) rotate(-45)"/>

  <!-- jian: point-up, rotated onto the grip-bottom-left / tip-top-right diagonal -->
  <g transform="translate(34.5 28.5) rotate(45)" stroke="#2A1008" stroke-linejoin="round" stroke-linecap="round">
    <path d="M0 -29L2.8 -22.5L2.5 13H-2.5L-2.8 -22.5Z" fill="none" stroke="#FFF6C8" stroke-width="5.6" opacity=".55"/>
    <path d="M0 -29L2.8 -22.5L2.5 13H-2.5L-2.8 -22.5Z" fill="url(#leg_sword_saints_last_intent-blade)" stroke-width="2.4"/>
    <path d="M0 -23V12" fill="none" stroke="#D69A2A" stroke-width="1.1" opacity=".9"/>
    <path d="M-1.5 -21V11" fill="none" stroke="#FFFFFF" stroke-width="1"/>
    <path d="M.6 -17L1.8 -13.4M.4 -6L1.7 -2.4" fill="none" stroke="#FFFFFF" stroke-width="1" opacity=".95"/>
    <!-- gold guard with a pearl -->
    <path d="M-6.8 12.4Q-3.4 14.6 0 14.2Q3.4 14.6 6.8 12.4L6.8 16.8Q0 18.8 -6.8 16.8Z" fill="url(#leg_sword_saints_last_intent-gold)" stroke-width="2.1"/>
    <path d="M-4.8 14.6L-2 14.1" fill="none" stroke="#FFF6C8" stroke-width="1" opacity=".9"/>
    <circle cx="0" cy="15.6" r="1.4" fill="#FFFFFF" stroke-width="1.1"/>
    <!-- white silk grip with gold bands -->
    <rect x="-2.1" y="17.3" width="4.2" height="7.6" rx="1" fill="url(#leg_sword_saints_last_intent-grip)" stroke-width="2.1"/>
    <path d="M-2.1 19.6H2.1M-2.1 22.4H2.1" fill="none" stroke="#FFD45A" stroke-width="1"/>
    <!-- gold pommel -->
    <circle cx="0" cy="27" r="2.7" fill="url(#leg_sword_saints_last_intent-gold)" stroke-width="2.1"/>
    <circle cx="-.9" cy="26.1" r=".7" fill="#FFF6C8" stroke="none"/>
  </g>

  <!-- white-gold tassel -->
  <g transform="translate(15.4 47.6) rotate(-35)" stroke="#2A1008" stroke-linejoin="round" stroke-linecap="round">
    <path d="M0 2.6V5.2" fill="none" stroke-width="2.2"/>
    <path d="M0 2.6V5.2" fill="none" stroke="#FFD45A" stroke-width=".9"/>
    <path d="M0 5.2C-2.3 6.8 -3.1 9 -2.2 10.4C-1.1 11.1 1.1 11.1 2.2 10.4C3.1 9 2.3 6.8 0 5.2Z" fill="url(#leg_sword_saints_last_intent-tassel)" stroke-width="1.8"/>
    <path d="M-.8 7L-1.2 9.6M.8 7L1.2 9.6" fill="none" stroke="#B07A20" stroke-width=".9" stroke-opacity=".8"/>
  </g>

  <!-- sparks of sword light -->
  <use href="#leg_sword_saints_last_intent-star" xlink:href="#leg_sword_saints_last_intent-star" transform="translate(55.2 9.2) scale(1.1)"/>
  <use href="#leg_sword_saints_last_intent-star" xlink:href="#leg_sword_saints_last_intent-star" transform="translate(13 40.5) scale(.8)" opacity=".9"/>
</svg>
