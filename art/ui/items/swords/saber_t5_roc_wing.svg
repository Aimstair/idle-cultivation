<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="saber_t5_roc_wing-blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFF8D8"/>
      <stop offset=".42" stop-color="#FFD45A"/>
      <stop offset=".58" stop-color="#E0A030"/>
      <stop offset="1" stop-color="#8A5810"/>
    </linearGradient>
    <linearGradient id="saber_t5_roc_wing-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF6C8"/>
      <stop offset=".35" stop-color="#FFD45A"/>
      <stop offset=".72" stop-color="#D69A2A"/>
      <stop offset="1" stop-color="#9A5E14"/>
    </linearGradient>
    <linearGradient id="saber_t5_roc_wing-grip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B8E4FF"/>
      <stop offset=".5" stop-color="#3B7FE0"/>
      <stop offset="1" stop-color="#1A2A6E"/>
    </linearGradient>
    <radialGradient id="saber_t5_roc_wing-shadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2A1008" stop-opacity=".3"/>
      <stop offset="1" stop-color="#2A1008" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="0" cy="0" rx="26" ry="4.6" fill="url(#saber_t5_roc_wing-shadow)" transform="translate(35.5 34.5) rotate(-45)"/>

  <!-- saber: point-up, rotated onto the grip-bottom-left / tip-top-right diagonal -->
  <g transform="translate(34.5 31.5) rotate(45)" stroke="#2A1008" stroke-linejoin="round" stroke-linecap="round">
    <path d="M-4.8 -29C-3.2 -23 -2 -4 -2.4 13L2.6 13C3.4 -4 5.6 -13 5.6 -19C5.6 -24 1.8 -28 -4.8 -29Z" fill="none" stroke="#FFE7A0" stroke-width="5" opacity=".4"/>
