    <ellipse cx="0" cy="14.4" rx="6" ry="2.1" fill="url(#saber_t5_roc_wing-gold)" stroke-width="2"/>
    <!-- wrapped handle -->
    <rect x="-2.3" y="16.4" width="4.6" height="10.2" rx="1" fill="url(#saber_t5_roc_wing-grip)" stroke-width="2.1"/>
    <path d="M-2.3 19.4H2.3M-2.3 23.4H2.3" fill="none" stroke="#FFD45A" stroke-width="1"/>
    <path d="M-1.4 17.4V18.4" fill="none" stroke="#FFFFFF" stroke-width=".9" opacity=".8"/>
    <!-- ring pommel -->
    <circle cx="0" cy="29.8" r="3" fill="none" stroke-width="3.8"/>
    <circle cx="0" cy="29.8" r="3" fill="none" stroke="url(#saber_t5_roc_wing-gold)" stroke-width="1.7"/>
    <path d="M-2.4 28.2A3 3 0 0 1 -.6 27" fill="none" stroke="#FFFFFF" stroke-width=".9" opacity=".9"/>
