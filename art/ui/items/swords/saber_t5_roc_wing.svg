    <path d="M4.8 14.2C9.8 14 13.2 11.6 14 7.2L11.6 8.8L11.8 5.4L9.6 7.8L9 4.6L7.2 7.6L6 5.2C4.8 8 4.4 11 4.8 14.2Z" fill="url(#saber_t5_roc_wing-gold)" stroke-width="1.9"/>
    <path d="M-6.4 12.6L-10.6 9.4M-6 11L-8.4 8.2" fill="none" stroke="#9A5E14" stroke-width=".9" opacity=".8"/>
    <path d="M6.4 12.6L10.6 9.4M6 11L8.4 8.2" fill="none" stroke="#9A5E14" stroke-width=".9" opacity=".8"/>
    <path d="M-12.2 8.6C-10.6 10.4 -8.8 11.6 -7 12.4" fill="none" stroke="#FFF6C8" stroke-width=".9" opacity=".9"/>
