<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="jian_t6_void_stone-blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6E6090"/>
      <stop offset=".42" stop-color="#3E2E5C"/>
      <stop offset=".58" stop-color="#241638"/>
      <stop offset="1" stop-color="#0C0616"/>
    </linearGradient>
    <linearGradient id="jian_t6_void_stone-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF6C8"/>
      <stop offset=".35" stop-color="#FFD45A"/>
      <stop offset=".72" stop-color="#D69A2A"/>
      <stop offset="1" stop-color="#9A5E14"/>
    </linearGradient>
    <linearGradient id="jian_t6_void_stone-grip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6A4AB8"/>
      <stop offset=".5" stop-color="#30186A"/>
      <stop offset="1" stop-color="#120A30"/>
    </linearGradient>
    <linearGradient id="jian_t6_void_stone-tassel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAD8FF"/>
      <stop offset=".55" stop-color="#9A6AE8"/>
      <stop offset="1" stop-color="#3A1E7A"/>
    </linearGradient>
    <radialGradient id="jian_t6_void_stone-aura" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#C8A4FF" stop-opacity=".45"/>
      <stop offset=".55" stop-color="#9A6AE8" stop-opacity=".2"/>
      <stop offset="1" stop-color="#9A6AE8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="jian_t6_void_stone-shadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2A1008" stop-opacity=".3"/>
      <stop offset="1" stop-color="#2A1008" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="0" cy="0" rx="27" ry="10" fill="url(#jian_t6_void_stone-aura)" transform="translate(34 30) rotate(-45)"/>

  <ellipse cx="0" cy="0" rx="26" ry="4.6" fill="url(#jian_t6_void_stone-shadow)" transform="translate(36 34) rotate(-45)"/>

  <!-- jian: point-up, rotated onto the grip-bottom-left / tip-top-right diagonal -->
  <g transform="translate(34.5 28.5) rotate(45)" stroke="#2A1008" stroke-linejoin="round" stroke-linecap="round">
    <path d="M0 -29L2.8 -22.5L2.5 13H-2.5L-2.8 -22.5Z" fill="none" stroke="#9A6AE8" stroke-width="5.6" opacity=".5"/>
    <path d="M0 -29L2.8 -22.5L2.5 13H-2.5L-2.8 -22.5Z" fill="url(#jian_t6_void_stone-blade)" stroke-width="2.4"/>
    <path d="M0 -23V12" fill="none" stroke="#1A0E2C" stroke-width="1.1" opacity=".8"/>
    <path d="M-1.5 -21V11" fill="none" stroke="#FFFFFF" stroke-width="1" opacity=".55"/>
    <!-- glowing violet cracks -->
    <path d="M.6 -24L-.8 -18L1.6 -13L-.6 -8M-1 -4L1.4 1L-.4 6L1.2 10" fill="none" stroke="#9A6AE8" stroke-width="2.6" opacity=".6"/>
    <path d="M.6 -24L-.8 -18L1.6 -13L-.6 -8M-1 -4L1.4 1L-.4 6L1.2 10" fill="none" stroke="#E6D6FF" stroke-width="1.1"/>
    <!-- guard -->
    <path d="M-6.8 12.4Q-3.4 14.6 0 14.2Q3.4 14.6 6.8 12.4L6.8 16.8Q0 18.8 -6.8 16.8Z" fill="url(#jian_t6_void_stone-gold)" stroke-width="2.1"/>
    <path d="M-4.8 14.6L-2 14.1" fill="none" stroke="#FFF6C8" stroke-width="1" opacity=".9"/>
    <!-- grip -->
    <rect x="-2.1" y="17.3" width="4.2" height="7.6" rx="1" fill="url(#jian_t6_void_stone-grip)" stroke-width="2.1"/>
    <path d="M-2.1 19.6H2.1M-2.1 22.4H2.1" fill="none" stroke="#FFD45A" stroke-width="1"/>
    <circle cx="0" cy="15.6" r="1.4" fill="#9A6AE8" stroke-width="1.1"/>
    <circle cx="-.4" cy="15.2" r=".4" fill="#FFFFFF" stroke="none"/>
    <!-- pommel -->
    <circle cx="0" cy="27" r="2.7" fill="url(#jian_t6_void_stone-gold)" stroke-width="2.1"/>
    <circle cx="-.9" cy="26.1" r=".7" fill="#FFFFFF" stroke="none"/>
  </g>

  <!-- tassel -->
  <g transform="translate(15.4 47.6) rotate(-35)" stroke="#2A1008" stroke-linejoin="round" stroke-linecap="round">
    <path d="M0 2.6V5.2" fill="none" stroke-width="2.2"/>
    <path d="M0 2.6V5.2" fill="none" stroke="#FFD45A" stroke-width=".9"/>
    <path d="M0 5.2C-2.3 6.8 -3.1 9 -2.2 10.4C-1.1 11.1 1.1 11.1 2.2 10.4C3.1 9 2.3 6.8 0 5.2Z" fill="url(#jian_t6_void_stone-tassel)" stroke-width="1.8"/>
    <path d="M-.8 7L-1.2 9.6M.8 7L1.2 9.6" fill="none" stroke="#3A1E7A" stroke-width=".9" stroke-opacity=".8"/>
  </g>
</svg>
