<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="great_t1_copper-blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFE6C4"/>
      <stop offset=".42" stop-color="#F0A868"/>
      <stop offset=".58" stop-color="#D4803E"/>
      <stop offset="1" stop-color="#7A3C14"/>
    </linearGradient>
    <linearGradient id="great_t1_copper-bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E0A870"/>
      <stop offset=".5" stop-color="#9A6034"/>
      <stop offset="1" stop-color="#4A2810"/>
    </linearGradient>
    <linearGradient id="great_t1_copper-grip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7A5230"/>
      <stop offset=".5" stop-color="#4E3018"/>
      <stop offset="1" stop-color="#2C180A"/>
    </linearGradient>
    <linearGradient id="great_t1_copper-fang" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFCEE"/>
      <stop offset="1" stop-color="#D8C690"/>
    </linearGradient>
    <radialGradient id="great_t1_copper-shadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2A1008" stop-opacity=".22"/>
      <stop offset="1" stop-color="#2A1008" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="0" cy="0" rx="27" ry="5" fill="url(#great_t1_copper-shadow)" transform="translate(34 35) rotate(-45)"/>

  <g transform="translate(32 32) rotate(45)" stroke="#2A1008" stroke-linejoin="round" stroke-linecap="round">
    <!-- broad heavy blade -->
    <path d="M0 -31L6.8 -21L6.2 7.5H-6.2L-6.8 -21Z" fill="url(#great_t1_copper-blade)" stroke-width="2.4"/>
    <path d="M-1.5 -19V6H1.5V-19Z" fill="#9A4E1C" opacity=".55" stroke="none"/>
    <path d="M-4.4 -19V5" fill="none" stroke="#FFF2DC" stroke-width="1.1" opacity=".8"/>
    <!-- big bronze guard -->
    <path d="M-13.5 7.6H13.5Q15.2 10.2 13.5 12.8H-13.5Q-15.2 10.2 -13.5 7.6Z" fill="url(#great_t1_copper-bronze)" stroke-width="2.3"/>
    <path d="M-12 9.4H-8" fill="none" stroke="#FFE6C4" stroke-width="1" opacity=".8"/>
    <!-- viper-fang pair set into the guard -->
    <path d="M-12.6 8.2C-13.8 2.8 -11.4 -1.2 -7.6 -3.2C-9.4 .6 -9.6 4.4 -8.8 8.2Z" fill="url(#great_t1_copper-fang)" stroke-width="1.9"/>
    <path d="M12.6 8.2C13.8 2.8 11.4 -1.2 7.6 -3.2C9.4 .6 9.6 4.4 8.8 8.2Z" fill="url(#great_t1_copper-fang)" stroke-width="1.9"/>
    <path d="M-11.6 5.4C-11.6 2.6 -10.4 .4 -9 -1" fill="none" stroke="#FFFFFF" stroke-width="1" opacity=".9"/>
    <!-- long two-handed grip -->
    <rect x="-2.6" y="13.3" width="5.2" height="13.6" rx="1.2" fill="url(#great_t1_copper-grip)" stroke-width="2.1"/>
    <path d="M-2 15.6L2 17.2M-2 18.6L2 20.2M-2 21.6L2 23.2M-2 24.6L2 26.2" fill="none" stroke="#2C180A" stroke-width="1"/>
    <rect x="-3.2" y="19.6" width="6.4" height="1.9" fill="url(#great_t1_copper-bronze)" stroke-width="1.4"/>
    <!-- heavy pommel -->
    <path d="M-3.5 27.2H3.5L4.1 30.2L0 33.4L-4.1 30.2Z" fill="url(#great_t1_copper-bronze)" stroke-width="2.1"/>
    <path d="M-2.2 28.6L-.6 28.2" fill="none" stroke="#FFE6C4" stroke-width="1" opacity=".8"/>
  </g>
</svg>
