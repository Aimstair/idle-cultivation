<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="twin_t6_leviathan_fins-blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".42" stop-color="#CFE6FF"/>
      <stop offset=".58" stop-color="#8ABCF0"/>
      <stop offset="1" stop-color="#2E5CA8"/>
    </linearGradient>
    <linearGradient id="twin_t6_leviathan_fins-silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".5" stop-color="#C4D0E0"/>
      <stop offset="1" stop-color="#5E6C86"/>
    </linearGradient>
    <linearGradient id="twin_t6_leviathan_fins-grip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5C7CC8"/>
      <stop offset=".5" stop-color="#2A3E8E"/>
      <stop offset="1" stop-color="#121C4C"/>
    </linearGradient>
    <radialGradient id="twin_t6_leviathan_fins-aura" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#B8E4FF" stop-opacity=".42"/>
      <stop offset=".55" stop-color="#3B7FE0" stop-opacity=".18"/>
      <stop offset="1" stop-color="#3B7FE0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="twin_t6_leviathan_fins-shadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2A1008" stop-opacity=".28"/>
      <stop offset="1" stop-color="#2A1008" stop-opacity="0"/>
    </radialGradient>
    <!-- one blade, point-up, origin at the crossing point -->
    <g id="twin_t6_leviathan_fins-sword" stroke="#2A1008" stroke-linejoin="round" stroke-linecap="round">
      <path d="M-3.4 11C-4.6 -2 -5.2 -14 -2.2 -28C3.8 -22 5.8 -12 4.8 -2C4.4 2.4 3.9 7 3.4 11Z" fill="none" stroke="#B8E4FF" stroke-width="4.8" opacity=".4"/>
      <path d="M-3.4 11C-4.6 -2 -5.2 -14 -2.2 -28C3.8 -22 5.8 -12 4.8 -2C4.4 2.4 3.9 7 3.4 11Z" fill="url(#twin_t6_leviathan_fins-blade)" stroke-width="2.4"/>
      <!-- fin rays -->
      <path d="M-1.2 9L-2.6 -20M.6 9L1.6 -14M2.2 9L3.6 -6" fill="none" stroke="#2E5CA8" stroke-width="1" opacity=".75"/>
      <path d="M-2.6 8.5C-3.4 -2 -3.6 -12 -2.4 -22" fill="none" stroke="#FFFFFF" stroke-width="1" opacity=".9"/>
      <ellipse cx="0" cy="12.6" rx="5.2" ry="1.9" fill="url(#twin_t6_leviathan_fins-silver)" stroke-width="1.9"/>
      <rect x="-2.4" y="14.4" width="4.8" height="8.4" rx="1" fill="url(#twin_t6_leviathan_fins-grip)" stroke-width="2"/>
      <path d="M-2.4 16.4Q-1.2 15.2 0 16.4Q1.2 15.2 2.4 16.4M-2.4 18.6Q-1.2 17.4 0 18.6Q1.2 17.4 2.4 18.6M-2.4 20.8Q-1.2 19.6 0 20.8Q1.2 19.6 2.4 20.8" fill="none" stroke="#121C4C" stroke-width=".9"/>
      <path d="M-2.4 17.5H2.4" fill="none" stroke="#DDE6F4" stroke-width=".9"/>
      <circle cx="0" cy="24.6" r="2.2" fill="url(#twin_t6_leviathan_fins-silver)" stroke-width="1.9"/>
      <circle cx="-.7" cy="23.9" r=".6" fill="#FFFFFF" stroke="none"/>
    </g>
  </defs>

  <circle cx="33" cy="30" r="25" fill="url(#twin_t6_leviathan_fins-aura)"/>

  <circle cx="33" cy="35" r="20" fill="url(#twin_t6_leviathan_fins-shadow)"/>

  <!-- back blade (mirrored), then front blade on the main diagonal -->
  <use href="#twin_t6_leviathan_fins-sword" xlink:href="#twin_t6_leviathan_fins-sword" transform="translate(32 32) rotate(-45) scale(-1 1) translate(0 -1)"/>
  <use href="#twin_t6_leviathan_fins-sword" xlink:href="#twin_t6_leviathan_fins-sword" transform="translate(32 32) rotate(45) translate(0 -1)"/>
  <!-- rising bubbles -->
  <g fill="none" stroke="#FFFFFF" stroke-width=".9" opacity=".85">
    <circle cx="22.4" cy="19.6" r="1.5"/>
    <circle cx="48.8" cy="27.6" r="1.2"/>
    <circle cx="18.8" cy="27" r=".9"/>
  </g>
</svg>
