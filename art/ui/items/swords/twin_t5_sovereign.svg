<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="twin_t5_sovereign-blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E6F0C0"/>
      <stop offset=".42" stop-color="#9AB05A"/>
      <stop offset=".58" stop-color="#5A7A2E"/>
      <stop offset="1" stop-color="#223414"/>
    </linearGradient>
    <linearGradient id="twin_t5_sovereign-bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E0A870"/>
      <stop offset=".5" stop-color="#9A6034"/>
      <stop offset="1" stop-color="#4A2810"/>
    </linearGradient>
    <linearGradient id="twin_t5_sovereign-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF6C8"/>
      <stop offset=".35" stop-color="#FFD45A"/>
      <stop offset=".72" stop-color="#D69A2A"/>
      <stop offset="1" stop-color="#9A5E14"/>
    </linearGradient>
    <linearGradient id="twin_t5_sovereign-grip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A5A30"/>
      <stop offset=".5" stop-color="#5A3614"/>
      <stop offset="1" stop-color="#2C1808"/>
    </linearGradient>
    <radialGradient id="twin_t5_sovereign-shadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2A1008" stop-opacity=".28"/>
      <stop offset="1" stop-color="#2A1008" stop-opacity="0"/>
    </radialGradient>
    <!-- one blade, point-up, origin at the crossing point -->
    <g id="twin_t5_sovereign-sword" stroke="#2A1008" stroke-linejoin="round" stroke-linecap="round">
      <path d="M0 -29C4 -24 5.6 -15 5 -5L4.2 11H-4.2L-5 -5C-5.6 -15 -4 -24 0 -29Z" fill="none" stroke="#C8E890" stroke-width="4.6" opacity=".3"/>
      <path d="M0 -29C4 -24 5.6 -15 5 -5L4.2 11H-4.2L-5 -5C-5.6 -15 -4 -24 0 -29Z" fill="url(#twin_t5_sovereign-blade)" stroke-width="2.4"/>
      <path d="M0 -24V9" fill="none" stroke="#223414" stroke-width="1.1" opacity=".8"/>
      <path d="M-2.4 -20C-2.9 -12 -2.4 -2 -2.2 8" fill="none" stroke="#F4FFD8" stroke-width="1" opacity=".85"/>
      <path d="M1.6 -18L3.2 -14.4M1.8 -8L3.4 -4.4M1.6 2L3 5.6" fill="none" stroke="#223414" stroke-width="1" opacity=".6"/>
      <!-- ape-claw guard: bronze disc with hooked claws curling down each side -->
      <ellipse cx="0" cy="12.6" rx="5.2" ry="1.9" fill="url(#twin_t5_sovereign-bronze)" stroke-width="1.9"/>
      <path d="M-5 13C-7.8 13.6 -9 16.2 -8 18.6C-7.8 16.4 -6.6 15 -4.4 14.6Z" fill="url(#twin_t5_sovereign-bronze)" stroke-width="1.7"/>
      <path d="M5 13C7.8 13.6 9 16.2 8 18.6C7.8 16.4 6.6 15 4.4 14.6Z" fill="url(#twin_t5_sovereign-bronze)" stroke-width="1.7"/>
      <path d="M-7.4 15.2C-6.8 14.6 -6 14.2 -5.2 14" fill="none" stroke="#FFE6C4" stroke-width=".9" opacity=".9"/>
      <rect x="-2.4" y="14.4" width="4.8" height="8.4" rx="1" fill="url(#twin_t5_sovereign-grip)" stroke-width="2"/>
      <path d="M-2.4 16.4Q-1.2 15.2 0 16.4Q1.2 15.2 2.4 16.4M-2.4 20.8Q-1.2 19.6 0 20.8Q1.2 19.6 2.4 20.8" fill="none" stroke="#2C1808" stroke-width=".9"/>
      <rect x="-2.9" y="17.8" width="5.8" height="1.6" fill="url(#twin_t5_sovereign-gold)" stroke-width="1.2"/>
      <circle cx="0" cy="24.6" r="2.2" fill="url(#twin_t5_sovereign-bronze)" stroke-width="1.9"/>
      <circle cx="-.7" cy="23.9" r=".6" fill="#FFFFFF" stroke="none"/>
    </g>
  </defs>

  <circle cx="33" cy="35" r="20" fill="url(#twin_t5_sovereign-shadow)"/>

  <!-- back blade (mirrored), then front blade on the main diagonal -->
  <use href="#twin_t5_sovereign-sword" xlink:href="#twin_t5_sovereign-sword" transform="translate(32 32) rotate(-45) scale(-1 1) translate(0 -1)"/>
  <use href="#twin_t5_sovereign-sword" xlink:href="#twin_t5_sovereign-sword" transform="translate(32 32) rotate(45) translate(0 -1)"/>
</svg>
