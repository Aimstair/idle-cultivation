<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="great_t2_ember-blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9A9EAA"/>
      <stop offset=".42" stop-color="#555A68"/>
      <stop offset=".58" stop-color="#3C404C"/>
      <stop offset="1" stop-color="#1A1C24"/>
    </linearGradient>
    <linearGradient id="great_t2_ember-iron" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A0A4B0"/>
      <stop offset=".5" stop-color="#4E525E"/>
      <stop offset="1" stop-color="#1E2028"/>
    </linearGradient>
    <linearGradient id="great_t2_ember-flame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF2A0"/>
      <stop offset=".45" stop-color="#FFA020"/>
      <stop offset="1" stop-color="#C02810"/>
    </linearGradient>
    <linearGradient id="great_t2_ember-grip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A2C1C"/>
      <stop offset=".5" stop-color="#5A1A0E"/>
      <stop offset="1" stop-color="#2E0A06"/>
    </linearGradient>
    <radialGradient id="great_t2_ember-gem" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#FFF2A0"/>
      <stop offset=".5" stop-color="#FFA020"/>
      <stop offset="1" stop-color="#C02810"/>
    </radialGradient>
    <radialGradient id="great_t2_ember-shadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2A1008" stop-opacity=".22"/>
      <stop offset="1" stop-color="#2A1008" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="0" cy="0" rx="27" ry="5" fill="url(#great_t2_ember-shadow)" transform="translate(34 35) rotate(-45)"/>

  <g transform="translate(32 32) rotate(45)" stroke="#2A1008" stroke-linejoin="round" stroke-linecap="round">
    <!-- dark iron blade -->
    <path d="M0 -31L6.8 -21L6.2 7.5H-6.2L-6.8 -21Z" fill="url(#great_t2_ember-blade)" stroke-width="2.4"/>
    <path d="M-4.6 -19V5" fill="none" stroke="#D8DCE6" stroke-width="1.1" opacity=".7"/>
    <!-- glowing ember cracks -->
    <path d="M-1.6 -22L1.2 -15L-1.4 -9L1.6 -1L-.8 5M2.2 -18L4.2 -13.5L2.6 -9" fill="none" stroke="#FF6A20" stroke-width="3" opacity=".45" stroke-linecap="round"/>
    <path d="M-1.6 -22L1.2 -15L-1.4 -9L1.6 -1L-.8 5M2.2 -18L4.2 -13.5L2.6 -9" fill="none" stroke="#FFA020" stroke-width="1.2"/>
    <path d="M-1.2 -20.5L.6 -16M-.8 -8L1 -2.5" fill="none" stroke="#FFF2A0" stroke-width=".9" opacity=".9"/>
    <!-- flame-shaped guard -->
    <path d="M-13.5 12.8Q-14.4 7.6 -11 5.2Q-10.6 8.4 -8 8.2H8Q10.6 8.4 11 5.2Q14.4 7.6 13.5 12.8Q0 14.8 -13.5 12.8Z" fill="url(#great_t2_ember-flame)" stroke-width="2.3"/>
    <path d="M-11.2 9.6Q-8.5 10.6 -5 10.2" fill="none" stroke="#FFF2A0" stroke-width="1" opacity=".85"/>
    <circle cx="0" cy="10.6" r="1.7" fill="url(#great_t2_ember-gem)" stroke-width="1.4"/>
    <!-- long two-handed grip, dark red leather -->
    <rect x="-2.6" y="13.3" width="5.2" height="13.6" rx="1.2" fill="url(#great_t2_ember-grip)" stroke-width="2.1"/>
    <path d="M-2 15.6L2 17.2M-2 18.6L2 20.2M-2 21.6L2 23.2M-2 24.6L2 26.2" fill="none" stroke="#2E0A06" stroke-width="1"/>
    <rect x="-3.2" y="19.6" width="6.4" height="1.9" fill="url(#great_t2_ember-iron)" stroke-width="1.4"/>
    <!-- heavy iron pommel with an ember vein -->
    <path d="M-3.5 27.2H3.5L4.1 30.2L0 33.4L-4.1 30.2Z" fill="url(#great_t2_ember-iron)" stroke-width="2.1"/>
    <path d="M-1.6 28.6L.6 30.4L-.6 32" fill="none" stroke="#FFA020" stroke-width="1"/>
  </g>
</svg>
