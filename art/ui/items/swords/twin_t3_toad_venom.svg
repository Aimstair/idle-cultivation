<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="twin_t3_toad_venom-blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#CCF2A8"/>
      <stop offset=".42" stop-color="#5E9A48"/>
      <stop offset=".58" stop-color="#3A6A30"/>
      <stop offset="1" stop-color="#121A10"/>
    </linearGradient>
    <linearGradient id="twin_t3_toad_venom-iron" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B0B6C0"/>
      <stop offset=".5" stop-color="#5E6670"/>
      <stop offset="1" stop-color="#262A30"/>
    </linearGradient>
    <linearGradient id="twin_t3_toad_venom-grip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A89A54"/>
      <stop offset=".5" stop-color="#6E6228"/>
      <stop offset="1" stop-color="#3A3010"/>
    </linearGradient>
    <linearGradient id="twin_t3_toad_venom-venom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4FF8C"/>
      <stop offset="1" stop-color="#6CB416"/>
    </linearGradient>
    <radialGradient id="twin_t3_toad_venom-shadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2A1008" stop-opacity=".28"/>
      <stop offset="1" stop-color="#2A1008" stop-opacity="0"/>
    </radialGradient>
    <!-- one short leaf blade, point-up -->
    <g id="twin_t3_toad_venom-sword" stroke="#2A1008" stroke-linejoin="round" stroke-linecap="round">
      <path d="M0 -29C3 -25 4.4 -18 3.8 -8L3.2 11H-3.2L-3.8 -8C-4.4 -18 -3 -25 0 -29Z" fill="url(#twin_t3_toad_venom-blade)" stroke-width="2.4"/>
      <path d="M0 -24V9" fill="none" stroke="#121A10" stroke-width="1.1" opacity=".8"/>
      <path d="M-2 -20C-2.4 -12 -1.8 -2 -1.6 8" fill="none" stroke="#E4FF8C" stroke-width="1" opacity=".8"/>
      <ellipse cx="0" cy="12.6" rx="5.2" ry="1.9" fill="url(#twin_t3_toad_venom-iron)" stroke-width="1.9"/>
      <!-- warty hide grip -->
      <rect x="-2.4" y="14.4" width="4.8" height="8.4" rx="1" fill="url(#twin_t3_toad_venom-grip)" stroke-width="2"/>
      <circle cx="-.9" cy="16.4" r=".8" fill="#C8B868" stroke="#3A3010" stroke-width=".7"/>
      <circle cx="1" cy="18.6" r=".8" fill="#C8B868" stroke="#3A3010" stroke-width=".7"/>
      <circle cx="-.8" cy="20.8" r=".8" fill="#C8B868" stroke="#3A3010" stroke-width=".7"/>
      <circle cx="0" cy="24.6" r="2.2" fill="url(#twin_t3_toad_venom-iron)" stroke-width="1.9"/>
      <circle cx="-.7" cy="23.9" r=".6" fill="#FFFFFF" stroke="none"/>
    </g>
    <!-- one venom drop, hanging down from its origin -->
    <g id="twin_t3_toad_venom-drop" stroke="#2A1008" stroke-linejoin="round" stroke-linecap="round">
      <path d="M-.5 0C-.8 1.8 -1.9 3 -1.9 4.3C-1.9 5.6 -.9 6.3 0 6.3C.9 6.3 1.9 5.6 1.9 4.3C1.9 3 .8 1.8 .5 0Z" fill="url(#twin_t3_toad_venom-venom)" stroke-width="1.6"/>
      <circle cx="-.6" cy="4" r=".6" fill="#FFFFFF" stroke="none" opacity=".9"/>
    </g>
  </defs>

  <circle cx="33" cy="35" r="20" fill="url(#twin_t3_toad_venom-shadow)"/>

  <use href="#twin_t3_toad_venom-sword" xlink:href="#twin_t3_toad_venom-sword" transform="translate(32 32) rotate(-45) scale(-1 1) translate(0 -1)"/>
  <use href="#twin_t3_toad_venom-drop" xlink:href="#twin_t3_toad_venom-drop" transform="translate(18.6 22.8)"/>
  <use href="#twin_t3_toad_venom-sword" xlink:href="#twin_t3_toad_venom-sword" transform="translate(32 32) rotate(45) translate(0 -1)"/>
  <use href="#twin_t3_toad_venom-drop" xlink:href="#twin_t3_toad_venom-drop" transform="translate(42.4 26.8)"/>
  <use href="#twin_t3_toad_venom-drop" xlink:href="#twin_t3_toad_venom-drop" transform="translate(48.8 20.2) scale(.8)"/>
</svg>
