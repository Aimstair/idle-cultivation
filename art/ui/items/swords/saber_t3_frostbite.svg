    <!-- pale blue wrap -->
    <rect x="-2.3" y="16.4" width="4.6" height="10.2" rx="1" fill="url(#saber_t3_frostbite-grip)" stroke-width="2.1"/>
    <path d="M-1.8 18.6L1.8 19.8M-1.8 21.2L1.8 22.4M-1.8 23.8L1.8 25" fill="none" stroke="#FFFFFF" stroke-width="1" opacity=".75"/>
