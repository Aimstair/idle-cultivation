    <circle cx="0" cy="29.8" r="3" fill="none" stroke="url(#saber_t3_frostbite-silver)" stroke-width="1.7"/>
    <path d="M-2.4 28.2A3 3 0 0 1 -.6 27" fill="none" stroke="#FFFFFF" stroke-width=".9" opacity=".9"/>
