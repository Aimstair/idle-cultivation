<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="twin_t2_bandit_hooks-steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C4CAD4"/>
      <stop offset=".45" stop-color="#737B8A"/>
      <stop offset=".55" stop-color="#565E6C"/>
      <stop offset="1" stop-color="#262A34"/>
    </linearGradient>
    <linearGradient id="twin_t2_bandit_hooks-steelD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B0B6C2"/>
      <stop offset=".5" stop-color="#5E6674"/>
      <stop offset="1" stop-color="#262A34"/>
    </linearGradient>
    <radialGradient id="twin_t2_bandit_hooks-red" cx=".3" cy=".25" r=".9">
      <stop offset="0" stop-color="#FF6A44"/>
      <stop offset=".5" stop-color="#C21E10"/>
      <stop offset="1" stop-color="#5A0A04"/>
    </radialGradient>
    <radialGradient id="twin_t2_bandit_hooks-shadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2A1008" stop-opacity=".28"/>
      <stop offset="1" stop-color="#2A1008" stop-opacity="0"/>
    </radialGradient>
    <!-- one hook sword, point-up -->
    <g id="twin_t2_bandit_hooks-sword" stroke="#2A1008" stroke-linejoin="round" stroke-linecap="round">
      <!-- blade with hooked tip -->
      <path d="M-2.4 11L-2.4 -20A7 7 0 0 1 11.6 -20L10.6 -15L6.8 -20A2.2 2.2 0 0 0 2.4 -20L2.4 11Z" fill="url(#twin_t2_bandit_hooks-steel)" stroke-width="2.4"/>
      <path d="M-1 -19V9" fill="none" stroke="#FFFFFF" stroke-width="1" opacity=".7"/>
      <path d="M1 -20.5A4.6 4.6 0 0 1 9.2 -19.6" fill="none" stroke="#FFFFFF" stroke-width="1" opacity=".55"/>
      <!-- crescent guard -->
      <path d="M-8.5 9.5C-3 15.5 3 15.5 8.5 9.5C4 12.2 -4 12.2 -8.5 9.5Z" fill="url(#twin_t2_bandit_hooks-steelD)" stroke-width="2"/>
      <path d="M-5.6 11.4Q-2 13 1.6 12.6" fill="none" stroke="#FFFFFF" stroke-width=".9" opacity=".6"/>
      <!-- red cloth wrap -->
      <rect x="-2.3" y="14.2" width="4.6" height="8.6" rx=".9" fill="url(#twin_t2_bandit_hooks-red)" stroke-width="2"/>
      <path d="M-1.8 16L1.8 17.3M-1.8 18.4L1.8 19.7M-1.8 20.8L1.8 22" fill="none" stroke="#5A0A04" stroke-width="1"/>
      <!-- dagger pommel -->
      <path d="M-2.4 22.6L0 29L2.4 22.6Z" fill="url(#twin_t2_bandit_hooks-steelD)" stroke-width="2"/>
    </g>
  </defs>

  <circle cx="33" cy="35" r="20" fill="url(#twin_t2_bandit_hooks-shadow)"/>

  <use href="#twin_t2_bandit_hooks-sword" xlink:href="#twin_t2_bandit_hooks-sword" transform="translate(32 32) rotate(-45) scale(-1 1) translate(0 -1)"/>
  <use href="#twin_t2_bandit_hooks-sword" xlink:href="#twin_t2_bandit_hooks-sword" transform="translate(32 32) rotate(45) translate(0 -1)"/>
</svg>
