<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="robe_t1-linen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8F0DC"/>
      <stop offset=".55" stop-color="#E6D5AE"/>
      <stop offset="1" stop-color="#C8AF80"/>
    </linearGradient>
    <linearGradient id="robe_t1-shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7A5A30" stop-opacity="0"/>
      <stop offset=".6" stop-color="#7A5A30" stop-opacity="0"/>
      <stop offset="1" stop-color="#7A5A30" stop-opacity=".32"/>
    </linearGradient>
    <linearGradient id="robe_t1-trim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCC79C"/>
      <stop offset="1" stop-color="#A88A58"/>
    </linearGradient>
    <linearGradient id="robe_t1-sash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B8804C"/>
      <stop offset=".5" stop-color="#7E4C24"/>
      <stop offset="1" stop-color="#4A2810"/>
    </linearGradient>
  </defs>

  <!-- contact shadow -->
  <ellipse cx="32" cy="57.2" rx="17" ry="1.6" fill="#2A1008" opacity=".25"/>

  <!-- wide sleeves -->
  <g stroke="#2A1008" stroke-width="2.3" stroke-linejoin="round">
    <path d="M25 11L7 14L6 31Q14 31.5 23 29.5Z" fill="url(#robe_t1-linen)"/>
    <path d="M39 11L57 14L58 31Q50 31.5 41 29.5Z" fill="url(#robe_t1-linen)"/>
  </g>
  <path d="M39 11L57 14L58 31Q50 31.5 41 29.5Z" fill="url(#robe_t1-shade)"/>
  <!-- cuffs -->
  <g stroke="#2A1008" stroke-width="1.4" stroke-linejoin="round" fill="url(#robe_t1-trim)">
    <path d="M7 14L11 13.3L10.3 30.6L6 31Z"/>
    <path d="M57 14L53 13.3L53.7 30.6L58 31Z"/>
  </g>
  <path d="M23 12.6L10.5 15" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".8"/>

  <!-- body -->
  <path d="M22 10H42L48 56Q32 58.5 16 56Z" fill="url(#robe_t1-linen)"/>
  <path d="M22 10H42L48 56Q32 58.5 16 56Z" fill="url(#robe_t1-shade)"/>
  <!-- inner collar -->
  <path d="M27 10L32 19L37 10Z" fill="#FFFBEE" stroke="#2A1008" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- crossed lapels (under, then over) -->
  <path d="M22 10H27L32 19L29.5 23.5Z" fill="url(#robe_t1-trim)" stroke="#2A1008" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M37 10H42L28.5 34H23.5Z" fill="url(#robe_t1-trim)" stroke="#2A1008" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M37.8 12L26.2 31" fill="none" stroke="#FFFFFF" stroke-width=".9" stroke-linecap="round" opacity=".7"/>
  <!-- hem fold -->
  <path d="M17.5 52.5Q32 55 46.5 52.5" fill="none" stroke="#A88A58" stroke-width="1" stroke-linecap="round" opacity=".7"/>
  <!-- body outline -->
  <path d="M22 10H42L48 56Q32 58.5 16 56Z" fill="none" stroke="#2A1008" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- brown sash, knot and tails -->
  <path d="M19 33H45L45.8 39H18.2Z" fill="url(#robe_t1-sash)" stroke="#2A1008" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M20.5 34.4H43.5" fill="none" stroke="#E0B080" stroke-width=".9" stroke-linecap="round" opacity=".7"/>
  <g fill="url(#robe_t1-sash)" stroke="#2A1008" stroke-width="1.5" stroke-linejoin="round">
    <path d="M29.5 39.5L27.5 50.5L30.5 51L32 39.5Z"/>
    <path d="M34.5 39.5L36.5 50.5L33.5 51L32 39.5Z"/>
    <rect x="29" y="32" width="6" height="8" rx="1.6"/>
  </g>
  <path d="M30.5 33.6V38" fill="none" stroke="#E0B080" stroke-width=".9" stroke-linecap="round" opacity=".7"/>
</svg>
