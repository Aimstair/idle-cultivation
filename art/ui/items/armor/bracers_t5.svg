<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bracers_t5-obsidian" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A8AA0"/>
      <stop offset=".45" stop-color="#2E2E3C"/>
      <stop offset="1" stop-color="#0A0A12"/>
    </linearGradient>
    <linearGradient id="bracers_t5-gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFF6C8"/>
      <stop offset=".35" stop-color="#FFD45A"/>
      <stop offset=".75" stop-color="#D69A2A"/>
      <stop offset="1" stop-color="#9A5E14"/>
    </linearGradient>
    <linearGradient id="bracers_t5-goldV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6C8"/>
      <stop offset=".4" stop-color="#FFD45A"/>
      <stop offset="1" stop-color="#9A5E14"/>
    </linearGradient>
    <linearGradient id="bracers_t5-hole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140603"/>
      <stop offset="1" stop-color="#4A2412"/>
    </linearGradient>
    <filter id="bracers_t5-glow" x="-80%" y="-40%" width="260%" height="180%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <!-- one bracer, centred on the origin -->
    <g id="bracers_t5-b">
      <path d="M-9.5-21L-7.5 21A7.5 2.6 0 0 0 7.5 21L9.5-21Z" fill="url(#bracers_t5-obsidian)" stroke="#2A1008" stroke-width="2.3" stroke-linejoin="round"/>
      <!-- molten seams -->
      <path d="M-8.9-8A8.9 2.9 0 0 0 8.9-8M-8.3 4A8.3 2.8 0 0 0 8.3 4" fill="none" stroke="#FFA020" stroke-width="2.2" stroke-linecap="round" opacity=".7" filter="url(#bracers_t5-glow)"/>
      <path d="M-8.9-8A8.9 2.9 0 0 0 8.9-8M-8.3 4A8.3 2.8 0 0 0 8.3 4" fill="none" stroke="#FFF2A0" stroke-width="1" stroke-linecap="round"/>
      <!-- gold bands -->
      <path d="M-7.75 15.5L-7.5 21A7.5 2.6 0 0 0 7.5 21L7.75 15.5A7.75 2.6 0 0 1-7.75 15.5Z" fill="url(#bracers_t5-gold)" stroke="#2A1008" stroke-width="1.3" stroke-linejoin="round"/>
      <path d="M-9.5-21L-9.25-15.5A9.25 3 0 0 0 9.25-15.5L9.5-21A9.5 3.2 0 0 1-9.5-21Z" fill="url(#bracers_t5-gold)" stroke="#2A1008" stroke-width="1.3" stroke-linejoin="round"/>
      <!-- gold roc feather inlay over a molten aura -->
      <path d="M0-13Q6-4 0 12Q-6-4 0-13Z" fill="#FFA020" opacity=".8" filter="url(#bracers_t5-glow)"/>
      <path d="M0-13Q5.5-4 0 12Q-5.5-4 0-13Z" fill="url(#bracers_t5-goldV)" stroke="#2A1008" stroke-width="1.2" stroke-linejoin="round"/>
      <path d="M0-10.5V9.5M-.2-6L-3.2-2.5M.2-6L3.2-2.5M-.2-1L-3.4 2.5M.2-1L3.4 2.5M-.2 4L-2.4 6.5M.2 4L2.4 6.5" fill="none" stroke="#9A5E14" stroke-width=".9" stroke-linecap="round" opacity=".8"/>
      <path d="M-1.6-9Q-3.2-4-2.6 0" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".9"/>
      <!-- opening -->
      <ellipse cx="0" cy="-21" rx="9.5" ry="3.2" fill="url(#bracers_t5-hole)" stroke="#2A1008" stroke-width="2"/>
      <path d="M-8-20.4A8 2.4 0 0 0 8-20.4" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".6"/>
      <!-- highlight -->
      <path d="M-7.4-13.5L-7 13" fill="none" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" opacity=".55"/>
    </g>
    <path id="bracers_t5-spark" d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z"/>
  </defs>

  <ellipse cx="18.5" cy="56.2" rx="9" ry="1.4" fill="#2A1008" opacity=".25"/>
  <ellipse cx="45.5" cy="56.2" rx="9" ry="1.4" fill="#2A1008" opacity=".25"/>
  <use href="#bracers_t5-b" transform="translate(18.5 32) rotate(-5)"/>
  <use href="#bracers_t5-b" transform="translate(45.5 32) rotate(5)"/>
  <g fill="#FFFFFF" stroke="#2A1008" stroke-width=".35" stroke-opacity=".5">
    <use href="#bracers_t5-spark" transform="translate(32 14) scale(1.8)"/>
    <use href="#bracers_t5-spark" transform="translate(57 30) scale(1.3)"/>
  </g>
  <g fill="#FFF2A0">
    <use href="#bracers_t5-spark" transform="translate(7 40) scale(1.3)"/>
    <use href="#bracers_t5-spark" transform="translate(32 44) scale(1.2)"/>
  </g>
</svg>
