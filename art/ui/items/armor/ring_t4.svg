<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="ring_t4-bone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF0"/>
      <stop offset=".4" stop-color="#EDE2C4"/>
      <stop offset=".8" stop-color="#A89870"/>
      <stop offset="1" stop-color="#7A6A4A"/>
    </linearGradient>
    <linearGradient id="ring_t4-boneHi" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".5"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#5A4A2A" stop-opacity=".3"/>
    </linearGradient>
    <linearGradient id="ring_t4-sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF8DC"/>
      <stop offset=".4" stop-color="#E0B058"/>
      <stop offset="1" stop-color="#8C6622"/>
    </linearGradient>
    <radialGradient id="ring_t4-spirit" cx=".35" cy=".3" r=".85">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".45" stop-color="#8FF0F0"/>
      <stop offset="1" stop-color="#2A98B0"/>
    </radialGradient>
    <filter id="ring_t4-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <path id="ring_t4-spark" d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z"/>
  </defs>

  <!-- contact shadow -->
  <ellipse cx="32" cy="53.4" rx="18" ry="1.8" fill="#2A1008" opacity=".25"/>

  <!-- bone band seen at 3/4 -->
  <path fill-rule="evenodd" d="M11 37A21 14 0 1 0 53 37A21 14 0 1 0 11 37ZM17 35.5A15 9 0 1 0 47 35.5A15 9 0 1 0 17 35.5Z" fill="url(#ring_t4-bone)" stroke="#2A1008" stroke-width="2.3" stroke-linejoin="round"/>
  <path fill-rule="evenodd" d="M11 37A21 14 0 1 0 53 37A21 14 0 1 0 11 37ZM17 35.5A15 9 0 1 0 47 35.5A15 9 0 1 0 17 35.5Z" fill="url(#ring_t4-boneHi)"/>
  <!-- inner wall of the far side -->
  <path d="M17 35.5A15 9 0 0 1 47 35.5A15 6.8 0 0 0 17 35.5Z" fill="#8A7A58" stroke="#2A1008" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- sand-gold scale engraving around the band -->
  <path d="M14.5 42Q32 53 49.5 42M13 39.5Q32 51.5 51 39.5" fill="none" stroke="#C89A48" stroke-width="1" stroke-linecap="round" opacity=".8"/>
  <path d="M22 45.5Q24 43.5 26 45.5M29 47.2Q31 45.2 33 47.2M36 46.4Q38 44.4 40 46.4" fill="none" stroke="#C89A48" stroke-width="1" stroke-linecap="round" opacity=".8"/>
  <!-- highlights -->
  <path d="M14 32.5Q18.5 26.5 26.5 24.6" fill="none" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" opacity=".95"/>
  <path d="M23 48Q32 50.5 41 48" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".4"/>

  <!-- spirit orb in a sand-gold bezel -->
  <ellipse cx="32" cy="20.5" rx="8" ry="8.4" fill="#8FF0F0" opacity=".75" filter="url(#ring_t4-glow)"/>
  <ellipse cx="32" cy="20.5" rx="7.8" ry="8.2" fill="url(#ring_t4-sand)" stroke="#2A1008" stroke-width="2.2"/>
  <ellipse cx="32" cy="20.5" rx="5.6" ry="6.1" fill="url(#ring_t4-spirit)" stroke="#2A1008" stroke-width="1.3"/>
  <!-- ghost wisp inside the orb -->
  <path d="M29.5 23.5Q33.5 22 32 18.5Q31 16.5 33.5 16" fill="none" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" opacity=".9"/>
  <ellipse cx="30" cy="17.2" rx="1.6" ry="1" fill="#FFFFFF" opacity=".95"/>
  <path d="M26.3 17.5Q27.8 14 31.2 13" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".8"/>

  <!-- mist and sparks -->
  <ellipse cx="32" cy="29" rx="12" ry="2" fill="#C8FFFF" opacity=".45" filter="url(#ring_t4-glow)"/>
  <g fill="#E8FFFF" stroke="#2A1008" stroke-width=".35" stroke-opacity=".5">
    <use href="#ring_t4-spark" transform="translate(22 10.5) scale(1.8)"/>
    <use href="#ring_t4-spark" transform="translate(43 12) scale(1.4)"/>
    <use href="#ring_t4-spark" transform="translate(45 26) scale(1.2)"/>
  </g>
  <g fill="#8FF0F0">
    <use href="#ring_t4-spark" transform="translate(19 20) scale(1.1)"/>
  </g>
</svg>
