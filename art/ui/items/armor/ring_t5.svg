<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="ring_t5-obsidian" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9A9AB0"/>
      <stop offset=".4" stop-color="#3E3E4E"/>
      <stop offset=".8" stop-color="#16161E"/>
      <stop offset="1" stop-color="#0A0A12"/>
    </linearGradient>
    <linearGradient id="ring_t5-obsidianHi" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".4"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="ring_t5-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6C8"/>
      <stop offset=".35" stop-color="#FFD45A"/>
      <stop offset=".75" stop-color="#D69A2A"/>
      <stop offset="1" stop-color="#9A5E14"/>
    </linearGradient>
    <radialGradient id="ring_t5-ember" cx=".35" cy=".3" r=".85">
      <stop offset="0" stop-color="#FFF8D8"/>
      <stop offset=".35" stop-color="#FFE060"/>
      <stop offset=".7" stop-color="#FFA020"/>
      <stop offset="1" stop-color="#C21E10"/>
    </radialGradient>
    <filter id="ring_t5-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <path id="ring_t5-spark" d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z"/>
  </defs>

  <!-- contact shadow -->
  <ellipse cx="32" cy="53.4" rx="18" ry="1.8" fill="#2A1008" opacity=".25"/>

  <!-- obsidian band seen at 3/4 -->
  <path fill-rule="evenodd" d="M11 37A21 14 0 1 0 53 37A21 14 0 1 0 11 37ZM17 35.5A15 9 0 1 0 47 35.5A15 9 0 1 0 17 35.5Z" fill="url(#ring_t5-obsidian)" stroke="#2A1008" stroke-width="2.3" stroke-linejoin="round"/>
  <path fill-rule="evenodd" d="M11 37A21 14 0 1 0 53 37A21 14 0 1 0 11 37ZM17 35.5A15 9 0 1 0 47 35.5A15 9 0 1 0 17 35.5Z" fill="url(#ring_t5-obsidianHi)"/>
  <!-- inner wall of the far side -->
  <path d="M17 35.5A15 9 0 0 1 47 35.5A15 6.8 0 0 0 17 35.5Z" fill="#2E2E3C" stroke="#2A1008" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- molten seam and gold inlay lines around the band -->
  <path d="M13 39.5Q32 51.5 51 39.5" fill="none" stroke="#FFA020" stroke-width="2.4" stroke-linecap="round" opacity=".7" filter="url(#ring_t5-glow)"/>
  <path d="M13 39.5Q32 51.5 51 39.5" fill="none" stroke="#FFF2A0" stroke-width="1" stroke-linecap="round"/>
  <path d="M14.5 42.5Q32 53.5 49.5 42.5" fill="none" stroke="#FFD45A" stroke-width="1" stroke-linecap="round" opacity=".9"/>
  <!-- highlights -->
  <path d="M14 32.5Q18.5 26.5 26.5 24.6" fill="none" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" opacity=".95"/>
  <path d="M23 48Q32 50.5 41 48" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".4"/>

  <!-- ember orb in a feathered gold bezel -->
  <ellipse cx="32" cy="20.5" rx="8.5" ry="9" fill="#FFA020" opacity=".8" filter="url(#ring_t5-glow)"/>
  <ellipse cx="32" cy="20.5" rx="7.8" ry="8.2" fill="url(#ring_t5-gold)" stroke="#2A1008" stroke-width="2.2"/>
  <!-- feather barbs on the bezel -->
  <path d="M32 12.6V14.2M26.2 16.5L27.6 17.3M37.8 16.5L36.4 17.3M25.4 23.5L26.8 23M38.6 23.5L37.2 23" fill="none" stroke="#9A5E14" stroke-width="1" stroke-linecap="round" opacity=".8"/>
  <ellipse cx="32" cy="20.5" rx="5.6" ry="6.1" fill="url(#ring_t5-ember)" stroke="#2A1008" stroke-width="1.3"/>
  <!-- molten vein inside the orb -->
  <path d="M33.4 15.5L30.6 20L33 21.2L30.8 25.2" fill="none" stroke="#FFF8D8" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" opacity=".95"/>
  <ellipse cx="30" cy="17.2" rx="1.6" ry="1" fill="#FFFFFF" opacity=".95"/>
  <path d="M26.3 17.5Q27.8 14 31.2 13" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".8"/>

  <!-- sparks -->
  <g fill="#FFFFFF" stroke="#2A1008" stroke-width=".35" stroke-opacity=".5">
    <use href="#ring_t5-spark" transform="translate(22 10.5) scale(1.8)"/>
    <use href="#ring_t5-spark" transform="translate(43 12) scale(1.4)"/>
    <use href="#ring_t5-spark" transform="translate(45 26) scale(1.2)"/>
  </g>
  <g fill="#FFF2A0">
    <use href="#ring_t5-spark" transform="translate(19 20) scale(1.2)"/>
    <use href="#ring_t5-spark" transform="translate(51 46) scale(1.1)"/>
  </g>
</svg>
