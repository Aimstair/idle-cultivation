<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="boots_t5-obsidian" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8A8AA0"/>
      <stop offset=".45" stop-color="#2E2E3C"/>
      <stop offset="1" stop-color="#0A0A12"/>
    </linearGradient>
    <linearGradient id="boots_t5-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6C8"/>
      <stop offset=".35" stop-color="#FFD45A"/>
      <stop offset=".75" stop-color="#D69A2A"/>
      <stop offset="1" stop-color="#9A5E14"/>
    </linearGradient>
    <linearGradient id="boots_t5-sole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A5A6E"/>
      <stop offset="1" stop-color="#16161E"/>
    </linearGradient>
    <filter id="boots_t5-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <!-- one boot, toe to the right -->
    <g id="boots_t5-boot">
      <!-- gold roc feather at the heel -->
      <g transform="translate(10.5 43) rotate(-40)">
        <path d="M0-6.5Q4.5-1 0 7Q-4.5-1 0-6.5Z" fill="url(#boots_t5-gold)" stroke="#2A1008" stroke-width="2.4" stroke-linejoin="round"/>
        <path d="M0-4V5M-.2-1.5L-2.4 .5M.2-1.5L2.4 .5" fill="none" stroke="#9A5E14" stroke-width=".9" stroke-linecap="round" opacity=".8"/>
        <path d="M-1.2-3.5Q-2.2-1 -1.8 1" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".9"/>
      </g>
      <path d="M12 13H28V33Q28 39.5 34 41L44 42.5Q51 43.5 50.5 49.5L50.3 53H12Z" fill="url(#boots_t5-obsidian)" stroke="#2A1008" stroke-width="2.3" stroke-linejoin="round"/>
      <!-- molten cracks -->
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 51L19.5 46L18 41.5M34 50.5L36.5 46.5M26 51L27 47.5" stroke="#FFA020" stroke-width="2.6" opacity=".75" filter="url(#boots_t5-glow)"/>
        <path d="M17 51L19.5 46L18 41.5M34 50.5L36.5 46.5M26 51L27 47.5" stroke="#FFF2A0" stroke-width="1.1"/>
      </g>
      <!-- gold toe cap -->
      <path d="M41 42L44 42.5Q51 43.5 50.5 49.5L50.3 53H41Z" fill="url(#boots_t5-gold)" stroke="#2A1008" stroke-width="1.4" stroke-linejoin="round"/>
      <!-- obsidian sole with a lava seam -->
      <path d="M12 53H50.3Q52.3 53 52.3 55Q52.3 57 50.3 57H12Z" fill="url(#boots_t5-sole)" stroke="#2A1008" stroke-width="2" stroke-linejoin="round"/>
      <path d="M14 55H48" fill="none" stroke="#FFA020" stroke-width="2" stroke-linecap="round" opacity=".7" filter="url(#boots_t5-glow)"/>
      <path d="M14 55H48" fill="none" stroke="#FFF2A0" stroke-width="1" stroke-linecap="round"/>
      <!-- gold top band with feather barbs -->
      <path d="M12 13H28V18H12Z" fill="url(#boots_t5-gold)" stroke="#2A1008" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M16 14.2L17.5 17M20 14.2L21.5 17M24 14.2L25.5 17" fill="none" stroke="#9A5E14" stroke-width=".9" stroke-linecap="round" opacity=".8"/>
      <path d="M13.5 14.5H19" fill="none" stroke="#FFFFFF" stroke-width=".9" stroke-linecap="round" opacity=".9"/>
      <path d="M14.3 20.3V38" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity=".55"/>
    </g>
    <path id="boots_t5-spark" d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z"/>
  </defs>

  <ellipse cx="33" cy="57.6" rx="21" ry="1.4" fill="#2A1008" opacity=".25"/>
  <!-- back boot -->
  <g transform="translate(6 -6)">
    <use href="#boots_t5-boot"/>
    <path d="M12 13H28V33Q28 39.5 34 41L44 42.5Q51 43.5 50.5 49.5L50.3 53Q52.3 53 52.3 55Q52.3 57 50.3 57H12Z" fill="#000000" opacity=".28"/>
  </g>
  <!-- front boot -->
  <use href="#boots_t5-boot"/>
  <g fill="#FFFFFF" stroke="#2A1008" stroke-width=".35" stroke-opacity=".5">
    <use href="#boots_t5-spark" transform="translate(40 14) scale(1.8)"/>
    <use href="#boots_t5-spark" transform="translate(56 42) scale(1.3)"/>
  </g>
  <g fill="#FFF2A0">
    <use href="#boots_t5-spark" transform="translate(8 30) scale(1.3)"/>
    <use href="#boots_t5-spark" transform="translate(44 36) scale(1.1)"/>
  </g>
</svg>
