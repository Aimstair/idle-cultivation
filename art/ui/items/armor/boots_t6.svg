<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="boots_t6-void" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6A4EA0"/>
      <stop offset=".45" stop-color="#241450"/>
      <stop offset="1" stop-color="#0A0618"/>
    </linearGradient>
    <linearGradient id="boots_t6-navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5C7CC8"/>
      <stop offset=".45" stop-color="#2A3E8E"/>
      <stop offset="1" stop-color="#0A0E2E"/>
    </linearGradient>
    <linearGradient id="boots_t6-sole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B5FB8"/>
      <stop offset="1" stop-color="#0A0E2E"/>
    </linearGradient>
    <linearGradient id="boots_t6-flame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAD8FF"/>
      <stop offset=".5" stop-color="#9A6AE8"/>
      <stop offset="1" stop-color="#3A1E7A"/>
    </linearGradient>
    <filter id="boots_t6-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <!-- one boot, toe to the right -->
    <g id="boots_t6-boot">
      <!-- void-flame wing at the heel -->
      <g transform="translate(11 43.5) rotate(-30) scale(.85)">
        <path d="M-4.5 1.5C-7 1.5-7-2.5-4-2.2C-3.8-5.2 .8-5.6 1.5-2.8C4.2-4.2 7.2-.4 5 1.5Z" fill="#C8A4FF" opacity=".85" filter="url(#boots_t6-glow)"/>
        <path d="M-4.5 1.5C-7 1.5-7-2.5-4-2.2C-3.8-5.2 .8-5.6 1.5-2.8C4.2-4.2 7.2-.4 5 1.5Z" fill="url(#boots_t6-flame)" stroke="#2A1008" stroke-width="2.4" stroke-linejoin="round"/>
        <path d="M-3.2-1.6Q-1.4-3.4 .6-3" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round"/>
      </g>
      <path d="M12 13H28V33Q28 39.5 34 41L44 42.5Q51 43.5 50.5 49.5L50.3 53H12Z" fill="url(#boots_t6-void)" stroke="#2A1008" stroke-width="2.3" stroke-linejoin="round"/>
      <!-- glowing violet crack across the shaft -->
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 20L18.5 27L23 31L20 37M18.5 27L15.5 25.5M23 31L26 30" stroke="#9A6AE8" stroke-width="3.2" opacity=".8" filter="url(#boots_t6-glow)"/>
        <path d="M22 20L18.5 27L23 31L20 37M18.5 27L15.5 25.5M23 31L26 30" stroke="#C8A4FF" stroke-width="1.5"/>
        <path d="M22 20L18.5 27L23 31" stroke="#FFFFFF" stroke-width=".9" opacity=".9"/>
      </g>
      <!-- star specks -->
      <g fill="#FFFFFF">
        <circle cx="25" cy="24" r=".9"/>
        <circle cx="17" cy="33" r=".8"/>
        <circle cx="38" cy="47" r=".9"/>
        <circle cx="30" cy="45" r=".7" opacity=".8"/>
      </g>
      <!-- navy toe cap -->
      <path d="M41 42L44 42.5Q51 43.5 50.5 49.5L50.3 53H41Z" fill="url(#boots_t6-navy)" stroke="#2A1008" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M12 53H50.3Q52.3 53 52.3 55Q52.3 57 50.3 57H12Z" fill="url(#boots_t6-sole)" stroke="#2A1008" stroke-width="2" stroke-linejoin="round"/>
      <path d="M14 55H48" fill="none" stroke="#C8A4FF" stroke-width="1" stroke-linecap="round" opacity=".85"/>
      <!-- navy top band with starlight -->
      <path d="M12 13H28V18H12Z" fill="url(#boots_t6-navy)" stroke="#2A1008" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M13.5 14.5H19" fill="none" stroke="#FFFFFF" stroke-width=".9" stroke-linecap="round" opacity=".9"/>
      <circle cx="24" cy="15.5" r=".9" fill="#FFFFFF"/>
      <path d="M14.3 20.3V38" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity=".55"/>
    </g>
    <path id="boots_t6-spark" d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z"/>
  </defs>

  <ellipse cx="33" cy="57.6" rx="21" ry="1.4" fill="#2A1008" opacity=".25"/>
  <!-- back boot -->
  <g transform="translate(6 -6)">
    <use href="#boots_t6-boot"/>
    <path d="M12 13H28V33Q28 39.5 34 41L44 42.5Q51 43.5 50.5 49.5L50.3 53Q52.3 53 52.3 55Q52.3 57 50.3 57H12Z" fill="#000000" opacity=".3"/>
  </g>
  <!-- front boot -->
  <use href="#boots_t6-boot"/>
  <g fill="#FFFFFF" stroke="#2A1008" stroke-width=".35" stroke-opacity=".5">
    <use href="#boots_t6-spark" transform="translate(40 14) scale(1.8)"/>
    <use href="#boots_t6-spark" transform="translate(56 42) scale(1.3)"/>
    <use href="#boots_t6-spark" transform="translate(8 30) scale(1.4)"/>
  </g>
  <g fill="#C8A4FF">
    <use href="#boots_t6-spark" transform="translate(44 36) scale(1.2)"/>
    <use href="#boots_t6-spark" transform="translate(20 10) scale(1.1)"/>
  </g>
</svg>
