<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="robe_t5-obsidian" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7A7A92"/>
      <stop offset=".45" stop-color="#2E2E3C"/>
      <stop offset="1" stop-color="#0A0A12"/>
    </linearGradient>
    <linearGradient id="robe_t5-shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset=".6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".3"/>
    </linearGradient>
    <linearGradient id="robe_t5-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6C8"/>
      <stop offset=".4" stop-color="#FFD45A"/>
      <stop offset=".75" stop-color="#D69A2A"/>
      <stop offset="1" stop-color="#9A5E14"/>
    </linearGradient>
    <linearGradient id="robe_t5-goldH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFF6C8"/>
      <stop offset=".5" stop-color="#FFD45A"/>
      <stop offset="1" stop-color="#9A5E14"/>
    </linearGradient>
    <linearGradient id="robe_t5-molten" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8301A"/>
      <stop offset=".5" stop-color="#FFA020"/>
      <stop offset="1" stop-color="#FFF2A0"/>
    </linearGradient>
    <radialGradient id="robe_t5-ember" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#FFF2A0"/>
      <stop offset=".5" stop-color="#FFA020"/>
      <stop offset="1" stop-color="#E8301A"/>
    </radialGradient>
    <filter id="robe_t5-glow" x="-40%" y="-60%" width="180%" height="220%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <path id="robe_t5-spark" d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z"/>
  </defs>

  <!-- contact shadow -->
  <ellipse cx="32" cy="57.2" rx="17" ry="1.6" fill="#2A1008" opacity=".25"/>

  <!-- gold feather sleeves -->
  <g stroke="#2A1008" stroke-width="2.3" stroke-linejoin="round">
    <path d="M25 11L7 14L6 31Q14 31.5 23 29.5Z" fill="url(#robe_t5-gold)"/>
    <path d="M39 11L57 14L58 31Q50 31.5 41 29.5Z" fill="url(#robe_t5-gold)"/>
  </g>
  <path d="M39 11L57 14L58 31Q50 31.5 41 29.5Z" fill="url(#robe_t5-shade)"/>
  <!-- feather barbs -->
  <g fill="none" stroke="#9A5E14" stroke-width="1" stroke-linecap="round" opacity=".75">
    <path d="M15 15.5L13.5 29.5M15 15.5L21 20M15 15.5L9.5 20.5M14.3 22L19.5 25.5M14.3 22L9 26"/>
    <path d="M49 15.5L50.5 29.5M49 15.5L43 20M49 15.5L54.5 20.5M49.7 22L44.5 25.5M49.7 22L55 26"/>
  </g>
  <!-- obsidian cuffs -->
  <g stroke="#2A1008" stroke-width="1.4" stroke-linejoin="round" fill="url(#robe_t5-obsidian)">
    <path d="M7 14L11.5 13.2L10.8 30.6L6 31Z"/>
    <path d="M57 14L52.5 13.2L53.2 30.6L58 31Z"/>
  </g>
  <path d="M23 12.6L11.5 14.9" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".9"/>

  <!-- obsidian body -->
  <path d="M22 10H42L48 56Q32 58.5 16 56Z" fill="url(#robe_t5-obsidian)"/>
  <path d="M22 10H42L48 56Q32 58.5 16 56Z" fill="url(#robe_t5-shade)"/>
  <!-- molten cracks rising from the hem -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 51.5L22.5 47L21.5 43.5M43.5 51.5L41.5 46.5L43 42.5M32.5 51.5L31 48" stroke="#FFA020" stroke-width="2.6" opacity=".7" filter="url(#robe_t5-glow)"/>
    <path d="M20.5 51.5L22.5 47L21.5 43.5M43.5 51.5L41.5 46.5L43 42.5M32.5 51.5L31 48" stroke="#FFF2A0" stroke-width="1.1"/>
  </g>
  <!-- molten hem band -->
  <path d="M16.5 52H47.5L48 56Q32 58.5 16 56Z" fill="#FFA020" opacity=".7" filter="url(#robe_t5-glow)"/>
  <path d="M16.5 52H47.5L48 56Q32 58.5 16 56Z" fill="url(#robe_t5-molten)" stroke="#2A1008" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- inner collar -->
  <path d="M27 10L32 19L37 10Z" fill="#FFF2A0" stroke="#2A1008" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- crossed gold lapels (under, then over) -->
  <path d="M22 10H27L32 19L29.5 23.5Z" fill="url(#robe_t5-gold)" stroke="#2A1008" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M37 10H42L28.5 34H23.5Z" fill="url(#robe_t5-gold)" stroke="#2A1008" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M37.8 12L26.2 31" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".9"/>
  <!-- body outline -->
  <path d="M22 10H42L48 56Q32 58.5 16 56Z" fill="none" stroke="#2A1008" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- obsidian sash with gold thunder thread -->
  <path d="M19 33H45L45.8 39H18.2Z" fill="url(#robe_t5-obsidian)" stroke="#2A1008" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M20.2 34.3h3.2v3.4h-2.2v-2h1.2M24.6 34.3h3.2v3.4h-2.2v-2h1.2M36.2 34.3h3.2v3.4h-2.2v-2h1.2M40.6 34.3h3.2v3.4h-2.2v-2h1.2" fill="none" stroke="#FFD45A" stroke-width="1" stroke-linejoin="miter"/>
  <g fill="url(#robe_t5-obsidian)" stroke="#2A1008" stroke-width="1.5" stroke-linejoin="round">
    <path d="M29.5 39.5L27.5 50.5L30.5 51L32 39.5Z"/>
    <path d="M34.5 39.5L36.5 50.5L33.5 51L32 39.5Z"/>
  </g>
  <path d="M29 41.5L28.2 49M35 41.5L35.8 49" fill="none" stroke="#FFA020" stroke-width=".9" stroke-linecap="round" opacity=".9"/>
  <!-- gold clasp with ember gem -->
  <circle cx="32" cy="36" r="4.8" fill="#FFA020" opacity=".7" filter="url(#robe_t5-glow)"/>
  <circle cx="32" cy="36" r="3.8" fill="url(#robe_t5-goldH)" stroke="#2A1008" stroke-width="1.4"/>
  <circle cx="32" cy="36" r="2" fill="url(#robe_t5-ember)" stroke="#9A3010" stroke-width=".7"/>
  <ellipse cx="30.6" cy="34.4" rx="1" ry=".6" fill="#FFFFFF" opacity=".9"/>

  <!-- sparkles -->
  <g fill="#FFFFFF" stroke="#2A1008" stroke-width=".35" stroke-opacity=".5">
    <use href="#robe_t5-spark" transform="translate(11 8.5) scale(2)"/>
    <use href="#robe_t5-spark" transform="translate(53 37) scale(1.5)"/>
  </g>
  <g fill="#FFF2A0">
    <use href="#robe_t5-spark" transform="translate(15 43) scale(1.3)"/>
    <use href="#robe_t5-spark" transform="translate(49 46) scale(1.1)"/>
  </g>
</svg>
