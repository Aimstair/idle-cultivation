<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="boots_t1-cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9090AE"/>
      <stop offset=".45" stop-color="#4C4C64"/>
      <stop offset="1" stop-color="#26263A"/>
    </linearGradient>
    <linearGradient id="boots_t1-sole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CFD0DA"/>
    </linearGradient>
    <!-- one boot, toe to the right -->
    <g id="boots_t1-boot">
      <path d="M12 13H28V33Q28 39.5 34 41L44 42.5Q51 43.5 50.5 49.5L50.3 53H12Z" fill="url(#boots_t1-cloth)" stroke="#2A1008" stroke-width="2.3" stroke-linejoin="round"/>
      <path d="M12 53H50.3Q52.3 53 52.3 55Q52.3 57 50.3 57H12Z" fill="url(#boots_t1-sole)" stroke="#2A1008" stroke-width="2" stroke-linejoin="round"/>
      <path d="M12 13H28V16.5H12Z" fill="#5E5E7A" stroke="#2A1008" stroke-width="1.3" stroke-linejoin="round"/>
      <path d="M14.3 19V38" fill="none" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" opacity=".45"/>
      <path d="M14 54.4H47" fill="none" stroke="#FFFFFF" stroke-width=".9" stroke-linecap="round" opacity=".9"/>
    </g>
  </defs>

  <ellipse cx="33" cy="57.6" rx="21" ry="1.4" fill="#2A1008" opacity=".25"/>
  <!-- back boot -->
  <g transform="translate(6 -6)">
    <use href="#boots_t1-boot"/>
    <path d="M12 13H28V33Q28 39.5 34 41L44 42.5Q51 43.5 50.5 49.5L50.3 53Q52.3 53 52.3 55Q52.3 57 50.3 57H12Z" fill="#1A0804" opacity=".3"/>
  </g>
  <!-- front boot -->
  <use href="#boots_t1-boot"/>
