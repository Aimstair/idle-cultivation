<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="robe_t4-bone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF0"/>
      <stop offset=".6" stop-color="#EDE2C4"/>
      <stop offset="1" stop-color="#C8B890"/>
    </linearGradient>
    <linearGradient id="robe_t4-shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8C6622" stop-opacity="0"/>
      <stop offset=".6" stop-color="#8C6622" stop-opacity="0"/>
      <stop offset="1" stop-color="#8C6622" stop-opacity=".26"/>
    </linearGradient>
    <linearGradient id="robe_t4-sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF8DC"/>
      <stop offset=".45" stop-color="#E0B058"/>
      <stop offset="1" stop-color="#8C6622"/>
    </linearGradient>
    <linearGradient id="robe_t4-sash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D8A050"/>
      <stop offset=".5" stop-color="#A86A22"/>
      <stop offset="1" stop-color="#5A3410"/>
    </linearGradient>
    <radialGradient id="robe_t4-spirit" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".45" stop-color="#8FF0F0"/>
      <stop offset="1" stop-color="#2A98B0"/>
    </radialGradient>
    <filter id="robe_t4-glow" x="-40%" y="-60%" width="180%" height="220%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <!-- wyrm scale glyph -->
    <g id="robe_t4-scale">
      <path d="M-2.7-1.2Q0-3.2 2.7-1.2Q2.4 2 0 3.2Q-2.4 2-2.7-1.2Z" fill="url(#robe_t4-sand)" stroke="#8C6622" stroke-width=".9" stroke-linejoin="round"/>
      <path d="M-1.6-1.1Q-.4-2 .8-1.6" fill="none" stroke="#FFFFFF" stroke-width=".9" stroke-linecap="round"/>
    </g>
    <path id="robe_t4-spark" d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z"/>
  </defs>

  <!-- contact shadow -->
  <ellipse cx="32" cy="57.2" rx="17" ry="1.6" fill="#2A1008" opacity=".25"/>

  <!-- sand-gold sleeves -->
  <g stroke="#2A1008" stroke-width="2.3" stroke-linejoin="round">
    <path d="M25 11L7 14L6 31Q14 31.5 23 29.5Z" fill="url(#robe_t4-sand)"/>
    <path d="M39 11L57 14L58 31Q50 31.5 41 29.5Z" fill="url(#robe_t4-sand)"/>
  </g>
  <path d="M39 11L57 14L58 31Q50 31.5 41 29.5Z" fill="url(#robe_t4-shade)"/>
  <!-- bone cuffs -->
  <g stroke="#2A1008" stroke-width="1.4" stroke-linejoin="round" fill="url(#robe_t4-bone)">
    <path d="M7 14L11.5 13.2L10.8 30.6L6 31Z"/>
    <path d="M57 14L52.5 13.2L53.2 30.6L58 31Z"/>
  </g>
  <path d="M23 12.6L11.5 14.9" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".9"/>
  <!-- sleeve scales -->
  <use href="#robe_t4-scale" transform="translate(14.5 20)"/>
  <use href="#robe_t4-scale" transform="translate(20 20)"/>
  <use href="#robe_t4-scale" transform="translate(17.2 25)"/>
  <use href="#robe_t4-scale" transform="translate(49.5 20)"/>
  <use href="#robe_t4-scale" transform="translate(44 20)"/>
  <use href="#robe_t4-scale" transform="translate(46.8 25)"/>

  <!-- bone body -->
  <path d="M22 10H42L48 56Q32 58.5 16 56Z" fill="url(#robe_t4-bone)"/>
  <path d="M22 10H42L48 56Q32 58.5 16 56Z" fill="url(#robe_t4-shade)"/>
  <!-- sand hem band -->
  <path d="M16.5 52H47.5L48 56Q32 58.5 16 56Z" fill="url(#robe_t4-sand)" stroke="#2A1008" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- body scales above the hem -->
  <use href="#robe_t4-scale" transform="translate(22.5 47.5)"/>
  <use href="#robe_t4-scale" transform="translate(28 47.5)"/>
  <use href="#robe_t4-scale" transform="translate(36 47.5)"/>
  <use href="#robe_t4-scale" transform="translate(41.5 47.5)"/>
  <!-- inner collar -->
  <path d="M27 10L32 19L37 10Z" fill="#FFFFFF" stroke="#2A1008" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- crossed sand lapels (under, then over) -->
  <path d="M22 10H27L32 19L29.5 23.5Z" fill="url(#robe_t4-sand)" stroke="#2A1008" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M37 10H42L28.5 34H23.5Z" fill="url(#robe_t4-sand)" stroke="#2A1008" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M37.8 12L26.2 31" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".85"/>
  <!-- body outline -->
  <path d="M22 10H42L48 56Q32 58.5 16 56Z" fill="none" stroke="#2A1008" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- sash with spirit thread -->
  <path d="M19 33H45L45.8 39H18.2Z" fill="url(#robe_t4-sash)" stroke="#2A1008" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M20.5 34.4H43.5M20.3 37.6H43.7" fill="none" stroke="#8FF0F0" stroke-width=".9" stroke-linecap="round" opacity=".85"/>
  <g fill="url(#robe_t4-sash)" stroke="#2A1008" stroke-width="1.5" stroke-linejoin="round">
    <path d="M29.5 39.5L27.5 50.5L30.5 51L32 39.5Z"/>
    <path d="M34.5 39.5L36.5 50.5L33.5 51L32 39.5Z"/>
  </g>
  <path d="M29 41.5L28.2 49M35 41.5L35.8 49" fill="none" stroke="#8FF0F0" stroke-width=".9" stroke-linecap="round" opacity=".8"/>
  <!-- bone clasp with spirit gem -->
  <circle cx="32" cy="36" r="4.6" fill="#8FF0F0" opacity=".7" filter="url(#robe_t4-glow)"/>
  <circle cx="32" cy="36" r="3.8" fill="url(#robe_t4-bone)" stroke="#2A1008" stroke-width="1.4"/>
  <circle cx="32" cy="36" r="2" fill="url(#robe_t4-spirit)" stroke="#2A98B0" stroke-width=".7"/>
  <ellipse cx="30.6" cy="34.4" rx="1" ry=".6" fill="#FFFFFF" opacity=".9"/>

  <!-- ghost mist drifting around the hem and sleeves -->
  <g fill="#C8FFFF" filter="url(#robe_t4-glow)">
    <ellipse cx="33" cy="55.5" rx="15" ry="2.2" opacity=".55"/>
    <ellipse cx="9" cy="30" rx="5" ry="1.8" opacity=".55"/>
    <ellipse cx="55" cy="30" rx="5" ry="1.8" opacity=".55"/>
  </g>
  <path d="M8 27Q13 24.5 11 21.5" fill="none" stroke="#E8FFFF" stroke-width="1.2" stroke-linecap="round" opacity=".85"/>
  <path d="M56 27Q51 24.5 53 21.5" fill="none" stroke="#E8FFFF" stroke-width="1.2" stroke-linecap="round" opacity=".85"/>

  <!-- sparkles -->
  <g fill="#E8FFFF" stroke="#2A1008" stroke-width=".35" stroke-opacity=".5">
    <use href="#robe_t4-spark" transform="translate(11 8.5) scale(2)"/>
    <use href="#robe_t4-spark" transform="translate(53 37) scale(1.5)"/>
    <use href="#robe_t4-spark" transform="translate(15 42) scale(1.3)"/>
  </g>
</svg>
