<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="ring_t2-silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".4" stop-color="#CFD6E4"/>
      <stop offset=".8" stop-color="#8A92A6"/>
      <stop offset="1" stop-color="#5E6678"/>
    </linearGradient>
    <linearGradient id="ring_t2-silverHi" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".5"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#3A4050" stop-opacity=".3"/>
    </linearGradient>
    <radialGradient id="ring_t2-jade" cx=".35" cy=".3" r=".85">
      <stop offset="0" stop-color="#E0FFF0"/>
      <stop offset=".5" stop-color="#3FC79A"/>
      <stop offset="1" stop-color="#0E6A50"/>
    </radialGradient>
  </defs>

  <!-- contact shadow -->
  <ellipse cx="32" cy="53.4" rx="18" ry="1.8" fill="#2A1008" opacity=".25"/>

  <!-- band seen at 3/4 -->
  <path fill-rule="evenodd" d="M11 37A21 14 0 1 0 53 37A21 14 0 1 0 11 37ZM17 35.5A15 9 0 1 0 47 35.5A15 9 0 1 0 17 35.5Z" fill="url(#ring_t2-silver)" stroke="#2A1008" stroke-width="2.3" stroke-linejoin="round"/>
  <path fill-rule="evenodd" d="M11 37A21 14 0 1 0 53 37A21 14 0 1 0 11 37ZM17 35.5A15 9 0 1 0 47 35.5A15 9 0 1 0 17 35.5Z" fill="url(#ring_t2-silverHi)"/>
  <!-- inner wall of the far side -->
  <path d="M17 35.5A15 9 0 0 1 47 35.5A15 6.8 0 0 0 17 35.5Z" fill="#5E6678" stroke="#2A1008" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- engraved line around the band -->
  <path d="M14.5 42Q32 53 49.5 42" fill="none" stroke="#7E8698" stroke-width="1" stroke-linecap="round" opacity=".8"/>
  <!-- highlights -->
  <path d="M14 32.5Q18.5 26.5 26.5 24.6" fill="none" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" opacity=".95"/>
  <path d="M23 48Q32 50.5 41 48" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".4"/>

  <!-- bezel and jade stone with carved cloud -->
  <ellipse cx="32" cy="20.5" rx="7.6" ry="8" fill="url(#ring_t2-silver)" stroke="#2A1008" stroke-width="2.2"/>
  <ellipse cx="32" cy="20.5" rx="5.6" ry="6.1" fill="url(#ring_t2-jade)" stroke="#2A1008" stroke-width="1.3"/>
  <g transform="translate(32 21.6) scale(.5)">
    <path d="M-4.5 1.5C-7 1.5-7-2.5-4-2.2C-3.8-5.2 .8-5.6 1.5-2.8C4.2-4.2 7.2-.4 5 1.5Z" fill="#C8FFE6" fill-opacity=".7" stroke="#0E6A50" stroke-width="1.6" stroke-linejoin="round"/>
  </g>
  <ellipse cx="30" cy="17.2" rx="1.6" ry="1" fill="#FFFFFF" opacity=".95"/>
  <path d="M26.3 17.5Q27.8 14 31.2 13" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".8"/>
</svg>
