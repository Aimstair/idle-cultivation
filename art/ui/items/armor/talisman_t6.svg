<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="talisman_t6-paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A3E90"/>
      <stop offset=".5" stop-color="#1E1040"/>
      <stop offset="1" stop-color="#0A0618"/>
    </linearGradient>
    <linearGradient id="talisman_t6-shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".25"/>
      <stop offset=".3" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".75" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".4"/>
    </linearGradient>
    <linearGradient id="talisman_t6-navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5C7CC8"/>
      <stop offset=".45" stop-color="#2A3E8E"/>
      <stop offset="1" stop-color="#0A0E2E"/>
    </linearGradient>
    <linearGradient id="talisman_t6-violet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAD8FF"/>
      <stop offset=".5" stop-color="#9A6AE8"/>
      <stop offset="1" stop-color="#3A1E7A"/>
    </linearGradient>
    <radialGradient id="talisman_t6-gem" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".45" stop-color="#C8A4FF"/>
      <stop offset="1" stop-color="#5A2EB0"/>
    </radialGradient>
    <filter id="talisman_t6-glow" x="-30%" y="-20%" width="160%" height="140%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <path id="talisman_t6-spark" d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z"/>
  </defs>

  <!-- contact shadow -->
  <ellipse cx="32" cy="57.4" rx="8" ry="1.3" fill="#2A1008" opacity=".25"/>

  <!-- void strip with glowing violet edge -->
  <path d="M19 11.5L32 5.5L45 11.5V45H19Z" fill="url(#talisman_t6-paper)" stroke="#2A1008" stroke-width="2.3" stroke-linejoin="round"/>
  <path d="M19 11.5L32 5.5L45 11.5V45H19Z" fill="url(#talisman_t6-shade)"/>
  <!-- star specks -->
  <g fill="#FFFFFF">
    <circle cx="23.5" cy="20" r=".9"/>
    <circle cx="40.5" cy="24" r=".8"/>
    <circle cx="24" cy="36" r=".7" opacity=".8"/>
    <circle cx="39" cy="15" r=".7" opacity=".8"/>
  </g>
  <path d="M21.2 12.5L32 7.6L42.8 12.5V42.8H21.2Z" fill="none" stroke="#9A6AE8" stroke-width="2.6" stroke-linejoin="round" opacity=".7" filter="url(#talisman_t6-glow)"/>
  <path d="M21.2 12.5L32 7.6L42.8 12.5V42.8H21.2Z" fill="none" stroke="url(#talisman_t6-violet)" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M22.6 13L31.6 9" fill="none" stroke="#FFFFFF" stroke-width=".9" stroke-linecap="round" opacity=".9"/>

  <!-- starlight brush strokes -->
  <g fill="none" stroke="#9A6AE8" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" opacity=".85" filter="url(#talisman_t6-glow)">
    <path d="M26 14.5Q32 9 37.5 14.5Q39.5 19.5 33 19.5Q29 19.5 30.5 16.5"/>
    <path d="M33.5 21.5Q28.5 28 34 33.5Q36 36 32 40.5"/>
    <path d="M24.5 30.5L28.5 33.5"/>
    <path d="M25 40Q27.5 43 31 41"/>
  </g>
  <g fill="none" stroke="#E0CCFF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M26 14.5Q32 9 37.5 14.5Q39.5 19.5 33 19.5Q29 19.5 30.5 16.5"/>
    <path d="M33.5 21.5Q28.5 28 34 33.5Q36 36 32 40.5"/>
    <path d="M24.5 30.5L28.5 33.5"/>
    <path d="M25 40Q27.5 43 31 41"/>
  </g>
  <circle cx="26.2" cy="24.2" r="1.5" fill="#E0CCFF"/>
  <path d="M27.4 14.2Q32 10.6 35.6 13.4" fill="none" stroke="#FFFFFF" stroke-width=".9" stroke-linecap="round" opacity=".95"/>

  <!-- navy seal with a violet crack -->
  <rect x="36" y="35.2" width="7" height="7" rx=".9" fill="url(#talisman_t6-navy)" stroke="#2A1008" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M40.6 36.3L38.2 38.8L40.4 39.6L38.6 41.3" fill="none" stroke="#C8A4FF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- cord, void-crystal bead and tassel -->
  <path d="M32 45V47.5" fill="none" stroke="#2A1008" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M32 45V47.5" fill="none" stroke="#9A6AE8" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M29.6 50L28.6 57H35.4L34.4 50Z" fill="url(#talisman_t6-navy)" stroke="#2A1008" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M31.2 51.5V55.5M33 51.5V55.5" fill="none" stroke="#C8A4FF" stroke-width=".8" stroke-linecap="round" opacity=".8"/>
  <circle cx="32" cy="48.6" r="3" fill="#C8A4FF" opacity=".7" filter="url(#talisman_t6-glow)"/>
  <circle cx="32" cy="48.6" r="2.4" fill="url(#talisman_t6-gem)" stroke="#2A1008" stroke-width="1.2"/>
  <ellipse cx="31.2" cy="47.8" rx=".8" ry=".5" fill="#FFFFFF" opacity=".9"/>

  <!-- starlight -->
  <g fill="#FFFFFF" stroke="#2A1008" stroke-width=".35" stroke-opacity=".5">
    <use href="#talisman_t6-spark" transform="translate(14 14) scale(1.9)"/>
    <use href="#talisman_t6-spark" transform="translate(50 30) scale(1.5)"/>
    <use href="#talisman_t6-spark" transform="translate(16 44) scale(1.3)"/>
  </g>
  <g fill="#C8A4FF">
    <use href="#talisman_t6-spark" transform="translate(49 48) scale(1.2)"/>
    <use href="#talisman_t6-spark" transform="translate(13 30) scale(1.1)"/>
  </g>
</svg>
