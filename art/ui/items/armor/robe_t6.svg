<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="robe_t6-void" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5A3E90"/>
      <stop offset=".45" stop-color="#1E1040"/>
      <stop offset="1" stop-color="#0A0618"/>
    </linearGradient>
    <linearGradient id="robe_t6-shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset=".6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".3"/>
    </linearGradient>
    <linearGradient id="robe_t6-navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5C7CC8"/>
      <stop offset=".45" stop-color="#2A3E8E"/>
      <stop offset="1" stop-color="#0A0E2E"/>
    </linearGradient>
    <linearGradient id="robe_t6-navyH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5C7CC8"/>
      <stop offset=".5" stop-color="#2A3E8E"/>
      <stop offset="1" stop-color="#0A0E2E"/>
    </linearGradient>
    <radialGradient id="robe_t6-gem" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".45" stop-color="#C8A4FF"/>
      <stop offset="1" stop-color="#5A2EB0"/>
    </radialGradient>
    <filter id="robe_t6-glow" x="-40%" y="-60%" width="180%" height="220%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <path id="robe_t6-spark" d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z"/>
  </defs>

  <!-- contact shadow -->
  <ellipse cx="32" cy="57.2" rx="17" ry="1.6" fill="#2A1008" opacity=".25"/>

  <!-- deep navy sleeves -->
  <g stroke="#2A1008" stroke-width="2.3" stroke-linejoin="round">
    <path d="M25 11L7 14L6 31Q14 31.5 23 29.5Z" fill="url(#robe_t6-navy)"/>
    <path d="M39 11L57 14L58 31Q50 31.5 41 29.5Z" fill="url(#robe_t6-navy)"/>
  </g>
  <path d="M39 11L57 14L58 31Q50 31.5 41 29.5Z" fill="url(#robe_t6-shade)"/>
  <!-- void cuffs -->
  <g stroke="#2A1008" stroke-width="1.4" stroke-linejoin="round" fill="url(#robe_t6-void)">
    <path d="M7 14L11.5 13.2L10.8 30.6L6 31Z"/>
    <path d="M57 14L52.5 13.2L53.2 30.6L58 31Z"/>
  </g>
  <path d="M23 12.6L11.5 14.9" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".9"/>
  <!-- sleeve star specks -->
  <g fill="#FFFFFF">
    <circle cx="16" cy="19" r=".9"/>
    <circle cx="20" cy="25.5" r=".8"/>
    <circle cx="13" cy="26" r=".7" opacity=".8"/>
    <circle cx="48" cy="19" r=".9"/>
    <circle cx="44" cy="25.5" r=".8"/>
    <circle cx="51" cy="26" r=".7" opacity=".8"/>
  </g>

  <!-- black-violet body -->
  <path d="M22 10H42L48 56Q32 58.5 16 56Z" fill="url(#robe_t6-void)"/>
  <path d="M22 10H42L48 56Q32 58.5 16 56Z" fill="url(#robe_t6-shade)"/>
  <!-- glowing violet cracks -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 44L22 47.5L21 51.5M44.5 41L42.5 45.5L45 49.5L44.5 52M38 24L40 28.5L39 32" stroke="#9A6AE8" stroke-width="2.8" opacity=".75" filter="url(#robe_t6-glow)"/>
    <path d="M19 44L22 47.5L21 51.5M44.5 41L42.5 45.5L45 49.5L44.5 52M38 24L40 28.5L39 32" stroke="#E0CCFF" stroke-width="1.1"/>
  </g>
  <!-- body star specks -->
  <g fill="#FFFFFF">
    <circle cx="26" cy="43" r=".9"/>
    <circle cx="36" cy="46" r=".8"/>
    <circle cx="41" cy="37" r=".7" opacity=".8"/>
  </g>
  <!-- navy hem band -->
  <path d="M16.5 52H47.5L48 56Q32 58.5 16 56Z" fill="url(#robe_t6-navy)" stroke="#2A1008" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M18 54.2Q32 56.5 46 54.2" fill="none" stroke="#C8A4FF" stroke-width=".9" stroke-linecap="round" opacity=".8"/>
  <!-- inner collar -->
  <path d="M27 10L32 19L37 10Z" fill="#EAD8FF" stroke="#2A1008" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- crossed navy lapels with violet edge (under, then over) -->
  <path d="M22 10H27L32 19L29.5 23.5Z" fill="url(#robe_t6-navy)" stroke="#2A1008" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M37 10H42L28.5 34H23.5Z" fill="url(#robe_t6-navy)" stroke="#2A1008" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M40.8 11.8L27.6 32.8" fill="none" stroke="#C8A4FF" stroke-width="1" stroke-linecap="round" opacity=".9"/>
  <path d="M37.8 12L26.2 31" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".85"/>
  <!-- body outline -->
  <path d="M22 10H42L48 56Q32 58.5 16 56Z" fill="none" stroke="#2A1008" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- void sash with violet thread -->
  <path d="M19 33H45L45.8 39H18.2Z" fill="url(#robe_t6-void)" stroke="#2A1008" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M20.5 34.4H43.5M20.3 37.6H43.7" fill="none" stroke="#C8A4FF" stroke-width=".9" stroke-linecap="round" opacity=".9"/>
  <g fill="url(#robe_t6-void)" stroke="#2A1008" stroke-width="1.5" stroke-linejoin="round">
    <path d="M29.5 39.5L27.5 50.5L30.5 51L32 39.5Z"/>
    <path d="M34.5 39.5L36.5 50.5L33.5 51L32 39.5Z"/>
  </g>
  <path d="M29 41.5L28.2 49M35 41.5L35.8 49" fill="none" stroke="#C8A4FF" stroke-width=".9" stroke-linecap="round" opacity=".9"/>
  <!-- navy clasp with void gem -->
  <circle cx="32" cy="36" r="5" fill="#C8A4FF" opacity=".75" filter="url(#robe_t6-glow)"/>
  <circle cx="32" cy="36" r="3.8" fill="url(#robe_t6-navyH)" stroke="#2A1008" stroke-width="1.4"/>
  <circle cx="32" cy="36" r="2" fill="url(#robe_t6-gem)" stroke="#3A1E7A" stroke-width=".7"/>
  <ellipse cx="30.6" cy="34.4" rx="1" ry=".6" fill="#FFFFFF" opacity=".9"/>

  <!-- starlight -->
  <g fill="#FFFFFF" stroke="#2A1008" stroke-width=".35" stroke-opacity=".5">
    <use href="#robe_t6-spark" transform="translate(11 8.5) scale(2)"/>
    <use href="#robe_t6-spark" transform="translate(53 37) scale(1.5)"/>
    <use href="#robe_t6-spark" transform="translate(30 45.5) scale(1.6)"/>
  </g>
  <g fill="#C8A4FF">
    <use href="#robe_t6-spark" transform="translate(15 42) scale(1.3)"/>
    <use href="#robe_t6-spark" transform="translate(50 20) scale(1.2)"/>
  </g>
</svg>
