<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="talisman_t2-paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFAD0"/>
      <stop offset=".5" stop-color="#F8DA78"/>
      <stop offset="1" stop-color="#DDAE34"/>
    </linearGradient>
    <linearGradient id="talisman_t2-shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".35"/>
      <stop offset=".3" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".75" stop-color="#8A5A10" stop-opacity="0"/>
      <stop offset="1" stop-color="#8A5A10" stop-opacity=".28"/>
    </linearGradient>
    <linearGradient id="talisman_t2-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6C8"/>
      <stop offset=".4" stop-color="#FFD45A"/>
      <stop offset="1" stop-color="#9A5E14"/>
    </linearGradient>
    <linearGradient id="talisman_t2-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF6A44"/>
      <stop offset=".5" stop-color="#C21E10"/>
      <stop offset="1" stop-color="#5A0A04"/>
    </linearGradient>
    <radialGradient id="talisman_t2-jade" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#C8FFE6"/>
      <stop offset=".5" stop-color="#3FC79A"/>
      <stop offset="1" stop-color="#0E6A50"/>
    </radialGradient>
  </defs>

  <!-- contact shadow -->
  <ellipse cx="32" cy="57.4" rx="8" ry="1.3" fill="#2A1008" opacity=".25"/>

