<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="pendant_t4-bone" gradientUnits="userSpaceOnUse" cx="26" cy="27" r="22">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".4" stop-color="#F6EEDA"/>
      <stop offset=".8" stop-color="#D8CAA0"/>
      <stop offset="1" stop-color="#A89870"/>
    </radialGradient>
    <linearGradient id="pendant_t4-sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF8DC"/>
      <stop offset=".45" stop-color="#E0B058"/>
      <stop offset="1" stop-color="#8C6622"/>
    </linearGradient>
    <linearGradient id="pendant_t4-spiritV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C8FFFF"/>
      <stop offset=".5" stop-color="#5ACCD8"/>
      <stop offset="1" stop-color="#1E7A8A"/>
    </linearGradient>
    <radialGradient id="pendant_t4-spirit" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".45" stop-color="#8FF0F0"/>
      <stop offset="1" stop-color="#2A98B0"/>
    </radialGradient>
    <filter id="pendant_t4-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <path id="pendant_t4-spark" d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z"/>
  </defs>

  <!-- contact shadow -->
  <ellipse cx="32" cy="57.4" rx="8" ry="1.3" fill="#2A1008" opacity=".25"/>

  <!-- sand-gold silk cord -->
  <path d="M16 6L32 19.5L48 6" fill="none" stroke="#2A1008" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M16 6L32 19.5L48 6" fill="none" stroke="url(#pendant_t4-sand)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M17.5 7.3L23 12" fill="none" stroke="#FFFFFF" stroke-width=".8" stroke-linecap="round" opacity=".8"/>

  <!-- spirit tassel (behind the disc) -->
  <path d="M32 46V49" fill="none" stroke="#2A1008" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M29.6 50.5L28.6 57H35.4L34.4 50.5Z" fill="url(#pendant_t4-spiritV)" stroke="#2A1008" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M31.2 52V55.5M33 52V55.5" fill="none" stroke="#1E7A8A" stroke-width=".8" stroke-linecap="round" opacity=".8"/>
  <circle cx="32" cy="49.4" r="1.8" fill="url(#pendant_t4-sand)" stroke="#2A1008" stroke-width="1.1"/>

  <!-- spirit glow -->
  <circle cx="32" cy="34.5" r="12" fill="#8FF0F0" opacity=".5" filter="url(#pendant_t4-glow)"/>
  <!-- carved bone disc -->
  <circle cx="32" cy="34.5" r="14" fill="url(#pendant_t4-bone)" stroke="#2A1008" stroke-width="2.4"/>
  <!-- coiled wyrm carving: body spiral and scales -->
  <path d="M32 24.5A10 10 0 1 1 22 34.5A7.5 7.5 0 1 1 36.5 30" fill="none" stroke="#A89870" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M32 24.5A10 10 0 1 1 22 34.5A7.5 7.5 0 1 1 36.5 30" fill="none" stroke="url(#pendant_t4-sand)" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M38.5 29.5Q40.5 28 41.6 30.2" fill="none" stroke="#8C6622" stroke-width="1" stroke-linecap="round" opacity=".8"/>
  <circle cx="38.6" cy="30.8" r=".8" fill="#2A98B0"/>
  <!-- spirit gem heart -->
  <circle cx="32" cy="34.5" r="5" fill="#8FF0F0" opacity=".8" filter="url(#pendant_t4-glow)"/>
  <circle cx="32" cy="34.5" r="4.2" fill="url(#pendant_t4-spirit)" stroke="#2A1008" stroke-width="1.3"/>
  <ellipse cx="30.6" cy="32.8" rx="1.4" ry=".9" fill="#FFFFFF" opacity=".95"/>
  <!-- highlight -->
  <path d="M21.5 29.5Q24 23.5 30.5 21.8" fill="none" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" opacity=".95"/>
  <!-- bone knot -->
  <circle cx="32" cy="20" r="2.4" fill="url(#pendant_t4-bone)" stroke="#2A1008" stroke-width="1.3"/>

  <!-- ghost mist and sparkles -->
  <path d="M15 42Q20 39.5 18 36" fill="none" stroke="#E8FFFF" stroke-width="1.2" stroke-linecap="round" opacity=".8"/>
  <path d="M49 42Q44 39.5 46 36" fill="none" stroke="#E8FFFF" stroke-width="1.2" stroke-linecap="round" opacity=".8"/>
  <g fill="#E8FFFF" stroke="#2A1008" stroke-width=".35" stroke-opacity=".5">
    <use href="#pendant_t4-spark" transform="translate(13 24) scale(1.8)"/>
    <use href="#pendant_t4-spark" transform="translate(51 40) scale(1.4)"/>
    <use href="#pendant_t4-spark" transform="translate(47 16) scale(1.2)"/>
  </g>
</svg>
