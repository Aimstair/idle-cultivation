<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="talisman_t3-paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A880F0"/>
      <stop offset=".5" stop-color="#5E3AA8"/>
      <stop offset="1" stop-color="#301668"/>
    </linearGradient>
    <linearGradient id="talisman_t3-shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".3"/>
      <stop offset=".3" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".75" stop-color="#1A0840" stop-opacity="0"/>
      <stop offset="1" stop-color="#1A0840" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="talisman_t3-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6C8"/>
      <stop offset=".4" stop-color="#FFD45A"/>
      <stop offset="1" stop-color="#9A5E14"/>
    </linearGradient>
    <linearGradient id="talisman_t3-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF6A44"/>
      <stop offset=".5" stop-color="#C21E10"/>
      <stop offset="1" stop-color="#5A0A04"/>
    </linearGradient>
    <filter id="talisman_t3-glow" x="-30%" y="-20%" width="160%" height="140%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <path id="talisman_t3-spark" d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z"/>
  </defs>

  <!-- contact shadow -->
  <ellipse cx="32" cy="57.4" rx="8" ry="1.3" fill="#2A1008" opacity=".25"/>

  <!-- purple paper strip with gold edge -->
  <path d="M19 11.5L32 5.5L45 11.5V45H19Z" fill="url(#talisman_t3-paper)" stroke="#2A1008" stroke-width="2.3" stroke-linejoin="round"/>
  <path d="M19 11.5L32 5.5L45 11.5V45H19Z" fill="url(#talisman_t3-shade)"/>
  <path d="M21.2 12.5L32 7.6L42.8 12.5V42.8H21.2Z" fill="none" stroke="url(#talisman_t3-gold)" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M21.2 12.5L32 7.6L42.8 12.5V42.8H21.2Z" fill="none" stroke="#9A5E14" stroke-width=".5" stroke-linejoin="round" opacity=".6"/>
  <path d="M22.6 13L31.6 9" fill="none" stroke="#FFFFFF" stroke-width=".9" stroke-linecap="round" opacity=".9"/>

  <!-- glowing gold brush strokes -->
  <g fill="none" stroke="#FFE7A0" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" opacity=".7" filter="url(#talisman_t3-glow)">
    <path d="M26 14.5Q32 9 37.5 14.5Q39.5 19.5 33 19.5Q29 19.5 30.5 16.5"/>
    <path d="M33.5 21.5Q28.5 28 34 33.5Q36 36 32 40.5"/>
    <path d="M24.5 30.5L28.5 33.5"/>
    <path d="M25 40Q27.5 43 31 41"/>
  </g>
  <g fill="none" stroke="url(#talisman_t3-gold)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M26 14.5Q32 9 37.5 14.5Q39.5 19.5 33 19.5Q29 19.5 30.5 16.5"/>
    <path d="M33.5 21.5Q28.5 28 34 33.5Q36 36 32 40.5"/>
    <path d="M24.5 30.5L28.5 33.5"/>
    <path d="M25 40Q27.5 43 31 41"/>
  </g>
  <circle cx="26.2" cy="24.2" r="1.5" fill="#FFD45A"/>
  <path d="M27.4 14.2Q32 10.6 35.6 13.4" fill="none" stroke="#FFFFFF" stroke-width=".9" stroke-linecap="round" opacity=".9"/>

  <!-- red thunder seal -->
  <rect x="36" y="35.2" width="7" height="7" rx=".9" fill="url(#talisman_t3-red)" stroke="#2A1008" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M40.5 36.3L38 39.1H40.2L38.8 41.3" fill="none" stroke="#FFD45A" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- cord, gold bead and tassel -->
  <path d="M32 45V47.5" fill="none" stroke="#2A1008" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M32 45V47.5" fill="none" stroke="#C21E10" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M29.6 50L28.6 57H35.4L34.4 50Z" fill="url(#talisman_t3-red)" stroke="#2A1008" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M31.2 51.5V55.5M33 51.5V55.5" fill="none" stroke="#5A0A04" stroke-width=".8" stroke-linecap="round" opacity=".8"/>
  <circle cx="32" cy="48.6" r="2.4" fill="url(#talisman_t3-gold)" stroke="#2A1008" stroke-width="1.2"/>
  <ellipse cx="31.2" cy="47.8" rx=".8" ry=".5" fill="#FFFFFF" opacity=".9"/>

  <!-- sparkles -->
  <g fill="#FFFFFF" stroke="#2A1008" stroke-width=".35" stroke-opacity=".5">
    <use href="#talisman_t3-spark" transform="translate(14 14) scale(1.9)"/>
    <use href="#talisman_t3-spark" transform="translate(50 30) scale(1.5)"/>
    <use href="#talisman_t3-spark" transform="translate(16 44) scale(1.2)"/>
  </g>
</svg>
