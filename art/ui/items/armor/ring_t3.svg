<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="ring_t3-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6C8"/>
      <stop offset=".35" stop-color="#FFD45A"/>
      <stop offset=".75" stop-color="#D69A2A"/>
      <stop offset="1" stop-color="#9A5E14"/>
    </linearGradient>
    <linearGradient id="ring_t3-goldHi" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".45"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#5A3008" stop-opacity=".3"/>
    </linearGradient>
    <linearGradient id="ring_t3-crystal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAD8FF"/>
      <stop offset=".45" stop-color="#9A6AE8"/>
      <stop offset="1" stop-color="#3A1E7A"/>
    </linearGradient>
    <filter id="ring_t3-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <path id="ring_t3-spark" d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z"/>
  </defs>

  <!-- contact shadow -->
  <ellipse cx="32" cy="53.4" rx="18" ry="1.8" fill="#2A1008" opacity=".25"/>

  <!-- band seen at 3/4 -->
  <path fill-rule="evenodd" d="M11 37A21 14 0 1 0 53 37A21 14 0 1 0 11 37ZM17 35.5A15 9 0 1 0 47 35.5A15 9 0 1 0 17 35.5Z" fill="url(#ring_t3-gold)" stroke="#2A1008" stroke-width="2.3" stroke-linejoin="round"/>
  <path fill-rule="evenodd" d="M11 37A21 14 0 1 0 53 37A21 14 0 1 0 11 37ZM17 35.5A15 9 0 1 0 47 35.5A15 9 0 1 0 17 35.5Z" fill="url(#ring_t3-goldHi)"/>
  <!-- inner wall of the far side -->
  <path d="M17 35.5A15 9 0 0 1 47 35.5A15 6.8 0 0 0 17 35.5Z" fill="#9A5E14" stroke="#2A1008" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- engraved double line around the band -->
  <path d="M14.5 42Q32 53 49.5 42M13 39.5Q32 51.5 51 39.5" fill="none" stroke="#9A5E14" stroke-width="1" stroke-linecap="round" opacity=".7"/>
  <!-- highlights -->
  <path d="M14 32.5Q18.5 26.5 26.5 24.6" fill="none" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" opacity=".95"/>
  <path d="M23 48Q32 50.5 41 48" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".4"/>

  <!-- violet thunder crystal in a gold bezel -->
  <ellipse cx="32" cy="20.5" rx="8" ry="8.4" fill="#B48CFF" opacity=".75" filter="url(#ring_t3-glow)"/>
  <ellipse cx="32" cy="20.5" rx="7.8" ry="8.2" fill="url(#ring_t3-gold)" stroke="#2A1008" stroke-width="2.2"/>
  <path d="M32 13L38 17V24L32 28L26 24V17Z" fill="url(#ring_t3-crystal)" stroke="#2A1008" stroke-width="1.3" stroke-linejoin="round"/>
  <path d="M32 13L32 28M26 17L38 24M38 17L26 24" fill="none" stroke="#EAD8FF" stroke-width=".8" stroke-linecap="round" opacity=".7"/>
  <!-- lightning glint on the crystal -->
  <path d="M33.2 15.5L30.3 20.2H32.6L30.8 25" fill="none" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" opacity=".95"/>

  <!-- tiny sparks -->
  <g fill="#FFFFFF" stroke="#2A1008" stroke-width=".35" stroke-opacity=".5">
    <use href="#ring_t3-spark" transform="translate(22 10.5) scale(1.8)"/>
    <use href="#ring_t3-spark" transform="translate(43 12) scale(1.4)"/>
    <use href="#ring_t3-spark" transform="translate(45 26) scale(1.2)"/>
  </g>
  <g fill="#EAD8FF">
    <use href="#ring_t3-spark" transform="translate(19 20) scale(1.1)"/>
  </g>
</svg>
