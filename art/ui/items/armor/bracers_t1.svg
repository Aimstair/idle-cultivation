<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bracers_t1-leather" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DEA062"/>
      <stop offset=".45" stop-color="#A05E2E"/>
      <stop offset="1" stop-color="#5C321A"/>
    </linearGradient>
    <linearGradient id="bracers_t1-strap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7E4E2A"/>
      <stop offset="1" stop-color="#3A1C0C"/>
    </linearGradient>
    <linearGradient id="bracers_t1-hole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140603"/>
      <stop offset="1" stop-color="#4A2412"/>
    </linearGradient>
    <!-- one bracer, centred on the origin -->
    <g id="bracers_t1-b">
      <path d="M-9.5-21L-7.5 21A7.5 2.6 0 0 0 7.5 21L9.5-21Z" fill="url(#bracers_t1-leather)" stroke="#2A1008" stroke-width="2.3" stroke-linejoin="round"/>
      <!-- straps -->
      <path d="M-7.75 15.5L-7.5 21A7.5 2.6 0 0 0 7.5 21L7.75 15.5A7.75 2.6 0 0 1-7.75 15.5Z" fill="url(#bracers_t1-strap)" stroke="#2A1008" stroke-width="1.3" stroke-linejoin="round"/>
      <path d="M-9.5-21L-9.25-15.5A9.25 3 0 0 0 9.25-15.5L9.5-21A9.5 3.2 0 0 1-9.5-21Z" fill="url(#bracers_t1-strap)" stroke="#2A1008" stroke-width="1.3" stroke-linejoin="round"/>
      <!-- rope lacing -->
      <path d="M-4-11L4-5M4-11L-4-5M-4-3L4 3M4-3L-4 3M-4 5L4 11M4 5L-4 11" fill="none" stroke="#2A1008" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M-4-11L4-5M4-11L-4-5M-4-3L4 3M4-3L-4 3M-4 5L4 11M4 5L-4 11" fill="none" stroke="#EBD098" stroke-width="1.4" stroke-linecap="round"/>
      <!-- opening -->
      <ellipse cx="0" cy="-21" rx="9.5" ry="3.2" fill="url(#bracers_t1-hole)" stroke="#2A1008" stroke-width="2"/>
      <path d="M-8-20.4A8 2.4 0 0 0 8-20.4" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".45"/>
      <!-- highlight -->
      <path d="M-7-13L-5.9 13" fill="none" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" opacity=".5"/>
    </g>
  </defs>

  <ellipse cx="18.5" cy="56.2" rx="9" ry="1.4" fill="#2A1008" opacity=".25"/>
  <ellipse cx="45.5" cy="56.2" rx="9" ry="1.4" fill="#2A1008" opacity=".25"/>
  <use href="#bracers_t1-b" transform="translate(18.5 32) rotate(-5)"/>
  <use href="#bracers_t1-b" transform="translate(45.5 32) rotate(5)"/>
</svg>
