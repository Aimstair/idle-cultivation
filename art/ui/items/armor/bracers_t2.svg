<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bracers_t2-leather" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7A4E3A"/>
      <stop offset=".45" stop-color="#432418"/>
      <stop offset="1" stop-color="#20100A"/>
    </linearGradient>
    <linearGradient id="bracers_t2-blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8CC6F6"/>
      <stop offset=".5" stop-color="#3B7FE0"/>
      <stop offset="1" stop-color="#1A2A6E"/>
    </linearGradient>
    <linearGradient id="bracers_t2-bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6CC8A"/>
      <stop offset=".5" stop-color="#B87634"/>
      <stop offset="1" stop-color="#6A3E14"/>
    </linearGradient>
    <linearGradient id="bracers_t2-hole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140603"/>
      <stop offset="1" stop-color="#4A2412"/>
    </linearGradient>
    <!-- one bracer, centred on the origin -->
    <g id="bracers_t2-b">
      <path d="M-9.5-21L-7.5 21A7.5 2.6 0 0 0 7.5 21L9.5-21Z" fill="url(#bracers_t2-leather)" stroke="#2A1008" stroke-width="2.3" stroke-linejoin="round"/>
      <!-- blue bands -->
      <path d="M-7.75 15.5L-7.5 21A7.5 2.6 0 0 0 7.5 21L7.75 15.5A7.75 2.6 0 0 1-7.75 15.5Z" fill="url(#bracers_t2-blue)" stroke="#2A1008" stroke-width="1.3" stroke-linejoin="round"/>
      <path d="M-9.5-21L-9.25-15.5A9.25 3 0 0 0 9.25-15.5L9.5-21A9.5 3.2 0 0 1-9.5-21Z" fill="url(#bracers_t2-blue)" stroke="#2A1008" stroke-width="1.3" stroke-linejoin="round"/>
      <!-- bronze plates -->
      <g fill="url(#bracers_t2-bronze)" stroke="#2A1008" stroke-width="1.4" stroke-linejoin="round">
        <rect x="-7.4" y="-12.6" width="14.8" height="6.4" rx="1.6"/>
        <rect x="-6.9" y="-3.6" width="13.8" height="6.4" rx="1.6"/>
        <rect x="-6.4" y="5.4" width="12.8" height="6.4" rx="1.6"/>
      </g>
      <g fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".8">
        <path d="M-5.6-11H-1"/>
        <path d="M-5.1-2H-.8"/>
        <path d="M-4.6 7H-.6"/>
      </g>
      <!-- opening -->
      <ellipse cx="0" cy="-21" rx="9.5" ry="3.2" fill="url(#bracers_t2-hole)" stroke="#2A1008" stroke-width="2"/>
      <path d="M-8-20.4A8 2.4 0 0 0 8-20.4" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".5"/>
      <!-- highlight -->
      <path d="M-7.4-13.5L-7 13" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".3"/>
    </g>
  </defs>

  <ellipse cx="18.5" cy="56.2" rx="9" ry="1.4" fill="#2A1008" opacity=".25"/>
  <ellipse cx="45.5" cy="56.2" rx="9" ry="1.4" fill="#2A1008" opacity=".25"/>
  <use href="#bracers_t2-b" transform="translate(18.5 32) rotate(-5)"/>
  <use href="#bracers_t2-b" transform="translate(45.5 32) rotate(5)"/>
</svg>
