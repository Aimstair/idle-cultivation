<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bracers_t6-void" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6A4EA0"/>
      <stop offset=".45" stop-color="#241450"/>
      <stop offset="1" stop-color="#0A0618"/>
    </linearGradient>
    <linearGradient id="bracers_t6-navy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5C7CC8"/>
      <stop offset=".5" stop-color="#2A3E8E"/>
      <stop offset="1" stop-color="#0A0E2E"/>
    </linearGradient>
    <linearGradient id="bracers_t6-hole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140603"/>
      <stop offset="1" stop-color="#4A2412"/>
    </linearGradient>
    <filter id="bracers_t6-glow" x="-80%" y="-40%" width="260%" height="180%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <!-- one bracer, centred on the origin -->
    <g id="bracers_t6-b">
      <path d="M-9.5-21L-7.5 21A7.5 2.6 0 0 0 7.5 21L9.5-21Z" fill="url(#bracers_t6-void)" stroke="#2A1008" stroke-width="2.3" stroke-linejoin="round"/>
      <!-- navy bands with starlight -->
      <path d="M-7.75 15.5L-7.5 21A7.5 2.6 0 0 0 7.5 21L7.75 15.5A7.75 2.6 0 0 1-7.75 15.5Z" fill="url(#bracers_t6-navy)" stroke="#2A1008" stroke-width="1.3" stroke-linejoin="round"/>
      <path d="M-9.5-21L-9.25-15.5A9.25 3 0 0 0 9.25-15.5L9.5-21A9.5 3.2 0 0 1-9.5-21Z" fill="url(#bracers_t6-navy)" stroke="#2A1008" stroke-width="1.3" stroke-linejoin="round"/>
      <!-- glowing violet crack -->
      <path d="M1.5-13L-3.5-4L1-1L-2.5 6L1.5 12M-3.5-4L-6.5-6.5M1-1L4.5 1.5" fill="none" stroke="#9A6AE8" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" opacity=".8" filter="url(#bracers_t6-glow)"/>
      <path d="M1.5-13L-3.5-4L1-1L-2.5 6L1.5 12M-3.5-4L-6.5-6.5M1-1L4.5 1.5" fill="none" stroke="#C8A4FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M1.5-13L-3.5-4L1-1" fill="none" stroke="#FFFFFF" stroke-width=".9" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
      <!-- star specks -->
      <g fill="#FFFFFF">
        <circle cx="4.5" cy="-9" r=".9"/>
        <circle cx="-4.5" cy="3" r=".8"/>
        <circle cx="4.5" cy="8" r=".7" opacity=".8"/>
        <circle cx="0" cy="18" r=".8"/>
      </g>
      <!-- opening -->
      <ellipse cx="0" cy="-21" rx="9.5" ry="3.2" fill="url(#bracers_t6-hole)" stroke="#2A1008" stroke-width="2"/>
      <path d="M-8-20.4A8 2.4 0 0 0 8-20.4" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".6"/>
      <!-- highlight -->
      <path d="M-7.4-13.5L-7 13" fill="none" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" opacity=".55"/>
    </g>
    <path id="bracers_t6-spark" d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z"/>
  </defs>

  <ellipse cx="18.5" cy="56.2" rx="9" ry="1.4" fill="#2A1008" opacity=".25"/>
  <ellipse cx="45.5" cy="56.2" rx="9" ry="1.4" fill="#2A1008" opacity=".25"/>
  <use href="#bracers_t6-b" transform="translate(18.5 32) rotate(-5)"/>
  <use href="#bracers_t6-b" transform="translate(45.5 32) rotate(5)"/>
  <g fill="#FFFFFF" stroke="#2A1008" stroke-width=".35" stroke-opacity=".5">
    <use href="#bracers_t6-spark" transform="translate(32 14) scale(1.8)"/>
    <use href="#bracers_t6-spark" transform="translate(57 30) scale(1.3)"/>
    <use href="#bracers_t6-spark" transform="translate(32 42) scale(1.4)"/>
  </g>
  <g fill="#C8A4FF">
    <use href="#bracers_t6-spark" transform="translate(7 38) scale(1.3)"/>
    <use href="#bracers_t6-spark" transform="translate(32 27) scale(1.1)"/>
  </g>
</svg>
