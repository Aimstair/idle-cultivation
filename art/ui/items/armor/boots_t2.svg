<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="boots_t2-cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".5" stop-color="#F3F5FB"/>
      <stop offset="1" stop-color="#C9D2E6"/>
    </linearGradient>
    <linearGradient id="boots_t2-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B8E4FF"/>
      <stop offset=".45" stop-color="#3B7FE0"/>
      <stop offset="1" stop-color="#1A2A6E"/>
    </linearGradient>
    <linearGradient id="boots_t2-sole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CFD0DA"/>
    </linearGradient>
    <!-- one boot, toe to the right -->
    <g id="boots_t2-boot">
      <path d="M12 13H28V33Q28 39.5 34 41L44 42.5Q51 43.5 50.5 49.5L50.3 53H12Z" fill="url(#boots_t2-cloth)" stroke="#2A1008" stroke-width="2.3" stroke-linejoin="round"/>
      <path d="M12 53H50.3Q52.3 53 52.3 55Q52.3 57 50.3 57H12Z" fill="url(#boots_t2-sole)" stroke="#2A1008" stroke-width="2" stroke-linejoin="round"/>
      <!-- royal-blue bands -->
      <path d="M12 13H28V18H12Z" fill="url(#boots_t2-blue)" stroke="#2A1008" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M12 28H28V32.5H12Z" fill="url(#boots_t2-blue)" stroke="#2A1008" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M13.5 14.4H22M13.5 29.4H22" fill="none" stroke="#FFFFFF" stroke-width=".9" stroke-linecap="round" opacity=".8"/>
      <path d="M14.3 20.3V26" fill="none" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" opacity=".9"/>
      <path d="M14 54.4H47" fill="none" stroke="#FFFFFF" stroke-width=".9" stroke-linecap="round" opacity=".9"/>
    </g>
  </defs>

  <ellipse cx="33" cy="57.6" rx="21" ry="1.4" fill="#2A1008" opacity=".25"/>
  <!-- back boot -->
  <g transform="translate(6 -6)">
    <use href="#boots_t2-boot"/>
    <path d="M12 13H28V33Q28 39.5 34 41L44 42.5Q51 43.5 50.5 49.5L50.3 53Q52.3 53 52.3 55Q52.3 57 50.3 57H12Z" fill="#1A2A6E" opacity=".22"/>
  </g>
  <!-- front boot -->
  <use href="#boots_t2-boot"/>
</svg>
