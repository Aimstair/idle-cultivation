<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="pendant_t6-navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6E8ED8"/>
      <stop offset=".4" stop-color="#2A3E8E"/>
      <stop offset="1" stop-color="#0A0E2E"/>
    </linearGradient>
    <radialGradient id="pendant_t6-void" gradientUnits="userSpaceOnUse" cx="27" cy="29" r="17">
      <stop offset="0" stop-color="#5A3E90"/>
      <stop offset=".5" stop-color="#1E1040"/>
      <stop offset="1" stop-color="#0A0618"/>
    </radialGradient>
    <radialGradient id="pendant_t6-gem" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".45" stop-color="#C8A4FF"/>
      <stop offset="1" stop-color="#5A2EB0"/>
    </radialGradient>
    <linearGradient id="pendant_t6-violet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9A6AE8"/>
      <stop offset=".5" stop-color="#3A1E7A"/>
      <stop offset="1" stop-color="#1E1040"/>
    </linearGradient>
    <filter id="pendant_t6-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <path id="pendant_t6-spark" d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z"/>
  </defs>

  <!-- contact shadow -->
  <ellipse cx="32" cy="57.4" rx="8" ry="1.3" fill="#2A1008" opacity=".25"/>

  <!-- navy silk cord with starlight thread -->
  <path d="M16 6L32 19.5L48 6" fill="none" stroke="#2A1008" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M16 6L32 19.5L48 6" fill="none" stroke="url(#pendant_t6-navy)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M17.5 7.3L23 12" fill="none" stroke="#FFFFFF" stroke-width=".8" stroke-linecap="round" opacity=".8"/>

  <!-- void tassel (behind the disc) -->
  <path d="M32 46V49" fill="none" stroke="#2A1008" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M29.6 50.5L28.6 57H35.4L34.4 50.5Z" fill="url(#pendant_t6-violet)" stroke="#2A1008" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M31.2 52V55.5M33 52V55.5" fill="none" stroke="#C8A4FF" stroke-width=".8" stroke-linecap="round" opacity=".8"/>
  <circle cx="32" cy="49.4" r="1.8" fill="url(#pendant_t6-navy)" stroke="#2A1008" stroke-width="1.1"/>

  <!-- violet glow -->
  <circle cx="32" cy="34.5" r="13" fill="#C8A4FF" opacity=".65" filter="url(#pendant_t6-glow)"/>
  <!-- deep navy frame -->
  <circle cx="32" cy="34.5" r="14" fill="url(#pendant_t6-navy)" stroke="#2A1008" stroke-width="2.4"/>
  <!-- void disc -->
  <circle cx="32" cy="34.5" r="10.4" fill="url(#pendant_t6-void)" stroke="#2A1008" stroke-width="1.4"/>
  <!-- star specks in the void -->
  <g fill="#FFFFFF">
    <circle cx="27" cy="29" r=".9"/>
    <circle cx="38" cy="31" r=".8"/>
    <circle cx="36.5" cy="40.5" r=".9"/>
    <circle cx="26.5" cy="39" r=".7" opacity=".8"/>
  </g>
  <!-- violet cracks radiating from the gem -->
  <path d="M32 31L33.5 27.5L32.5 25.5M35 36.5L39 38L40.5 41M29 36L25.5 36.5L24 40" fill="none" stroke="#9A6AE8" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" opacity=".85" filter="url(#pendant_t6-glow)"/>
  <path d="M32 31L33.5 27.5L32.5 25.5M35 36.5L39 38L40.5 41M29 36L25.5 36.5L24 40" fill="none" stroke="#E0CCFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- void gem heart -->
  <circle cx="32" cy="34.5" r="5" fill="#C8A4FF" opacity=".9" filter="url(#pendant_t6-glow)"/>
  <circle cx="32" cy="34.5" r="4.2" fill="url(#pendant_t6-gem)" stroke="#2A1008" stroke-width="1.3"/>
  <ellipse cx="30.6" cy="32.8" rx="1.4" ry=".9" fill="#FFFFFF" opacity=".95"/>
  <!-- frame bevel and highlight -->
  <circle cx="32" cy="34.5" r="12.2" fill="none" stroke="#C8A4FF" stroke-width=".9" opacity=".75"/>
  <path d="M21.5 29.5Q24 23.5 30.5 21.8" fill="none" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" opacity=".95"/>
  <!-- navy knot -->
  <circle cx="32" cy="20" r="2.4" fill="url(#pendant_t6-navy)" stroke="#2A1008" stroke-width="1.3"/>

  <!-- starlight -->
  <g fill="#FFFFFF" stroke="#2A1008" stroke-width=".35" stroke-opacity=".5">
    <use href="#pendant_t6-spark" transform="translate(13 24) scale(1.8)"/>
    <use href="#pendant_t6-spark" transform="translate(51 40) scale(1.4)"/>
    <use href="#pendant_t6-spark" transform="translate(47 16) scale(1.3)"/>
  </g>
  <g fill="#C8A4FF">
    <use href="#pendant_t6-spark" transform="translate(16 44) scale(1.3)"/>
    <use href="#pendant_t6-spark" transform="translate(50 29) scale(1.1)"/>
  </g>
</svg>
