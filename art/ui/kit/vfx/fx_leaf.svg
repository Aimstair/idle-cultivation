<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="fx_leaf-light" gradientUnits="userSpaceOnUse" x1="4" y1="28" x2="28" y2="4">
      <stop offset="0" stop-color="#3FC79A"/>
      <stop offset=".5" stop-color="#6ED9AE"/>
      <stop offset="1" stop-color="#A4F0CF"/>
    </linearGradient>
    <linearGradient id="fx_leaf-dark" gradientUnits="userSpaceOnUse" x1="4" y1="28" x2="28" y2="4">
      <stop offset="0" stop-color="#0E6A50"/>
      <stop offset=".55" stop-color="#1E8C68"/>
