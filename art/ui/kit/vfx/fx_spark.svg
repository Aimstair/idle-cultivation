<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="fx_spark-halo" gradientUnits="userSpaceOnUse" cx="16" cy="16" r="9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".6"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fx_spark-ray" gradientUnits="userSpaceOnUse" cx="16" cy="16" r="15">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset=".35" stop-color="#FFFFFF" stop-opacity=".9"/>
      <stop offset=".75" stop-color="#F2EFF8" stop-opacity=".45"/>
      <stop offset="1" stop-color="#E8E4EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fx_spark-core" gradientUnits="userSpaceOnUse" cx="16" cy="16" r="3.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset=".6" stop-color="#FFFFFF" stop-opacity=".9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- soft halo -->
  <circle cx="16" cy="16" r="9" fill="url(#fx_spark-halo)"/>
  <!-- small diagonal cross -->
  <path d="M16 8.5Q16.5 15.5 23.5 16Q16.5 16.5 16 23.5Q15.5 16.5 8.5 16Q15.5 15.5 16 8.5Z" fill="url(#fx_spark-ray)" opacity=".55" transform="rotate(45 16 16)"/>
  <!-- four long thin rays -->
  <path d="M16 1Q16.9 15.1 31 16Q16.9 16.9 16 31Q15.1 16.9 1 16Q15.1 15.1 16 1Z" fill="url(#fx_spark-ray)"/>
  <!-- bright core -->
  <circle cx="16" cy="16" r="3.6" fill="url(#fx_spark-core)"/>
</svg>
