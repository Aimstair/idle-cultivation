<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 40 40">
  <defs>
    <radialGradient id="btn_close-red" cx=".38" cy=".3" r=".8">
      <stop offset="0" stop-color="#FF6A44"/>
      <stop offset=".55" stop-color="#C21E10"/>
      <stop offset="1" stop-color="#5A0A04"/>
    </radialGradient>
    <linearGradient id="btn_close-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A0803"/>
      <stop offset="1" stop-color="#1A0202"/>
    </linearGradient>
    <linearGradient id="btn_close-sheen" gradientUnits="userSpaceOnUse" x1="0" y1="4" x2="0" y2="15">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".42"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="btn_close-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
    <path id="btn_close-x" d="M13.8 12.3 L26.2 24.7 M26.2 12.3 L13.8 24.7"/>
  </defs>

  <!-- cast shadow and plinth -->
  <circle cx="20" cy="22.6" r="15.8" fill="#2A1008" opacity=".4" filter="url(#btn_close-blur)"/>
  <circle cx="20" cy="21.4" r="15.8" fill="url(#btn_close-base)" stroke="#2A1008" stroke-width="2"/>
  <!-- red lacquer face -->
  <circle cx="20" cy="18.5" r="15.8" fill="url(#btn_close-red)" stroke="#2A1008" stroke-width="2.5"/>
  <ellipse cx="20" cy="10" rx="11" ry="5.5" fill="url(#btn_close-sheen)"/>
  <!-- gold rim -->
  <circle cx="20" cy="18.5" r="13.6" fill="none" stroke="#FFE7A0" stroke-width="1.5"/>
  <!-- bold white X -->
  <use href="#btn_close-x" fill="none" stroke="#5A0A04" stroke-width="6.2" stroke-linecap="round" transform="translate(0 1.2)"/>
  <use href="#btn_close-x" fill="none" stroke="#2A1008" stroke-width="6.4" stroke-linecap="round"/>
  <use href="#btn_close-x" fill="none" stroke="#FFFFFF" stroke-width="3.8" stroke-linecap="round"/>
  <path d="M14.6 12.6 L18.4 16.4" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity=".5"/>
</svg>
