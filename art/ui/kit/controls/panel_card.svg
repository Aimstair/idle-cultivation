<svg xmlns="http://www.w3.org/2000/svg" width="240" height="144" viewBox="0 0 120 72">
<!-- 9slice: 16 -->
  <defs>
    <linearGradient id="panel_card-sheen" gradientUnits="userSpaceOnUse" x1="0" y1="4" x2="0" y2="15">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="panel_card-shade" gradientUnits="userSpaceOnUse" x1="0" y1="57" x2="0" y2="68">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".38"/>
    </linearGradient>
    <linearGradient id="panel_card-goldSmall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF6C8"/>
      <stop offset=".4" stop-color="#FFD45A"/>
      <stop offset="1" stop-color="#9A5E14"/>
    </linearGradient>
    <filter id="panel_card-blur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <clipPath id="panel_card-clip"><rect x="4" y="4" width="112" height="64" rx="8"/></clipPath>
    <g id="panel_card-stud">
      <circle r="2.7" fill="url(#panel_card-goldSmall)" stroke="#2A1008" stroke-width="1.2"/>
      <circle cx="-.9" cy="-.9" r=".8" fill="#FFFFFF" opacity=".85"/>
    </g>
  </defs>

  <!-- cast shadow -->
  <rect x="4" y="5.8" width="112" height="64" rx="8" fill="#2A1008" opacity=".4" filter="url(#panel_card-blur)"/>

  <!-- rosewood body -->
  <rect x="4" y="4" width="112" height="64" rx="8" fill="#3A190C" stroke="#2A1008" stroke-width="2.6" stroke-linejoin="round"/>
  <g clip-path="url(#panel_card-clip)">
    <rect x="4" y="4" width="112" height="11" fill="url(#panel_card-sheen)"/>
    <rect x="4" y="57" width="112" height="11" fill="url(#panel_card-shade)"/>
  </g>
  <path d="M13 5.3 H107" fill="none" stroke="#FFFFFF" stroke-width=".8" stroke-linecap="round" opacity=".35"/>

  <!-- gold hairline rim -->
  <rect x="6.6" y="6.6" width="106.8" height="58.8" rx="5.8" fill="none" stroke="#E8B657" stroke-width="1.1" opacity=".9"/>

  <!-- gold corner studs -->
  <use href="#panel_card-stud" transform="translate(10.2 10.2)"/>
  <use href="#panel_card-stud" transform="translate(109.8 10.2)"/>
  <use href="#panel_card-stud" transform="translate(10.2 61.8)"/>
  <use href="#panel_card-stud" transform="translate(109.8 61.8)"/>
</svg>
