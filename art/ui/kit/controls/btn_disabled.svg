<svg xmlns="http://www.w3.org/2000/svg" width="240" height="96" viewBox="0 0 120 48">
<!-- 9slice: 18 -->
  <defs>
    <linearGradient id="btn_disabled-face" gradientUnits="userSpaceOnUse" x1="0" y1="3" x2="0" y2="39">
      <stop offset="0" stop-color="#C6C3CC"/>
      <stop offset=".5" stop-color="#8E8A98"/>
      <stop offset="1" stop-color="#58545F"/>
    </linearGradient>
    <linearGradient id="btn_disabled-base" gradientUnits="userSpaceOnUse" x1="0" y1="30" x2="0" y2="44">
      <stop offset="0" stop-color="#3C3844"/>
      <stop offset="1" stop-color="#1C1922"/>
    </linearGradient>
    <linearGradient id="btn_disabled-sheen" gradientUnits="userSpaceOnUse" x1="0" y1="4" x2="0" y2="16">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="btn_disabled-shade" gradientUnits="userSpaceOnUse" x1="0" y1="31" x2="0" y2="38">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".22"/>
    </linearGradient>
    <filter id="btn_disabled-blur" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <clipPath id="btn_disabled-clip"><rect x="4" y="3" width="112" height="36" rx="9"/></clipPath>
  </defs>

  <!-- cast shadow -->
  <rect x="4" y="9.5" width="112" height="36" rx="9" fill="#2A1008" opacity=".3" filter="url(#btn_disabled-blur)"/>
  <!-- plinth -->
  <rect x="4" y="8" width="112" height="36" rx="9" fill="url(#btn_disabled-base)" stroke="#2A1F1E" stroke-width="2.4"/>
  <!-- grey stone face -->
  <rect x="4" y="3" width="112" height="36" rx="9" fill="url(#btn_disabled-face)" stroke="#2A1F1E" stroke-width="2.8"/>
  <g clip-path="url(#btn_disabled-clip)">
    <rect x="4" y="3" width="112" height="13" fill="url(#btn_disabled-sheen)"/>
    <rect x="4" y="31" width="112" height="8" fill="url(#btn_disabled-shade)"/>
  </g>
  <!-- dulled rim -->
  <rect x="6.3" y="5.3" width="107.4" height="31.4" rx="7" fill="none" stroke="#A39FAC" stroke-width="1.5" opacity=".8"/>
  <path d="M14 5.3 H106" fill="none" stroke="#D8D5DE" stroke-width="1.5" opacity=".8"/>
  <path d="M14 36.7 H106" fill="none" stroke="#6E6A78" stroke-width="1.5" opacity=".8"/>
</svg>
