<svg xmlns="http://www.w3.org/2000/svg" width="240" height="96" viewBox="0 0 120 48">
<!-- 9slice: 18 -->
  <defs>
    <linearGradient id="btn_secondary-face" gradientUnits="userSpaceOnUse" x1="0" y1="3" x2="0" y2="39">
      <stop offset="0" stop-color="#6A3414"/>
      <stop offset=".5" stop-color="#3A190C"/>
      <stop offset="1" stop-color="#1A0804"/>
    </linearGradient>
    <linearGradient id="btn_secondary-base" gradientUnits="userSpaceOnUse" x1="0" y1="30" x2="0" y2="44">
      <stop offset="0" stop-color="#2A1008"/>
      <stop offset="1" stop-color="#0E0302"/>
    </linearGradient>
    <linearGradient id="btn_secondary-sheen" gradientUnits="userSpaceOnUse" x1="0" y1="4" x2="0" y2="16">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".26"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="btn_secondary-shade" gradientUnits="userSpaceOnUse" x1="0" y1="31" x2="0" y2="38">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".3"/>
    </linearGradient>
    <filter id="btn_secondary-blur" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <clipPath id="btn_secondary-clip"><rect x="4" y="3" width="112" height="36" rx="9"/></clipPath>
  </defs>

  <!-- cast shadow -->
  <rect x="4" y="9.5" width="112" height="36" rx="9" fill="#2A1008" opacity=".4" filter="url(#btn_secondary-blur)"/>
  <!-- plinth -->
  <rect x="4" y="8" width="112" height="36" rx="9" fill="url(#btn_secondary-base)" stroke="#2A1008" stroke-width="2.4"/>
  <!-- rosewood face -->
  <rect x="4" y="3" width="112" height="36" rx="9" fill="url(#btn_secondary-face)" stroke="#2A1008" stroke-width="2.8"/>
  <g clip-path="url(#btn_secondary-clip)">
    <rect x="4" y="3" width="112" height="13" fill="url(#btn_secondary-sheen)"/>
    <rect x="4" y="31" width="112" height="8" fill="url(#btn_secondary-shade)"/>
  </g>
  <!-- gold rim -->
  <rect x="6.3" y="5.3" width="107.4" height="31.4" rx="7" fill="none" stroke="#E8B657" stroke-width="1.8"/>
  <path d="M14 5.3 H106" fill="none" stroke="#FFE7A0" stroke-width="1.8"/>
  <path d="M14 36.7 H106" fill="none" stroke="#B8812A" stroke-width="1.8"/>
  <path d="M15 4 H105" fill="none" stroke="#FFFFFF" stroke-width=".9" stroke-linecap="round" opacity=".45"/>
</svg>
