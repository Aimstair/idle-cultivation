<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="btn_info-jade" cx=".38" cy=".3" r=".8">
      <stop offset="0" stop-color="#C8FFE6"/>
      <stop offset=".5" stop-color="#3FC79A"/>
      <stop offset="1" stop-color="#0E6A50"/>
    </radialGradient>
    <linearGradient id="btn_info-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B4A37"/>
      <stop offset="1" stop-color="#042218"/>
    </linearGradient>
    <linearGradient id="btn_info-sheen" gradientUnits="userSpaceOnUse" x1="0" y1="3.5" x2="0" y2="12">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".4"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="btn_info-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation=".9"/>
    </filter>
  </defs>

  <!-- cast shadow and plinth -->
  <circle cx="16" cy="18.2" r="12.4" fill="#2A1008" opacity=".4" filter="url(#btn_info-blur)"/>
  <circle cx="16" cy="17.3" r="12.4" fill="url(#btn_info-base)" stroke="#2A1008" stroke-width="1.8"/>
  <!-- jade face -->
  <circle cx="16" cy="14.8" r="12.4" fill="url(#btn_info-jade)" stroke="#2A1008" stroke-width="2.2"/>
  <ellipse cx="16" cy="8.3" rx="8.5" ry="4.3" fill="url(#btn_info-sheen)"/>
  <!-- gold rim -->
  <circle cx="16" cy="14.8" r="10.6" fill="none" stroke="#FFE7A0" stroke-width="1.3"/>
  <!-- white "i": dot and bar -->
  <g fill="#0E6A50" opacity=".7" transform="translate(0 1)">
    <circle cx="16" cy="9.2" r="2.1"/>
    <rect x="14.1" y="12.6" width="3.8" height="8.8" rx="1.7"/>
  </g>
  <g stroke="#2A1008" stroke-width="1.4" fill="#FFFFFF">
    <circle cx="16" cy="9.2" r="2.1"/>
    <rect x="14.1" y="12.6" width="3.8" height="8.8" rx="1.7"/>
  </g>
</svg>
