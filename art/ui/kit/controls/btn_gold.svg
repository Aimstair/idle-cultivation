<svg xmlns="http://www.w3.org/2000/svg" width="240" height="96" viewBox="0 0 120 48">
<!-- 9slice: 18 -->
  <defs>
    <linearGradient id="btn_gold-face" gradientUnits="userSpaceOnUse" x1="0" y1="3" x2="0" y2="39">
      <stop offset="0" stop-color="#FFF6C8"/>
      <stop offset=".3" stop-color="#FFD45A"/>
      <stop offset=".7" stop-color="#D69A2A"/>
      <stop offset="1" stop-color="#9A5E14"/>
    </linearGradient>
    <linearGradient id="btn_gold-inner" gradientUnits="userSpaceOnUse" x1="0" y1="6.5" x2="0" y2="35.5">
      <stop offset="0" stop-color="#B8781E"/>
      <stop offset=".35" stop-color="#E0A838"/>
      <stop offset=".75" stop-color="#FFD45A"/>
      <stop offset="1" stop-color="#FFF0B0"/>
    </linearGradient>
    <linearGradient id="btn_gold-base" gradientUnits="userSpaceOnUse" x1="0" y1="30" x2="0" y2="44">
      <stop offset="0" stop-color="#7A4810"/>
      <stop offset="1" stop-color="#2E1A04"/>
    </linearGradient>
    <linearGradient id="btn_gold-sheen" gradientUnits="userSpaceOnUse" x1="0" y1="7" x2="0" y2="17">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".3"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="btn_gold-blur" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- cast shadow -->
  <rect x="4" y="9.5" width="112" height="36" rx="9" fill="#2A1008" opacity=".4" filter="url(#btn_gold-blur)"/>
  <!-- plinth -->
  <rect x="4" y="8" width="112" height="36" rx="9" fill="url(#btn_gold-base)" stroke="#2A1008" stroke-width="2.4"/>
  <!-- gold ingot face: lit outer slope, reversed inner slope -->
  <rect x="4" y="3" width="112" height="36" rx="9" fill="url(#btn_gold-face)" stroke="#2A1008" stroke-width="2.8"/>
  <rect x="7.5" y="6.5" width="105" height="29" rx="6.5" fill="url(#btn_gold-inner)"/>
  <rect x="7.5" y="6.5" width="105" height="11" rx="6.5" fill="url(#btn_gold-sheen)"/>
  <!-- bevel ridge highlight and shade -->
  <path d="M14 6.1 H106" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".7"/>
  <path d="M14 35.9 H106" fill="none" stroke="#7A4810" stroke-width="1" stroke-linecap="round" opacity=".6"/>
  <!-- sparkle in the top-left corner zone -->
  <path d="M13 7 L13.9 9.6 L16.5 10.5 L13.9 11.4 L13 14 L12.1 11.4 L9.5 10.5 L12.1 9.6 Z" fill="#FFFFFF" opacity=".9"/>
</svg>
