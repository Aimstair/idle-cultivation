<svg xmlns="http://www.w3.org/2000/svg" width="112" height="112" viewBox="0 0 56 56">
  <defs>
    <radialGradient id="node_ground_train-plaque" gradientUnits="userSpaceOnUse" cx="22" cy="21" r="27">
      <stop offset="0" stop-color="#F0C080"/>
      <stop offset=".5" stop-color="#B8742E"/>
      <stop offset="1" stop-color="#5A2E0C"/>
    </radialGradient>
    <!-- polished wooden post, lit from the left (coords in the emblem's 80-unit space) -->
    <linearGradient id="node_ground_train-post" gradientUnits="userSpaceOnUse" x1="31.5" y1="0" x2="48.5" y2="0">
      <stop offset="0" stop-color="#E2AE70"/>
      <stop offset=".18" stop-color="#CE8A46"/>
      <stop offset=".5" stop-color="#B8733A"/>
      <stop offset=".8" stop-color="#8A4A1E"/>
      <stop offset="1" stop-color="#5A2A10"/>
    </linearGradient>
    <linearGradient id="node_ground_train-iron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B4BCCC"/>
      <stop offset=".45" stop-color="#6E768A"/>
      <stop offset="1" stop-color="#363C4C"/>
    </linearGradient>
    <linearGradient id="node_ground_train-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A3A1E"/>
      <stop offset=".5" stop-color="#3A190C"/>
      <stop offset="1" stop-color="#1A0804"/>
    </linearGradient>
    <radialGradient id="node_ground_train-endgrain" cx=".4" cy=".36" r=".75">
      <stop offset="0" stop-color="#F0C890"/>
      <stop offset=".6" stop-color="#D49A5A"/>
      <stop offset="1" stop-color="#9A5A26"/>
    </radialGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="28" cy="49.4" rx="16" ry="2.2" fill="#2A1008" opacity=".32"/>

  <!-- bronze plaque -->
  <circle cx="28" cy="27" r="19" fill="url(#node_ground_train-plaque)" stroke="#2A1008" stroke-width="2.2"/>
  <circle cx="28" cy="27" r="16.8" fill="none" stroke="#FFE7A0" stroke-opacity=".8" stroke-width="1.1"/>
  <path d="M12.6 20 A17.2 17.2 0 0 1 20.8 11.4" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" opacity=".7"/>

  <!-- emblem: wooden training dummy (drawn in an 80-unit space, scaled to sit inside the plaque) -->
  <g transform="translate(28 27.6) scale(.52) translate(-40 -38.8)">
    <!-- arms behind the post: two upper arms spread forward-up, one middle arm forward-left -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M36 28L15 21.5M44 28L65 21.5M37 40L23 46.5" stroke="#2A1008" stroke-width="10.4"/>
      <path d="M36 28L15 21.5M44 28L65 21.5M37 40L23 46.5" stroke="#B8733A" stroke-width="6.8"/>
      <path d="M34.4 25.6L18 20.6M45.6 25.6L62 20.6M31.4 40.6L24.4 43.9" stroke="#EDBB7E" stroke-width="1.9" opacity=".95"/>
      <path d="M33.4 29.2L17 24.1M46.6 29.2L63 24.1M32.8 43.9L25.8 47.2" stroke="#6A3414" stroke-width="1.9" opacity=".75"/>
    </g>

    <!-- post -->
    <path d="M31.5 10A8.5 3 0 0 1 48.5 10V65H31.5Z" fill="url(#node_ground_train-post)"/>
    <path d="M38.6 22Q37.4 30 38.8 38Q39.8 46 38.2 54" fill="none" stroke="#6A3414" stroke-width="1.6" stroke-linecap="round" opacity=".5"/>
    <ellipse cx="40.8" cy="34" rx="2.8" ry="4" fill="#F0C890" opacity=".38"/>
    <path d="M34.6 22.5V53.5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" opacity=".45"/>
    <path d="M31.5 10A8.5 3 0 0 1 48.5 10V65H31.5Z" fill="none" stroke="#2A1008" stroke-width="3.4" stroke-linejoin="round"/>
    <ellipse cx="40" cy="10" rx="8.5" ry="3" fill="url(#node_ground_train-endgrain)" stroke="#2A1008" stroke-width="2.2"/>
    <ellipse cx="40" cy="10.1" rx="4" ry="1.3" fill="none" stroke="#8A4A1E" stroke-width="1.3" opacity=".8"/>

    <!-- iron bands -->
    <g stroke="#2A1008" stroke-width="2.2" stroke-linejoin="round">
      <rect x="30.4" y="15" width="19.2" height="5.2" rx="1" fill="url(#node_ground_train-iron)"/>
      <rect x="30.4" y="55.3" width="19.2" height="5.2" rx="1" fill="url(#node_ground_train-iron)"/>
    </g>
    <path d="M32.4 16.3H37.6M32.4 56.6H37.6" fill="none" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" opacity=".6"/>

    <!-- base / stand -->
    <rect x="25" y="62.5" width="30" height="7.5" rx="2.5" fill="url(#node_ground_train-base)" stroke="#2A1008" stroke-width="3.4" stroke-linejoin="round"/>
    <path d="M28.2 64.4H39" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity=".45"/>

    <!-- leg in front: forward-right, then down -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M44 52L56 56.5L59 65" stroke="#2A1008" stroke-width="10.4"/>
      <path d="M44 52L56 56.5L59 65" stroke="#B8733A" stroke-width="6.8"/>
      <path d="M48.2 51.6L55.4 54.3M54.7 58.4L56.7 63.9" stroke="#EDBB7E" stroke-width="1.9" opacity=".95"/>
      <path d="M48.6 55.4L54.6 57.8" stroke="#6A3414" stroke-width="1.9" opacity=".75"/>
    </g>

    <!-- end-grain caps -->
    <g stroke="#2A1008" stroke-width="1.7">
      <circle cx="15" cy="21.5" r="3" fill="url(#node_ground_train-endgrain)"/>
      <circle cx="65" cy="21.5" r="3" fill="url(#node_ground_train-endgrain)"/>
      <circle cx="23" cy="46.5" r="3" fill="url(#node_ground_train-endgrain)"/>
      <circle cx="59" cy="65" r="3" fill="url(#node_ground_train-endgrain)"/>
    </g>
    <g fill="none" stroke="#8A4A1E" stroke-width="1.3" opacity=".8">
      <circle cx="15" cy="21.5" r="1.3"/>
      <circle cx="65" cy="21.5" r="1.3"/>
      <circle cx="23" cy="46.5" r="1.3"/>
      <circle cx="59" cy="65" r="1.3"/>
    </g>
  </g>

  <!-- small gold effort ticks at the arm tips, kept inside the plaque -->
  <g fill="none" stroke-linecap="round">
    <path d="M12.7 15.6L10.9 13.6M12.5 21.4L10.5 22.8M43.3 15.6L45.1 13.6M43.5 21.4L45.5 22.8" stroke="#2A1008" stroke-width="2.4"/>
    <path d="M12.7 15.6L10.9 13.6M12.5 21.4L10.5 22.8M43.3 15.6L45.1 13.6M43.5 21.4L45.5 22.8" stroke="#FFE7A0" stroke-width="1.2"/>
  </g>
</svg>
