<svg xmlns="http://www.w3.org/2000/svg" width="80" height="104" viewBox="0 0 40 52">
  <defs>
    <linearGradient id="marker_player-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6C8"/>
      <stop offset=".3" stop-color="#FFD45A"/>
      <stop offset=".7" stop-color="#D69A2A"/>
      <stop offset="1" stop-color="#9A5E14"/>
    </linearGradient>
    <radialGradient id="marker_player-jade" cx=".36" cy=".32" r=".8">
      <stop offset="0" stop-color="#C8FFE6"/>
      <stop offset=".5" stop-color="#3FC79A"/>
      <stop offset="1" stop-color="#0E6A50"/>
    </radialGradient>
    <path id="marker_player-pin" d="M20 46.5 C15 39.5 4 31 4 18 A16 16 0 0 1 36 18 C36 31 25 39.5 20 46.5 Z"/>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="20" cy="50.6" rx="6.5" ry="1.2" fill="#2A1008" opacity=".38"/>

  <!-- gold pin with open window (window centre 20,18 r 12 stays transparent) -->
  <path d="M20 46.5 C15 39.5 4 31 4 18 A16 16 0 0 1 36 18 C36 31 25 39.5 20 46.5 Z M20 6 A12 12 0 1 0 20.01 6 Z"
    fill="url(#marker_player-gold)" fill-rule="evenodd" stroke="#2A1008" stroke-width="1.9" stroke-linejoin="round"/>
  <!-- window edge (stroke sits outside r 12) -->
  <circle cx="20" cy="18" r="12.7" fill="none" stroke="#2A1008" stroke-width="1.4"/>
  <circle cx="20" cy="18" r="14" fill="none" stroke="#FFE7A0" stroke-opacity=".8" stroke-width=".9"/>
  <!-- rim highlight + lower shade -->
  <path d="M6.2 13.4 A14.6 14.6 0 0 1 12.4 5.6" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity=".95"/>
  <path d="M30.5 33.5 C28 37 24.5 40.5 21.5 44" fill="none" stroke="#7A4A10" stroke-width="1" stroke-linecap="round" opacity=".5"/>

  <!-- jade gem at the tip -->
  <circle cx="20" cy="45.6" r="3.4" fill="url(#marker_player-jade)" stroke="#2A1008" stroke-width="1.6"/>
  <ellipse cx="18.9" cy="44.5" rx="1" ry=".7" fill="#FFFFFF" opacity=".9"/>
</svg>
