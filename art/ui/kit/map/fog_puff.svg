<svg xmlns="http://www.w3.org/2000/svg" width="240" height="140" viewBox="0 0 120 70">
  <defs>
    <radialGradient id="fog_puff-body" gradientUnits="userSpaceOnUse" cx="50" cy="26" r="62">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".5" stop-color="#F1ECFA"/>
      <stop offset="1" stop-color="#C6B8E0"/>
    </radialGradient>
    <linearGradient id="fog_puff-under" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B9A8DA" stop-opacity="0"/>
      <stop offset="1" stop-color="#9F8EC4" stop-opacity=".55"/>
    </linearGradient>
    <filter id="fog_puff-soft" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <filter id="fog_puff-halo" x="-25%" y="-35%" width="150%" height="170%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="fog_puff-ink" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation=".8"/>
    </filter>
    <g id="fog_puff-shape">
      <ellipse cx="60" cy="46" rx="44" ry="14"/>
      <circle cx="37" cy="36" r="16"/>
      <circle cx="61" cy="29" r="20"/>
      <circle cx="85" cy="36" r="15"/>
      <circle cx="24" cy="45" r="11"/>
      <circle cx="97" cy="46" r="10"/>
    </g>
    <clipPath id="fog_puff-clip"><use href="#fog_puff-shape"/></clipPath>
  </defs>

  <!-- soft halo -->
  <use href="#fog_puff-shape" fill="#E6DDF5" opacity=".55" filter="url(#fog_puff-halo)"/>
  <!-- cloud body -->
  <g filter="url(#fog_puff-soft)">
    <use href="#fog_puff-shape" fill="url(#fog_puff-body)"/>
    <g clip-path="url(#fog_puff-clip)">
      <rect x="0" y="34" width="120" height="30" fill="url(#fog_puff-under)"/>
      <!-- ink-wash swirls -->
      <g fill="none" stroke="#9F8EC4" stroke-linecap="round" filter="url(#fog_puff-ink)">
        <path d="M28 50 C36 43 50 44 55 50 C58 54 52 57 48 54" stroke-width="2" opacity=".4"/>
        <path d="M66 52 C72 45 86 46 90 52" stroke-width="1.8" opacity=".35"/>
        <path d="M44 24 C50 17 60 18 64 24 C66 28 61 30 58 27" stroke-width="1.6" opacity=".3"/>
        <path d="M78 30 C84 26 90 28 93 33" stroke-width="1.4" opacity=".28"/>
      </g>
      <!-- lavender shading in the hollows -->
      <ellipse cx="50" cy="40" rx="9" ry="4" fill="#C6B8E0" opacity=".35" filter="url(#fog_puff-ink)"/>
      <ellipse cx="76" cy="44" rx="8" ry="3.5" fill="#C6B8E0" opacity=".3" filter="url(#fog_puff-ink)"/>
    </g>
  </g>
  <!-- top light -->
  <ellipse cx="58" cy="17" rx="12" ry="5" fill="#FFFFFF" opacity=".7" filter="url(#fog_puff-soft)"/>
  <ellipse cx="36" cy="27" rx="7" ry="3.5" fill="#FFFFFF" opacity=".55" filter="url(#fog_puff-soft)"/>
</svg>
