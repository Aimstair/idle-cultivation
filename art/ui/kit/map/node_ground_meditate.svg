<svg xmlns="http://www.w3.org/2000/svg" width="112" height="112" viewBox="0 0 56 56">
  <defs>
    <radialGradient id="node_ground_meditate-glow" cx=".5" cy=".5" r=".5">
      <stop offset=".66" stop-color="#8FF0C8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#3FC79A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="node_ground_meditate-plaque" gradientUnits="userSpaceOnUse" cx="22" cy="21" r="27">
      <stop offset="0" stop-color="#7FE3BC"/>
      <stop offset=".5" stop-color="#2FA67E"/>
      <stop offset="1" stop-color="#0A4F3C"/>
    </radialGradient>
    <linearGradient id="node_ground_meditate-petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
