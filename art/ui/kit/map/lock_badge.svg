<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="lock_badge-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6C8"/>
      <stop offset=".3" stop-color="#FFD45A"/>
      <stop offset=".7" stop-color="#D69A2A"/>
      <stop offset="1" stop-color="#9A5E14"/>
    </linearGradient>
    <linearGradient id="lock_badge-goldH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFF6C8"/>
      <stop offset=".5" stop-color="#FFD45A"/>
      <stop offset="1" stop-color="#B8812A"/>
    </linearGradient>
    <radialGradient id="lock_badge-red" cx=".35" cy=".25" r=".9">
      <stop offset="0" stop-color="#FF6A44"/>
      <stop offset=".55" stop-color="#C21E10"/>
      <stop offset="1" stop-color="#5A0A04"/>
    </radialGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="16" cy="30.3" rx="9" ry="1.3" fill="#2A1008" opacity=".32"/>

  <!-- shackle -->
  <path d="M10.5 15 V10.5 A5 5 0 0 1 20.5 10.5 V15" fill="none" stroke="#2A1008" stroke-width="5.4" stroke-linecap="round"/>
  <path d="M10.5 15 V10.5 A5 5 0 0 1 20.5 10.5 V15" fill="none" stroke="url(#lock_badge-goldH)" stroke-width="3" stroke-linecap="round"/>
  <path d="M11.6 12.4 A4 4 0 0 1 14.6 7.2" fill="none" stroke="#FFFFFF" stroke-width=".9" stroke-linecap="round" opacity=".9"/>

  <!-- red cord + tassel -->
  <path d="M21 9.5 C26.5 10.5 27.5 16 26.8 21.5" fill="none" stroke="#2A1008" stroke-width="3" stroke-linecap="round"/>
  <path d="M21 9.5 C26.5 10.5 27.5 16 26.8 21.5" fill="none" stroke="#C21E10" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M25.2 23.2 H28.4 L29.6 29.6 H24 Z" fill="url(#lock_badge-red)" stroke="#2A1008" stroke-width="1.1" stroke-linejoin="round"/>
  <path d="M25.6 25 L25.2 28.6 M26.8 25 L26.8 28.6 M28 25 L28.4 28.6" fill="none" stroke="#5A0A04" stroke-width=".7" stroke-linecap="round" opacity=".8"/>
  <circle cx="26.8" cy="22.6" r="1.9" fill="url(#lock_badge-gold)" stroke="#2A1008" stroke-width="1.1"/>

  <!-- body -->
  <rect x="6.5" y="14.5" width="18" height="13.5" rx="2.8" fill="url(#lock_badge-gold)" stroke="#2A1008" stroke-width="1.3"/>
  <path d="M8.6 17 H14" fill="none" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" opacity=".85"/>
  <path d="M8.8 25.6 H22.4" fill="none" stroke="#7A4A10" stroke-width=".9" stroke-linecap="round" opacity=".55"/>
  <!-- keyhole -->
  <circle cx="15.5" cy="20" r="1.7" fill="#2A1008"/>
  <path d="M15.5 20.5 V24" fill="none" stroke="#2A1008" stroke-width="1.7" stroke-linecap="round"/>
</svg>
