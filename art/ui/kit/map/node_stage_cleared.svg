<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 48 48">
  <defs>
    <radialGradient id="node_stage_cleared-stone" gradientUnits="userSpaceOnUse" cx="19" cy="18" r="22">
      <stop offset="0" stop-color="#F4F0F8"/>
      <stop offset=".5" stop-color="#C4BDD2"/>
      <stop offset="1" stop-color="#857D98"/>
    </radialGradient>
    <radialGradient id="node_stage_cleared-inset" gradientUnits="userSpaceOnUse" cx="26" cy="25" r="15">
      <stop offset=".78" stop-color="#2A1008" stop-opacity="0"/>
      <stop offset="1" stop-color="#2A1008" stop-opacity=".35"/>
    </radialGradient>
    <linearGradient id="node_stage_cleared-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6C8"/>
      <stop offset=".3" stop-color="#FFD45A"/>
      <stop offset=".7" stop-color="#D69A2A"/>
      <stop offset="1" stop-color="#9A5E14"/>
    </linearGradient>
    <radialGradient id="node_stage_cleared-jade" cx=".36" cy=".32" r=".8">
      <stop offset="0" stop-color="#C8FFE6"/>
      <stop offset=".5" stop-color="#3FC79A"/>
      <stop offset="1" stop-color="#0E6A50"/>
    </radialGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="24" cy="45" rx="15" ry="2.1" fill="#2A1008" opacity=".32"/>

  <!-- gold rim -->
  <circle cx="24" cy="23" r="18" fill="url(#node_stage_cleared-gold)" stroke="#2A1008" stroke-width="1.9"/>
  <path d="M8.6 30.2 A16.6 16.6 0 0 0 36 35.4" fill="none" stroke="#7A4A10" stroke-width="1.1" stroke-linecap="round" opacity=".45"/>
  <!-- stone centre (clear for the stage number) -->
  <circle cx="24" cy="23" r="14.8" fill="url(#node_stage_cleared-stone)" stroke="#2A1008" stroke-width="1.3"/>
  <circle cx="24" cy="23" r="14.8" fill="url(#node_stage_cleared-inset)"/>
  <path d="M13.2 29.6 A12.6 12.6 0 0 0 33.6 30.4" fill="none" stroke="#FFFFFF" stroke-width=".9" stroke-linecap="round" opacity=".45"/>
  <!-- rim highlight -->
  <path d="M9.4 16.2 A16.4 16.4 0 0 1 17.2 7.6" fill="none" stroke="#FFF6C8" stroke-width="1.4" stroke-linecap="round" opacity=".95"/>

  <!-- jade check emblem -->
  <circle cx="36" cy="35" r="6.2" fill="url(#node_stage_cleared-jade)" stroke="#2A1008" stroke-width="1.5"/>
  <circle cx="36" cy="35" r="4.7" fill="none" stroke="#FFE7A0" stroke-opacity=".7" stroke-width=".8"/>
  <path d="M33 35.2 L35.3 37.4 L39.2 32.8" fill="none" stroke="#2A1008" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M33 35.2 L35.3 37.4 L39.2 32.8" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="33.6" cy="32.2" rx="1.1" ry=".7" fill="#FFFFFF" opacity=".8" transform="rotate(-30 33.6 32.2)"/>
</svg>
