<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="node_dungeon-stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4DEEC"/>
      <stop offset=".5" stop-color="#A69EB8"/>
      <stop offset="1" stop-color="#6E6684"/>
    </linearGradient>
    <linearGradient id="node_dungeon-step" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9C2D6"/>
      <stop offset="1" stop-color="#5E5676"/>
    </linearGradient>
    <radialGradient id="node_dungeon-portal" gradientUnits="userSpaceOnUse" cx="32" cy="42" r="18">
      <stop offset="0" stop-color="#EAD8FF"/>
      <stop offset=".4" stop-color="#9A6AE8"/>
      <stop offset="1" stop-color="#2A1460"/>
    </radialGradient>
    <linearGradient id="node_dungeon-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6C8"/>
      <stop offset=".3" stop-color="#FFD45A"/>
      <stop offset=".7" stop-color="#D69A2A"/>
      <stop offset="1" stop-color="#9A5E14"/>
    </linearGradient>
    <path id="node_dungeon-open" d="M19 55 V32 A13 13 0 0 1 45 32 V55 Z"/>
    <clipPath id="node_dungeon-clipOpen"><use href="#node_dungeon-open"/></clipPath>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="32" cy="60.8" rx="24" ry="2.4" fill="#2A1008" opacity=".36"/>

  <!-- stone arch -->
  <path d="M11 55 V30 A21 21 0 0 1 53 30 V55 Z" fill="url(#node_dungeon-stone)" stroke="#2A1008" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- block seams -->
  <g fill="none" stroke="#2A1008" stroke-width="1.1" stroke-linecap="round" opacity=".5">
    <path d="M11.5 40 H18.5 M11.5 48 H18.5 M45.5 40 H52.5 M45.5 48 H52.5"/>
    <path d="M14.5 23.5 L20.2 26.6 M22 15 L25.5 20.5 M42 15 L38.5 20.5 M49.5 23.5 L43.8 26.6"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-width=".9" stroke-linecap="round" opacity=".45">
    <path d="M11.8 41.4 H18 M11.8 49.4 H18 M45.8 41.4 H52 M45.8 49.4 H52"/>
  </g>
  <path d="M13.6 30 A18.6 18.6 0 0 1 26.5 13.5" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity=".8"/>

  <!-- portal -->
  <use href="#node_dungeon-open" fill="url(#node_dungeon-portal)"/>
  <g clip-path="url(#node_dungeon-clipOpen)">
    <path d="M32 46 C38 46 40 40 36 37.5 C31 34.5 25 39 27 45 C29.5 52.5 42 51 42.5 41.5" fill="none" stroke="#EAD8FF" stroke-width="1.8" stroke-linecap="round" opacity=".85"/>
    <path d="M30.5 41.5 C33 40 35 42.5 33.5 44.3" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" opacity=".95"/>
    <path d="M22 50 C24 46 23 42 21.5 38" fill="none" stroke="#C9A8FF" stroke-width="1.4" stroke-linecap="round" opacity=".55"/>
    <path d="M42 54 C40.5 51.5 38 50.5 35 51" fill="none" stroke="#C9A8FF" stroke-width="1.4" stroke-linecap="round" opacity=".5"/>
    <circle cx="25.5" cy="33" r="1.1" fill="#FFFFFF" opacity=".8"/>
    <circle cx="39.5" cy="35.5" r=".9" fill="#FFFFFF" opacity=".7"/>
    <path d="M19 55 H45" stroke="#3A1E7A" stroke-width="4" opacity=".5"/>
  </g>
  <!-- gold rim on the opening -->
  <use href="#node_dungeon-open" fill="none" stroke="#2A1008" stroke-width="3.6" stroke-linejoin="round"/>
  <use href="#node_dungeon-open" fill="none" stroke="url(#node_dungeon-gold)" stroke-width="2" stroke-linejoin="round"/>
  <path d="M19.8 32 A12.2 12.2 0 0 1 26 21.6" fill="none" stroke="#FFF6C8" stroke-width="1" stroke-linecap="round" opacity=".9"/>
  <!-- keystone -->
  <path d="M28.5 12.5 H35.5 L34.5 19 H29.5 Z" fill="url(#node_dungeon-gold)" stroke="#2A1008" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M30 14 H33.5" fill="none" stroke="#FFFFFF" stroke-width=".9" stroke-linecap="round" opacity=".85"/>

  <!-- step -->
  <rect x="8" y="54" width="48" height="5.6" rx="1.6" fill="url(#node_dungeon-step)" stroke="#2A1008" stroke-width="2.2"/>
  <path d="M10 55.6 H54" fill="none" stroke="#FFFFFF" stroke-width=".9" stroke-linecap="round" opacity=".55"/>
</svg>
