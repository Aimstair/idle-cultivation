<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 40 40">
  <defs>
    <linearGradient id="el_water-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6FB4F2"/>
      <stop offset=".5" stop-color="#3B7FE0"/>
      <stop offset="1" stop-color="#1A2A6E"/>
    </linearGradient>
    <radialGradient id="el_water-core" cx=".36" cy=".3" r=".8">
      <stop offset="0" stop-color="#B8E4FF"/>
      <stop offset=".55" stop-color="#3B7FE0"/>
      <stop offset="1" stop-color="#1A2A6E"/>
    </radialGradient>
  </defs>

  <!-- scalloped wave-crest rim -->
  <path d="M33.86 25.74A6.5 6.5 0 0 1 25.74 33.86A6.5 6.5 0 0 1 14.26 33.86A6.5 6.5 0 0 1 6.14 25.74A6.5 6.5 0 0 1 6.14 14.26A6.5 6.5 0 0 1 14.26 6.14A6.5 6.5 0 0 1 25.74 6.14A6.5 6.5 0 0 1 33.86 14.26A6.5 6.5 0 0 1 33.86 25.74Z"
    fill="url(#el_water-rim)" stroke="#2A1008" stroke-width="1.7" stroke-linejoin="round"/>
  <!-- inner wave line following the crests -->
  <path d="M33.86 25.74A6.5 6.5 0 0 1 25.74 33.86A6.5 6.5 0 0 1 14.26 33.86A6.5 6.5 0 0 1 6.14 25.74A6.5 6.5 0 0 1 6.14 14.26A6.5 6.5 0 0 1 14.26 6.14A6.5 6.5 0 0 1 25.74 6.14A6.5 6.5 0 0 1 33.86 14.26A6.5 6.5 0 0 1 33.86 25.74Z"
    transform="translate(20 20) scale(.84) translate(-20 -20)" fill="none" stroke="#B8E4FF" stroke-width=".9" opacity=".6"/>
  <!-- foam highlights on the lit crests -->
  <g fill="#FFFFFF" opacity=".85">
    <ellipse cx="19.2" cy="4.3" rx="2" ry=".9"/>
    <ellipse cx="9.4" cy="8.6" rx="1.7" ry=".8" transform="rotate(-45 9.4 8.6)"/>
    <ellipse cx="4.6" cy="18.6" rx="1.5" ry=".8" transform="rotate(-80 4.6 18.6)"/>
    <ellipse cx="29.6" cy="7.8" rx="1.3" ry=".7" transform="rotate(40 29.6 7.8)"/>
  </g>

  <!-- clear centre disc -->
  <circle cx="20" cy="20" r="11.3" fill="url(#el_water-core)" stroke="#2A1008" stroke-width="1.1"/>
  <circle cx="20" cy="20" r="10.1" fill="none" stroke="#B8E4FF" stroke-width=".8" opacity=".5"/>
  <path d="M12.4 15.8C13.4 13.2 15.4 11.4 17.8 10.6" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity=".85"/>
