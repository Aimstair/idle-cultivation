<svg xmlns="http://www.w3.org/2000/svg" width="144" height="144" viewBox="0 0 72 72">
  <defs>
    <linearGradient id="rarity_immortal-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6C8"/>
      <stop offset=".3" stop-color="#FFD45A"/>
      <stop offset=".7" stop-color="#D69A2A"/>
      <stop offset="1" stop-color="#9A5E14"/>
    </linearGradient>
    <linearGradient id="rarity_immortal-rimRev" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9A5E14"/>
      <stop offset=".35" stop-color="#D69A2A"/>
      <stop offset=".75" stop-color="#FFD45A"/>
      <stop offset="1" stop-color="#FFF0B0"/>
    </linearGradient>
    <linearGradient id="rarity_immortal-cloud" gradientUnits="userSpaceOnUse" x1="0" y1="1" x2="0" y2="71">
      <stop offset="0" stop-color="#FFF6C8"/>
      <stop offset=".35" stop-color="#FFD45A"/>
      <stop offset=".7" stop-color="#E0A632"/>
      <stop offset="1" stop-color="#B07418"/>
    </linearGradient>
    <radialGradient id="rarity_immortal-gem" cx=".36" cy=".3" r=".8">
      <stop offset="0" stop-color="#FF6A44"/>
      <stop offset=".5" stop-color="#C21E10"/>
      <stop offset="1" stop-color="#5A0A04"/>
    </radialGradient>
    <radialGradient id="rarity_immortal-rays" gradientUnits="userSpaceOnUse" cx="36" cy="36" r="54">
      <stop offset=".58" stop-color="#FFF6C8" stop-opacity=".85"/>
      <stop offset=".72" stop-color="#FFE7A0" stop-opacity=".55"/>
      <stop offset="1" stop-color="#FFD45A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rarity_immortal-well" gradientUnits="userSpaceOnUse" cx="30" cy="28" r="42">
      <stop offset="0" stop-color="#3C1A10"/>
      <stop offset=".6" stop-color="#220C06"/>
      <stop offset="1" stop-color="#140502"/>
    </radialGradient>
    <radialGradient id="rarity_immortal-glow" gradientUnits="userSpaceOnUse" cx="36" cy="36" r="30">
      <stop offset="0" stop-color="#FFB030" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FFB030" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFB030" stop-opacity=".4"/>
    </radialGradient>
    <linearGradient id="rarity_immortal-inset" gradientUnits="userSpaceOnUse" x1="0" y1="8" x2="0" y2="20">
      <stop offset="0" stop-color="#000000" stop-opacity=".5"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="rarity_immortal-wellclip">
      <path d="M13 8H59A5 5 0 0 1 64 13V59A5 5 0 0 1 59 64H13A5 5 0 0 1 8 59V13A5 5 0 0 1 13 8Z"/>
    </clipPath>
    <clipPath id="rarity_immortal-canvas"><rect width="72" height="72"/></clipPath>
    <g id="rarity_immortal-gemg">
      <circle r="3.6" fill="url(#rarity_immortal-cloud)" stroke="#2A1008" stroke-width="1.4"/>
      <circle r="2.3" fill="url(#rarity_immortal-gem)" stroke="#9A5E14" stroke-width=".6"/>
      <circle cx="-.75" cy="-.75" r=".7" fill="#FFFFFF" opacity=".9"/>
    </g>
  </defs>

  <!-- rays peeking out behind the frame -->
  <g clip-path="url(#rarity_immortal-canvas)" fill="url(#rarity_immortal-rays)">
    <path d="M36 36L32.2-20H39.8Z" transform="rotate(15 36 36)"/>
    <path d="M36 36L33.4-20H38.6Z" transform="rotate(45 36 36)"/>
    <path d="M36 36L32.2-20H39.8Z" transform="rotate(75 36 36)"/>
    <path d="M36 36L33.4-20H38.6Z" transform="rotate(105 36 36)"/>
    <path d="M36 36L32.2-20H39.8Z" transform="rotate(135 36 36)"/>
    <path d="M36 36L33.4-20H38.6Z" transform="rotate(165 36 36)"/>
    <path d="M36 36L32.2-20H39.8Z" transform="rotate(195 36 36)"/>
    <path d="M36 36L33.4-20H38.6Z" transform="rotate(225 36 36)"/>
    <path d="M36 36L32.2-20H39.8Z" transform="rotate(255 36 36)"/>
    <path d="M36 36L33.4-20H38.6Z" transform="rotate(285 36 36)"/>
    <path d="M36 36L32.2-20H39.8Z" transform="rotate(315 36 36)"/>
    <path d="M36 36L33.4-20H38.6Z" transform="rotate(345 36 36)"/>
  </g>

  <!-- dark inner well, warm inner glow and inset shadow -->
  <path d="M13 8H59A5 5 0 0 1 64 13V59A5 5 0 0 1 59 64H13A5 5 0 0 1 8 59V13A5 5 0 0 1 13 8Z" fill="url(#rarity_immortal-well)"/>
  <g clip-path="url(#rarity_immortal-wellclip)">
