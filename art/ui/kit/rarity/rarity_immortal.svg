    <rect x="8" y="8" width="56" height="56" fill="url(#rarity_immortal-inset)"/>
  </g>
  <path d="M13.5 9H58.5A4.5 4.5 0 0 1 63 13.5V58.5A4.5 4.5 0 0 1 58.5 63H13.5A4.5 4.5 0 0 1 9 58.5V13.5A4.5 4.5 0 0 1 13.5 9Z"
    fill="none" stroke="#FFE7A0" stroke-width="1.2" opacity=".6"/>

  <!-- gold rim: outer slope and inner slope -->
  <path fill-rule="evenodd" fill="url(#rarity_immortal-rim)"
    d="M12 3H60A9 9 0 0 1 69 12V60A9 9 0 0 1 60 69H12A9 9 0 0 1 3 60V12A9 9 0 0 1 12 3Z
       M12.2 5.6H59.8A6.6 6.6 0 0 1 66.4 12.2V59.8A6.6 6.6 0 0 1 59.8 66.4H12.2A6.6 6.6 0 0 1 5.6 59.8V12.2A6.6 6.6 0 0 1 12.2 5.6Z"/>
  <path fill-rule="evenodd" fill="url(#rarity_immortal-rimRev)"
    d="M12.2 5.6H59.8A6.6 6.6 0 0 1 66.4 12.2V59.8A6.6 6.6 0 0 1 59.8 66.4H12.2A6.6 6.6 0 0 1 5.6 59.8V12.2A6.6 6.6 0 0 1 12.2 5.6Z
       M13 8H59A5 5 0 0 1 64 13V59A5 5 0 0 1 59 64H13A5 5 0 0 1 8 59V13A5 5 0 0 1 13 8Z"/>
  <path d="M12.2 5.6H59.8A6.6 6.6 0 0 1 66.4 12.2V59.8A6.6 6.6 0 0 1 59.8 66.4H12.2A6.6 6.6 0 0 1 5.6 59.8V12.2A6.6 6.6 0 0 1 12.2 5.6Z"
    fill="none" stroke="#FFFFFF" stroke-width=".9" opacity=".5"/>

  <!-- outlines -->
  <path d="M12 3H60A9 9 0 0 1 69 12V60A9 9 0 0 1 60 69H12A9 9 0 0 1 3 60V12A9 9 0 0 1 12 3Z"
    fill="none" stroke="#2A1008" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M12.5 7H59.5A5.5 5.5 0 0 1 65 12.5V59.5A5.5 5.5 0 0 1 59.5 65H12.5A5.5 5.5 0 0 1 7 59.5V12.5A5.5 5.5 0 0 1 12.5 7Z"
    fill="none" stroke="#2A1008" stroke-width="2" stroke-linejoin="round"/>

  <!-- cloud-scroll corners: outline silhouettes first, then gold lobes, then curls and gems -->
  <g fill="#2A1008">
    <circle cx="8" cy="8" r="7.4"/><circle cx="16.5" cy="6.2" r="5.4"/><circle cx="6.2" cy="16.5" r="5.4"/>
    <circle cx="64" cy="8" r="7.4"/><circle cx="55.5" cy="6.2" r="5.4"/><circle cx="65.8" cy="16.5" r="5.4"/>
    <circle cx="8" cy="64" r="7.4"/><circle cx="16.5" cy="65.8" r="5.4"/><circle cx="6.2" cy="55.5" r="5.4"/>
    <circle cx="64" cy="64" r="7.4"/><circle cx="55.5" cy="65.8" r="5.4"/><circle cx="65.8" cy="55.5" r="5.4"/>
  </g>
  <g fill="url(#rarity_immortal-cloud)">
    <circle cx="8" cy="8" r="6"/><circle cx="16.5" cy="6.2" r="4"/><circle cx="6.2" cy="16.5" r="4"/>
    <circle cx="64" cy="8" r="6"/><circle cx="55.5" cy="6.2" r="4"/><circle cx="65.8" cy="16.5" r="4"/>
    <circle cx="8" cy="64" r="6"/><circle cx="16.5" cy="65.8" r="4"/><circle cx="6.2" cy="55.5" r="4"/>
    <circle cx="64" cy="64" r="6"/><circle cx="55.5" cy="65.8" r="4"/><circle cx="65.8" cy="55.5" r="4"/>
  </g>
  <!-- cloud curls in the side lobes -->
  <g fill="none" stroke="#9A5E14" stroke-width="1.2" stroke-linecap="round" opacity=".85">
    <path d="M18.6 6.2A2.1 2.1 0 1 0 16.5 8.3"/><path d="M6.2 18.6A2.1 2.1 0 1 1 8.3 16.5"/>
    <path d="M53.4 6.2A2.1 2.1 0 1 1 55.5 8.3"/><path d="M65.8 18.6A2.1 2.1 0 1 0 63.7 16.5"/>
    <path d="M18.6 65.8A2.1 2.1 0 1 1 16.5 63.7"/><path d="M6.2 53.4A2.1 2.1 0 1 0 8.3 55.5"/>
    <path d="M53.4 65.8A2.1 2.1 0 1 0 55.5 63.7"/><path d="M65.8 53.4A2.1 2.1 0 1 1 63.7 55.5"/>
  </g>
  <!-- highlights on the lit lobes -->
  <g fill="#FFFFFF" opacity=".85">
    <ellipse cx="5.6" cy="5.4" rx="1.9" ry="1.2" transform="rotate(-40 5.6 5.4)"/>
    <ellipse cx="61.6" cy="5.4" rx="1.9" ry="1.2" transform="rotate(-40 61.6 5.4)"/>
    <ellipse cx="15.2" cy="4.4" rx="1.2" ry=".8" transform="rotate(-30 15.2 4.4)"/>
    <ellipse cx="54.2" cy="4.4" rx="1.2" ry=".8" transform="rotate(-30 54.2 4.4)"/>
  </g>
  <!-- red lacquer gems set in the corner lobes -->
  <use href="#rarity_immortal-gemg" transform="translate(8 8)"/>
  <use href="#rarity_immortal-gemg" transform="translate(64 8)"/>
  <use href="#rarity_immortal-gemg" transform="translate(64 64)"/>
  <use href="#rarity_immortal-gemg" transform="translate(8 64)"/>

  <!-- sparkles -->
  <g fill="#FFFFFF" stroke="#2A1008" stroke-width=".35" stroke-opacity=".5" stroke-linejoin="round">
    <path d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z" transform="translate(36 4.3) scale(2.4)"/>
    <path d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z" transform="translate(67.7 36) scale(1.7)"/>
  </g>
</svg>
