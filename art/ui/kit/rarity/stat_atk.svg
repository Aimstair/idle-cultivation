<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="stat_atk-blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".5" stop-color="#CFD6E4"/>
      <stop offset="1" stop-color="#7E8698"/>
    </linearGradient>
    <linearGradient id="stat_atk-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6C8"/>
      <stop offset=".4" stop-color="#FFD45A"/>
      <stop offset="1" stop-color="#9A5E14"/>
    </linearGradient>
    <linearGradient id="stat_atk-grip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B7FE0"/>
      <stop offset="1" stop-color="#1A2A6E"/>
    </linearGradient>
  </defs>
  <!-- jian drawn upright, then turned to point up-right -->
  <g transform="rotate(45 16 16)">
    <!-- blade -->
    <path d="M16 1.5L18.7 6.5V19.4H13.3V6.5Z" fill="url(#stat_atk-blade)" stroke="#2A1008" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M16 6V19.4" fill="none" stroke="#7E8698" stroke-width=".9" opacity=".7"/>
    <path d="M14.4 7.2V17.6" fill="none" stroke="#FFFFFF" stroke-width=".9" stroke-linecap="round" opacity=".9"/>
    <!-- gold guard -->
    <path d="M10.4 19.2H21.6A1.6 1.6 0 0 1 23.2 20.8V21.4A1.6 1.6 0 0 1 21.6 23H10.4A1.6 1.6 0 0 1 8.8 21.4V20.8A1.6 1.6 0 0 1 10.4 19.2Z"
      fill="url(#stat_atk-gold)" stroke="#2A1008" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M10.6 20.4H14" fill="none" stroke="#FFFFFF" stroke-width=".8" stroke-linecap="round" opacity=".85"/>
    <!-- wrapped grip -->
    <rect x="14.1" y="23" width="3.8" height="5.6" fill="url(#stat_atk-grip)" stroke="#2A1008" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M14.3 24.6H17.7M14.3 26.3H17.7" fill="none" stroke="#B8E4FF" stroke-width=".7" opacity=".6"/>
    <!-- pommel -->
    <circle cx="16" cy="29.6" r="2" fill="url(#stat_atk-gold)" stroke="#2A1008" stroke-width="1.3"/>
    <circle cx="15.3" cy="28.9" r=".6" fill="#FFFFFF" opacity=".9"/>
  </g>
</svg>
