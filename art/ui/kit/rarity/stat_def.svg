  <circle cx="16" cy="16" r="10.2" fill="none" stroke="#FFE7A0" stroke-width=".8" opacity=".55"/>
  <!-- rivets -->
  <g fill="#6E3A0C" stroke="#2A1008" stroke-width=".6">
    <circle cx="16" cy="4.6" r="1.1"/><circle cx="27.4" cy="16" r="1.1"/><circle cx="16" cy="27.4" r="1.1"/><circle cx="4.6" cy="16" r="1.1"/>
  </g>
  <g fill="#FFF2BE" opacity=".8">
    <circle cx="15.7" cy="4.3" r=".4"/><circle cx="27.1" cy="15.7" r=".4"/><circle cx="15.7" cy="27.1" r=".4"/><circle cx="4.3" cy="15.7" r=".4"/>
  </g>
  <!-- gold boss -->
  <circle cx="16" cy="16" r="4.8" fill="url(#stat_def-boss)" stroke="#2A1008" stroke-width="1.3"/>
  <ellipse cx="14.4" cy="14.2" rx="1.5" ry=".9" transform="rotate(-35 14.4 14.2)" fill="#FFFFFF" opacity=".9"/>
  <!-- shield glint -->
  <path d="M6.6 12.4C7.6 9.4 9.8 7.2 12.6 6.2" fill="none" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" opacity=".85"/>
