<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="stat_def-bronze" cx=".36" cy=".3" r=".8">
      <stop offset="0" stop-color="#FFF2BE"/>
      <stop offset=".3" stop-color="#F6C85A"/>
      <stop offset=".7" stop-color="#CF8E26"/>
      <stop offset="1" stop-color="#8A5012"/>
    </radialGradient>
    <radialGradient id="stat_def-boss" cx=".36" cy=".32" r=".8">
      <stop offset="0" stop-color="#FFF6C8"/>
      <stop offset=".45" stop-color="#FFD45A"/>
      <stop offset="1" stop-color="#9A5E14"/>
    </radialGradient>
  </defs>
  <ellipse cx="16" cy="30" rx="10" ry="1.4" fill="#2A1008" opacity=".25"/>
