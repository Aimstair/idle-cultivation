<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="stat_stones-crystal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".45" stop-color="#8FDCFF"/>
      <stop offset="1" stop-color="#2E7FD0"/>
    </linearGradient>
    <linearGradient id="stat_stones-side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E7FD0" stop-opacity=".2"/>
      <stop offset="1" stop-color="#1A4A9E" stop-opacity=".65"/>
    </linearGradient>
    <radialGradient id="stat_stones-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#8FDCFF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8FDCFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="16" cy="16" r="15" fill="url(#stat_stones-glow)"/>
  <g transform="rotate(-12 16 16)">
    <!-- hexagonal crystal body -->
    <path d="M16 2.6L26.6 8.8V22.2L16 28.4L5.4 22.2V8.8Z" fill="url(#stat_stones-crystal)" stroke="#2A1008" stroke-width="1.4" stroke-linejoin="round"/>
    <!-- darker right facets -->
    <path d="M21.6 11.2L26.6 8.8V22.2L21.6 19.8Z" fill="url(#stat_stones-side)"/>
    <path d="M16 23.2L21.6 19.8L26.6 22.2L16 28.4Z" fill="#1A4A9E" opacity=".35"/>
    <!-- central facet -->
    <path d="M16 7.8L21.6 11.2V19.8L16 23.2L10.4 19.8V11.2Z" fill="#FFFFFF" opacity=".28"/>
    <g fill="none" stroke="#2E7FD0" stroke-width=".6" opacity=".55" stroke-linecap="round">
      <path d="M16 2.6V7.8M16 23.2V28.4M5.4 8.8L10.4 11.2M26.6 8.8L21.6 11.2M5.4 22.2L10.4 19.8M26.6 22.2L21.6 19.8"/>
      <path d="M16 7.8L21.6 11.2V19.8L16 23.2L10.4 19.8V11.2Z"/>
    </g>
    <!-- glints -->
    <path d="M9.2 10.2L12.8 6.6" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity=".95"/>
    <path d="M8.4 13.4L8.5 14.6" fill="none" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" opacity=".8"/>
  </g>
  <path d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z" transform="translate(25 6) scale(1.6)" fill="#FFFFFF" stroke="#2A1008" stroke-width=".25" stroke-opacity=".5"/>
</svg>
