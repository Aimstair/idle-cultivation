<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 40 40">
  <defs>
    <radialGradient id="el_earth-core" cx=".38" cy=".32" r=".8">
      <stop offset="0" stop-color="#E8C07A"/>
      <stop offset=".55" stop-color="#B8782E"/>
      <stop offset="1" stop-color="#7E4A16"/>
    </radialGradient>
    <linearGradient id="el_earth-stud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4DEEC"/>
      <stop offset=".5" stop-color="#A69EB8"/>
      <stop offset="1" stop-color="#6E6684"/>
    </linearGradient>
    <g id="el_earth-hex">
      <path d="M0-2.6L2.25-1.3V1.3L0 2.6L-2.25 1.3V-1.3Z" fill="url(#el_earth-stud)" stroke="#2A1008" stroke-width="1.1" stroke-linejoin="round"/>
      <path d="M-1.1-1.4L-.3-1.9" fill="none" stroke="#FFFFFF" stroke-width=".7" stroke-linecap="round" opacity=".9"/>
    </g>
  </defs>

  <!-- chunky square with a stone bevel: four facets, lit from the top-left -->
  <path d="M7 5H33A2 2 0 0 1 35 7V33A2 2 0 0 1 33 35H7A2 2 0 0 1 5 33V7A2 2 0 0 1 7 5Z" fill="#8E5A22"/>
  <path d="M5 5H35L30.5 9.5H9.5Z" fill="#E8C07A"/>
  <path d="M5 5V35L9.5 30.5V9.5Z" fill="#C89650"/>
  <path d="M35 5V35L30.5 30.5V9.5Z" fill="#8E5A22"/>
  <path d="M5 35H35L30.5 30.5H9.5Z" fill="#6A3A12"/>
  <!-- chipped stone marks on the bevel -->
  <g fill="none" stroke="#5A2E0C" stroke-width=".7" stroke-linecap="round" opacity=".5">
    <path d="M14 7.4L16 7.1M24.5 7.6L26.8 7.3M7.2 15L7.4 18M32.6 22L32.8 25.5M14 32.6L16.4 32.9"/>
  </g>
  <path d="M7 8V7H8" fill="none" stroke="#FFF2C8" stroke-width=".9" stroke-linecap="round" opacity=".8"/>
  <path d="M11 6.4H29" fill="none" stroke="#FFF2C8" stroke-width=".8" stroke-linecap="round" opacity=".55"/>

  <!-- clear ochre centre plate -->
  <path d="M10.5 9.5H29.5A1 1 0 0 1 30.5 10.5V29.5A1 1 0 0 1 29.5 30.5H10.5A1 1 0 0 1 9.5 29.5V10.5A1 1 0 0 1 10.5 9.5Z"
    fill="url(#el_earth-core)" stroke="#2A1008" stroke-width="1.1" stroke-linejoin="round"/>
  <path d="M11.5 15.5C11.8 13.4 12.8 12 14.6 11.4" fill="none" stroke="#FFF2C8" stroke-width="1.1" stroke-linecap="round" opacity=".8"/>

  <!-- outer outline -->
  <path d="M7 5H33A2 2 0 0 1 35 7V33A2 2 0 0 1 33 35H7A2 2 0 0 1 5 33V7A2 2 0 0 1 7 5Z" fill="none" stroke="#2A1008" stroke-width="1.7" stroke-linejoin="round"/>

  <!-- hexagon stone studs on the bevel band -->
  <use href="#el_earth-hex" transform="translate(7.3 7.3)"/>
  <use href="#el_earth-hex" transform="translate(32.7 7.3)"/>
  <use href="#el_earth-hex" transform="translate(7.3 32.7)"/>
  <use href="#el_earth-hex" transform="translate(32.7 32.7)"/>
  <use href="#el_earth-hex" transform="translate(20 7.3)"/>
  <use href="#el_earth-hex" transform="translate(20 32.7)"/>
  <use href="#el_earth-hex" transform="translate(7.3 20)"/>
  <use href="#el_earth-hex" transform="translate(32.7 20)"/>
