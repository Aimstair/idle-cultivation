<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="stat_luck-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6C8"/>
      <stop offset=".35" stop-color="#FFD45A"/>
      <stop offset=".75" stop-color="#D69A2A"/>
      <stop offset="1" stop-color="#9A5E14"/>
    </linearGradient>
    <linearGradient id="stat_luck-fin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD45A"/>
      <stop offset="1" stop-color="#9A5E14"/>
    </linearGradient>
  </defs>
  <!-- dorsal fin (behind the body) -->
  <path d="M13.2 12.8C14.2 8.2 18.4 5.4 22.8 7.4C19.6 8.4 16.6 10 14.4 13.2Z" fill="url(#stat_luck-fin)" stroke="#2A1008" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- koi body with forked tail -->
  <path d="M27.5 12.5C28.5 16.5 25 21.5 19.5 22.5C14.5 23.5 11 22.5 8.5 20.5C7 23.5 5 26.5 2.5 28C3.5 24.5 4.5 21 6 18.5C4.5 16.5 3.5 13 3.5 10.5C6 12 8 14.5 9 17C12 13 16 10 20.5 9.5C24 9 27 10.5 27.5 12.5Z"
    fill="url(#stat_luck-gold)" stroke="#2A1008" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- belly shade -->
  <path d="M27.5 12.5C28.5 16.5 25 21.5 19.5 22.5C14.5 23.5 11 22.5 8.5 20.5L9.4 18.6C12 20.4 16 21 19.6 20.2C23.6 19.2 26.4 16.4 27.5 12.5Z" fill="#9A5E14" opacity=".35"/>
