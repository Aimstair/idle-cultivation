  <!-- scales -->
  <g fill="none" stroke="#9A5E14" stroke-width=".8" stroke-linecap="round" opacity=".55">
    <path d="M12.4 17.6q1.5 1.6 3 0M15.6 15.4q1.5 1.6 3 0M18.8 13.8q1.5 1.6 3 0M15 19.2q1.5 1.6 3 0"/>
  </g>
  <!-- red lacquer marking and eye -->
  <circle cx="22.6" cy="11.6" r="1.6" fill="#C21E10" opacity=".85"/>
  <circle cx="25.4" cy="13.2" r="1.3" fill="#2A1008"/>
  <circle cx="25" cy="12.8" r=".45" fill="#FFFFFF"/>
  <!-- glints -->
  <path d="M19.6 10.8C21.4 10.2 23.2 10.2 24.8 10.8" fill="none" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" opacity=".9"/>
  <path d="M10.6 15.4C11.6 14.2 12.8 13.2 14 12.4" fill="none" stroke="#FFFFFF" stroke-width=".9" stroke-linecap="round" opacity=".7"/>
