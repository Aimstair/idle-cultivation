<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="st_shield-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C8FFE6"/>
      <stop offset=".5" stop-color="#3FC79A"/>
      <stop offset="1" stop-color="#0E6A50"/>
    </linearGradient>
    <linearGradient id="st_shield-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#245040"/>
      <stop offset="1" stop-color="#0B1A14"/>
    </linearGradient>
    <radialGradient id="st_shield-sheen" cx="0.3" cy="0.22" r="0.7">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="st_shield-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD75A" stop-opacity=".6"/>
      <stop offset=".55" stop-color="#FFD75A" stop-opacity=".22"/>
      <stop offset="1" stop-color="#FFD75A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="st_shield-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6C8"/>
      <stop offset=".32" stop-color="#FFD45A"/>
      <stop offset=".7" stop-color="#D69A2A"/>
      <stop offset="1" stop-color="#9A5E14"/>
    </linearGradient>
    <radialGradient id="st_shield-jade" cx="0.36" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#C8FFE6"/>
      <stop offset=".5" stop-color="#3FC79A"/>
      <stop offset="1" stop-color="#0E6A50"/>
    </radialGradient>
  </defs>

  <!-- chip: coloured rim + dark face -->
  <rect x="1.3" y="1.3" width="29.4" height="29.4" rx="7.6" fill="url(#st_shield-rim)" stroke="#2A1008" stroke-width="1.3"/>
  <rect x="4.2" y="4.2" width="23.6" height="23.6" rx="5" fill="url(#st_shield-face)" stroke="#2A1008" stroke-width=".8"/>
  <rect x="4.2" y="4.2" width="23.6" height="23.6" rx="5" fill="url(#st_shield-sheen)"/>
  
  <path d="M8 2.6 H24" fill="none" stroke="#FFFFFF" stroke-width=".9" stroke-linecap="round" opacity=".55"/>
  <path d="M2.6 8 V24" fill="none" stroke="#FFFFFF" stroke-width=".9" stroke-linecap="round" opacity=".35"/>

  <!-- pictogram -->
  <circle cx="16" cy="16" r="13" fill="url(#st_shield-glow)"/>
  <circle cx="16" cy="16" r="9.8" fill="url(#st_shield-gold)" stroke="#2A1008" stroke-width="1.2"/>
  <circle cx="16" cy="16" r="6.6" fill="url(#st_shield-jade)" stroke="#9A5E14" stroke-width=".8"/>
  <circle cx="16" cy="16" r="1.9" fill="url(#st_shield-gold)" stroke="#2A1008" stroke-width=".7"/>
  <path d="M9 12.4 A7.8 7.8 0 0 1 12.4 9" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity=".9"/>
  <ellipse cx="12.9" cy="12.6" rx="1.1" ry=".7" transform="rotate(-40 12.9 12.6)" fill="#FFFFFF" opacity=".85"/>
</svg>
