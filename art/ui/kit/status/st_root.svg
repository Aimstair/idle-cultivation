<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="st_root-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8A5C"/>
      <stop offset=".45" stop-color="#C21E10"/>
      <stop offset="1" stop-color="#5A0A04"/>
    </linearGradient>
    <linearGradient id="st_root-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A1A12"/>
      <stop offset="1" stop-color="#1C0806"/>
    </linearGradient>
    <radialGradient id="st_root-sheen" cx="0.3" cy="0.22" r="0.7">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="st_root-stone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E4DEEC"/>
      <stop offset=".5" stop-color="#A69EB8"/>
      <stop offset="1" stop-color="#6E6684"/>
    </linearGradient>
    <linearGradient id="st_root-leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C8FFE6"/>
      <stop offset=".5" stop-color="#3FC79A"/>
      <stop offset="1" stop-color="#0E6A50"/>
    </linearGradient>
  </defs>

  <!-- chip: coloured rim + dark face -->
  <rect x="1.3" y="1.3" width="29.4" height="29.4" rx="7.6" fill="url(#st_root-rim)" stroke="#2A1008" stroke-width="1.3"/>
  <rect x="4.2" y="4.2" width="23.6" height="23.6" rx="5" fill="url(#st_root-face)" stroke="#2A1008" stroke-width=".8"/>
  <rect x="4.2" y="4.2" width="23.6" height="23.6" rx="5" fill="url(#st_root-sheen)"/>
  
  <path d="M8 2.6 H24" fill="none" stroke="#FFFFFF" stroke-width=".9" stroke-linecap="round" opacity=".55"/>
  <path d="M2.6 8 V24" fill="none" stroke="#FFFFFF" stroke-width=".9" stroke-linecap="round" opacity=".35"/>

