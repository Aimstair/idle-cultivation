<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="st_burn-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8A5C"/>
      <stop offset=".45" stop-color="#C21E10"/>
      <stop offset="1" stop-color="#5A0A04"/>
    </linearGradient>
    <linearGradient id="st_burn-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A1A12"/>
      <stop offset="1" stop-color="#1C0806"/>
    </linearGradient>
    <radialGradient id="st_burn-sheen" cx="0.3" cy="0.22" r="0.7">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="st_burn-fire" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FFF2A0"/>
      <stop offset=".45" stop-color="#FFA020"/>
