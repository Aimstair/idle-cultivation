  <rect x="1.3" y="1.3" width="29.4" height="29.4" rx="7.6" fill="url(#st_burn-rim)" stroke="#2A1008" stroke-width="1.3"/>
  <rect x="4.2" y="4.2" width="23.6" height="23.6" rx="5" fill="url(#st_burn-face)" stroke="#2A1008" stroke-width=".8"/>
