  <path d="M16.3 14.4 C16.7 17.1 19.1 18.1 19.5 20.8 C19.9 23.5 17.9 25 16 25 C13.9 25 12.2 23.3 12.8 20.9 C13.1 19.4 14.3 18.6 14.2 17.1 C15.2 17.9 15.6 18.8 15.5 19.7 C16.4 18.1 16.6 16.3 16.3 14.4Z" fill="url(#st_burn-core)"/>
