      <stop offset="1" stop-color="#050305"/>
    </linearGradient>
    <radialGradient id="st_enrage-sheen" cx="0.3" cy="0.22" r="0.7">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".28"/>
