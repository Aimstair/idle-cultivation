    </radialGradient>
    <linearGradient id="st_enrage-fire" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FFF2A0"/>
      <stop offset=".45" stop-color="#FFA020"/>
      <stop offset="1" stop-color="#E8301A"/>
    </linearGradient>
    <radialGradient id="st_enrage-red" cx="0.4" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FF6A44"/>
      <stop offset=".5" stop-color="#C21E10"/>
