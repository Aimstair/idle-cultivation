  <!-- chip: coloured rim + dark face -->
  <rect x="1.3" y="1.3" width="29.4" height="29.4" rx="7.6" fill="url(#st_enrage-rim)" stroke="#2A1008" stroke-width="1.3"/>
  <rect x="4.2" y="4.2" width="23.6" height="23.6" rx="5" fill="url(#st_enrage-face)" stroke="#2A1008" stroke-width=".8"/>
  <rect x="4.2" y="4.2" width="23.6" height="23.6" rx="5" fill="url(#st_enrage-sheen)"/>
  <rect x="4.9" y="4.9" width="22.2" height="22.2" rx="4.6" fill="none" stroke="#FFE7A0" stroke-width=".6" opacity=".55"/>
  <path d="M8 2.6 H24" fill="none" stroke="#FFFFFF" stroke-width=".9" stroke-linecap="round" opacity=".55"/>
  <path d="M2.6 8 V24" fill="none" stroke="#FFFFFF" stroke-width=".9" stroke-linecap="round" opacity=".35"/>

