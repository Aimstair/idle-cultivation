<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="st_weaken-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8A5C"/>
      <stop offset=".45" stop-color="#C21E10"/>
      <stop offset="1" stop-color="#5A0A04"/>
    </linearGradient>
    <linearGradient id="st_weaken-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A1A12"/>
      <stop offset="1" stop-color="#1C0806"/>
    </linearGradient>
    <radialGradient id="st_weaken-sheen" cx="0.3" cy="0.22" r="0.7">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="st_weaken-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6C8"/>
      <stop offset=".32" stop-color="#FFD45A"/>
      <stop offset=".7" stop-color="#D69A2A"/>
      <stop offset="1" stop-color="#9A5E14"/>
    </linearGradient>
    <linearGradient id="st_weaken-steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".5" stop-color="#CFD6E4"/>
      <stop offset="1" stop-color="#7E8698"/>
    </linearGradient>
  </defs>

  <!-- chip: coloured rim + dark face -->
  <rect x="1.3" y="1.3" width="29.4" height="29.4" rx="7.6" fill="url(#st_weaken-rim)" stroke="#2A1008" stroke-width="1.3"/>
  <rect x="4.2" y="4.2" width="23.6" height="23.6" rx="5" fill="url(#st_weaken-face)" stroke="#2A1008" stroke-width=".8"/>
  <rect x="4.2" y="4.2" width="23.6" height="23.6" rx="5" fill="url(#st_weaken-sheen)"/>
  
  <path d="M8 2.6 H24" fill="none" stroke="#FFFFFF" stroke-width=".9" stroke-linecap="round" opacity=".55"/>
  <path d="M2.6 8 V24" fill="none" stroke="#FFFFFF" stroke-width=".9" stroke-linecap="round" opacity=".35"/>

  <!-- pictogram -->
  <circle cx="16" cy="6.2" r="1.9" fill="url(#st_weaken-gold)" stroke="#2A1008" stroke-width="1"/>
  <rect x="14.5" y="7.4" width="3" height="4.4" fill="#5A2A16" stroke="#2A1008" stroke-width=".9"/>
  <rect x="10.3" y="11.4" width="11.4" height="2.8" rx="1.1" fill="url(#st_weaken-gold)" stroke="#2A1008" stroke-width="1"/>
  <path d="M13.5 14.2 H18.5 V17.3 L16.2 18.6 L13.5 17Z" fill="url(#st_weaken-steel)" stroke="#2A1008" stroke-width="1.1" stroke-linejoin="round"/>
  <path d="M14.5 18.9 L17.2 20.1 L19.4 18.8 V21.6 L17 26.6 L14.5 21.6Z" fill="url(#st_weaken-steel)" stroke="#2A1008" stroke-width="1.1" stroke-linejoin="round"/>
  <path d="M14.6 15 V16.6 M15.6 20.2 V21.6" fill="none" stroke="#FFFFFF" stroke-width=".7" stroke-linecap="round" opacity=".8"/>
  <path d="M19.4 18.8 L21.2 17.6" fill="none" stroke="#2A1008" stroke-width="1" stroke-linecap="round"/>
  <circle cx="15.3" cy="5.6" r=".55" fill="#FFFFFF" opacity=".9"/>
</svg>
