<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 40 40">
  <defs>
    <radialGradient id="quest_weekly-disc" gradientUnits="userSpaceOnUse" cx="15" cy="15" r="20">
      <stop offset="0" stop-color="#B8E4FF"/>
      <stop offset=".5" stop-color="#3B7FE0"/>
      <stop offset="1" stop-color="#1A2A6E"/>
    </radialGradient>
    <radialGradient id="quest_weekly-dischi" gradientUnits="userSpaceOnUse" cx="14" cy="13" r="11">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".4"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="quest_weekly-silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".5" stop-color="#CFD6E4"/>
      <stop offset="1" stop-color="#7E8698"/>
    </linearGradient>
    <linearGradient id="quest_weekly-paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8E4"/>
      <stop offset="1" stop-color="#E9CF98"/>
    </linearGradient>
    <linearGradient id="quest_weekly-wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C07A3E"/>
      <stop offset="1" stop-color="#5A2A10"/>
    </linearGradient>
  </defs>

  <!-- badge disc -->
  <circle cx="20" cy="20.5" r="17" fill="url(#quest_weekly-disc)" stroke="#2A1008" stroke-width="1.6"/>
  <circle cx="20" cy="20.5" r="17" fill="url(#quest_weekly-dischi)"/>
  <circle cx="20" cy="20.5" r="15.4" fill="none" stroke="#FFE7A0" stroke-opacity=".8" stroke-width=".8"/>

  <!-- crescent moon -->
  <path d="M23 6.8A6.2 6.2 0 1 0 23 19.2A6 6 0 0 1 23 6.8Z" fill="url(#quest_weekly-silver)" stroke="#2A1008" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M15.8 11.6C16.2 9.8 17.3 8.6 18.8 7.9" fill="none" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" opacity=".9"/>
  <!-- stars -->
  <g fill="#FFFFFF" stroke="#2A1008" stroke-width=".3" stroke-opacity=".5" stroke-linejoin="round">
    <path d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z" transform="translate(27.5 9.5) scale(2.2)"/>
    <path d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z" transform="translate(30 16) scale(1.5)"/>
  </g>

  <!-- scroll -->
  <rect x="11.5" y="23" width="17" height="9.5" fill="url(#quest_weekly-paper)" stroke="#2A1008" stroke-width="1.4" stroke-linejoin="round"/>
  <g fill="none" stroke="#3A2A4A" stroke-width="1" stroke-linecap="round" opacity=".85">
    <path d="M14.5 26.6H21.5"/><path d="M14.5 29.2H25"/>
  </g>
  <rect x="9.5" y="21.5" width="21" height="3.4" rx="1.7" fill="url(#quest_weekly-wood)" stroke="#2A1008" stroke-width="1.3"/>
  <rect x="9.5" y="31.5" width="21" height="3.4" rx="1.7" fill="url(#quest_weekly-wood)" stroke="#2A1008" stroke-width="1.3"/>
  <path d="M12.5 22.5H26" fill="none" stroke="#FFFFFF" stroke-width=".8" stroke-linecap="round" opacity=".55"/>
  <path d="M12.5 32.5H26" fill="none" stroke="#FFFFFF" stroke-width=".8" stroke-linecap="round" opacity=".45"/>
</svg>
