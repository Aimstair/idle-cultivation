<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="ach_gold-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6C8"/>
      <stop offset=".3" stop-color="#FFD45A"/>
      <stop offset=".7" stop-color="#D69A2A"/>
      <stop offset="1" stop-color="#9A5E14"/>
    </linearGradient>
    <linearGradient id="ach_gold-goldRev" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9A5E14"/>
      <stop offset=".35" stop-color="#D69A2A"/>
      <stop offset=".75" stop-color="#FFD45A"/>
      <stop offset="1" stop-color="#FFF0B0"/>
    </linearGradient>
    <linearGradient id="ach_gold-goldSmall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF6C8"/>
      <stop offset=".4" stop-color="#FFD45A"/>
      <stop offset="1" stop-color="#B8812A"/>
    </linearGradient>
    <linearGradient id="ach_gold-lacquer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8502E"/>
      <stop offset=".5" stop-color="#C21E10"/>
      <stop offset="1" stop-color="#7A0E06"/>
    </linearGradient>
    <radialGradient id="ach_gold-jade" cx=".35" cy=".3" r=".85">
      <stop offset="0" stop-color="#C8FFE6"/>
      <stop offset=".5" stop-color="#3FC79A"/>
      <stop offset="1" stop-color="#0E6A50"/>
    </radialGradient>
    <g id="ach_gold-cloud">
      <path d="M-7 3C-7 -.5 -3.5 -1.7 -1.5 .3C-1 -2.8 1 -2.8 1.5 .3C3.5 -1.7 7 -.5 7 3Z" fill="url(#ach_gold-goldSmall)" stroke="#2A1008" stroke-width="1.8" stroke-linejoin="round"/>
      <ellipse cx="-2.6" cy=".4" rx="1.2" ry=".8" fill="#FFFFFF" opacity=".85"/>
    </g>
  </defs>

  <!-- cast shadow -->
  <circle cx="33" cy="34" r="27" fill="#2A1008" opacity=".22"/>

  <!-- outer slope (lit top) -->
  <path fill-rule="evenodd" fill="url(#ach_gold-gold)" d="M5 32A27 27 0 1 1 59 32A27 27 0 1 1 5 32ZM12 32A20 20 0 1 0 52 32A20 20 0 1 0 12 32Z"/>
  <!-- inner slope (reversed light) -->
  <path fill-rule="evenodd" fill="url(#ach_gold-goldRev)" d="M8.5 32A23.5 23.5 0 1 1 55.5 32A23.5 23.5 0 1 1 8.5 32ZM12 32A20 20 0 1 0 52 32A20 20 0 1 0 12 32Z"/>
  <!-- red lacquer inlay ring on the ridge -->
  <circle cx="32" cy="32" r="23.5" fill="none" stroke="#2A1008" stroke-width="3.4"/>
  <circle cx="32" cy="32" r="23.5" fill="none" stroke="url(#ach_gold-lacquer)" stroke-width="2.2"/>
  <path d="M13.2 24A20 20 0 0 1 21 14.5" fill="none" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" opacity=".6"/>
  <path d="M10 20.5A25 25 0 0 1 20.5 10" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" opacity=".8"/>

  <!-- outlines -->
  <circle cx="32" cy="32" r="27" fill="none" stroke="#2A1008" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="20" fill="none" stroke="#2A1008" stroke-width="1.8"/>

  <!-- cloud bumps at the sides and bottom -->
  <use href="#ach_gold-cloud" transform="translate(7.5 32) rotate(-90)"/>
  <use href="#ach_gold-cloud" transform="translate(56.5 32) rotate(90)"/>
  <use href="#ach_gold-cloud" transform="translate(32 56.5) rotate(180)"/>

  <!-- top cloud crest with a jade gem -->
  <path d="M22 10C22 5.5 26.5 3.6 29.5 5.8C30.2 2.2 33.8 2.2 34.5 5.8C37.5 3.6 42 5.5 42 10Z" fill="url(#ach_gold-goldSmall)" stroke="#2A1008" stroke-width="2" stroke-linejoin="round"/>
  <ellipse cx="27.2" cy="5.6" rx="1.4" ry=".9" fill="#FFFFFF" opacity=".85"/>
  <circle cx="32" cy="8.5" r="2.8" fill="url(#ach_gold-jade)" stroke="#2A1008" stroke-width="1.4"/>
  <ellipse cx="31.1" cy="7.6" rx=".9" ry=".6" fill="#FFFFFF" opacity=".9"/>
</svg>
