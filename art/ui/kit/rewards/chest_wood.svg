  <path d="M10.5 36H69.5" fill="none" stroke="#3A190C" stroke-width="1.2" stroke-linecap="round" opacity=".45"/>
  <path d="M11.5 32.5C12 28.5 14.5 26.5 18.5 26.2" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" opacity=".75"/>

  <!-- iron bands -->
