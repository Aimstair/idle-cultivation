  <rect x="54.5" y="23" width="7.5" height="47.5" rx="1.2" fill="url(#chest_wood-iron)" stroke="#2A1008" stroke-width="2" stroke-linejoin="round"/>
  <path d="M19.8 26V67" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".55"/>
  <path d="M56.3 26V67" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".55"/>
  <g fill="#2A1008" opacity=".7">
    <circle cx="21.75" cy="31" r="1.1"/><circle cx="21.75" cy="47" r="1.1"/><circle cx="21.75" cy="63" r="1.1"/>
    <circle cx="58.25" cy="31" r="1.1"/><circle cx="58.25" cy="47" r="1.1"/><circle cx="58.25" cy="63" r="1.1"/>
  </g>

  <!-- lock plate -->
  <path d="M34 37.5H46V47.5Q46 50 43.5 50H36.5Q34 50 34 47.5Z" fill="url(#chest_wood-ironV)" stroke="#2A1008" stroke-width="2" stroke-linejoin="round"/>
