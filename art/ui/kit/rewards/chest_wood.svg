<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="chest_wood-wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C07A3E"/>
      <stop offset=".55" stop-color="#8E4A1E"/>
      <stop offset="1" stop-color="#5A2A10"/>
    </linearGradient>
    <linearGradient id="chest_wood-lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D89050"/>
      <stop offset=".5" stop-color="#A0582A"/>
      <stop offset="1" stop-color="#6A3414"/>
    </linearGradient>
    <linearGradient id="chest_wood-iron" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E4E8F0"/>
      <stop offset=".45" stop-color="#8E96A8"/>
      <stop offset="1" stop-color="#464C5A"/>
    </linearGradient>
    <linearGradient id="chest_wood-ironV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4E8F0"/>
      <stop offset=".5" stop-color="#8E96A8"/>
      <stop offset="1" stop-color="#464C5A"/>
    </linearGradient>
  </defs>

  <!-- cast shadow -->
  <ellipse cx="40" cy="72" rx="31" ry="3" fill="#2A1008" opacity=".3"/>

  <!-- body -->
  <rect x="11" y="41" width="58" height="29" rx="3" fill="url(#chest_wood-wood)" stroke="#2A1008" stroke-width="3.1" stroke-linejoin="round"/>
  <g fill="none" stroke="#3A190C" stroke-width="1.2" stroke-linecap="round" opacity=".55">
    <path d="M13.5 51H66.5"/>
    <path d="M13.5 60.5H66.5"/>
  </g>
  <path d="M14.2 44.5V66" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" opacity=".35"/>

