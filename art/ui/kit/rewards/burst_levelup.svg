<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 160 160">
  <defs>
    <radialGradient id="burst_levelup-fade" gradientUnits="userSpaceOnUse" cx="80" cy="80" r="80">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="burst_levelup-centre" gradientUnits="userSpaceOnUse" cx="80" cy="80" r="46">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#FFFBE6" stop-opacity=".6"/>
      <stop offset="1" stop-color="#FFF6C8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="burst_levelup-warm" gradientUnits="userSpaceOnUse" cx="80" cy="80" r="80">
      <stop offset=".3" stop-color="#E8A030" stop-opacity="0"/>
      <stop offset=".75" stop-color="#E8A030" stop-opacity=".28"/>
      <stop offset="1" stop-color="#D69A2A" stop-opacity="0"/>
    </radialGradient>
    <mask id="burst_levelup-mask">
      <rect x="0" y="0" width="160" height="160" fill="url(#burst_levelup-fade)"/>
    </mask>
    <path id="burst_levelup-ray" d="M0 0L-11.8 -120L11.8 -120Z" fill="#FFD45A"/>
  </defs>

  <g mask="url(#burst_levelup-mask)">
    <!-- pale cream field -->
    <circle cx="80" cy="80" r="120" fill="#FFF6C8"/>
    <!-- gold rays -->
    <g transform="translate(80 80)">
      <use href="#burst_levelup-ray"/>
      <use href="#burst_levelup-ray" transform="rotate(22.5)"/>
      <use href="#burst_levelup-ray" transform="rotate(45)"/>
      <use href="#burst_levelup-ray" transform="rotate(67.5)"/>
      <use href="#burst_levelup-ray" transform="rotate(90)"/>
      <use href="#burst_levelup-ray" transform="rotate(112.5)"/>
      <use href="#burst_levelup-ray" transform="rotate(135)"/>
      <use href="#burst_levelup-ray" transform="rotate(157.5)"/>
      <use href="#burst_levelup-ray" transform="rotate(180)"/>
      <use href="#burst_levelup-ray" transform="rotate(202.5)"/>
      <use href="#burst_levelup-ray" transform="rotate(225)"/>
      <use href="#burst_levelup-ray" transform="rotate(247.5)"/>
      <use href="#burst_levelup-ray" transform="rotate(270)"/>
      <use href="#burst_levelup-ray" transform="rotate(292.5)"/>
      <use href="#burst_levelup-ray" transform="rotate(315)"/>
      <use href="#burst_levelup-ray" transform="rotate(337.5)"/>
    </g>
    <!-- warm outer tint -->
    <circle cx="80" cy="80" r="80" fill="url(#burst_levelup-warm)"/>
  </g>
  <!-- soft centre -->
  <circle cx="80" cy="80" r="46" fill="url(#burst_levelup-centre)"/>
</svg>
