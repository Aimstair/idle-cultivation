<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 80 80">
  <defs>
    <radialGradient id="chest_gold_open-lacquer" gradientUnits="userSpaceOnUse" cx="26" cy="46" r="56">
      <stop offset="0" stop-color="#FF6A44"/>
      <stop offset=".5" stop-color="#C21E10"/>
      <stop offset="1" stop-color="#5A0A04"/>
    </radialGradient>
    <linearGradient id="chest_gold_open-inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A0A04"/>
      <stop offset=".6" stop-color="#A8200E"/>
      <stop offset="1" stop-color="#FF8A5A"/>
    </linearGradient>
    <linearGradient id="chest_gold_open-gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFF6C8"/>
      <stop offset=".35" stop-color="#FFD45A"/>
      <stop offset=".75" stop-color="#D69A2A"/>
      <stop offset="1" stop-color="#9A5E14"/>
    </linearGradient>
    <linearGradient id="chest_gold_open-goldV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6C8"/>
      <stop offset=".35" stop-color="#FFD45A"/>
      <stop offset=".75" stop-color="#D69A2A"/>
      <stop offset="1" stop-color="#9A5E14"/>
    </linearGradient>
    <linearGradient id="chest_gold_open-goldDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFD45A"/>
      <stop offset=".5" stop-color="#C08A28"/>
      <stop offset="1" stop-color="#7A4A10"/>
    </linearGradient>
    <linearGradient id="chest_gold_open-goldSmall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF6C8"/>
      <stop offset=".4" stop-color="#FFD45A"/>
      <stop offset="1" stop-color="#B8812A"/>
    </linearGradient>
    <radialGradient id="chest_gold_open-coin" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#FFF6C8"/>
      <stop offset=".5" stop-color="#FFD45A"/>
      <stop offset="1" stop-color="#B8812A"/>
    </radialGradient>
    <radialGradient id="chest_gold_open-gem" cx=".35" cy=".3" r=".85">
      <stop offset="0" stop-color="#FF9A7A"/>
      <stop offset=".5" stop-color="#C21E10"/>
      <stop offset="1" stop-color="#5A0A04"/>
    </radialGradient>
    <radialGradient id="chest_gold_open-jade" cx=".35" cy=".3" r=".85">
      <stop offset="0" stop-color="#C8FFE6"/>
      <stop offset=".5" stop-color="#3FC79A"/>
      <stop offset="1" stop-color="#0E6A50"/>
    </radialGradient>
    <radialGradient id="chest_gold_open-glow" gradientUnits="userSpaceOnUse" cx="40" cy="39" r="36">
      <stop offset="0" stop-color="#FFFBE6" stop-opacity=".95"/>
      <stop offset=".4" stop-color="#FFE08A" stop-opacity=".55"/>
      <stop offset="1" stop-color="#FFD45A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chest_gold_open-beam" gradientUnits="userSpaceOnUse" x1="0" y1="40" x2="0" y2="2">
      <stop offset="0" stop-color="#FFF6C8" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#FFE08A" stop-opacity=".45"/>
      <stop offset="1" stop-color="#FFD45A" stop-opacity="0"/>
