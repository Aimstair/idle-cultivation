  <!-- cast shadow -->
  <ellipse cx="40" cy="74.5" rx="33" ry="3" fill="#2A1008" opacity=".3"/>

  <!-- open lid: inner face lit from below -->
  <path d="M8 40L11 13C11.3 9.5 13 8 16 8H64C67 8 68.7 9.5 69 13L72 40Z" fill="url(#chest_gold_open-inner)" stroke="#2A1008" stroke-width="3.1" stroke-linejoin="round"/>
  <path d="M11 14.5C11.2 10.5 13 9.5 16 9.5H64C67 9.5 68.8 10.5 69 14.5V16.5H11Z" fill="url(#chest_gold_open-goldV)" stroke="#2A1008" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M15 11.6H62" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity=".8"/>
  <rect x="17" y="16.5" width="7" height="23.5" fill="url(#chest_gold_open-goldDark)" stroke="#2A1008" stroke-width="1.6" stroke-linejoin="round"/>
  <rect x="56" y="16.5" width="7" height="23.5" fill="url(#chest_gold_open-goldDark)" stroke="#2A1008" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- cloud crest on the raised lid -->
  <path d="M27 9.5C27 4.5 32 2.8 35.5 5.3C36.2 1.5 43.8 1.5 44.5 5.3C48 2.8 53 4.5 53 9.5Z" fill="url(#chest_gold_open-goldSmall)" stroke="#2A1008" stroke-width="2" stroke-linejoin="round"/>
  <ellipse cx="38.4" cy="4.4" rx="1.7" ry="1.1" fill="#FFFFFF" opacity=".85"/>

  <!-- bright golden beams -->
  <path d="M34 40L33 2H47L46 40Z" fill="url(#chest_gold_open-beam)"/>
  <path d="M30 40L14 4L22 1.5L40 40Z" fill="url(#chest_gold_open-beam)"/>
  <path d="M50 40L66 4L58 1.5L40 40Z" fill="url(#chest_gold_open-beam)"/>
  <path d="M28 40L2 18L6 11L40 40Z" fill="url(#chest_gold_open-beam)"/>
  <path d="M52 40L78 18L74 11L40 40Z" fill="url(#chest_gold_open-beam)"/>
  <circle cx="40" cy="39" r="36" fill="url(#chest_gold_open-glow)"/>

  <!-- treasure: coins, a red gem and a jade bead -->
  <g stroke="#2A1008" stroke-width="1.8" fill="url(#chest_gold_open-coin)">
    <circle cx="27" cy="39.5" r="4.6"/>
    <circle cx="53" cy="39.5" r="4.6"/>
    <circle cx="33.5" cy="42" r="4.2"/>
    <circle cx="46.5" cy="42" r="4.2"/>
  </g>
  <path d="M40 27.5L46 35.5L40 43.5L34 35.5Z" fill="url(#chest_gold_open-gem)" stroke="#2A1008" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M38 31.6L40 29.1" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity=".9"/>
  <circle cx="21" cy="42" r="3.6" fill="url(#chest_gold_open-jade)" stroke="#2A1008" stroke-width="1.6"/>
  <circle cx="59" cy="42" r="3.6" fill="url(#chest_gold_open-jade)" stroke="#2A1008" stroke-width="1.6"/>
  <g fill="#FFFFFF" opacity=".9">
    <ellipse cx="25.4" cy="37.8" rx="1.3" ry=".8"/>
    <ellipse cx="51.4" cy="37.8" rx="1.3" ry=".8"/>
    <ellipse cx="20" cy="40.9" rx=".9" ry=".6"/>
    <ellipse cx="58" cy="40.9" rx=".9" ry=".6"/>
  </g>

  <!-- gold feet -->
  <rect x="11" y="66" width="10" height="7" rx="2" fill="url(#chest_gold_open-goldV)" stroke="#2A1008" stroke-width="2" stroke-linejoin="round"/>
  <rect x="59" y="66" width="10" height="7" rx="2" fill="url(#chest_gold_open-goldV)" stroke="#2A1008" stroke-width="2" stroke-linejoin="round"/>

  <!-- body -->
  <rect x="9" y="40" width="62" height="29" rx="3" fill="url(#chest_gold_open-lacquer)" stroke="#2A1008" stroke-width="3.1" stroke-linejoin="round"/>
  <path d="M12.2 46V64" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" opacity=".4"/>
  <g fill="url(#chest_gold_open-goldSmall)" stroke="#2A1008" stroke-width="1.6" stroke-linejoin="round">
    <path d="M11 66V58C11 55.5 14 55 15 57.5C17.5 56.5 19 59 17 61.5C19 62.5 19 66 16 66Z"/>
    <path d="M69 66V58C69 55.5 66 55 65 57.5C62.5 56.5 61 59 63 61.5C61 62.5 61 66 64 66Z"/>
  </g>
  <!-- gold rim along the opening -->
  <rect x="6" y="39" width="68" height="4.8" rx="1.6" fill="url(#chest_gold_open-goldV)" stroke="#2A1008" stroke-width="2" stroke-linejoin="round"/>
  <path d="M8.5 40.4H71.5" fill="none" stroke="#FFFFFF" stroke-width=".9" stroke-linecap="round" opacity=".8"/>

  <!-- gold vertical bands on the body -->
  <rect x="15" y="40" width="8" height="29.5" rx="1.2" fill="url(#chest_gold_open-gold)" stroke="#2A1008" stroke-width="2" stroke-linejoin="round"/>
  <rect x="57" y="40" width="8" height="29.5" rx="1.2" fill="url(#chest_gold_open-gold)" stroke="#2A1008" stroke-width="2" stroke-linejoin="round"/>
  <path d="M16.9 45.5V66" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".7"/>
  <path d="M58.9 45.5V66" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".7"/>
  <g fill="#9A5E14" opacity=".8">
    <circle cx="19" cy="49" r="1.2"/><circle cx="19" cy="62" r="1.2"/>
    <circle cx="61" cy="49" r="1.2"/><circle cx="61" cy="62" r="1.2"/>
  </g>

  <!-- gold lock with a red gem -->
  <path d="M32 42H48V50.5Q48 55.5 43 55.5H37Q32 55.5 32 50.5Z" fill="url(#chest_gold_open-goldV)" stroke="#2A1008" stroke-width="2" stroke-linejoin="round"/>
  <path d="M34.3 44.2H41" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".8"/>
  <circle cx="40" cy="49" r="3.6" fill="url(#chest_gold_open-gem)" stroke="#2A1008" stroke-width="1.5"/>
  <ellipse cx="38.8" cy="47.7" rx="1.2" ry=".8" fill="#FFFFFF" opacity=".9"/>

  <!-- sparkles -->
  <g fill="#FFFFFF" stroke="#2A1008" stroke-width=".35" stroke-opacity=".5" stroke-linejoin="round">
    <path d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z" transform="translate(5 30) scale(3)"/>
    <path d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z" transform="translate(75 28) scale(2.6)"/>
    <path d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z" transform="translate(22 24) scale(2)"/>
    <path d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z" transform="translate(59 23) scale(1.8)"/>
    <path d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z" transform="translate(9 6) scale(1.8)"/>
    <path d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z" transform="translate(70 5) scale(1.6)"/>
  </g>
  <g fill="#FFD45A" opacity=".9">
    <circle cx="12" cy="36" r="1.1"/><circle cx="68" cy="35" r="1.1"/><circle cx="31" cy="12" r=".9"/><circle cx="49" cy="13" r=".9"/><circle cx="3.5" cy="46" r=".9"/><circle cx="76.5" cy="46" r=".9"/>
  </g>
</svg>
