<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="ach_silver-metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".35" stop-color="#CFD6E4"/>
      <stop offset=".75" stop-color="#9AA2B4"/>
      <stop offset="1" stop-color="#5E6678"/>
    </linearGradient>
    <linearGradient id="ach_silver-metalRev" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5E6678"/>
      <stop offset=".35" stop-color="#9AA2B4"/>
      <stop offset=".75" stop-color="#CFD6E4"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="ach_silver-tab" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".5" stop-color="#CFD6E4"/>
      <stop offset="1" stop-color="#7E8698"/>
    </linearGradient>
    <radialGradient id="ach_silver-stud" cx=".35" cy=".3" r=".85">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".6" stop-color="#B8C0D0"/>
      <stop offset="1" stop-color="#5E6678"/>
    </radialGradient>
  </defs>

  <!-- cast shadow -->
  <circle cx="33" cy="34" r="27" fill="#2A1008" opacity=".22"/>

  <!-- outer slope (lit top) -->
  <path fill-rule="evenodd" fill="url(#ach_silver-metal)" d="M5 32A27 27 0 1 1 59 32A27 27 0 1 1 5 32ZM12 32A20 20 0 1 0 52 32A20 20 0 1 0 12 32Z"/>
  <!-- inner slope (reversed light) -->
  <path fill-rule="evenodd" fill="url(#ach_silver-metalRev)" d="M8.5 32A23.5 23.5 0 1 1 55.5 32A23.5 23.5 0 1 1 8.5 32ZM12 32A20 20 0 1 0 52 32A20 20 0 1 0 12 32Z"/>
  <circle cx="32" cy="32" r="23.5" fill="none" stroke="#FFFFFF" stroke-width=".9" opacity=".6"/>
  <path d="M12.5 22.5A21.5 21.5 0 0 1 22 13" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" opacity=".9"/>

  <!-- outlines -->
  <circle cx="32" cy="32" r="27" fill="none" stroke="#2A1008" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="20" fill="none" stroke="#2A1008" stroke-width="1.8"/>

  <!-- notch marks between the studs -->
  <g fill="none" stroke="#3A190C" stroke-width="1.2" stroke-linecap="round" opacity=".6">
    <path d="M15.4 15.4L17.5 17.5"/><path d="M48.6 15.4L46.5 17.5"/>
    <path d="M15.4 48.6L17.5 46.5"/><path d="M48.6 48.6L46.5 46.5"/>
  </g>

  <!-- silver studs at the compass points -->
  <g stroke="#2A1008" stroke-width="1.6" fill="url(#ach_silver-stud)">
    <circle cx="8.5" cy="32" r="3.2"/>
    <circle cx="55.5" cy="32" r="3.2"/>
    <circle cx="32" cy="55.5" r="3.2"/>
  </g>
  <g fill="#FFFFFF" opacity=".9">
    <circle cx="7.5" cy="31" r=".9"/><circle cx="54.5" cy="31" r=".9"/><circle cx="31" cy="54.5" r=".9"/>
  </g>

  <!-- top cloud tab -->
  <path d="M23 9.5C23 5.5 27 3.8 29.8 5.8C30.4 2.8 33.6 2.8 34.2 5.8C37 3.8 41 5.5 41 9.5Z" fill="url(#ach_silver-tab)" stroke="#2A1008" stroke-width="2" stroke-linejoin="round"/>
  <ellipse cx="29.4" cy="5.6" rx="1.4" ry=".9" fill="#FFFFFF" opacity=".9"/>
</svg>
