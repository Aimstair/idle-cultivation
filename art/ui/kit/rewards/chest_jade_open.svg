<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 80 80">
  <defs>
    <radialGradient id="chest_jade_open-body" gradientUnits="userSpaceOnUse" cx="28" cy="46" r="50">
      <stop offset="0" stop-color="#9AEFCB"/>
      <stop offset=".5" stop-color="#3FC79A"/>
      <stop offset="1" stop-color="#0E6A50"/>
    </radialGradient>
    <linearGradient id="chest_jade_open-inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E6A50"/>
      <stop offset=".6" stop-color="#1E9A72"/>
      <stop offset="1" stop-color="#8FEFC8"/>
    </linearGradient>
    <linearGradient id="chest_jade_open-silver" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".45" stop-color="#CFD6E4"/>
      <stop offset="1" stop-color="#7E8698"/>
    </linearGradient>
    <linearGradient id="chest_jade_open-silverV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".5" stop-color="#CFD6E4"/>
      <stop offset="1" stop-color="#7E8698"/>
    </linearGradient>
    <linearGradient id="chest_jade_open-silverDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#CFD6E4"/>
      <stop offset=".5" stop-color="#8E96A8"/>
      <stop offset="1" stop-color="#4A5060"/>
    </linearGradient>
    <radialGradient id="chest_jade_open-gem" cx=".35" cy=".3" r=".85">
      <stop offset="0" stop-color="#C8FFE6"/>
      <stop offset=".5" stop-color="#3FC79A"/>
      <stop offset="1" stop-color="#0E6A50"/>
    </radialGradient>
    <radialGradient id="chest_jade_open-crystal" cx=".35" cy=".3" r=".85">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".5" stop-color="#8FDCFF"/>
      <stop offset="1" stop-color="#2E7FD0"/>
    </radialGradient>
    <radialGradient id="chest_jade_open-glow" gradientUnits="userSpaceOnUse" cx="40" cy="40" r="32">
      <stop offset="0" stop-color="#E6FFF4" stop-opacity=".9"/>
      <stop offset=".45" stop-color="#8FF5CC" stop-opacity=".45"/>
      <stop offset="1" stop-color="#3FC79A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chest_jade_open-beam" gradientUnits="userSpaceOnUse" x1="0" y1="41" x2="0" y2="2">
      <stop offset="0" stop-color="#C8FFE6" stop-opacity=".8"/>
      <stop offset=".5" stop-color="#8FF5CC" stop-opacity=".35"/>
      <stop offset="1" stop-color="#8FF5CC" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- cast shadow -->
  <ellipse cx="40" cy="72" rx="32" ry="3" fill="#2A1008" opacity=".3"/>

  <!-- open lid: inner face lit from below -->
  <path d="M9 41L12 12C12.3 8.5 14 7 17 7H63C66 7 67.7 8.5 68 12L71 41Z" fill="url(#chest_jade_open-inner)" stroke="#2A1008" stroke-width="3.1" stroke-linejoin="round"/>
  <path d="M12 13.5C12.2 9.5 14 8.5 17 8.5H63C66 8.5 67.8 9.5 68 13.5V15.5H12Z" fill="url(#chest_jade_open-silverV)" stroke="#2A1008" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M16 10.6H61" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity=".8"/>
  <rect x="17.8" y="15.5" width="6.6" height="25.5" fill="url(#chest_jade_open-silverDark)" stroke="#2A1008" stroke-width="1.6" stroke-linejoin="round"/>
  <rect x="55.6" y="15.5" width="6.6" height="25.5" fill="url(#chest_jade_open-silverDark)" stroke="#2A1008" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- green light beams -->
  <path d="M33 41L31 2H49L47 41Z" fill="url(#chest_jade_open-beam)"/>
  <path d="M30 41L7 10L15 4L40 41Z" fill="url(#chest_jade_open-beam)"/>
  <path d="M50 41L73 10L65 4L40 41Z" fill="url(#chest_jade_open-beam)"/>
  <circle cx="40" cy="40" r="32" fill="url(#chest_jade_open-glow)"/>

  <!-- treasure: jade beads and a spirit crystal -->
  <path d="M40 30L45 37.5L40 44L35 37.5Z" fill="url(#chest_jade_open-crystal)" stroke="#2A1008" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M38.3 33.5L40 31.4" fill="none" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" opacity=".9"/>
  <g stroke="#2A1008" stroke-width="1.8" fill="url(#chest_jade_open-gem)">
    <circle cx="29" cy="40" r="4.4"/>
    <circle cx="51" cy="40" r="4.4"/>
    <circle cx="34.5" cy="43" r="3.8"/>
    <circle cx="45.5" cy="43" r="3.8"/>
  </g>
  <g fill="#FFFFFF" opacity=".9">
    <ellipse cx="27.6" cy="38.4" rx="1.2" ry=".8"/>
    <ellipse cx="49.6" cy="38.4" rx="1.2" ry=".8"/>
  </g>

  <!-- body -->
  <rect x="10" y="41" width="60" height="29" rx="3" fill="url(#chest_jade_open-body)" stroke="#2A1008" stroke-width="3.1" stroke-linejoin="round"/>
  <path d="M13.2 46V66" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" opacity=".45"/>
  <g fill="none" stroke="#E4E8F0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13.5 62V66.5H18"/>
    <path d="M66.5 62V66.5H62"/>
  </g>
  <!-- silver rim along the opening -->
  <rect x="7" y="40" width="66" height="4.6" rx="1.6" fill="url(#chest_jade_open-silverV)" stroke="#2A1008" stroke-width="2" stroke-linejoin="round"/>
  <path d="M9.5 41.4H70.5" fill="none" stroke="#FFFFFF" stroke-width=".9" stroke-linecap="round" opacity=".8"/>

  <!-- silver vertical bands on the body -->
  <rect x="16" y="41" width="7.5" height="29.5" rx="1.2" fill="url(#chest_jade_open-silver)" stroke="#2A1008" stroke-width="2" stroke-linejoin="round"/>
  <rect x="56.5" y="41" width="7.5" height="29.5" rx="1.2" fill="url(#chest_jade_open-silver)" stroke="#2A1008" stroke-width="2" stroke-linejoin="round"/>
  <path d="M17.8 46V67" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".7"/>
  <path d="M58.3 46V67" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".7"/>
  <g fill="#2A1008" opacity=".55">
    <circle cx="19.75" cy="50" r="1.1"/><circle cx="19.75" cy="64" r="1.1"/>
    <circle cx="60.25" cy="50" r="1.1"/><circle cx="60.25" cy="64" r="1.1"/>
  </g>

  <!-- silver lock with a jade gem -->
  <path d="M33 43H47V51Q47 55.5 42.5 55.5H37.5Q33 55.5 33 51Z" fill="url(#chest_jade_open-silverV)" stroke="#2A1008" stroke-width="2" stroke-linejoin="round"/>
  <path d="M35.2 45.1H41" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".8"/>
  <circle cx="40" cy="49.3" r="3.2" fill="url(#chest_jade_open-gem)" stroke="#2A1008" stroke-width="1.5"/>
  <ellipse cx="38.9" cy="48.2" rx="1.1" ry=".7" fill="#FFFFFF" opacity=".9"/>

  <!-- sparkles -->
  <g fill="#FFFFFF" stroke="#2A1008" stroke-width=".35" stroke-opacity=".5" stroke-linejoin="round">
    <path d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z" transform="translate(6 24) scale(2.8)"/>
    <path d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z" transform="translate(74 20) scale(2.2)"/>
    <path d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z" transform="translate(24 4) scale(1.7)"/>
    <path d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z" transform="translate(58 3.5) scale(1.9)"/>
  </g>
  <g fill="#C8FFE6" opacity=".9">
    <circle cx="12" cy="36" r="1"/><circle cx="68.5" cy="33" r="1"/><circle cx="40" cy="22" r=".9"/>
  </g>
</svg>
