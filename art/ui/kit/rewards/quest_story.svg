<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 40 40">
  <defs>
    <radialGradient id="quest_story-disc" gradientUnits="userSpaceOnUse" cx="15" cy="15" r="20">
      <stop offset="0" stop-color="#A86A48"/>
      <stop offset=".5" stop-color="#5A2A16"/>
      <stop offset="1" stop-color="#1A0804"/>
    </radialGradient>
    <radialGradient id="quest_story-dischi" gradientUnits="userSpaceOnUse" cx="14" cy="13" r="11">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="quest_story-cover" cx=".35" cy=".3" r=".9">
      <stop offset="0" stop-color="#FF6A44"/>
      <stop offset=".5" stop-color="#C21E10"/>
      <stop offset="1" stop-color="#5A0A04"/>
    </radialGradient>
    <linearGradient id="quest_story-paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF8E4"/>
      <stop offset="1" stop-color="#E9CF98"/>
    </linearGradient>
    <linearGradient id="quest_story-jade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C8FFE6"/>
      <stop offset=".5" stop-color="#3FC79A"/>
      <stop offset="1" stop-color="#0E6A50"/>
    </linearGradient>
  </defs>

  <!-- badge disc -->
  <circle cx="20" cy="20.5" r="17" fill="url(#quest_story-disc)" stroke="#2A1008" stroke-width="1.6"/>
  <circle cx="20" cy="20.5" r="17" fill="url(#quest_story-dischi)"/>
  <circle cx="20" cy="20.5" r="15.4" fill="none" stroke="#FFE7A0" stroke-opacity=".8" stroke-width=".8"/>

  <!-- red lacquer cover -->
  <path d="M6 13.5C11 10.5 16.5 11 20 13.5C23.5 11 29 10.5 34 13.5V30.5C29 28.5 23.5 28.5 20 31C16.5 28.5 11 28.5 6 30.5Z" fill="url(#quest_story-cover)" stroke="#2A1008" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- pages -->
  <path d="M8 15C12 12.8 16.8 13.3 19 15.3V28.3C16.8 26.6 12 26.6 8 28.3Z" fill="url(#quest_story-paper)" stroke="#2A1008" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M32 15C28 12.8 23.2 13.3 21 15.3V28.3C23.2 26.6 28 26.6 32 28.3Z" fill="url(#quest_story-paper)" stroke="#2A1008" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M9.6 16.2C12 15 14.5 14.8 16.5 15.4" fill="none" stroke="#FFFFFF" stroke-width=".9" stroke-linecap="round" opacity=".8"/>
  <!-- ink lines (decorative, not text) -->
  <g fill="none" stroke="#3A2A4A" stroke-width="1" stroke-linecap="round" opacity=".85">
    <path d="M10.5 19.2C12.5 18.4 14.8 18.3 16.5 18.6"/>
    <path d="M10.5 22.4C12.5 21.6 14.8 21.5 16.5 21.8"/>
    <path d="M23.5 18.6C25.2 18.3 27.5 18.4 29.5 19.2"/>
  </g>
  <!-- jade bookmark -->
  <path d="M24.5 13.2H28V33L26.25 31L24.5 33Z" fill="url(#quest_story-jade)" stroke="#2A1008" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M25.6 14.5V29" fill="none" stroke="#FFFFFF" stroke-width=".7" stroke-linecap="round" opacity=".7"/>
  <!-- spine -->
  <path d="M20 13.8V30.6" fill="none" stroke="#2A1008" stroke-width="1.2" stroke-linecap="round"/>
</svg>
