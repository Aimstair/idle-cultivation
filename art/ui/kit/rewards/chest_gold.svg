<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 80 80">
  <defs>
    <radialGradient id="chest_gold-lacquer" gradientUnits="userSpaceOnUse" cx="26" cy="46" r="56">
      <stop offset="0" stop-color="#FF6A44"/>
      <stop offset=".5" stop-color="#C21E10"/>
      <stop offset="1" stop-color="#5A0A04"/>
    </radialGradient>
    <radialGradient id="chest_gold-lidLacquer" gradientUnits="userSpaceOnUse" cx="22" cy="24" r="52">
      <stop offset="0" stop-color="#FF7A54"/>
      <stop offset=".5" stop-color="#C21E10"/>
      <stop offset="1" stop-color="#5A0A04"/>
    </radialGradient>
    <linearGradient id="chest_gold-gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFF6C8"/>
      <stop offset=".35" stop-color="#FFD45A"/>
      <stop offset=".75" stop-color="#D69A2A"/>
      <stop offset="1" stop-color="#9A5E14"/>
    </linearGradient>
    <linearGradient id="chest_gold-goldV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6C8"/>
      <stop offset=".35" stop-color="#FFD45A"/>
      <stop offset=".75" stop-color="#D69A2A"/>
      <stop offset="1" stop-color="#9A5E14"/>
    </linearGradient>
    <linearGradient id="chest_gold-goldSmall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF6C8"/>
      <stop offset=".4" stop-color="#FFD45A"/>
      <stop offset="1" stop-color="#B8812A"/>
    </linearGradient>
    <radialGradient id="chest_gold-gem" cx=".35" cy=".3" r=".85">
      <stop offset="0" stop-color="#FF9A7A"/>
      <stop offset=".5" stop-color="#C21E10"/>
      <stop offset="1" stop-color="#5A0A04"/>
    </radialGradient>
  </defs>

  <!-- cast shadow -->
  <ellipse cx="40" cy="74.5" rx="33" ry="3" fill="#2A1008" opacity=".3"/>

  <!-- gold feet -->
  <rect x="11" y="66" width="10" height="7" rx="2" fill="url(#chest_gold-goldV)" stroke="#2A1008" stroke-width="2" stroke-linejoin="round"/>
  <rect x="59" y="66" width="10" height="7" rx="2" fill="url(#chest_gold-goldV)" stroke="#2A1008" stroke-width="2" stroke-linejoin="round"/>

  <!-- body -->
  <rect x="9" y="40" width="62" height="29" rx="3" fill="url(#chest_gold-lacquer)" stroke="#2A1008" stroke-width="3.1" stroke-linejoin="round"/>
  <path d="M12.2 45V64" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" opacity=".4"/>
  <!-- gold cloud brackets at the body corners -->
  <g fill="url(#chest_gold-goldSmall)" stroke="#2A1008" stroke-width="1.6" stroke-linejoin="round">
    <path d="M11 66V58C11 55.5 14 55 15 57.5C17.5 56.5 19 59 17 61.5C19 62.5 19 66 16 66Z"/>
    <path d="M69 66V58C69 55.5 66 55 65 57.5C62.5 56.5 61 59 63 61.5C61 62.5 61 66 64 66Z"/>
  </g>

  <!-- lid -->
  <path d="M6 40V31C6 25 9.5 22 15 22H65C70.5 22 74 25 74 31V40Z" fill="url(#chest_gold-lidLacquer)" stroke="#2A1008" stroke-width="3.1" stroke-linejoin="round"/>
  <path d="M9.5 31.5C10 27 12.5 25 16.5 24.7" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" opacity=".8"/>
  <path d="M9.6 36.5V31C9.6 27.5 12 25.6 15.4 25.6H64.6C68 25.6 70.4 27.5 70.4 31V36.5" fill="none" stroke="#FFD45A" stroke-width="1.2" stroke-linecap="round" opacity=".85"/>
  <!-- gold cloud crest on the lid -->
  <path d="M27 22.5C27 17.5 32 15.8 35.5 18.3C36.2 14.3 43.8 14.3 44.5 18.3C48 15.8 53 17.5 53 22.5Z" fill="url(#chest_gold-goldSmall)" stroke="#2A1008" stroke-width="2" stroke-linejoin="round"/>
  <ellipse cx="38.4" cy="17.4" rx="1.7" ry="1.1" fill="#FFFFFF" opacity=".85"/>

  <!-- gold hinge band along the lid base -->
  <rect x="6" y="37.4" width="68" height="5.4" rx="1.6" fill="url(#chest_gold-goldV)" stroke="#2A1008" stroke-width="2" stroke-linejoin="round"/>
  <path d="M8.5 38.9H71.5" fill="none" stroke="#FFFFFF" stroke-width=".9" stroke-linecap="round" opacity=".7"/>

  <!-- gold vertical bands -->
  <rect x="15" y="21.5" width="8" height="48" rx="1.2" fill="url(#chest_gold-gold)" stroke="#2A1008" stroke-width="2" stroke-linejoin="round"/>
  <rect x="57" y="21.5" width="8" height="48" rx="1.2" fill="url(#chest_gold-gold)" stroke="#2A1008" stroke-width="2" stroke-linejoin="round"/>
  <path d="M16.9 24.5V66" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".7"/>
  <path d="M58.9 24.5V66" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".7"/>
  <g fill="#9A5E14" opacity=".8">
    <circle cx="19" cy="30" r="1.2"/><circle cx="19" cy="49" r="1.2"/><circle cx="19" cy="62" r="1.2"/>
    <circle cx="61" cy="30" r="1.2"/><circle cx="61" cy="49" r="1.2"/><circle cx="61" cy="62" r="1.2"/>
  </g>

  <!-- gold lock with a red gem -->
  <path d="M32 37H48V46.5Q48 51.5 43 51.5H37Q32 51.5 32 46.5Z" fill="url(#chest_gold-goldV)" stroke="#2A1008" stroke-width="2" stroke-linejoin="round"/>
  <path d="M34.3 39.2H41" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".8"/>
  <circle cx="40" cy="44.6" r="3.6" fill="url(#chest_gold-gem)" stroke="#2A1008" stroke-width="1.5"/>
  <ellipse cx="38.8" cy="43.3" rx="1.2" ry=".8" fill="#FFFFFF" opacity=".9"/>

  <!-- glints -->
  <g fill="#FFFFFF" stroke="#2A1008" stroke-width=".35" stroke-opacity=".5" stroke-linejoin="round">
    <path d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z" transform="translate(10 19) scale(2.2)"/>
    <path d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z" transform="translate(70.5 16.5) scale(1.7)"/>
  </g>
</svg>
