<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="gear_v2-disc" gradientUnits="userSpaceOnUse" cx="24" cy="25" r="31">
      <stop offset="0" stop-color="#7FA6F0"/>
      <stop offset=".45" stop-color="#2C4FA8"/>
      <stop offset="1" stop-color="#14245C"/>
    </radialGradient>
    <radialGradient id="gear_v2-discHi" gradientUnits="userSpaceOnUse" cx="22" cy="20" r="17">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".4"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gear_v2-cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".6" stop-color="#F3F5FB"/>
      <stop offset="1" stop-color="#D9E0F0"/>
    </linearGradient>
    <linearGradient id="gear_v2-clothShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1A2A6E" stop-opacity="0"/>
      <stop offset=".6" stop-color="#1A2A6E" stop-opacity="0"/>
      <stop offset="1" stop-color="#1A2A6E" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="gear_v2-fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCD8EA"/>
    </linearGradient>
    <linearGradient id="gear_v2-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B8E4FF"/>
      <stop offset=".45" stop-color="#3B7FE0"/>
      <stop offset="1" stop-color="#1A2A6E"/>
    </linearGradient>
    <linearGradient id="gear_v2-blueH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8CC6F6"/>
      <stop offset=".5" stop-color="#3B7FE0"/>
      <stop offset="1" stop-color="#1A2A6E"/>
    </linearGradient>
    <linearGradient id="gear_v2-navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A66C4"/>
      <stop offset="1" stop-color="#16214E"/>
    </linearGradient>
    <linearGradient id="gear_v2-silver" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".45" stop-color="#CFD6E4"/>
      <stop offset="1" stop-color="#7E8698"/>
    </linearGradient>
    <linearGradient id="gear_v2-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF6C8"/>
      <stop offset=".3" stop-color="#FFD45A"/>
      <stop offset=".7" stop-color="#D69A2A"/>
      <stop offset="1" stop-color="#9A5E14"/>
    </linearGradient>
    <radialGradient id="gear_v2-red" cx=".35" cy=".3" r=".9">
      <stop offset="0" stop-color="#FF6A44"/>
      <stop offset=".55" stop-color="#C21E10"/>
      <stop offset="1" stop-color="#5A0A04"/>
    </radialGradient>
  </defs>

  <!-- backing disc -->
  <circle cx="32" cy="33" r="22" fill="url(#gear_v2-disc)" stroke="#2A1008" stroke-width="2.5"/>
  <circle cx="32" cy="33" r="22" fill="url(#gear_v2-discHi)"/>
  <circle cx="32" cy="33" r="19.8" fill="none" stroke="#FFE7A0" stroke-opacity=".8" stroke-width="1.2"/>

  <!-- jian standing upright behind the robe -->
  <g transform="rotate(7 36 34)">
    <!-- grip (mostly hidden behind the collar) -->
    <rect x="34.2" y="30.5" width="3.6" height="8" rx="1" fill="url(#gear_v2-navy)" stroke="#2A1008" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- blade -->
    <path d="M36 2.5L39.6 10.5V27.5H32.4V10.5Z" fill="url(#gear_v2-silver)" stroke="#2A1008" stroke-width="2.3" stroke-linejoin="round"/>
    <path d="M36 6V27" fill="none" stroke="#6E7890" stroke-width="1.1" stroke-linecap="round"/>
    <path d="M34.3 10.5V25.5" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".9"/>
    <!-- gold cross-guard -->
    <rect x="29.4" y="26.8" width="13.2" height="3.8" rx="1.7" fill="url(#gear_v2-gold)" stroke="#2A1008" stroke-width="1.9" stroke-linejoin="round"/>
    <path d="M31.2 28H34" fill="none" stroke="#FFFFFF" stroke-width=".9" stroke-linecap="round" opacity=".8"/>
  </g>

  <!-- cast shadow -->
  <ellipse cx="32" cy="54" rx="19" ry="2.2" fill="#2A1008" opacity=".28"/>

  <!-- folded sleeves with blue cuffs -->
  <g stroke="#2A1008" stroke-width="2.3" stroke-linejoin="round">
    <path d="M16 38L10.5 40.5V49.5L16 49.5Z" fill="url(#gear_v2-cloth)"/>
    <path d="M48 38L53.5 40.5V49.5L48 49.5Z" fill="url(#gear_v2-cloth)"/>
  </g>
  <path d="M10.5 40.5L13 39.4V49.5H10.5Z" fill="url(#gear_v2-blue)" stroke="#2A1008" stroke-width="1.3" stroke-linejoin="round"/>
  <path d="M53.5 40.5L51 39.4V49.5H53.5Z" fill="url(#gear_v2-blue)" stroke="#2A1008" stroke-width="1.3" stroke-linejoin="round"/>

  <!-- robe body -->
  <path d="M15 36Q32 30.5 49 36V50.5Q49 53 46.5 53H17.5Q15 53 15 50.5Z" fill="url(#gear_v2-cloth)"/>
  <path d="M15 36Q32 30.5 49 36V50.5Q49 53 46.5 53H17.5Q15 53 15 50.5Z" fill="url(#gear_v2-clothShade)"/>
  <!-- crossed blue lapels -->
  <path d="M38.5 34.2H44.5L34.5 46H30Z" fill="url(#gear_v2-blue)" stroke="#2A1008" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M19.5 34.2H25.5L36 46H31.5Z" fill="url(#gear_v2-blue)" stroke="#2A1008" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M24.2 36L32.6 45.2" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".8"/>
  <!-- sash -->
  <rect x="15" y="44.6" width="34" height="5.2" fill="url(#gear_v2-blueH)" stroke="#2A1008" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M16.5 45.8H47.5" fill="none" stroke="#FFD45A" stroke-width=".9" opacity=".8"/>
  <!-- body outline -->
  <path d="M15 36Q32 30.5 49 36V50.5Q49 53 46.5 53H17.5Q15 53 15 50.5Z" fill="none" stroke="#2A1008" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- gold crescent-moon buckle -->
  <path d="M33.4 43.6A3.6 3.6 0 1 0 33.4 50.8A2.7 2.7 0 1 1 33.4 43.6Z" fill="url(#gear_v2-gold)" stroke="#2A1008" stroke-width="1.3" stroke-linejoin="round"/>

  <!-- fur collar -->
  <g fill="url(#gear_v2-fur)" stroke="#2A1008" stroke-width="2">
    <circle cx="18.5" cy="37" r="3.2"/>
    <circle cx="23" cy="35.2" r="3.4"/>
    <circle cx="27.8" cy="34" r="3.5"/>
    <circle cx="32.5" cy="33.6" r="3.6"/>
    <circle cx="37.2" cy="34" r="3.5"/>
    <circle cx="42" cy="35.2" r="3.4"/>
    <circle cx="46.5" cy="37" r="3.2"/>
  </g>
  <g fill="url(#gear_v2-fur)">
    <circle cx="18.5" cy="37" r="3.2"/>
    <circle cx="23" cy="35.2" r="3.4"/>
    <circle cx="27.8" cy="34" r="3.5"/>
    <circle cx="32.5" cy="33.6" r="3.6"/>
    <circle cx="37.2" cy="34" r="3.5"/>
    <circle cx="42" cy="35.2" r="3.4"/>
    <circle cx="46.5" cy="37" r="3.2"/>
  </g>
  <g fill="#FFFFFF" opacity=".9">
    <ellipse cx="26.6" cy="32.6" rx="1.3" ry=".8"/>
    <ellipse cx="31.4" cy="32.2" rx="1.3" ry=".8"/>
    <ellipse cx="21.8" cy="34" rx="1" ry=".7"/>
  </g>

  <!-- red tassel hanging from the guard -->
  <path d="M43.2 30.6L44.6 35.2" fill="none" stroke="#C21E10" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M44.8 35.6C47 37.2 47.2 39.6 45 40.2C42.8 39.6 43 37.2 44.8 35.6Z" fill="url(#gear_v2-red)" stroke="#2A1008" stroke-width="1.4" stroke-linejoin="round"/>
  <circle cx="44.6" cy="35.2" r="1.2" fill="url(#gear_v2-gold)" stroke="#2A1008" stroke-width=".9"/>

  <!-- sparkles -->
  <g fill="#FFFFFF" stroke="#2A1008" stroke-width=".35" stroke-opacity=".5" stroke-linejoin="round">
    <path d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z" transform="translate(15 16) scale(2.2)"/>
    <path d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z" transform="translate(50 22) scale(1.5)"/>
    <path d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z" transform="translate(8 33) scale(1.4)"/>
  </g>
</svg>
