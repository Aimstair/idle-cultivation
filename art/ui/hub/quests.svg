<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="quests-disc" gradientUnits="userSpaceOnUse" cx="24" cy="25" r="31">
      <stop offset="0" stop-color="#E8604A"/>
      <stop offset=".45" stop-color="#B8281A"/>
      <stop offset="1" stop-color="#6E1208"/>
    </radialGradient>
    <radialGradient id="quests-dischi" gradientUnits="userSpaceOnUse" cx="22" cy="21" r="17">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".4"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="quests-paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8E4"/>
      <stop offset=".55" stop-color="#F6E4B8"/>
      <stop offset="1" stop-color="#E9CF98"/>
    </linearGradient>
    <linearGradient id="quests-wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C07A3E"/>
      <stop offset=".5" stop-color="#8E4A1E"/>
      <stop offset="1" stop-color="#5A2A10"/>
    </linearGradient>
    <linearGradient id="quests-cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6C8"/>
      <stop offset=".35" stop-color="#FFD45A"/>
      <stop offset=".7" stop-color="#D69A2A"/>
      <stop offset="1" stop-color="#9A5E14"/>
    </linearGradient>
    <linearGradient id="quests-gold" gradientUnits="userSpaceOnUse" x1="30" y1="19" x2="34" y2="49">
      <stop offset="0" stop-color="#FFF6C8"/>
      <stop offset=".3" stop-color="#FFD45A"/>
      <stop offset=".68" stop-color="#D69A2A"/>
      <stop offset="1" stop-color="#9A5E14"/>
    </linearGradient>
    <radialGradient id="quests-seal" cx=".35" cy=".3" r=".85">
      <stop offset="0" stop-color="#FF6A44"/>
      <stop offset=".55" stop-color="#C21E10"/>
      <stop offset="1" stop-color="#5A0A04"/>
    </radialGradient>
    <linearGradient id="quests-shade" gradientUnits="userSpaceOnUse" x1="0" y1="14" x2="0" y2="19">
      <stop offset="0" stop-color="#5A2608" stop-opacity=".35"/>
      <stop offset="1" stop-color="#5A2608" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="quests-shade2" gradientUnits="userSpaceOnUse" x1="0" y1="49" x2="0" y2="44">
      <stop offset="0" stop-color="#5A2608" stop-opacity=".3"/>
      <stop offset="1" stop-color="#5A2608" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- backing disc -->
  <circle cx="32" cy="33" r="22" fill="url(#quests-disc)" stroke="#2A1008" stroke-width="2.5"/>
  <circle cx="32" cy="33" r="22" fill="url(#quests-dischi)"/>
  <circle cx="32" cy="33" r="19.8" fill="none" stroke="#FFE7A0" stroke-opacity=".8" stroke-width="1.2"/>

  <!-- cast shadow -->
  <path d="M13.5 10H44.5V54H13.5Z" fill="#2A1008" opacity=".22" transform="translate(1.6 1.8)"/>

  <!-- parchment sheet -->
  <path d="M16.5 12H41.5V51.5H16.5Z" fill="url(#quests-paper)" stroke="#2A1008" stroke-width="2.2" stroke-linejoin="round"/>
  <rect x="16.5" y="14" width="25" height="5" fill="url(#quests-shade)"/>
  <rect x="16.5" y="44" width="25" height="5" fill="url(#quests-shade2)"/>
  <path d="M18.3 15V48.5" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".7"/>

  <!-- ink lines (decorative strokes, not text) -->
  <g fill="none" stroke="#3A2A4A" stroke-width="1.7" stroke-linecap="round" opacity=".85">
    <path d="M21 21.5H30"/>
    <path d="M21 26.5H30"/>
    <path d="M21 31.5H37"/>
    <path d="M21 36.5H33"/>
    <path d="M21 41.5H28"/>
  </g>

  <!-- red seal stamp -->
  <rect x="33" y="19" width="6.6" height="6.6" rx="1" fill="url(#quests-seal)" stroke="#2A1008" stroke-width="1.3" stroke-linejoin="round"/>
  <rect x="34.6" y="20.6" width="3.4" height="3.4" rx=".4" fill="none" stroke="#FFC0A8" stroke-width=".8" opacity=".75"/>
  <circle cx="34.5" cy="20.4" r=".6" fill="#FFFFFF" opacity=".7"/>

  <!-- top roller -->
  <rect x="12" y="8.5" width="34" height="5.8" rx="2.9" fill="url(#quests-wood)" stroke="#2A1008" stroke-width="2.2"/>
  <rect x="12.4" y="9.1" width="3.6" height="4.6" rx="1.2" fill="url(#quests-cap)" stroke="#2A1008" stroke-width="1.1"/>
  <rect x="42" y="9.1" width="3.6" height="4.6" rx="1.2" fill="url(#quests-cap)" stroke="#2A1008" stroke-width="1.1"/>
  <path d="M18 10.2H38" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".55"/>

  <!-- bottom roller -->
  <rect x="12" y="49.5" width="34" height="5.8" rx="2.9" fill="url(#quests-wood)" stroke="#2A1008" stroke-width="2.2"/>
  <rect x="12.4" y="50.1" width="3.6" height="4.6" rx="1.2" fill="url(#quests-cap)" stroke="#2A1008" stroke-width="1.1"/>
  <rect x="42" y="50.1" width="3.6" height="4.6" rx="1.2" fill="url(#quests-cap)" stroke="#2A1008" stroke-width="1.1"/>
  <path d="M18 51.2H38" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".45"/>

  <!-- big gold check mark -->
  <path d="M19 36L29 46L54 21" fill="none" stroke="#2A1008" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round" opacity=".32" transform="translate(1.4 1.8)"/>
  <path d="M19 36L29 46L54 21" fill="none" stroke="#2A1008" stroke-width="10.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M19 36L29 46L54 21" fill="none" stroke="url(#quests-gold)" stroke-width="6.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M20.6 35.6L29 43.9L52.4 21.1" fill="none" stroke="#FFF6C8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>
  <path d="M22.8 40.2L27.8 45.2" fill="none" stroke="#9A5E14" stroke-width="1.2" stroke-linecap="round" opacity=".55"/>

  <!-- sparkles -->
  <g fill="#FFFFFF" stroke="#2A1008" stroke-width=".35" stroke-opacity=".5" stroke-linejoin="round">
    <path d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z" transform="translate(8 17) scale(2.4)"/>
    <path d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z" transform="translate(55.5 36) scale(1.7)"/>
  </g>
</svg>
