<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="mail-disc" gradientUnits="userSpaceOnUse" cx="24" cy="25" r="31">
      <stop offset="0" stop-color="#E2B470"/>
      <stop offset=".45" stop-color="#A8752A"/>
      <stop offset="1" stop-color="#55340C"/>
    </radialGradient>
    <radialGradient id="mail-discHi" gradientUnits="userSpaceOnUse" cx="22" cy="20" r="17">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".4"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mail-parch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF8E4"/>
      <stop offset=".6" stop-color="#F6E6C4"/>
      <stop offset="1" stop-color="#E9CF98"/>
    </linearGradient>
    <linearGradient id="mail-flap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBEFD2"/>
      <stop offset="1" stop-color="#DDBF84"/>
    </linearGradient>
    <linearGradient id="mail-wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".6" stop-color="#F2F4FA"/>
      <stop offset="1" stop-color="#CDD5E6"/>
    </linearGradient>
    <radialGradient id="mail-seal" cx=".36" cy=".3" r=".85">
      <stop offset="0" stop-color="#FF6A44"/>
      <stop offset=".55" stop-color="#C21E10"/>
      <stop offset="1" stop-color="#5A0A04"/>
    </radialGradient>
    <linearGradient id="mail-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF6C8"/>
      <stop offset=".3" stop-color="#FFD45A"/>
      <stop offset=".7" stop-color="#D69A2A"/>
      <stop offset="1" stop-color="#9A5E14"/>
    </linearGradient>
  </defs>

  <!-- backing disc -->
  <circle cx="32" cy="33" r="22" fill="url(#mail-disc)" stroke="#2A1008" stroke-width="2.5"/>
  <circle cx="32" cy="33" r="22" fill="url(#mail-discHi)"/>
  <circle cx="32" cy="33" r="19.8" fill="none" stroke="#FFE7A0" stroke-opacity=".8" stroke-width="1.2"/>

  <!-- cast shadow -->
  <ellipse cx="32" cy="54.5" rx="21" ry="2.3" fill="#2A1008" opacity=".28"/>

  <!-- crane wings -->
  <g stroke="#2A1008" stroke-width="2.3" stroke-linejoin="round" fill="url(#mail-wing)">
    <path d="M13 46C7 46.5 2.5 41 3 33.5L6.5 37C4.5 31 5 25 8.5 20.5L10 26.5C10.5 21 12.5 17.5 16 15.5L15 24C15 29 13.5 33 13.5 36.5Z"/>
    <path d="M51 46C57 46.5 61.5 41 61 33.5L57.5 37C59.5 31 59 25 55.5 20.5L54 26.5C53.5 21 51.5 17.5 48 15.5L49 24C49 29 50.5 33 50.5 36.5Z"/>
  </g>
  <g fill="none" stroke="#B9C2D4" stroke-width="1.1" stroke-linecap="round">
    <path d="M7 38.5C8.5 40.5 10 42 12.5 43.5"/>
    <path d="M10.5 28C11 32 12 36 12.8 40"/>
    <path d="M57 38.5C55.5 40.5 54 42 51.5 43.5"/>
    <path d="M53.5 28C53 32 52 36 51.2 40"/>
  </g>
  <path d="M5.5 33.5C5.3 30.5 6.4 27 8 24.5" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity=".9"/>

  <!-- envelope -->
  <rect x="11" y="22" width="42" height="29" rx="2.6" fill="url(#mail-parch)" stroke="#2A1008" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M13 50L28 37.5M51 50L36 37.5" fill="none" stroke="#C9A870" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M14 36.5L19 40.5" fill="none" stroke="#C9A870" stroke-width="1" stroke-linecap="round" opacity=".7"/>
  <!-- flap -->
  <path d="M11.5 23.5H52.5L32 41.5Z" fill="url(#mail-flap)" stroke="#2A1008" stroke-width="2" stroke-linejoin="round"/>
  <path d="M14.5 25.5L21 31" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" opacity=".85"/>
  <!-- wax seal with gold crescent -->
  <circle cx="32" cy="40.5" r="6" fill="url(#mail-seal)" stroke="#2A1008" stroke-width="1.8"/>
  <circle cx="32" cy="40.5" r="4.4" fill="none" stroke="#FFE08A" stroke-width=".8" opacity=".75"/>
  <path d="M32.6 37.4A3.1 3.1 0 1 0 32.6 43.6A2.3 2.3 0 1 1 32.6 37.4Z" fill="url(#mail-gold)" stroke="#2A1008" stroke-width=".8" stroke-linejoin="round"/>
  <circle cx="29.6" cy="38.2" r=".8" fill="#FFFFFF" opacity=".8"/>

  <!-- sparkles -->
  <g fill="#FFFFFF" stroke="#2A1008" stroke-width=".35" stroke-opacity=".5" stroke-linejoin="round">
    <path d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z" transform="translate(23 11) scale(2.2)"/>
    <path d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z" transform="translate(43 15) scale(1.4)"/>
    <path d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z" transform="translate(6 52) scale(1.6)"/>
  </g>
</svg>
