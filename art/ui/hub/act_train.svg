<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 80 80">
  <defs>
    <!-- polished wooden post, lit from the left -->
    <linearGradient id="train-post" gradientUnits="userSpaceOnUse" x1="31.5" y1="0" x2="48.5" y2="0">
      <stop offset="0" stop-color="#E2AE70"/>
      <stop offset=".18" stop-color="#CE8A46"/>
      <stop offset=".5" stop-color="#B8733A"/>
      <stop offset=".8" stop-color="#8A4A1E"/>
      <stop offset="1" stop-color="#5A2A10"/>
    </linearGradient>
    <linearGradient id="train-iron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B4BCCC"/>
      <stop offset=".45" stop-color="#6E768A"/>
      <stop offset="1" stop-color="#363C4C"/>
    </linearGradient>
    <linearGradient id="train-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A3A1E"/>
      <stop offset=".5" stop-color="#3A190C"/>
      <stop offset="1" stop-color="#1A0804"/>
    </linearGradient>
    <radialGradient id="train-endgrain" cx=".4" cy=".36" r=".75">
      <stop offset="0" stop-color="#F0C890"/>
      <stop offset=".6" stop-color="#D49A5A"/>
      <stop offset="1" stop-color="#9A5A26"/>
    </radialGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="40" cy="71.8" rx="27" ry="3.2" fill="#2A1008" opacity=".32"/>

  <!-- ARMS (behind the post): outline pass, then wood, then cylinder shading -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- two upper arms, spread forward-up; one middle arm forward-left -->
    <path d="M36 28L15 21.5M44 28L65 21.5M37 40L23 46.5" stroke="#2A1008" stroke-width="9.6"/>
    <path d="M36 28L15 21.5M44 28L65 21.5M37 40L23 46.5" stroke="#B8733A" stroke-width="6.4"/>
    <!-- light along the top edge -->
    <path d="M34.4 25.7L18 20.7M45.6 25.7L62 20.7M31.4 40.7L24.4 44" stroke="#EDBB7E" stroke-width="1.5" opacity=".95"/>
    <!-- shade along the underside -->
    <path d="M33.4 29.05L17 24M46.6 29.05L63 24M32.8 43.8L25.8 47.1" stroke="#6A3414" stroke-width="1.5" opacity=".75"/>
  </g>

  <!-- POST -->
  <path d="M31.5 10A8.5 3 0 0 1 48.5 10V65H31.5Z" fill="url(#train-post)"/>
  <!-- wood grain -->
  <g fill="none" stroke="#6A3414" stroke-width="1.1" stroke-linecap="round" opacity=".5">
    <path d="M38.6 22Q37.4 30 38.8 38Q39.8 46 38.2 54"/>
    <path d="M43.4 22Q44.6 32 43.2 42Q42.4 48 43.8 54"/>
  </g>
  <!-- worn, struck spots -->
  <ellipse cx="40.6" cy="33.5" rx="2.6" ry="3.8" fill="#F0C890" opacity=".38"/>
  <ellipse cx="41.2" cy="46.5" rx="2.1" ry="2.9" fill="#F0C890" opacity=".32"/>
  <!-- polish highlight -->
  <path d="M34.6 22.5V53.5" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity=".45"/>
  <!-- outline -->
  <path d="M31.5 10A8.5 3 0 0 1 48.5 10V65H31.5Z" fill="none" stroke="#2A1008" stroke-width="3.1" stroke-linejoin="round"/>
  <!-- end grain on top -->
  <ellipse cx="40" cy="10" rx="8.5" ry="3" fill="url(#train-endgrain)" stroke="#2A1008" stroke-width="1.8"/>
  <ellipse cx="40" cy="10.1" rx="4" ry="1.3" fill="none" stroke="#8A4A1E" stroke-width="1" opacity=".8"/>

  <!-- iron bands -->
  <g stroke="#2A1008" stroke-width="1.8" stroke-linejoin="round">
    <rect x="30.4" y="15" width="19.2" height="5" rx=".9" fill="url(#train-iron)"/>
    <rect x="30.4" y="55.5" width="19.2" height="5" rx=".9" fill="url(#train-iron)"/>
  </g>
  <g fill="#1E2230">
    <circle cx="36" cy="17.5" r="1"/><circle cx="44" cy="17.5" r="1"/>
    <circle cx="36" cy="58" r="1"/><circle cx="44" cy="58" r="1"/>
  </g>
  <path d="M32.4 16.2H37.6M32.4 56.7H37.6" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".6"/>

  <!-- BASE / STAND -->
  <rect x="25" y="62.5" width="30" height="7.5" rx="2.5" fill="url(#train-base)" stroke="#2A1008" stroke-width="3.1" stroke-linejoin="round"/>
  <path d="M28.2 64.4H39" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" opacity=".45"/>

  <!-- LEG (in front): angled forward-right, then down -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M44 52L56 56.5L59 65" stroke="#2A1008" stroke-width="9.6"/>
    <path d="M44 52L56 56.5L59 65" stroke="#B8733A" stroke-width="6.4"/>
    <path d="M48.2 51.75L55.4 54.45M54.85 58.4L56.8 63.9" stroke="#EDBB7E" stroke-width="1.5" opacity=".95"/>
    <path d="M48.6 55.2L54.6 57.6" stroke="#6A3414" stroke-width="1.5" opacity=".75"/>
  </g>

  <!-- end-grain caps on the arm and leg tips -->
  <g stroke="#2A1008" stroke-width="1.3">
    <circle cx="15" cy="21.5" r="2.7" fill="url(#train-endgrain)"/>
    <circle cx="65" cy="21.5" r="2.7" fill="url(#train-endgrain)"/>
    <circle cx="23" cy="46.5" r="2.7" fill="url(#train-endgrain)"/>
    <circle cx="59" cy="65" r="2.7" fill="url(#train-endgrain)"/>
  </g>
  <g fill="none" stroke="#8A4A1E" stroke-width=".9" opacity=".8">
    <circle cx="15" cy="21.5" r="1.2"/>
    <circle cx="65" cy="21.5" r="1.2"/>
    <circle cx="23" cy="46.5" r="1.2"/>
    <circle cx="59" cy="65" r="1.2"/>
  </g>

  <!-- gold effort / impact lines -->
  <g fill="none" stroke-linecap="round">
    <path d="M9.4 15.6L5.4 11.4M8 23L2.6 24M70.6 15.6L74.6 11.4M72 23L77.4 24" stroke="#2A1008" stroke-width="4"/>
    <path d="M9.4 15.6L5.4 11.4M8 23L2.6 24M70.6 15.6L74.6 11.4M72 23L77.4 24" stroke="#FFE7A0" stroke-width="2.2"/>
  </g>
</svg>
