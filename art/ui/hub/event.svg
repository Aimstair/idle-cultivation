<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="event-disc" gradientUnits="userSpaceOnUse" cx="24" cy="25" r="31">
      <stop offset="0" stop-color="#C8503C"/>
      <stop offset=".45" stop-color="#8E1E14"/>
      <stop offset="1" stop-color="#4E0C06"/>
    </radialGradient>
    <radialGradient id="event-dischi" gradientUnits="userSpaceOnUse" cx="22" cy="21" r="17">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".4"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="event-body" cx=".38" cy=".32" r=".82">
      <stop offset="0" stop-color="#FF6A44"/>
      <stop offset=".55" stop-color="#C21E10"/>
      <stop offset="1" stop-color="#5A0A04"/>
    </radialGradient>
    <radialGradient id="event-glow" gradientUnits="userSpaceOnUse" cx="32" cy="29" r="13">
      <stop offset="0" stop-color="#FFF2A0" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#FFB040" stop-opacity=".55"/>
      <stop offset="1" stop-color="#FF8020" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="event-halo" gradientUnits="userSpaceOnUse" cx="32" cy="28" r="26">
      <stop offset="0" stop-color="#FFB060" stop-opacity=".45"/>
      <stop offset="1" stop-color="#FFB060" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="event-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6C8"/>
      <stop offset=".3" stop-color="#FFD45A"/>
      <stop offset=".65" stop-color="#D69A2A"/>
      <stop offset="1" stop-color="#9A5E14"/>
    </linearGradient>
    <linearGradient id="event-tassel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF6A44"/>
      <stop offset=".5" stop-color="#C21E10"/>
      <stop offset="1" stop-color="#7A1008"/>
    </linearGradient>
    <clipPath id="event-bodyclip">
      <ellipse cx="32" cy="28" rx="17.5" ry="15.5"/>
    </clipPath>
  </defs>

  <!-- backing disc -->
  <circle cx="32" cy="33" r="22" fill="url(#event-disc)" stroke="#2A1008" stroke-width="2.5"/>
  <circle cx="32" cy="33" r="22" fill="url(#event-dischi)"/>
  <circle cx="32" cy="33" r="19.8" fill="none" stroke="#FFE7A0" stroke-opacity=".8" stroke-width="1.2"/>
  <circle cx="32" cy="28" r="26" fill="url(#event-halo)"/>

  <!-- hanging cord -->
  <path d="M32 2.5V9" fill="none" stroke="#2A1008" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M32 2.5V9" fill="none" stroke="#FFD45A" stroke-width="1.3" stroke-linecap="round"/>

  <!-- lantern body -->
  <ellipse cx="32" cy="28" rx="17.5" ry="15.5" fill="url(#event-body)"/>
  <g clip-path="url(#event-bodyclip)">
    <ellipse cx="32" cy="29" rx="12" ry="12" fill="url(#event-glow)"/>
    <g fill="none" stroke="#5A0A04" stroke-width="1.2" opacity=".55">
      <ellipse cx="32" cy="28" rx="5.5" ry="15.5"/>
      <ellipse cx="32" cy="28" rx="11.5" ry="15.5"/>
    </g>
    <g fill="none" stroke="#FFB080" stroke-width=".8" opacity=".35">
      <ellipse cx="32.8" cy="28" rx="5.5" ry="15.5"/>
      <ellipse cx="32.8" cy="28" rx="11.5" ry="15.5"/>
    </g>
    <ellipse cx="32" cy="28" rx="17.5" ry="15.5" fill="none" stroke="#5A0A04" stroke-width="5" opacity=".35"/>
  </g>
  <ellipse cx="32" cy="28" rx="17.5" ry="15.5" fill="none" stroke="#2A1008" stroke-width="2.5"/>
  <path d="M20.2 20.5C21.4 18.2 23.2 16.6 25.4 15.6" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity=".75"/>
  <path d="M18.6 24.6L18.8 23.6" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" opacity=".6"/>

  <!-- top cap -->
  <rect x="23" y="8.5" width="18" height="5" rx="1.8" fill="url(#event-gold)" stroke="#2A1008" stroke-width="2.2"/>
  <path d="M25.5 10.2H34" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".6"/>

  <!-- bottom cap -->
  <rect x="24.5" y="42" width="15" height="4.8" rx="1.6" fill="url(#event-gold)" stroke="#2A1008" stroke-width="2.2"/>
  <path d="M27 43.6H33" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".55"/>

  <!-- tassel -->
  <path d="M32 46.8V50" fill="none" stroke="#2A1008" stroke-width="3" stroke-linecap="round"/>
  <path d="M32 46.8V50" fill="none" stroke="#C21E10" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M29.4 52.5L28.3 58.2H35.7L34.6 52.5Z" fill="url(#event-tassel)" stroke="#2A1008" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M30.3 54.5L29.8 57.4M32 54.5V57.4M33.7 54.5L34.2 57.4" fill="none" stroke="#7A1008" stroke-width=".9" stroke-linecap="round" opacity=".7"/>
  <circle cx="32" cy="51.4" r="2.3" fill="url(#event-gold)" stroke="#2A1008" stroke-width="1.4"/>
  <circle cx="31.3" cy="50.7" r=".6" fill="#FFFFFF" opacity=".85"/>

  <!-- sparkles -->
  <g fill="#FFFFFF" stroke="#2A1008" stroke-width=".35" stroke-opacity=".5" stroke-linejoin="round">
    <path d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z" transform="translate(9 14) scale(2.5)"/>
    <path d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z" transform="translate(55.5 38) scale(1.6)"/>
  </g>
</svg>
