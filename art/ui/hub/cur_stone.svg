<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="cur_stone-crystal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".45" stop-color="#8FDCFF"/>
      <stop offset="1" stop-color="#2E7FD0"/>
    </linearGradient>
    <linearGradient id="cur_stone-side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E7FD0" stop-opacity=".2"/>
      <stop offset="1" stop-color="#1A4A9E" stop-opacity=".6"/>
    </linearGradient>
    <radialGradient id="cur_stone-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#8FDCFF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8FDCFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="16" cy="16" r="15" fill="url(#cur_stone-glow)"/>

  <!-- crystal body -->
  <path d="M16 2.5L27 9V23L16 29.5L5 23V9Z" fill="url(#cur_stone-crystal)" stroke="#2A1008" stroke-width="1.3" stroke-linejoin="round"/>
