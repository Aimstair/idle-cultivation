  <path d="M22 11.5L27 9V23L22 20.5Z" fill="url(#cur_stone-side)"/>
  <path d="M16 24L22 20.5L27 23L16 29.5Z" fill="#1A4A9E" opacity=".35"/>
  <!-- central facet -->
  <path d="M16 8L22 11.5V20.5L16 24L10 20.5V11.5Z" fill="#FFFFFF" opacity=".28"/>
  <g fill="none" stroke="#2E7FD0" stroke-width=".6" opacity=".55" stroke-linecap="round">
    <path d="M16 2.5V8M16 24V29.5M5 9L10 11.5M27 9L22 11.5M5 23L10 20.5M27 23L22 20.5"/>
    <path d="M16 8L22 11.5V20.5L16 24L10 20.5V11.5Z"/>
  </g>
  <!-- glints -->
  <path d="M9 10.2L12.6 6.4" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity=".95"/>
  <path d="M8.2 13.5L8.3 14.6" fill="none" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" opacity=".8"/>
  <path d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z" transform="translate(23.5 6) scale(1.5)" fill="#FFFFFF" stroke="#2A1008" stroke-width=".25" stroke-opacity=".5"/>
