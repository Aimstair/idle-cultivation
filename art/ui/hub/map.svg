<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="map-disc" gradientUnits="userSpaceOnUse" cx="24" cy="25" r="31">
      <stop offset="0" stop-color="#63C9C2"/>
      <stop offset=".45" stop-color="#1F8F8A"/>
      <stop offset="1" stop-color="#0B4A47"/>
    </radialGradient>
    <radialGradient id="map-discHi" gradientUnits="userSpaceOnUse" cx="22" cy="20" r="17">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".4"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="map-parch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF8E4"/>
      <stop offset=".55" stop-color="#F4E3BE"/>
      <stop offset="1" stop-color="#E9CF98"/>
    </linearGradient>
    <linearGradient id="map-parchShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A5A20" stop-opacity=".28"/>
      <stop offset=".12" stop-color="#8A5A20" stop-opacity="0"/>
      <stop offset=".88" stop-color="#8A5A20" stop-opacity="0"/>
      <stop offset="1" stop-color="#8A5A20" stop-opacity=".32"/>
    </linearGradient>
    <linearGradient id="map-wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D28C4C"/>
      <stop offset=".4" stop-color="#A85C26"/>
      <stop offset="1" stop-color="#5A2A10"/>
    </linearGradient>
    <linearGradient id="map-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF6C8"/>
      <stop offset=".3" stop-color="#FFD45A"/>
      <stop offset=".7" stop-color="#D69A2A"/>
      <stop offset="1" stop-color="#9A5E14"/>
    </linearGradient>
    <linearGradient id="map-mtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CFC8DE"/>
      <stop offset=".5" stop-color="#8F87A6"/>
      <stop offset="1" stop-color="#5E5676"/>
    </linearGradient>
    <linearGradient id="map-hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4DEEC"/>
      <stop offset="1" stop-color="#A69EB8"/>
    </linearGradient>
    <radialGradient id="map-flag" cx=".35" cy=".3" r=".9">
      <stop offset="0" stop-color="#FF6A44"/>
      <stop offset=".55" stop-color="#C21E10"/>
      <stop offset="1" stop-color="#5A0A04"/>
    </radialGradient>
    <clipPath id="map-sheet">
      <path d="M12 17.5C25 15.5 40 19 53 19.5V48C40 49 25 50.5 12 49.5Z"/>
    </clipPath>
  </defs>

  <!-- backing disc -->
  <circle cx="32" cy="33" r="22" fill="url(#map-disc)" stroke="#2A1008" stroke-width="2.5"/>
  <circle cx="32" cy="33" r="22" fill="url(#map-discHi)"/>
  <circle cx="32" cy="33" r="19.8" fill="none" stroke="#FFE7A0" stroke-opacity=".8" stroke-width="1.2"/>

  <!-- cast shadow -->
  <ellipse cx="32" cy="56" rx="21" ry="2.2" fill="#2A1008" opacity=".28"/>

  <g transform="rotate(7 32 33)">
    <!-- parchment sheet -->
    <path d="M12 17.5C25 15.5 40 19 53 19.5V48C40 49 25 50.5 12 49.5Z" fill="url(#map-parch)"/>
    <g clip-path="url(#map-sheet)">
      <rect x="0" y="0" width="64" height="64" fill="url(#map-parchShade)"/>
      <!-- ink-wash mountains -->
      <path d="M17 43.5L25.5 31L30.5 38L35.5 33L44.5 43.5Z" fill="url(#map-mtn)" stroke="#2A1008" stroke-width="1.3" stroke-linejoin="round"/>
      <path d="M25.5 31L27.4 33.9L25.2 34.7L23.6 33.9Z" fill="#FFFFFF" opacity=".85"/>
      <path d="M35.5 33L37.2 35.1L35.4 35.7L33.8 35.1Z" fill="#FFFFFF" opacity=".85"/>
      <path d="M12 47C17 40 23 40.5 29 47Z" fill="url(#map-hill)" stroke="#2A1008" stroke-width="1.1" stroke-linejoin="round" opacity=".95"/>
      <!-- river -->
      <path d="M13 24C19.5 28.5 25.5 21.5 32 26S44.5 30 53 31" fill="none" stroke="#1A2A6E" stroke-width="3.4" stroke-linecap="round"/>
      <path d="M13 24C19.5 28.5 25.5 21.5 32 26S44.5 30 53 31" fill="none" stroke="#3B7FE0" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M13 23.6C19.5 28 25.5 21.1 32 25.6S44.5 29.6 53 30.6" fill="none" stroke="#B8E4FF" stroke-width=".7" stroke-linecap="round" opacity=".9"/>
    </g>
    <!-- aged inner border -->
    <path d="M14.5 19.9C26 18 40 21.4 50.5 21.9V46C40 46.8 26 48.1 14.5 47.4Z" fill="none" stroke="#C9A870" stroke-width=".8" opacity=".75"/>
    <!-- dotted route -->
    <path d="M15.5 46.5C22 46 24 41 31 42S39 35.5 43.5 33" fill="none" stroke="#D82A18" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="1.9 2.4"/>
    <circle cx="15.5" cy="46.5" r="1.4" fill="#D82A18" stroke="#2A1008" stroke-width=".8"/>
    <!-- flag -->
    <path d="M43.5 33.5V21" fill="none" stroke="#2A1008" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M43.5 21L51.5 24.3L43.5 28Z" fill="url(#map-flag)" stroke="#2A1008" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M44.6 22.4L47.6 23.6" fill="none" stroke="#FFFFFF" stroke-width=".8" stroke-linecap="round" opacity=".7"/>
    <!-- sheet outline + sheen -->
    <path d="M12 17.5C25 15.5 40 19 53 19.5V48C40 49 25 50.5 12 49.5Z" fill="none" stroke="#2A1008" stroke-width="2.3" stroke-linejoin="round"/>
    <path d="M15 20.5C20 19.2 24 18.6 28 18.8" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" opacity=".8"/>

    <!-- wooden rollers -->
    <g stroke="#2A1008" stroke-width="2.2" stroke-linejoin="round">
      <rect x="5.5" y="12" width="6.5" height="41.5" rx="3.2" fill="url(#map-wood)"/>
      <rect x="52" y="15" width="6.5" height="35" rx="3.2" fill="url(#map-wood)"/>
    </g>
    <g fill="none" stroke-linecap="round">
      <path d="M7.6 16.5V49" stroke="#FFFFFF" stroke-width=".9" opacity=".45"/>
      <path d="M10.3 17V48.5" stroke="#2A1008" stroke-width=".7" opacity=".4"/>
      <path d="M54.1 19.5V45.5" stroke="#FFFFFF" stroke-width=".9" opacity=".45"/>
      <path d="M56.8 20V45" stroke="#2A1008" stroke-width=".7" opacity=".4"/>
    </g>
    <!-- gold end caps -->
    <g fill="url(#map-gold)" stroke="#2A1008" stroke-width="1.8">
      <circle cx="8.75" cy="12" r="3.4"/>
      <circle cx="8.75" cy="53.5" r="3.4"/>
      <circle cx="55.25" cy="15" r="3.4"/>
      <circle cx="55.25" cy="50" r="3.4"/>
    </g>
    <g fill="#FFFFFF" opacity=".85">
      <ellipse cx="7.7" cy="10.9" rx="1.1" ry=".8"/>
      <ellipse cx="7.7" cy="52.4" rx="1.1" ry=".8"/>
      <ellipse cx="54.2" cy="13.9" rx="1.1" ry=".8"/>
      <ellipse cx="54.2" cy="48.9" rx="1.1" ry=".8"/>
    </g>
  </g>

  <!-- sparkles -->
  <g fill="#FFFFFF" stroke="#2A1008" stroke-width=".35" stroke-opacity=".5" stroke-linejoin="round">
    <path d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z" transform="translate(28 8.5) scale(2.2)"/>
    <path d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z" transform="translate(4.5 30) scale(1.7)"/>
    <path d="M0-1Q.18-.18 1 0Q.18.18 0 1Q-.18.18-1 0Q-.18-.18 0-1Z" transform="translate(59.5 35) scale(1.5)"/>
  </g>
</svg>
