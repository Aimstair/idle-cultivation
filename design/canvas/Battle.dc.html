<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;family=Nunito:wght@500;700;800&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&amp;display=swap&amp;text=%E9%87%91%E4%B8%80%E4%BA%8C%E4%B8%89%E5%87%BB%E8%B4%A5">
<style>
body{margin:0;background:#E9E2D3}
.ic{font-family:"Nunito",ui-rounded,system-ui,sans-serif;color:#2E2A3A}
.disp{font-family:"Baloo 2","Nunito",ui-rounded,sans-serif}
.brush{font-family:"Ma Shan Zheng","Kaiti SC",serif}
.rb{width:42px;height:42px;border-radius:50%;border:3px solid #3A2A2A;background:#FFFDF8;display:grid;place-items:center;box-shadow:0 3px 0 #3A2A2A;text-decoration:none;cursor:pointer;padding:0;position:relative}
.hp{height:9px;border-radius:999px;border:2px solid #3A2A2A;background:#FFFDF8;position:relative;overflow:hidden}
.dmg{position:absolute;font-family:"Baloo 2",sans-serif;font-weight:800;-webkit-text-stroke:2px #3A2A2A;paint-order:stroke fill}
.zn{width:50px;height:50px;border-radius:50%;border:3px solid #3A2A2A;display:grid;place-items:center;box-shadow:0 4px 0 #3A2A2A;position:relative;cursor:pointer;padding:0}
.lt{width:44px;height:44px;border-radius:12px;border:3px solid var(--c);background:#FFF8EA;display:grid;place-items:center;position:relative;box-shadow:0 0 0 2px #3A2A2A}
.ct{position:absolute;right:-6px;bottom:-7px;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:10px;background:#2E2A3A;color:#FFFDF8;border:1.5px solid #3A2A2A;border-radius:999px;padding:0 4px}
.tile{border:3px solid #3A2A2A;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 2px;position:relative;box-shadow:0 4px 0 #3A2A2A;text-decoration:none}
</style>
</helmet>
