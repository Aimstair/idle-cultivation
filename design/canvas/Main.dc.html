<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {

  renderVals() {
    const a = this.state.act;
    const on = (bg, glow) => 'background:' + bg + ';color:#FFFDF8;box-shadow:0 0 0 3px ' + glow + ',0 4px 0 #3A2A2A;transform:translateY(-2px)';
    const off = 'background:#FFFDF8;color:#6B6478';
    const meta = {
      battle: { bg: '#B83E2B', title: 'Battling · Thunder Peak', rate: '+9.6 Qi/s' },
      meditate: { bg: '#277864', title: 'Meditating · Moonlit Lake', rate: '+96 Qi/s' },
      train: { bg: '#6E5DC0', title: 'Training · Drill Yard', rate: '+9.6 Qi/s' }
    }[a];
    return {
      battleStyle: a === 'battle' ? on('#B83E2B', '#F6D3CC') : off,
      meditateStyle: a === 'meditate' ? on('#277864', '#CFEBE2') : off,
      trainStyle: a === 'train' ? on('#6E5DC0', '#E3DDF7') : off,
      chipBg: meta.bg, chipTitle: meta.title, qiRate: meta.rate,
      pickBattle: () => this.setState({ act: 'battle' }),
      pickMeditate: () => this.setState({ act: 'meditate' }),
      pickTrain: () => this.setState({ act: 'train' })
    };
  }
}
</script>
