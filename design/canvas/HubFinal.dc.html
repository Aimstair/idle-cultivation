@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{opacity:.55;transform:scale(.96)}50%{opacity:1;transform:scale(1.04)}}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translateY(-200px) scale(1.1);opacity:0}}
@keyframes drift{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:.95}100%{transform:translate(-160px,260px) rotate(320deg);opacity:0}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes hover{0%,100%{transform:translateY(0) rotate(-38deg)}50%{transform:translateY(-10px) rotate(-34deg)}}
@keyframes trail{0%,100%{opacity:.35}50%{opacity:.9}}
@keyframes sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes puff{0%{transform:translateY(4px) scale(.6);opacity:0}30%{opacity:.95}100%{transform:translateY(-12px) scale(1.25);opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes twinkle{0%,100%{transform:scale(.4);opacity:.2}50%{transform:scale(1.15);opacity:1}}
@keyframes svsweep{0%{transform:translateX(-40px)}60%,100%{transform:translateX(340px)}}
@keyframes wobble{0%,92%,100%{transform:rotate(0)}94%{transform:rotate(-9deg)}96%{transform:rotate(8deg)}98%{transform:rotate(-4deg)}}
.halo{position:absolute;left:105px;top:200px;width:180px;height:180px;border-radius:50%;border:2px dashed rgba(255,231,160,.85);animation:spin 18s linear infinite}
.halo2{position:absolute;left:121px;top:216px;width:148px;height:148px;border-radius:50%;border:1.5px dotted rgba(255,246,214,.9);animation:spin 26s linear infinite reverse}
.breath{position:absolute;left:55px;top:226px;width:280px;height:280px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,231,160,.5),rgba(255,231,160,0));animation:breathe 4s ease-in-out infinite}
.mote{position:absolute;width:6px;height:6px;border-radius:50%;background:#FFF0B8;box-shadow:0 0 8px 2px rgba(255,224,138,.9);animation:rise 4.5s ease-out infinite}
.mote.c{background:#B8E8FF;box-shadow:0 0 8px 2px rgba(110,180,255,.9)}
.petal{position:absolute;width:9px;height:6px;border-radius:60% 0 60% 0;background:#F7B6C8;animation:drift 9s linear infinite}
.pulse{animation:pulse 2.2s ease-in-out infinite}
.fsword{position:absolute;left:276px;top:300px;width:22px;height:150px;animation:hover 3.6s ease-in-out infinite;transform-origin:50% 50%}
.ftrail{animation:trail 3.6s ease-in-out infinite}
.sway{transform-origin:32px 2px;animation:sway 3.2s ease-in-out infinite}
.puff{transform-box:fill-box;transform-origin:center;animation:puff 2.6s ease-out infinite}
.wheel{transform-origin:32px 32px;animation:spin 16s linear infinite}
.bob{animation:bob 2.4s ease-in-out infinite}
.tw{transform-box:fill-box;transform-origin:center;animation:twinkle 1.9s ease-in-out infinite}
.svshine{animation:svsweep 3.4s ease-in-out infinite}
.sway2{transform-origin:50% 8%;animation:sway 3.2s ease-in-out infinite}
.wob{transform-origin:50% 90%;animation:wobble 4s ease-in-out infinite}
.ring{position:absolute;border-radius:50%;border:2.5px dashed rgba(255,231,160,.9);animation:spin 10s linear infinite}
@media (prefers-reduced-motion: reduce){.halo,.halo2,.breath,.mote,.petal,.pulse,.fsword,.ftrail,.sway,.puff,.wheel,.bob,.tw,.svshine,.wob,.ring,.sway2{animation:none!important}.mote,.petal{display:none}}
