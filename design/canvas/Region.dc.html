<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Region map</title>

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;family=Nunito:wght@500;700;800&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&amp;display=swap&amp;text=%E9%87%91%E6%9C%A8%E6%B0%B4">
<style>
body{margin:0;background:#E9E2D3}
.ic{font-family:"Nunito",ui-rounded,system-ui,sans-serif;color:#2E2A3A}
.disp{font-family:"Baloo 2","Nunito",ui-rounded,sans-serif}
.brush{font-family:"Ma Shan Zheng","Kaiti SC",serif}
.rb{border-radius:50%;border:3px solid #3A2A2A;display:grid;place-items:center;box-shadow:0 3px 0 #3A2A2A;text-decoration:none;cursor:pointer;padding:0;position:relative}
.isl{position:absolute;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:#2E2A3A}
.tag{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:12px;line-height:1.1;background:#FFFDF8;border:2px solid #3A2A2A;border-radius:8px;padding:2px 7px;white-space:nowrap}
.beads{display:flex;gap:3px}
.bead{width:11px;height:11px;border-radius:50%;border:2px solid #3A2A2A;background:#EFE8DA}
.on{background:#6CC4A1}
.el{width:18px;height:18px;border-radius:50%;border:1.5px solid #3A2A2A;display:inline-grid;place-items:center;font-size:12px;background:#ECEFF4}
.chip{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:12.5px;border:2.5px solid #3A2A2A;border-radius:999px;padding:2px 10px;background:#FFFDF8;display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.gpin{width:36px;height:36px;border-radius:11px;border:2.5px dashed #3A2A2A;background:#E3DDF7;display:grid;place-items:center;position:relative}
.lock{position:absolute;right:-7px;top:-7px;width:16px;height:16px;border-radius:50%;background:#FFFDF8;border:2px solid #3A2A2A;display:grid;place-items:center}
.mon{font-size:11px;font-weight:700;color:#6B6478}
</style>
</helmet>
<div class="ic" style="width:390px;height:844px;position:relative;overflow:hidden;background:#C8D2E6">

    <rect width="390" height="844" fill="url(#rsky)"/>

    </div>

      <svg width="360" height="740" viewBox="0 0 360 740" style="position:absolute;left:0;top:0" aria-hidden="true">

      <div style="position:absolute;left:300px;top:300px;display:flex;flex-direction:column;align-items:center;gap:1px;opacity:.8" title="Venom-Steeped Pools: Training ×1.45, sealed">

  <div style="position:absolute;left:18px;right:18px;bottom:36px;z-index:5;background:#FBF6EC;border:3px solid #3A2A2A;border-radius:18px;box-shadow:0 5px 0 #3A2A2A;padding:10px 12px;display:flex;align-items:center;gap:10px">
